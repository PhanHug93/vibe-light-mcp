# ============================================================================
# Docker Compose — TechStack Local MCP Server (Production)
# ============================================================================
# Target: Ubuntu Server (Intel i5, 8GB RAM), chạy 24/7
#
# Network Architecture (Dual-Network):
#   ┌────────────────────────────────────────────────────────────────┐
#   │  mcp_internal (internal: true — NO external access)           │
#   │  ┌──────────┐          ┌──────────────┐                       │
#   │  │ memorydb │◄────────►│  mcp_server  │                       │
#   │  │ :8000    │          │              │                       │
#   │  └──────────┘          └──────┬───────┘                       │
#   └───────────────────────────────┼───────────────────────────────┘
#   ┌───────────────────────────────┼───────────────────────────────┐
#   │  mcp_exposed (bridge)         │                               │
#   │                    ┌──────────┴───────┐                       │
#   │                    │  mcp_server      │──► :8000 (host)       │
#   │                    └──────────────────┘                       │
#   └───────────────────────────────────────────────────────────────┘
#
# MemoryDB: Chỉ ở mcp_internal → KHÔNG thể truy cập từ host/LAN
# MCP Server: Ở cả 2 network → truy cập MemoryDB nội bộ + expose port ra host
#
# Usage (từ project root):
#   cp deploy/compose/.env.example deploy/compose/.env  # Lần đầu
#   docker compose -f deploy/compose/docker-compose.yml up -d
#   docker compose -f deploy/compose/docker-compose.yml logs -f
#   docker compose -f deploy/compose/docker-compose.yml down
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # MemoryDB — MCP Memory Database (ChromaDB backend, Internal Only)
  # --------------------------------------------------------------------------
  # ⚠ KHÔNG expose port ra host. MemoryDB chỉ giao tiếp nội bộ với mcp_server
  # qua mạng Docker internal. Điều này ngăn bất kỳ ai trên mạng LAN truy cập
  # trực tiếp vào database chứa toàn bộ memory/knowledge của AI.
  # --------------------------------------------------------------------------
  memorydb:
    image: chromadb/chroma:latest
    container_name: mcp-memorydb
    restart: unless-stopped
    # KHÔNG có "ports:" → MemoryDB chỉ reachable qua mcp_internal
    networks:
      - mcp_internal
    volumes:
      - memorydb_data:/chroma/chroma  # Named volume — persistent qua restart
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "grep -q '00000000:1F40' /proc/net/tcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ── Resource Limits (Server 8GB RAM) ──────────────────────────────────
    # ChromaDB + hnswlib có thể ngốn RAM khi index lớn.
    # Giới hạn 2.5GB để chừa RAM cho OS + MCP Server + embedding model.
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M

    # ── Log Rotation ─────────────────────────────────────────────────────
    # Không có rotation → ChromaDB log có thể phình hàng chục GB.
    # json-file driver: max 10MB/file × 3 files = tối đa 30MB log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # MCP Server — AI Coding Assistant (SSE/HTTP exposed)
  # --------------------------------------------------------------------------
  mcp_server:
    build:
      context: ../..                    # Project root (chứa pyproject.toml, src/, main.py)
      dockerfile: deploy/docker/Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    depends_on:
      memorydb:
        condition: service_healthy      # Chờ MemoryDB healthy trước khi boot
    # ── Dual Network ─────────────────────────────────────────────────────
    # mcp_internal: giao tiếp với MemoryDB (internal, không ai ngoài truy cập)
    # mcp_exposed:  cho phép Docker map port ra host (port 8000)
    networks:
      - mcp_internal
      - mcp_exposed
    ports:
      - "${MCP_EXTERNAL_PORT:-8000}:${MCP_PORT:-8000}"   # Chỉ MCP được expose
    volumes:
      - mcp_data:/data                                    # Runtime data: MCP logs, backups, local DB path
      - tech_stacks_data:/app/tech_stacks                 # Seeded from image defaults on first boot
      - skill_registry_data:/app/skill_registry           # Seeded from image defaults on first boot
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8000}
      - MCP_CHROMA_HOST=memorydb                          # Tên service Docker = hostname nội bộ
      - MCP_CHROMA_PORT=8000                              # Port mặc định của chromadb/chroma image
      - MCP_CHROMA_DB=/data/db
      - MCP_USAGE_LOG_DIR=/data/usage_logs
      - MCP_TECH_STACKS_DIR=/app/tech_stacks
      - MCP_SKILL_REGISTRY_DIR=/app/skill_registry
      - MCP_SKILL_STORE_PATH=/app/skill_registry/index/skill_store.sqlite
      - MCP_EXEC_MODE=${MCP_EXEC_MODE:-allowlist}
    healthcheck:
      test: ["CMD-SHELL", "grep -q '00000000:1F40' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ── Resource Limits (Server 8GB RAM) ──────────────────────────────────
    # MCP Server + embedding model (sentence-transformers) ~400-800MB.
    # Giới hạn 1.5GB → đủ cho embedding + request handling.
    # Budget: MemoryDB 2.5GB + MCP 1.5GB + OS 2GB = 6GB / 8GB (chừa 2GB buffer)
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

    # ── Log Rotation ─────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ===========================================================================
# Networks (Dual-Network Security Model)
# ===========================================================================
networks:
  # Internal: MemoryDB ↔ MCP Server giao tiếp qua hostname.
  # internal: true → KHÔNG có default gateway → container không thể ra internet
  # và host/LAN không thể vào. MemoryDB hoàn toàn bị cô lập.
  mcp_internal:
    driver: bridge
    internal: true

  # Exposed: Chỉ MCP Server join network này để Docker có thể
  # map port container ra host. MemoryDB KHÔNG join network này.
  mcp_exposed:
    driver: bridge

# ===========================================================================
# Volumes — Dữ liệu persistent qua restart/rebuild
# ===========================================================================
volumes:
  memorydb_data:
    driver: local     # Memory DB (ChromaDB backend) for L1/session/L2 memory
  mcp_data:
    driver: local     # MCP runtime data: logs, backups, local DB path
  tech_stacks_data:
    driver: local     # Tech stack rules/references, seeded from image defaults
  skill_registry_data:
    driver: local     # Audited local skill registry + SQLite skill store
