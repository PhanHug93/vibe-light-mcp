  text: "## When to use this skill\nTo write internal communications, use this skill\
    \ for:\n- 3P updates (Progress, Plans, Problems)\n- Company newsletters\n- FAQ\
    \ responses\n- Status reports\n- Leadership updates\n- Project updates\n- Incident\
    \ reports\n\n## How to use this skill\n\nTo write any internal communication:\n\
    \n1. **Identify the communication type** from the request\n2. **Load the appropriate\
    \ guideline file** from the `examples/` directory:\n    - `examples/3p-updates.md`\
    \ - For Progress/Plans/Problems team updates\n    - `examples/company-newsletter.md`\
    \ - For company-wide newsletters\n    - `examples/faq-answers.md` - For answering\
    \ frequently asked questions\n    - `examples/general-comms.md` - For anything\
    \ else that doesn't explicitly match one of the above\n3. **Follow the specific\
    \ instructions** in that file for formatting, tone, and content gathering\n\n\
    If the communication type doesn't match any existing guideline, ask for clarification\
    \ or more context about the desired format.\n\n## Keywords\n3P updates, company\
    \ newsletter, company comms, weekly update, faqs, common questions, updates, internal\
    \ comms"
