  text: "# Web Artifacts Builder\n\nTo build powerful frontend claude.ai artifacts,\
    \ follow these steps:\n1. Initialize the frontend repo using `scripts/init-artifact.sh`\n\
    2. Develop your artifact by editing the generated code\n3. Bundle all code into\
    \ a single HTML file using `scripts/bundle-artifact.sh`\n4. Display artifact to\
    \ user\n5. (Optional) Test the artifact\n\n**Stack**: React 18 + TypeScript +\
    \ Vite + Parcel (bundling) + Tailwind CSS + shadcn/ui\n\n## Design & Style Guidelines\n\
    \nVERY IMPORTANT: To avoid what is often referred to as \"AI slop\", avoid using\
    \ excessive centered layouts, purple gradients, uniform rounded corners, and Inter\
    \ font.\n\n## Quick Start\n\n### Step 1: Initialize Project\n\nRun the initialization\
    \ script to create a new React project:\n```bash\nbash scripts/init-artifact.sh\
    \ <project-name>\ncd <project-name>\n```\n\nThis creates a fully configured project\
    \ with:\n- \u2705 React + TypeScript (via Vite)\n- \u2705 Tailwind CSS 3.4.1 with\
    \ shadcn/ui theming system\n- \u2705 Path aliases (`@/`) configured\n- \u2705\
    \ 40+ shadcn/ui components pre-installed\n- \u2705 All Radix UI dependencies included\n\
    - \u2705 Parcel configured for bundling (via .parcelrc)\n- \u2705 Node 18+ compatibility\
    \ (auto-detects and pins Vite version)\n\n### Step 2: Develop Your Artifact\n\n\
    To build the artifact, edit the generated files. See **Common Development Tasks**\
    \ below for guidance.\n\n### Step 3: Bundle to Single HTML File\n\nTo bundle the\
    \ React app into a single HTML artifact:\n```bash\nbash scripts/bundle-artifact.sh\n\
    ```\n\nThis creates `bundle.html` - a self-contained artifact with all JavaScript,\
    \ CSS, and dependencies inlined. This file can be directly shared in Claude conversations\
    \ as an artifact.\n\n**Requirements**: Your project must have an `index.html`\
    \ in the root directory.\n\n**What the script does**:\n- Installs bundling dependencies\
    \ (parcel, @parcel/config-default, parcel-resolver-tspaths, html-inline)\n- Creates\
    \ `.parcelrc` config with path alias support\n- Builds with Parcel (no source\
    \ maps)\n- Inlines all assets into single HTML using html-inline\n\n### Step 4:\
    \ Share Artifact with User\n\nFinally, share the bundled HTML file in conversation\
    \ with the user so they can view it as an artifact.\n\n### Step 5: Testing/Visualizing\
    \ the Artifact (Optional)\n\nNote: This is a completely optional step. Only perform\
    \ if necessary or requested.\n\nTo test/visualize the artifact, use available\
    \ tools (including other Skills or built-in tools like Playwright or Puppeteer).\
    \ In general, avoid testing the artifact upfront as it adds latency between the\
    \ request and when the finished artifact can be seen. Test later, after presenting\
    \ the artifact, if requested or if issues arise.\n\n## Reference\n\n- **shadcn/ui\
    \ components**: https://ui.shadcn.com/docs/components"
