  text: "# Improve Codebase Architecture\n\nSurface architectural friction and propose\
    \ **deepening opportunities** \u2014 refactors that turn shallow modules into\
    \ deep ones. The aim is testability and AI-navigability.\n\n## Glossary\n\nUse\
    \ these terms exactly in every suggestion. Consistent language is the point \u2014\
    \ don't drift into \"component,\" \"service,\" \"API,\" or \"boundary.\" Full\
    \ definitions in [LANGUAGE.md](LANGUAGE.md).\n\n- **Module** \u2014 anything with\
    \ an interface and an implementation (function, class, package, slice).\n- **Interface**\
    \ \u2014 everything a caller must know to use the module: types, invariants, error\
    \ modes, ordering, config. Not just the type signature.\n- **Implementation**\
    \ \u2014 the code inside.\n- **Depth** \u2014 leverage at the interface: a lot\
    \ of behaviour behind a small interface. **Deep** = high leverage. **Shallow**\
    \ = interface nearly as complex as the implementation.\n- **Seam** \u2014 where\
    \ an interface lives; a place behaviour can be altered without editing in place.\
    \ (Use this, not \"boundary.\")\n- **Adapter** \u2014 a concrete thing satisfying\
    \ an interface at a seam.\n- **Leverage** \u2014 what callers get from depth.\n\
    - **Locality** \u2014 what maintainers get from depth: change, bugs, knowledge\
    \ concentrated in one place.\n\nKey principles (see [LANGUAGE.md](LANGUAGE.md)\
    \ for the full list):\n\n- **Deletion test**: imagine deleting the module. If\
    \ complexity vanishes, it was a pass-through. If complexity reappears across N\
    \ callers, it was earning its keep.\n- **The interface is the test surface.**\n\
    - **One adapter = hypothetical seam. Two adapters = real seam.**\n\nThis skill\
    \ is _informed_ by the project's domain model. The domain language gives names\
    \ to good seams; ADRs record decisions the skill should not re-litigate.\n\n##\
    \ Process\n\n### 1. Explore\n\nRead the project's domain glossary and any ADRs\
    \ in the area you're touching first.\n\nThen use the Agent tool with `subagent_type=Explore`\
    \ to walk the codebase. Don't follow rigid heuristics \u2014 explore organically\
    \ and note where you experience friction:\n\n- Where does understanding one concept\
    \ require bouncing between many small modules?\n- Where are modules **shallow**\
    \ \u2014 interface nearly as complex as the implementation?\n- Where have pure\
    \ functions been extracted just for testability, but the real bugs hide in how\
    \ they're called (no **locality**)?\n- Where do tightly-coupled modules leak across\
    \ their seams?\n- Which parts of the codebase are untested, or hard to test through\
    \ their current interface?\n\nApply the **deletion test** to anything you suspect\
    \ is shallow: would deleting it concentrate complexity, or just move it? A \"\
    yes, concentrates\" is the signal you want.\n\n### 2. Present candidates as an\
    \ HTML report\n\nWrite a self-contained HTML file to the OS temp directory so\
    \ nothing lands in the repo. Resolve the temp dir from `$TMPDIR`, falling back\
    \ to `/tmp` (or `%TEMP%` on Windows), and write to `<tmpdir>/architecture-review-<timestamp>.html`\
    \ so each run gets a fresh file. Open it for the user \u2014 `xdg-open <path>`\
    \ on Linux, `open <path>` on macOS, `start <path>` on Windows \u2014 and tell\
    \ them the absolute path.\n\nThe report uses **Tailwind via CDN** for layout and\
    \ styling, and **Mermaid via CDN** for diagrams where a graph/flow/sequence reliably\
    \ communicates the structure. Mix Mermaid with hand-crafted CSS/SVG visuals \u2014\
    \ use Mermaid when relationships are graph-shaped (call graphs, dependencies,\
    \ sequences), and hand-built divs/SVG when you want something more editorial (mass\
    \ diagrams, cross-sections, collapse animations). Each candidate gets a **before/after\
    \ visualisation**. Be visual.\n\nFor each candidate, the same template as before,\
    \ but rendered as a card:\n\n- **Files** \u2014 which files/modules are involved\n\
    - **Problem** \u2014 why the current architecture is causing friction\n- **Solution**\
    \ \u2014 plain English description of what would change\n- **Benefits** \u2014\
    \ explained in terms of locality and leverage, and how tests would improve\n-\
    \ **Before / After diagram** \u2014 side-by-side, custom-drawn, illustrating the\
    \ shallowness and the deepening\n- **Recommendation strength** \u2014 one of `Strong`,\
    \ `Worth exploring`, `Speculative`, rendered as a badge\n\nEnd the report with\
    \ a **Top recommendation** section: which candidate you'd tackle first and why.\n\
    \n**Use CONTEXT.md vocabulary for the domain, and [LANGUAGE.md](LANGUAGE.md) vocabulary\
    \ for the architecture.** If `CONTEXT.md` defines \"Order,\" talk about \"the\
    \ Order intake module\" \u2014 not \"the FooBarHandler,\" and not \"the Order\
    \ service.\"\n\n**ADR conflicts**: if a candidate contradicts an existing ADR,\
    \ only surface it when the friction is real enough to warrant revisiting the ADR.\
    \ Mark it clearly in the card (e.g. a warning callout: _\"contradicts ADR-0007\
    \ \u2014 but worth reopening because\u2026\"_). Don't list every theoretical refactor\
    \ an ADR forbids.\n\nSee [HTML-REPORT.md](HTML-REPORT.md) for the full HTML scaffold,\
    \ diagram patterns, and styling guidance.\n\nDo NOT propose interfaces yet. After\
    \ the file is written, ask the user: \"Which of these would you like to explore?\"\
    \n\n### 3. Grilling loop\n\nOnce the user picks a candidate, drop into a grilling\
    \ conversation. Walk the design tree with them \u2014 constraints, dependencies,\
    \ the shape of the deepened module, what sits behind the seam, what tests survive.\n\
    \nSide effects happen inline as decisions crystallize:\n\n- **Naming a deepened\
    \ module after a concept not in `CONTEXT.md`?** Add the term to `CONTEXT.md` \u2014\
    \ same discipline as `/grill-with-docs` (see [CONTEXT-FORMAT.md](../grill-with-docs/CONTEXT-FORMAT.md)).\
    \ Create the file lazily if it doesn't exist.\n- **Sharpening a fuzzy term during\
    \ the conversation?** Update `CONTEXT.md` right there.\n- **User rejects the candidate\
    \ with a load-bearing reason?** Offer an ADR, framed as: _\"Want me to record\
    \ this as an ADR so future architecture reviews don't re-suggest it?\"_ Only offer\
    \ when the reason would actually be needed by a future explorer to avoid re-suggesting\
    \ the same thing \u2014 skip ephemeral reasons (\"not worth it right now\") and\
    \ self-evident ones. See [ADR-FORMAT.md](../grill-with-docs/ADR-FORMAT.md).\n\
    - **Want to explore alternative interfaces for the deepened module?** See [INTERFACE-DESIGN.md](INTERFACE-DESIGN.md)."
