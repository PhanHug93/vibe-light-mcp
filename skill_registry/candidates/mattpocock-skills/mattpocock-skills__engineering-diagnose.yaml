  text: "# Diagnose\n\nA discipline for hard bugs. Skip phases only when explicitly\
    \ justified.\n\nWhen exploring the codebase, use the project's domain glossary\
    \ to get a clear mental model of the relevant modules, and check ADRs in the area\
    \ you're touching.\n\n## Phase 1 \u2014 Build a feedback loop\n\n**This is the\
    \ skill.** Everything else is mechanical. If you have a fast, deterministic, agent-runnable\
    \ pass/fail signal for the bug, you will find the cause \u2014 bisection, hypothesis-testing,\
    \ and instrumentation all just consume that signal. If you don't have one, no\
    \ amount of staring at code will save you.\n\nSpend disproportionate effort here.\
    \ **Be aggressive. Be creative. Refuse to give up.**\n\n### Ways to construct\
    \ one \u2014 try them in roughly this order\n\n1. **Failing test** at whatever\
    \ seam reaches the bug \u2014 unit, integration, e2e.\n2. **Curl / HTTP script**\
    \ against a running dev server.\n3. **CLI invocation** with a fixture input, diffing\
    \ stdout against a known-good snapshot.\n4. **Headless browser script** (Playwright\
    \ / Puppeteer) \u2014 drives the UI, asserts on DOM/console/network.\n5. **Replay\
    \ a captured trace.** Save a real network request / payload / event log to disk;\
    \ replay it through the code path in isolation.\n6. **Throwaway harness.** Spin\
    \ up a minimal subset of the system (one service, mocked deps) that exercises\
    \ the bug code path with a single function call.\n7. **Property / fuzz loop.**\
    \ If the bug is \"sometimes wrong output\", run 1000 random inputs and look for\
    \ the failure mode.\n8. **Bisection harness.** If the bug appeared between two\
    \ known states (commit, dataset, version), automate \"boot at state X, check,\
    \ repeat\" so you can `git bisect run` it.\n9. **Differential loop.** Run the\
    \ same input through old-version vs new-version (or two configs) and diff outputs.\n\
    10. **HITL bash script.** Last resort. If a human must click, drive _them_ with\
    \ `scripts/hitl-loop.template.sh` so the loop is still structured. Captured output\
    \ feeds back to you.\n\nBuild the right feedback loop, and the bug is 90% fixed.\n\
    \n### Iterate on the loop itself\n\nTreat the loop as a product. Once you have\
    \ _a_ loop, ask:\n\n- Can I make it faster? (Cache setup, skip unrelated init,\
    \ narrow the test scope.)\n- Can I make the signal sharper? (Assert on the specific\
    \ symptom, not \"didn't crash\".)\n- Can I make it more deterministic? (Pin time,\
    \ seed RNG, isolate filesystem, freeze network.)\n\nA 30-second flaky loop is\
    \ barely better than no loop. A 2-second deterministic loop is a debugging superpower.\n\
    \n### Non-deterministic bugs\n\nThe goal is not a clean repro but a **higher reproduction\
    \ rate**. Loop the trigger 100\xD7, parallelise, add stress, narrow timing windows,\
    \ inject sleeps. A 50%-flake bug is debuggable; 1% is not \u2014 keep raising\
    \ the rate until it's debuggable.\n\n### When you genuinely cannot build a loop\n\
    \nStop and say so explicitly. List what you tried. Ask the user for: (a) access\
    \ to whatever environment reproduces it, (b) a captured artifact (HAR file, log\
    \ dump, core dump, screen recording with timestamps), or (c) permission to add\
    \ temporary production instrumentation. Do **not** proceed to hypothesise without\
    \ a loop.\n\nDo not proceed to Phase 2 until you have a loop you believe in.\n\
    \n## Phase 2 \u2014 Reproduce\n\nRun the loop. Watch the bug appear.\n\nConfirm:\n\
    \n- [ ] The loop produces the failure mode the **user** described \u2014 not a\
    \ different failure that happens to be nearby. Wrong bug = wrong fix.\n- [ ] The\
    \ failure is reproducible across multiple runs (or, for non-deterministic bugs,\
    \ reproducible at a high enough rate to debug against).\n- [ ] You have captured\
    \ the exact symptom (error message, wrong output, slow timing) so later phases\
    \ can verify the fix actually addresses it.\n\nDo not proceed until you reproduce\
    \ the bug.\n\n## Phase 3 \u2014 Hypothesise\n\nGenerate **3\u20135 ranked hypotheses**\
    \ before testing any of them. Single-hypothesis generation anchors on the first\
    \ plausible idea.\n\nEach hypothesis must be **falsifiable**: state the prediction\
    \ it makes.\n\n> Format: \"If <X> is the cause, then <changing Y> will make the\
    \ bug disappear / <changing Z> will make it worse.\"\n\nIf you cannot state the\
    \ prediction, the hypothesis is a vibe \u2014 discard or sharpen it.\n\n**Show\
    \ the ranked list to the user before testing.** They often have domain knowledge\
    \ that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses\
    \ they've already ruled out. Cheap checkpoint, big time saver. Don't block on\
    \ it \u2014 proceed with your ranking if the user is AFK.\n\n## Phase 4 \u2014\
    \ Instrument\n\nEach probe must map to a specific prediction from Phase 3. **Change\
    \ one variable at a time.**\n\nTool preference:\n\n1. **Debugger / REPL inspection**\
    \ if the env supports it. One breakpoint beats ten logs.\n2. **Targeted logs**\
    \ at the boundaries that distinguish hypotheses.\n3. Never \"log everything and\
    \ grep\".\n\n**Tag every debug log** with a unique prefix, e.g. `[DEBUG-a4f2]`.\
    \ Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs\
    \ die.\n\n**Perf branch.** For performance regressions, logs are usually wrong.\
    \ Instead: establish a baseline measurement (timing harness, `performance.now()`,\
    \ profiler, query plan), then bisect. Measure first, fix second.\n\n## Phase 5\
    \ \u2014 Fix + regression test\n\nWrite the regression test **before the fix**\
    \ \u2014 but only if there is a **correct seam** for it.\n\nA correct seam is\
    \ one where the test exercises the **real bug pattern** as it occurs at the call\
    \ site. If the only available seam is too shallow (single-caller test when the\
    \ bug needs multiple callers, unit test that can't replicate the chain that triggered\
    \ the bug), a regression test there gives false confidence.\n\n**If no correct\
    \ seam exists, that itself is the finding.** Note it. The codebase architecture\
    \ is preventing the bug from being locked down. Flag this for the next phase.\n\
    \nIf a correct seam exists:\n\n1. Turn the minimised repro into a failing test\
    \ at that seam.\n2. Watch it fail.\n3. Apply the fix.\n4. Watch it pass.\n5. Re-run\
    \ the Phase 1 feedback loop against the original (un-minimised) scenario.\n\n\
    ## Phase 6 \u2014 Cleanup + post-mortem\n\nRequired before declaring done:\n\n\
    - [ ] Original repro no longer reproduces (re-run the Phase 1 loop)\n- [ ] Regression\
    \ test passes (or absence of seam is documented)\n- [ ] All `[DEBUG-...]` instrumentation\
    \ removed (`grep` the prefix)\n- [ ] Throwaway prototypes deleted (or moved to\
    \ a clearly-marked debug location)\n- [ ] The hypothesis that turned out correct\
    \ is stated in the commit / PR message \u2014 so the next debugger learns\n\n\
    **Then ask: what would have prevented this bug?** If the answer involves architectural\
    \ change (no good test seam, tangled callers, hidden coupling) hand off to the\
    \ `/improve-codebase-architecture` skill with the specifics. Make the recommendation\
    \ **after** the fix is in, not before \u2014 you have more information now than\
    \ when you started."
