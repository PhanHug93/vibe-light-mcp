  text: "# Test-Driven Development\n\n## Philosophy\n\n**Core principle**: Tests should\
    \ verify behavior through public interfaces, not implementation details. Code\
    \ can change entirely; tests shouldn't.\n\n**Good tests** are integration-style:\
    \ they exercise real code paths through public APIs. They describe _what_ the\
    \ system does, not _how_ it does it. A good test reads like a specification -\
    \ \"user can checkout with valid cart\" tells you exactly what capability exists.\
    \ These tests survive refactors because they don't care about internal structure.\n\
    \n**Bad tests** are coupled to implementation. They mock internal collaborators,\
    \ test private methods, or verify through external means (like querying a database\
    \ directly instead of using the interface). The warning sign: your test breaks\
    \ when you refactor, but behavior hasn't changed. If you rename an internal function\
    \ and tests fail, those tests were testing implementation, not behavior.\n\nSee\
    \ [tests.md](tests.md) for examples and [mocking.md](mocking.md) for mocking guidelines.\n\
    \n## Anti-Pattern: Horizontal Slices\n\n**DO NOT write all tests first, then all\
    \ implementation.** This is \"horizontal slicing\" - treating RED as \"write all\
    \ tests\" and GREEN as \"write all code.\"\n\nThis produces **crap tests**:\n\n\
    - Tests written in bulk test _imagined_ behavior, not _actual_ behavior\n- You\
    \ end up testing the _shape_ of things (data structures, function signatures)\
    \ rather than user-facing behavior\n- Tests become insensitive to real changes\
    \ - they pass when behavior breaks, fail when behavior is fine\n- You outrun your\
    \ headlights, committing to test structure before understanding the implementation\n\
    \n**Correct approach**: Vertical slices via tracer bullets. One test \u2192 one\
    \ implementation \u2192 repeat. Each test responds to what you learned from the\
    \ previous cycle. Because you just wrote the code, you know exactly what behavior\
    \ matters and how to verify it.\n\n```\nWRONG (horizontal):\n  RED:   test1, test2,\
    \ test3, test4, test5\n  GREEN: impl1, impl2, impl3, impl4, impl5\n\nRIGHT (vertical):\n\
    \  RED\u2192GREEN: test1\u2192impl1\n  RED\u2192GREEN: test2\u2192impl2\n  RED\u2192\
    GREEN: test3\u2192impl3\n  ...\n```\n\n## Workflow\n\n### 1. Planning\n\nWhen\
    \ exploring the codebase, use the project's domain glossary so that test names\
    \ and interface vocabulary match the project's language, and respect ADRs in the\
    \ area you're touching.\n\nBefore writing any code:\n\n- [ ] Confirm with user\
    \ what interface changes are needed\n- [ ] Confirm with user which behaviors to\
    \ test (prioritize)\n- [ ] Identify opportunities for [deep modules](deep-modules.md)\
    \ (small interface, deep implementation)\n- [ ] Design interfaces for [testability](interface-design.md)\n\
    - [ ] List the behaviors to test (not implementation steps)\n- [ ] Get user approval\
    \ on the plan\n\nAsk: \"What should the public interface look like? Which behaviors\
    \ are most important to test?\"\n\n**You can't test everything.** Confirm with\
    \ the user exactly which behaviors matter most. Focus testing effort on critical\
    \ paths and complex logic, not every possible edge case.\n\n### 2. Tracer Bullet\n\
    \nWrite ONE test that confirms ONE thing about the system:\n\n```\nRED:   Write\
    \ test for first behavior \u2192 test fails\nGREEN: Write minimal code to pass\
    \ \u2192 test passes\n```\n\nThis is your tracer bullet - proves the path works\
    \ end-to-end.\n\n### 3. Incremental Loop\n\nFor each remaining behavior:\n\n```\n\
    RED:   Write next test \u2192 fails\nGREEN: Minimal code to pass \u2192 passes\n\
    ```\n\nRules:\n\n- One test at a time\n- Only enough code to pass current test\n\
    - Don't anticipate future tests\n- Keep tests focused on observable behavior\n\
    \n### 4. Refactor\n\nAfter all tests pass, look for [refactor candidates](refactoring.md):\n\
    \n- [ ] Extract duplication\n- [ ] Deepen modules (move complexity behind simple\
    \ interfaces)\n- [ ] Apply SOLID principles where natural\n- [ ] Consider what\
    \ new code reveals about existing code\n- [ ] Run tests after each refactor step\n\
    \n**Never refactor while RED.** Get to GREEN first.\n\n## Checklist Per Cycle\n\
    \n```\n[ ] Test describes behavior, not implementation\n[ ] Test uses public interface\
    \ only\n[ ] Test would survive internal refactor\n[ ] Code is minimal for this\
    \ test\n[ ] No speculative features added\n```"
