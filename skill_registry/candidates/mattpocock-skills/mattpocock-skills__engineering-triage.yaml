  text: "# Triage\n\nMove issues on the project issue tracker through a small state\
    \ machine of triage roles.\n\nEvery comment or issue posted to the issue tracker\
    \ during triage **must** start with this disclaimer:\n\n```\n> *This was generated\
    \ by AI during triage.*\n```\n\n## Reference docs\n\n- [AGENT-BRIEF.md](AGENT-BRIEF.md)\
    \ \u2014 how to write durable agent briefs\n- [OUT-OF-SCOPE.md](OUT-OF-SCOPE.md)\
    \ \u2014 how the `.out-of-scope/` knowledge base works\n\n## Roles\n\nTwo **category**\
    \ roles:\n\n- `bug` \u2014 something is broken\n- `enhancement` \u2014 new feature\
    \ or improvement\n\nFive **state** roles:\n\n- `needs-triage` \u2014 maintainer\
    \ needs to evaluate\n- `needs-info` \u2014 waiting on reporter for more information\n\
    - `ready-for-agent` \u2014 fully specified, ready for an AFK agent\n- `ready-for-human`\
    \ \u2014 needs human implementation\n- `wontfix` \u2014 will not be actioned\n\
    \nEvery triaged issue should carry exactly one category role and one state role.\
    \ If state roles conflict, flag it and ask the maintainer before doing anything\
    \ else.\n\nThese are canonical role names \u2014 the actual label strings used\
    \ in the issue tracker may differ. The mapping should have been provided to you\
    \ - run `/setup-matt-pocock-skills` if not.\n\nState transitions: an unlabeled\
    \ issue normally goes to `needs-triage` first; from there it moves to `needs-info`,\
    \ `ready-for-agent`, `ready-for-human`, or `wontfix`. `needs-info` returns to\
    \ `needs-triage` once the reporter replies. The maintainer can override at any\
    \ time \u2014 flag transitions that look unusual and ask before proceeding.\n\n\
    ## Invocation\n\nThe maintainer invokes `/triage` and describes what they want\
    \ in natural language. Interpret the request and act. Examples:\n\n- \"Show me\
    \ anything that needs my attention\"\n- \"Let's look at #42\"\n- \"Move #42 to\
    \ ready-for-agent\"\n- \"What's ready for agents to pick up?\"\n\n## Show what\
    \ needs attention\n\nQuery the issue tracker and present three buckets, oldest\
    \ first:\n\n1. **Unlabeled** \u2014 never triaged.\n2. **`needs-triage`** \u2014\
    \ evaluation in progress.\n3. **`needs-info` with reporter activity since the\
    \ last triage notes** \u2014 needs re-evaluation.\n\nShow counts and a one-line\
    \ summary per issue. Let the maintainer pick.\n\n## Triage a specific issue\n\n\
    1. **Gather context.** Read the full issue (body, comments, labels, reporter,\
    \ dates). Parse any prior triage notes so you don't re-ask resolved questions.\
    \ Explore the codebase using the project's domain glossary, respecting ADRs in\
    \ the area. Read `.out-of-scope/*.md` and surface any prior rejection that resembles\
    \ this issue.\n\n2. **Recommend.** Tell the maintainer your category and state\
    \ recommendation with reasoning, plus a brief codebase summary relevant to the\
    \ issue. Wait for direction.\n\n3. **Reproduce (bugs only).** Before any grilling,\
    \ attempt reproduction: read the reporter's steps, trace the relevant code, run\
    \ tests or commands. Report what happened \u2014 successful repro with code path,\
    \ failed repro, or insufficient detail (a strong `needs-info` signal). A confirmed\
    \ repro makes a much stronger agent brief.\n\n4. **Grill (if needed).** If the\
    \ issue needs fleshing out, run a `/grill-with-docs` session.\n\n5. **Apply the\
    \ outcome:**\n   - `ready-for-agent` \u2014 post an agent brief comment ([AGENT-BRIEF.md](AGENT-BRIEF.md)).\n\
    \   - `ready-for-human` \u2014 same structure as an agent brief, but note why\
    \ it can't be delegated (judgment calls, external access, design decisions, manual\
    \ testing).\n   - `needs-info` \u2014 post triage notes (template below).\n  \
    \ - `wontfix` (bug) \u2014 polite explanation, then close.\n   - `wontfix` (enhancement)\
    \ \u2014 write to `.out-of-scope/`, link to it from a comment, then close ([OUT-OF-SCOPE.md](OUT-OF-SCOPE.md)).\n\
    \   - `needs-triage` \u2014 apply the role. Optional comment if there's partial\
    \ progress.\n\n## Quick state override\n\nIf the maintainer says \"move #42 to\
    \ ready-for-agent\", trust them and apply the role directly. Confirm what you're\
    \ about to do (role changes, comment, close), then act. Skip grilling. If moving\
    \ to `ready-for-agent` without a grilling session, ask whether they want to write\
    \ an agent brief.\n\n## Needs-info template\n\n```markdown\n## Triage Notes\n\n\
    **What we've established so far:**\n\n- point 1\n- point 2\n\n**What we still\
    \ need from you (@reporter):**\n\n- question 1\n- question 2\n```\n\nCapture everything\
    \ resolved during grilling under \"established so far\" so the work isn't lost.\
    \ Questions must be specific and actionable, not \"please provide more info\"\
    .\n\n## Resuming a previous session\n\nIf prior triage notes exist on the issue,\
    \ read them, check whether the reporter has answered any outstanding questions,\
    \ and present an updated picture before continuing. Don't re-ask resolved questions."
