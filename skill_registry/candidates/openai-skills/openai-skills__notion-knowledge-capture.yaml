  text: "# Knowledge Capture\n\nConvert conversations and notes into structured, linkable\
    \ Notion pages for easy reuse.\n\n## Quick start\n1) Clarify what to capture (decision,\
    \ how-to, FAQ, learning, documentation) and target audience.\n2) Identify the\
    \ right database/template in `reference/` (team wiki, how-to, FAQ, decision log,\
    \ learning, documentation).\n3) Pull any prior context from Notion with `Notion:notion-search`\
    \ \u2192 `Notion:notion-fetch` (existing pages to update/link).\n4) Draft the\
    \ page with `Notion:notion-create-pages` using the database\u2019s schema; include\
    \ summary, context, source links, and tags/owners.\n5) Link from hub pages and\
    \ related records; update status/owners with `Notion:notion-update-page` as the\
    \ source evolves.\n\n## Workflow\n### 0) If any MCP call fails because Notion\
    \ MCP is not connected, pause and set it up:\n1. Add the Notion MCP:\n   - `codex\
    \ mcp add notion --url https://mcp.notion.com/mcp`\n2. Enable remote MCP client:\n\
    \   - Set `[features].rmcp_client = true` in `config.toml` **or** run `codex --enable\
    \ rmcp_client`\n3. Log in with OAuth:\n   - `codex mcp login notion`\n\nAfter\
    \ successful login, the user will have to restart codex. You should finish your\
    \ answer and tell them so when they try again they can continue with Step 1.\n\
    \n### 1) Define the capture\n- Ask purpose, audience, freshness, and whether this\
    \ is new or an update.\n- Determine content type: decision, how-to, FAQ, concept/wiki\
    \ entry, learning/note, documentation page.\n\n### 2) Locate destination\n- Pick\
    \ the correct database using `reference/*-database.md` guides; confirm required\
    \ properties (title, tags, owner, status, date, relations).\n- If multiple candidate\
    \ databases, ask the user which to use; otherwise, create in the primary wiki/documentation\
    \ DB.\n\n### 3) Extract and structure\n- Extract facts, decisions, actions, and\
    \ rationale from the conversation.\n- For decisions, record alternatives, rationale,\
    \ and outcomes.\n- For how-tos/docs, capture steps, pre-reqs, links to assets/code,\
    \ and edge cases.\n- For FAQs, phrase as Q&A with concise answers and links to\
    \ deeper docs.\n\n### 4) Create/update in Notion\n- Use `Notion:notion-create-pages`\
    \ with the correct `data_source_id`; set properties (title, tags, owner, status,\
    \ dates, relations).\n- Use templates in `reference/` to structure content (section\
    \ headers, checklists).\n- If updating an existing page, fetch then edit via `Notion:notion-update-page`.\n\
    \n### 5) Link and surface\n- Add relations/backlinks to hub pages, related specs/docs,\
    \ and teams.\n- Add a short summary/changelog for future readers.\n- If follow-up\
    \ tasks exist, create tasks in the relevant database and link them.\n\n## References\
    \ and examples\n- `reference/` \u2014 database schemas and templates (e.g., `team-wiki-database.md`,\
    \ `how-to-guide-database.md`, `faq-database.md`, `decision-log-database.md`, `documentation-database.md`,\
    \ `learning-database.md`, `database-best-practices.md`).\n- `examples/` \u2014\
    \ capture patterns in practice (e.g., `decision-capture.md`, `how-to-guide.md`,\
    \ `conversation-to-faq.md`)."
