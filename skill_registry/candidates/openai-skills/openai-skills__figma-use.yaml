  text: "# use_figma \u2014 Figma Plugin API Skill\n\nUse `use_figma` MCP to execute\
    \ JavaScript in Figma files via the Plugin API. All detailed reference docs live\
    \ in `references/`.\n\n**Always pass `skillNames: \"figma-use\"` when calling\
    \ `use_figma`.** This is a logging parameter used to track skill usage \u2014\
    \ it does not affect execution.\n\n**If the task involves building or updating\
    \ a full page, screen, or multi-section layout in Figma from code**, also load\
    \ [figma-generate-design](../figma-generate-design/SKILL.md). It provides the\
    \ workflow for discovering design system components via `search_design_system`,\
    \ importing them, and assembling screens incrementally. Both skills work together:\
    \ this one for the API rules, that one for the screen-building workflow.\n\nBefore\
    \ anything, load [plugin-api-standalone.index.md](references/plugin-api-standalone.index.md)\
    \ to understand what is possible. When you are asked to write plugin API code,\
    \ use this context to grep [plugin-api-standalone.d.ts](references/plugin-api-standalone.d.ts)\
    \ for relevant types, methods, and properties. This is the definitive source of\
    \ truth for the API surface. It is a large typings file, so do not load it all\
    \ at once, grep for relevant sections as needed.\n\nIMPORTANT: Whenever you work\
    \ with design systems, start with [working-with-design-systems/wwds.md](references/working-with-design-systems/wwds.md)\
    \ to understand the key concepts, processes, and guidelines for working with design\
    \ systems in Figma. Then load the more specific references for components, variables,\
    \ text styles, and effect styles as needed.\n\n## 1. Critical Rules\n\n1.  **Use\
    \ `return` to send data back.** The return value is JSON-serialized automatically\
    \ (objects, arrays, strings, numbers). Do NOT call `figma.closePlugin()` or wrap\
    \ code in an async IIFE \u2014 this is handled for you.\n2.  **Write plain JavaScript\
    \ with top-level `await` and `return`.** Code is automatically wrapped in an async\
    \ context. Do NOT wrap in `(async () => { ... })()`.\n3.  `figma.notify()` **throws\
    \ \"not implemented\"** \u2014 never use it\n3a. `getPluginData()` / `setPluginData()`\
    \ are **not supported** in `use_figma` \u2014 do not use them. Use `getSharedPluginData()`\
    \ / `setSharedPluginData()` instead (these ARE supported), or track node IDs by\
    \ returning them and passing them to subsequent calls.\n4.  `console.log()` is\
    \ NOT returned \u2014 use `return` for output\n5.  **Work incrementally in small\
    \ steps.** Break large operations into multiple `use_figma` calls. Validate after\
    \ each step. This is the single most important practice for avoiding bugs.\n6.\
    \  Colors are **0\u20131 range** (not 0\u2013255): `{r: 1, g: 0, b: 0}` = red\n\
    7.  Fills/strokes are **read-only arrays** \u2014 clone, modify, reassign\n8.\
    \  Font **MUST** be loaded before any text operation: `await figma.loadFontAsync({family,\
    \ style})`\n9.  **Pages load incrementally** \u2014 use `await figma.setCurrentPageAsync(page)`\
    \ to switch pages and load their content (see Page Rules below)\n10. `setBoundVariableForPaint`\
    \ returns a **NEW** paint \u2014 must capture and reassign\n11. `createVariable`\
    \ accepts collection **object or ID string** (object preferred)\n12. **`layoutSizingHorizontal/Vertical\
    \ = 'FILL'` MUST be set AFTER `parent.appendChild(child)`** \u2014 setting before\
    \ append throws. Same applies to `'HUG'` on non-auto-layout nodes.\n13. **Position\
    \ new top-level nodes away from (0,0).** Nodes appended directly to the page default\
    \ to (0,0). Scan `figma.currentPage.children` to find a clear position (e.g.,\
    \ to the right of the rightmost node). This only applies to page-level nodes \u2014\
    \ nodes nested inside other frames or auto-layout containers are positioned by\
    \ their parent. See [Gotchas](references/gotchas.md).\n14. **On `use_figma` error,\
    \ STOP. Do NOT immediately retry.** Failed scripts are **atomic** \u2014 if a\
    \ script errors, it is not executed at all and no changes are made to the file.\
    \ Read the error message carefully, fix the script, then retry. See [Error Recovery](#6-error-recovery--self-correction).\n\
    15. **MUST `return` ALL created/mutated node IDs.** Whenever a script creates\
    \ new nodes or mutates existing ones on the canvas, collect every affected node\
    \ ID and return them in a structured object (e.g. `return { createdNodeIds: [...],\
    \ mutatedNodeIds: [...] }`). This is essential for subsequent calls to reference,\
    \ validate, or clean up those nodes.\n16. **Always set `variable.scopes` explicitly\
    \ when creating variables.** The default `ALL_SCOPES` pollutes every property\
    \ picker \u2014 almost never what you want. Use specific scopes like `[\"FRAME_FILL\"\
    , \"SHAPE_FILL\"]` for backgrounds, `[\"TEXT_FILL\"]` for text colors, `[\"GAP\"\
    ]` for spacing, etc. See [variable-patterns.md](references/variable-patterns.md)\
    \ for the full list.\n17. **`await` every Promise.** Never leave a Promise unawaited\
    \ \u2014 unawaited async calls (e.g. `figma.loadFontAsync(...)` without `await`,\
    \ or `figma.setCurrentPageAsync(page)` without `await`) will fire-and-forget,\
    \ causing silent failures or race conditions. The script may return before the\
    \ async operation completes, leading to missing data or half-applied changes.\n\
    \n> For detailed WRONG/CORRECT examples of each rule, see [Gotchas & Common Mistakes](references/gotchas.md).\n\
    \n## 2. Page Rules (Critical)\n\n**Page context resets between `use_figma` calls**\
    \ \u2014 `figma.currentPage` starts on the first page each time.\n\n### Switching\
    \ pages\n\nUse `await figma.setCurrentPageAsync(page)` to switch pages and load\
    \ their content. The sync setter `figma.currentPage = page` **throws an error**\
    \ in `use_figma` runtimes.\n\n```js\n// Switch to a specific page (loads its content)\n\
    const targetPage = figma.root.children.find((p) => p.name === \"My Page\");\n\
    await figma.setCurrentPageAsync(targetPage);\n// targetPage.children is now populated\n\
    \n// Iterate over all pages\nfor (const page of figma.root.children) {\n  await\
    \ figma.setCurrentPageAsync(page);\n  // page.children is now loaded \u2014 read\
    \ or modify them here\n}\n```\n\n### Across script runs\n\n`figma.currentPage`\
    \ resets to the **first page** at the start of each `use_figma` call. If your\
    \ workflow spans multiple calls and targets a non-default page, call `await figma.setCurrentPageAsync(page)`\
    \ at the start of each invocation.\n\nYou can call `use_figma` multiple times\
    \ to incrementally build on the file state, or to retrieve information before\
    \ writing another script. For example, write a script to get metadata about existing\
    \ nodes, `return` that data, then use it in a subsequent script to modify those\
    \ nodes.\n\n## 3. `return` Is Your Output Channel\n\nThe agent sees **ONLY** the\
    \ value you `return`. Everything else is invisible.\n\n- **Returning IDs (CRITICAL)**:\
    \ Every script that creates or mutates canvas nodes **MUST** return all affected\
    \ node IDs \u2014 e.g. `return { createdNodeIds: [...], mutatedNodeIds: [...]\
    \ }`. This is a hard requirement, not optional.\n- **Progress reporting**: `return\
    \ { createdNodeIds: [...], count: 5, errors: [] }`\n- **Error info**: Thrown errors\
    \ are automatically captured and returned \u2014 just let them propagate or `throw`\
    \ explicitly.\n- `console.log()` output is **never** returned to the agent\n-\
    \ Always return actionable data (IDs, counts, status) so subsequent calls can\
    \ reference created objects\n\n## 4. Editor Mode\n\n`use_figma` works in **design\
    \ mode** (editorType `\"figma\"`, the default). FigJam (`\"figjam\"`) has a different\
    \ set of available node types \u2014 most design nodes are blocked there.\n\n\
    Available in design mode: Rectangle, Frame, Component, Text, Ellipse, Star, Line,\
    \ Vector, Polygon, BooleanOperation, Slice, Page, Section, TextPath.\n\n**Blocked**\
    \ in design mode: Sticky, Connector, ShapeWithText, CodeBlock, Slide, SlideRow,\
    \ Webpage.\n\n## 5. Incremental Workflow (How to Avoid Bugs)\n\nThe most common\
    \ cause of bugs is trying to do too much in a single `use_figma` call. **Work\
    \ in small steps and validate after each one.**\n\n### The pattern\n\n1. **Inspect\
    \ first.** Before creating anything, run a read-only `use_figma` to discover what\
    \ already exists in the file \u2014 pages, components, variables, naming conventions.\
    \ Match what's there.\n2. **Do one thing per call.** Create variables in one call,\
    \ create components in the next, compose layouts in another. Don't try to build\
    \ an entire screen in one script.\n3. **Return IDs from every call.** Always `return`\
    \ created node IDs, variable IDs, collection IDs as objects (e.g. `return { createdNodeIds:\
    \ [...] }`). You'll need these as inputs to subsequent calls.\n4. **Validate after\
    \ each step.** Use `get_metadata` to verify structure (counts, names, hierarchy,\
    \ positions). Use `get_screenshot` after major milestones to catch visual issues.\n\
    5. **Fix before moving on.** If validation reveals a problem, fix it before proceeding\
    \ to the next step. Don't build on a broken foundation.\n\n### Suggested step\
    \ order for complex tasks\n\n```\nStep 1: Inspect file \u2014 discover existing\
    \ pages, components, variables, conventions\nStep 2: Create tokens/variables (if\
    \ needed)\n       \u2192 validate with get_metadata\nStep 3: Create individual\
    \ components\n       \u2192 validate with get_metadata + get_screenshot\nStep\
    \ 4: Compose layouts from component instances\n       \u2192 validate with get_screenshot\n\
    Step 5: Final verification\n```\n\n### What to validate at each step\n\n| After...\
    \ | Check with `get_metadata` | Check with `get_screenshot` |\n|---|---|---|\n\
    | Creating variables | Collection count, variable count, mode names | \u2014 |\n\
    | Creating components | Child count, variant names, property definitions | Variants\
    \ visible, not collapsed, grid readable |\n| Binding variables | Node properties\
    \ reflect bindings | Colors/tokens resolved correctly |\n| Composing layouts |\
    \ Instance nodes have mainComponent, hierarchy correct | No cropped/clipped text,\
    \ no overlapping elements, correct spacing |\n\n## 6. Error Recovery & Self-Correction\n\
    \n**`use_figma` is atomic \u2014 failed scripts do not execute.** If a script\
    \ errors, no changes are made to the file. The file remains in the same state\
    \ as before the call. This means there are no partial nodes, no orphaned elements\
    \ from the failed script, and retrying after a fix is safe.\n\n### When `use_figma`\
    \ returns an error\n\n1. **STOP.** Do not immediately fix the code and retry.\n\
    2. **Read the error message carefully.** Understand exactly what went wrong \u2014\
    \ wrong API usage, missing font, invalid property value, etc.\n3. **If the error\
    \ is unclear**, call `get_metadata` or `get_screenshot` to understand the current\
    \ file state.\n4. **Fix the script** based on the error message.\n5. **Retry**\
    \ the corrected script.\n\n### Common self-correction patterns\n\n| Error message\
    \ | Likely cause | How to fix |\n|---|---|---|\n| `\"not implemented\"` | Used\
    \ `figma.notify()` | Remove it \u2014 use `return` for output |\n| `\"node must\
    \ be an auto-layout frame...\"` | Set `FILL`/`HUG` before appending to auto-layout\
    \ parent | Move `appendChild` before `layoutSizingX = 'FILL'` |\n| `\"Setting\
    \ figma.currentPage is not supported\"` | Used sync page setter | Use `await figma.setCurrentPageAsync(page)`\
    \ |\n| Property value out of range | Color channel > 1 (used 0\u2013255 instead\
    \ of 0\u20131) | Divide by 255 |\n| `\"Cannot read properties of null\"` | Node\
    \ doesn't exist (wrong ID, wrong page) | Check page context, verify ID |\n| Script\
    \ hangs / no response | Infinite loop or unresolved promise | Check for `while(true)`\
    \ or missing `await`; ensure code terminates |\n| `\"The node with id X does not\
    \ exist\"` | Parent instance was implicitly detached by a child `detachInstance()`,\
    \ changing IDs | Re-discover nodes by traversal from a stable (non-instance) parent\
    \ frame |\n\n### When the script succeeds but the result looks wrong\n\n1. Call\
    \ `get_metadata` to check structural correctness (hierarchy, counts, positions).\n\
    2. Call `get_screenshot` to check visual correctness. Look closely for cropped/clipped\
    \ text (line heights cutting off content) and overlapping elements \u2014 these\
    \ are common and easy to miss.\n3. Identify the discrepancy \u2014 is it structural\
    \ (wrong hierarchy, missing nodes) or visual (wrong colors, broken layout, clipped\
    \ content)?\n4. Write a targeted fix script that modifies only the broken parts\
    \ \u2014 don't recreate everything.\n\n> For the full validation workflow, see\
    \ [Validation & Error Recovery](references/validation-and-recovery.md).\n\n##\
    \ 7. Pre-Flight Checklist\n\nBefore submitting ANY `use_figma` call, verify:\n\
    \n- [ ] Code uses `return` to send data back (NOT `figma.closePlugin()`)\n- [\
    \ ] Code is NOT wrapped in an async IIFE (auto-wrapped for you)\n- [ ] `return`\
    \ value includes structured data with actionable info (IDs, counts)\n- [ ] NO\
    \ usage of `figma.notify()` anywhere\n- [ ] NO usage of `console.log()` as output\
    \ (use `return` instead)\n- [ ] All colors use 0\u20131 range (not 0\u2013255)\n\
    - [ ] Fills/strokes are reassigned as new arrays (not mutated in place)\n- [ ]\
    \ Page switches use `await figma.setCurrentPageAsync(page)` (sync setter throws)\n\
    - [ ] `layoutSizingVertical/Horizontal = 'FILL'` is set AFTER `parent.appendChild(child)`\n\
    - [ ] `loadFontAsync()` called BEFORE any text property changes\n- [ ] `lineHeight`/`letterSpacing`\
    \ use `{unit, value}` format (not bare numbers)\n- [ ] `resize()` is called BEFORE\
    \ setting sizing modes (resize resets them to FIXED)\n- [ ] For multi-step workflows:\
    \ IDs from previous calls are passed as string literals (not variables)\n- [ ]\
    \ New top-level nodes are positioned away from (0,0) to avoid overlapping existing\
    \ content\n- [ ] ALL created/mutated node IDs are collected and included in the\
    \ `return` value\n- [ ] Every async call (`loadFontAsync`, `setCurrentPageAsync`,\
    \ `importComponentByKeyAsync`, etc.) is `await`ed \u2014 no fire-and-forget Promises\n\
    \n## 8. Discover Conventions Before Creating\n\n**Always inspect the Figma file\
    \ before creating anything.** Different files use different naming conventions,\
    \ variable structures, and component patterns. Your code should match what's already\
    \ there, not impose new conventions.\n\nWhen in doubt about any convention (naming,\
    \ scoping, structure), check the Figma file first, then the user's codebase. Only\
    \ fall back to common patterns when neither exists.\n\n### Quick inspection scripts\n\
    \n**List all pages and top-level nodes:**\n```js\nconst pages = figma.root.children.map(p\
    \ => `${p.name} id=${p.id} children=${p.children.length}`);\nreturn pages.join('\\\
    n');\n```\n\n**List existing components across all pages:**\n```js\nconst results\
    \ = [];\nfor (const page of figma.root.children) {\n  await figma.setCurrentPageAsync(page);\n\
    \  page.findAll(n => {\n    if (n.type === 'COMPONENT' || n.type === 'COMPONENT_SET')\n\
    \      results.push(`[${page.name}] ${n.name} (${n.type}) id=${n.id}`);\n    return\
    \ false;\n  });\n}\nreturn results.join('\\n');\n```\n\n**List existing variable\
    \ collections and their conventions:**\n```js\nconst collections = await figma.variables.getLocalVariableCollectionsAsync();\n\
    const results = collections.map(c => ({\n  name: c.name, id: c.id,\n  varCount:\
    \ c.variableIds.length,\n  modes: c.modes.map(m => m.name)\n}));\nreturn results;\n\
    ```\n\n## 9. Reference Docs\n\nLoad these as needed based on what your task involves:\n\
    \n| Doc | When to load | What it covers |\n|-----|-------------|----------------|\n\
    | [gotchas.md](references/gotchas.md) | Before any `use_figma` | Every known pitfall\
    \ with WRONG/CORRECT code examples |\n| [common-patterns.md](references/common-patterns.md)\
    \ | Need working code examples | Script scaffolds: shapes, text, auto-layout,\
    \ variables, components, multi-step workflows |\n| [plugin-api-patterns.md](references/plugin-api-patterns.md)\
    \ | Creating/editing nodes | Fills, strokes, Auto Layout, effects, grouping, cloning,\
    \ styles |\n| [api-reference.md](references/api-reference.md) | Need exact API\
    \ surface | Node creation, variables API, core properties, what works and what\
    \ doesn't |\n| [validation-and-recovery.md](references/validation-and-recovery.md)\
    \ | Multi-step writes or error recovery | `get_metadata` vs `get_screenshot` workflow,\
    \ mandatory error recovery steps |\n| [component-patterns.md](references/component-patterns.md)\
    \ | Creating components/variants | combineAsVariants, component properties, INSTANCE_SWAP,\
    \ variant layout, discovering existing components, metadata traversal |\n| [variable-patterns.md](references/variable-patterns.md)\
    \ | Creating/binding variables | Collections, modes, scopes, aliasing, binding\
    \ patterns, discovering existing variables |\n| [text-style-patterns.md](references/text-style-patterns.md)\
    \ | Creating/applying text styles | Type ramps, font probing, listing styles,\
    \ applying styles to nodes |\n| [effect-style-patterns.md](references/effect-style-patterns.md)\
    \ | Creating/applying effect styles | Drop shadows, listing styles, applying styles\
    \ to nodes |\n| [plugin-api-standalone.index.md](references/plugin-api-standalone.index.md)\
    \ | Need to understand the full API surface | Index of all types, methods, and\
    \ properties in the Plugin API |\n| [plugin-api-standalone.d.ts](references/plugin-api-standalone.d.ts)\
    \ | Need exact type signatures | Full typings file \u2014 grep for specific symbols,\
    \ don't load all at once |\n\n## 10. Snippet examples\n\nYou will see snippets\
    \ throughout documentation here. These snippets contain useful plugin API code\
    \ that can be repurposed. Use them as is, or as starter code as you go. If there\
    \ are key concepts that are best documented as generic snippets, call them out\
    \ and write to disk so you can reuse in the future."
