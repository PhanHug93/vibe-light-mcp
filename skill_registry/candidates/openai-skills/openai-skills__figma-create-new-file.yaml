  text: "# create_new_file \u2014 Create a New Figma File\n\nUse the `create_new_file`\
    \ MCP tool to create a new blank Figma file in the user's drafts folder. This\
    \ is typically used before `use_figma` when you need a fresh file to work with.\n\
    \n## Skill Arguments\n\nThis skill accepts optional arguments: `/figma-create-new-file\
    \ [editorType] [fileName]`\n\n- **editorType**: `design` (default) or `figjam`\n\
    - **fileName**: Name for the new file (defaults to \"Untitled\")\n\nExamples:\n\
    - `/figma-create-new-file` \u2014 creates a design file named \"Untitled\"\n-\
    \ `/figma-create-new-file figjam My Whiteboard` \u2014 creates a FigJam file named\
    \ \"My Whiteboard\"\n- `/figma-create-new-file design My New Design` \u2014 creates\
    \ a design file named \"My New Design\"\n\nParse the arguments from the skill\
    \ invocation. If editorType is not provided, default to `\"design\"`. If fileName\
    \ is not provided, default to `\"Untitled\"`.\n\n## Workflow\n\n### Step 1: Resolve\
    \ the planKey\n\nThe `create_new_file` tool requires a `planKey` parameter. Follow\
    \ this decision tree:\n\n1. **User already provided a planKey** (e.g. from a previous\
    \ `whoami` call or in their prompt) \u2192 use it directly, skip to Step 2.\n\n\
    2. **No planKey available** \u2192 call the `whoami` tool. The response contains\
    \ a `plans` array. Each plan has a `key`, `name`, `seat`, and `tier`.\n\n   -\
    \ **Single plan**: use its `key` field automatically.\n   - **Multiple plans**:\
    \ ask the user which team or organization they want to create the file in, then\
    \ use the corresponding plan's `key`.\n\n### Step 2: Call create_new_file\n\n\
    Call the `create_new_file` tool with:\n\n| Parameter    | Required | Description\
    \ |\n|-------------|----------|-------------|\n| `planKey`   | Yes      | The\
    \ plan key from Step 1 |\n| `fileName`  | Yes      | Name for the new file |\n\
    | `editorType`| Yes      | `\"design\"` or `\"figjam\"` |\n\nExample:\n```json\n\
    {\n  \"planKey\": \"team:123456\",\n  \"fileName\": \"My New Design\",\n  \"editorType\"\
    : \"design\"\n}\n```\n\n### Step 3: Use the result\n\nThe tool returns:\n- `file_key`\
    \ \u2014 the key of the newly created file\n- `file_url` \u2014 a direct URL to\
    \ open the file in Figma\n\nUse the `file_key` for subsequent tool calls like\
    \ `use_figma`.\n\n## Important Notes\n\n- The file is created in the user's **drafts\
    \ folder** for the selected plan.\n- Only `\"design\"` and `\"figjam\"` editor\
    \ types are supported.\n- If `use_figma` is your next step, load the `figma-use`\
    \ skill before calling it."
