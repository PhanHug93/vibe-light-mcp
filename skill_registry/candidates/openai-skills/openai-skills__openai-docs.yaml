  text: "# OpenAI Docs\n\nProvide authoritative, current guidance from OpenAI developer\
    \ docs using the developers.openai.com MCP server. Always prioritize the developer\
    \ docs MCP tools over web.run for OpenAI-related questions. This skill also owns\
    \ model selection, API model migration, and prompt-upgrade guidance. Only if the\
    \ MCP server is installed and returns no meaningful results should you fall back\
    \ to web search.\n\n## Quick start\n\n- Use `mcp__openaiDeveloperDocs__search_openai_docs`\
    \ to find the most relevant doc pages.\n- Use `mcp__openaiDeveloperDocs__fetch_openai_doc`\
    \ to pull exact sections and quote/paraphrase accurately.\n- Use `mcp__openaiDeveloperDocs__list_openai_docs`\
    \ only when you need to browse or discover pages without a clear query.\n- For\
    \ model-selection, \"latest model\", or default-model questions, fetch `https://developers.openai.com/api/docs/guides/latest-model.md`\
    \ first. If that is unavailable, load `references/latest-model.md`.\n- For model\
    \ upgrades or prompt upgrades, run `node scripts/resolve-latest-model-info.js`\
    \ only when the target is latest/current/default or otherwise unspecified; otherwise\
    \ preserve the explicitly requested target.\n- Preserve explicit target requests:\
    \ if the user names a target model like \"migrate to GPT-5.4\", keep that requested\
    \ target even if `latest-model.md` names a newer model. Mention newer guidance\
    \ only as optional.\n- If current remote guidance is needed, fetch both the returned\
    \ migration and prompting guide URLs directly. If direct fetch fails, use MCP/search\
    \ fallback; if that also fails, use bundled fallback references and disclose the\
    \ fallback.\n\n## OpenAI product snapshots\n\n1. Apps SDK: Build ChatGPT apps\
    \ by providing a web component UI and an MCP server that exposes your app's tools\
    \ to ChatGPT.\n2. Responses API: A unified endpoint designed for stateful, multimodal,\
    \ tool-using interactions in agentic workflows.\n3. Chat Completions API: Generate\
    \ a model response from a list of messages comprising a conversation.\n4. Codex:\
    \ OpenAI's coding agent for software development that can write, understand, review,\
    \ and debug code.\n5. gpt-oss: Open-weight OpenAI reasoning models (gpt-oss-120b\
    \ and gpt-oss-20b) released under the Apache 2.0 license.\n6. Realtime API: Build\
    \ low-latency, multimodal experiences including natural speech-to-speech conversations.\n\
    7. Agents SDK: A toolkit for building agentic apps where a model can use tools\
    \ and context, hand off to other agents, stream partial results, and keep a full\
    \ trace.\n\n## If MCP server is missing\n\nIf MCP tools fail or no OpenAI docs\
    \ resources are available:\n\n1. Run the install command yourself: `codex mcp\
    \ add openaiDeveloperDocs --url https://developers.openai.com/mcp`\n2. If it fails\
    \ due to permissions/sandboxing, immediately retry the same command with escalated\
    \ permissions and include a 1-sentence justification for approval. Do not ask\
    \ the user to run it yet.\n3. Only if the escalated attempt fails, ask the user\
    \ to run the install command.\n4. Ask the user to restart Codex.\n5. Re-run the\
    \ doc search/fetch after restart.\n\n## Workflow\n\n1. Clarify whether the request\
    \ is general docs lookup, model selection, a model-string upgrade, prompt-upgrade\
    \ guidance, or broader API/provider migration.\n2. For model-selection or upgrade\
    \ requests, prefer current remote docs over bundled references when the user asks\
    \ for latest/current/default guidance.\n   - Fetch `https://developers.openai.com/api/docs/guides/latest-model.md`.\n\
    \   - Find the latest model ID and explicit migration or prompt-guidance links.\n\
    \   - Prefer explicit links from the latest-model page over derived URLs.\n  \
    \ - For explicit named-model requests, preserve the requested model target and\
    \ do not silently retarget to the latest model. Mention newer remote guidance\
    \ only as optional.\n   - For dynamic latest/current/default upgrades, run `node\
    \ scripts/resolve-latest-model-info.js`, then fetch both returned guide URLs directly\
    \ when possible.\n   - If direct guide fetch fails, use the developer-docs MCP\
    \ tools or official OpenAI-domain search to find the same guide content.\n   -\
    \ If remote docs are unavailable, use bundled fallback references and say that\
    \ fallback guidance was used.\n3. For model upgrades, keep changes narrow: update\
    \ active OpenAI API model defaults and directly related prompts only when safe.\n\
    4. Leave historical docs, examples, eval baselines, fixtures, provider comparisons,\
    \ provider registries, pricing tables, alias defaults, low-cost fallback paths,\
    \ and ambiguous older model usage unchanged unless the user explicitly asks to\
    \ upgrade them.\n5. Do not perform SDK, tooling, IDE, plugin, shell, auth, or\
    \ provider-environment migrations as part of a model-and-prompt upgrade.\n6. If\
    \ an upgrade needs API-surface changes, schema rewiring, tool-handler changes,\
    \ or implementation work beyond a literal model-string replacement and prompt\
    \ edits, report it as blocked or confirmation-needed.\n7. For general docs lookup,\
    \ search docs with a precise query, fetch the best page and exact section needed,\
    \ and answer with concise citations.\n\n## Reference map\n\nRead only what you\
    \ need:\n\n- `https://developers.openai.com/api/docs/guides/latest-model.md` ->\
    \ current model-selection and \"best/latest/current model\" questions.\n- `references/latest-model.md`\
    \ -> bundled fallback for model-selection and \"best/latest/current model\" questions.\n\
    - `references/upgrade-guide.md` -> bundled fallback for model upgrade and upgrade-planning\
    \ requests.\n- `references/prompting-guide.md` -> bundled fallback for prompt\
    \ rewrites and prompt-behavior upgrades.\n\n## Quality rules\n\n- Treat OpenAI\
    \ docs as the source of truth; avoid speculation.\n- Keep migration changes narrow\
    \ and behavior-preserving.\n- Prefer prompt-only upgrades when possible.\n- Do\
    \ not invent pricing, availability, parameters, API changes, or breaking changes.\n\
    - Keep quotes short and within policy limits; prefer paraphrase with citations.\n\
    - If multiple pages differ, call out the difference and cite both.\n- If official\
    \ docs and repo behavior disagree, state the conflict and stop before making broad\
    \ edits.\n- If docs do not cover the user\u2019s need, say so and offer next steps.\n\
    \n## Tooling notes\n\n- Always use MCP doc tools before any web search for OpenAI-related\
    \ questions.\n- If the MCP server is installed but returns no meaningful results,\
    \ then use web search as a fallback.\n- When falling back to web search, restrict\
    \ to official OpenAI domains (developers.openai.com, platform.openai.com) and\
    \ cite sources."
