  text: "# Vercel Deploy\n\nDeploy any project to Vercel instantly. **Always deploy\
    \ as preview** (not production) unless the user explicitly asks for production.\n\
    \n## Prerequisites\n\n- Check whether the Vercel CLI is installed **without**\
    \ escalated permissions (for example, `command -v vercel`).\n- Only escalate the\
    \ actual deploy command if sandboxing blocks the deployment network calls (`sandbox_permissions=require_escalated`).\n\
    - The deployment might take a few minutes. Use appropriate timeout values.\n\n\
    ## Quick Start\n\n1. Check whether the Vercel CLI is installed (no escalation\
    \ for this check):\n\n```bash\ncommand -v vercel\n```\n\n2. If `vercel` is installed,\
    \ run this (with a 10 minute timeout):\n```bash\nvercel deploy [path] -y\n```\n\
    \n**Important:** Use a 10 minute (600000ms) timeout for the deploy command since\
    \ builds can take a while.\n\n3. If `vercel` is not installed, or if the CLI fails\
    \ with \"No existing credentials found\", use the fallback method below.\n\n##\
    \ Fallback (No Auth)\n\nIf CLI fails with auth error, use the deploy script:\n\
    \n```bash\nskill_dir=\"<path-to-skill>\"\n\n# Deploy current directory\nbash \"\
    $skill_dir/scripts/deploy.sh\"\n\n# Deploy specific project\nbash \"$skill_dir/scripts/deploy.sh\"\
    \ /path/to/project\n\n# Deploy existing tarball\nbash \"$skill_dir/scripts/deploy.sh\"\
    \ /path/to/project.tgz\n```\n\nThe script handles framework detection, packaging,\
    \ and deployment. It waits for the build to complete and returns JSON with `previewUrl`\
    \ and `claimUrl`.\n\n**Tell the user:** \"Your deployment is ready at [previewUrl].\
    \ Claim it at [claimUrl] to manage your deployment.\"\n\n## Production Deploys\n\
    \nOnly if user explicitly asks:\n```bash\nvercel deploy [path] --prod -y\n```\n\
    \n## Output\n\nShow the user the deployment URL. For fallback deployments, also\
    \ show the claim URL.\n\n**Do not** curl or fetch the deployed URL to verify it\
    \ works. Just return the link.\n\n## Troubleshooting\n\n### Escalated Network\
    \ Access\n\nIf deployment fails due to network issues (timeouts, DNS errors, connection\
    \ resets), rerun the actual deploy command with escalated permissions (use `sandbox_permissions=require_escalated`).\
    \ Do not escalate the `command -v vercel` installation check. The deploy requires\
    \ escalated network access when sandbox networking blocks outbound requests.\n\
    \nExample guidance to the user:\n\n```\nThe deploy needs escalated network access\
    \ to deploy to Vercel. I can rerun the command with escalated permissions\u2014\
    want me to proceed?\n```"
