  text: "# ASP.NET Core\n\n## Overview\n\nChoose the right ASP.NET Core application\
    \ model, compose the host and request pipeline correctly, and implement features\
    \ in the framework style Microsoft documents today.\n\nLoad the smallest set of\
    \ references that fits the task. Do not load every reference by default.\n\n##\
    \ Workflow\n\n1. Confirm the target framework, SDK, and current app model.\n2.\
    \ Open [references/stack-selection.md](references/stack-selection.md) first for\
    \ new apps or major refactors.\n3. Open [references/program-and-pipeline.md](references/program-and-pipeline.md)\
    \ next for `Program.cs`, DI, configuration, middleware, routing, logging, and\
    \ static assets.\n4. Open exactly one primary app-model reference:\n   - [references/ui-blazor.md](references/ui-blazor.md)\n\
    \   - [references/ui-razor-pages.md](references/ui-razor-pages.md)\n   - [references/ui-mvc.md](references/ui-mvc.md)\n\
    \   - [references/apis-minimal-and-controllers.md](references/apis-minimal-and-controllers.md)\n\
    5. Add cross-cutting references only as needed:\n   - [references/data-state-and-services.md](references/data-state-and-services.md)\n\
    \   - [references/security-and-identity.md](references/security-and-identity.md)\n\
    \   - [references/realtime-grpc-and-background-work.md](references/realtime-grpc-and-background-work.md)\n\
    \   - [references/testing-performance-and-operations.md](references/testing-performance-and-operations.md)\n\
    6. Open [references/versioning-and-upgrades.md](references/versioning-and-upgrades.md)\
    \ before introducing new platform APIs into an older solution or when migrating\
    \ between major versions.\n7. Use [references/source-map.md](references/source-map.md)\
    \ when you need the Microsoft Learn section that corresponds to a task not already\
    \ covered by the focused references.\n\n## Default Operating Assumptions\n\n-\
    \ Prefer the latest stable ASP.NET Core and .NET unless the repository or user\
    \ request pins an older target.\n- As of March 2026, prefer .NET 10 / ASP.NET\
    \ Core 10 for new production work. Treat ASP.NET Core 11 as preview unless the\
    \ user explicitly asks for preview features.\n- Prefer `WebApplicationBuilder`\
    \ and `WebApplication`. Avoid older `Startup` and `WebHost` patterns unless the\
    \ codebase already uses them or the task is migration.\n- Prefer built-in DI,\
    \ options/configuration, logging, ProblemDetails, OpenAPI, health checks, rate\
    \ limiting, output caching, and Identity before adding third-party infrastructure.\n\
    - Keep feature slices cohesive so the page, component, endpoint, controller, validation,\
    \ service, data access, and tests are easy to trace.\n- Respect the existing app\
    \ model. Do not rewrite Razor Pages to MVC or controllers to Minimal APIs without\
    \ a clear reason.\n\n## Reference Guide\n\n- [references/_sections.md](references/_sections.md):\
    \ Quick index and reading order.\n- [references/stack-selection.md](references/stack-selection.md):\
    \ Choose the right ASP.NET Core application model and template.\n- [references/program-and-pipeline.md](references/program-and-pipeline.md):\
    \ Structure `Program.cs`, services, middleware, routing, configuration, logging,\
    \ and static assets.\n- [references/ui-blazor.md](references/ui-blazor.md): Build\
    \ Blazor Web Apps, choose render modes, and use components, forms, and JS interop\
    \ correctly.\n- [references/ui-razor-pages.md](references/ui-razor-pages.md):\
    \ Build page-focused server-rendered apps with handlers, model binding, and conventions.\n\
    - [references/ui-mvc.md](references/ui-mvc.md): Build controller/view applications\
    \ with clear separation of concerns.\n- [references/apis-minimal-and-controllers.md](references/apis-minimal-and-controllers.md):\
    \ Build HTTP APIs with Minimal APIs or controllers, including validation and response\
    \ patterns.\n- [references/data-state-and-services.md](references/data-state-and-services.md):\
    \ Use EF Core, `DbContext`, options, `IHttpClientFactory`, session, temp data,\
    \ and app state responsibly.\n- [references/security-and-identity.md](references/security-and-identity.md):\
    \ Apply authentication, authorization, Identity, secrets, data protection, CORS,\
    \ CSRF, and HTTPS guidance.\n- [references/realtime-grpc-and-background-work.md](references/realtime-grpc-and-background-work.md):\
    \ Use SignalR, gRPC, and hosted services.\n- [references/testing-performance-and-operations.md](references/testing-performance-and-operations.md):\
    \ Add integration tests, browser tests, caching, compression, health checks, rate\
    \ limits, and deployment concerns.\n- [references/versioning-and-upgrades.md](references/versioning-and-upgrades.md):\
    \ Handle target frameworks, breaking changes, obsolete APIs, and migrations.\n\
    - [references/source-map.md](references/source-map.md): Map the official ASP.NET\
    \ Core documentation tree to the references in this skill.\n\n## Execution Notes\n\
    \n- When generating new code, start from the correct `dotnet new` template and\
    \ keep the generated structure recognizable.\n- When editing an existing solution,\
    \ follow the solution's conventions first and use these references to avoid framework\
    \ misuse or outdated patterns.\n- When a task mentions \"latest\", verify the\
    \ feature on Microsoft Learn or the ASP.NET Core docs repo before relying on memory."
