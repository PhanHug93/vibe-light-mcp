  text: "# Sentry (Read-only Observability)\n\n## Quick start\n\n- If not already\
    \ authenticated, ask the user to run `sentry auth login` or set `SENTRY_AUTH_TOKEN`\
    \ as an env var.\n- The CLI auto-detects org/project from DSNs in `.env` files,\
    \ source code, config defaults, and directory names. Only specify `<org>/<project>`\
    \ if auto-detection fails or picks the wrong target.\n- Defaults: time range `24h`,\
    \ environment `production`, limit 20.\n- Always use `--json` when processing output\
    \ programmatically. Use `--json --fields` to select specific fields and reduce\
    \ output size.\n- Use `sentry schema <resource>` to discover API endpoints quickly.\n\
    \nIf the CLI is not installed, give the user these steps:\n1. Install the Sentry\
    \ CLI: `curl https://cli.sentry.dev/install -fsS | bash`\n2. Authenticate: `sentry\
    \ auth login`\n3. Confirm authentication: `sentry auth status`\n- Never ask the\
    \ user to paste the full token in chat. Ask them to set it locally and confirm\
    \ when ready.\n\n## Core tasks (use Sentry CLI)\n\nUse the `sentry` CLI for all\
    \ queries. It handles authentication, org/project detection, pagination, and retries\
    \ automatically. Use `--json` for machine-readable output.\n\n### 1) List issues\
    \ (ordered by most recent)\n\n```bash\nsentry issue list \\\n  --query \"is:unresolved\
    \ environment:production\" \\\n  --period 24h \\\n  --limit 20 \\\n  --json --fields\
    \ shortId,title,priority,level,status\n```\n\nIf auto-detection doesn't resolve\
    \ org/project, pass them explicitly:\n```bash\nsentry issue list {your-org}/{your-project}\
    \ \\\n  --query \"is:unresolved environment:production\" \\\n  --period 24h \\\
    \n  --limit 20 \\\n  --json\n```\n\n### 2) Resolve an issue short ID to issue\
    \ detail\n\n```bash\nsentry issue view {ABC-123} --json\n```\n\nUse the short\
    \ ID format (e.g., `ABC-123`), not the numeric ID.\n\n### 3) Issue detail\n\n\
    ```bash\nsentry issue view {ABC-123}\n```\n\n### 4) Issue events\n\n```bash\n\
    sentry issue events {ABC-123} --limit 20 --json\n```\n\n### 5) Event detail\n\n\
    ```bash\nsentry event view {your-org}/{your-project}/{event_id} --json\n```\n\n\
    ### 6) AI-powered root cause analysis\n\n```bash\nsentry issue explain {ABC-123}\n\
    ```\n\n### 7) AI-powered fix plan\n\n```bash\nsentry issue plan {ABC-123}\n```\n\
    \n## Fallback: arbitrary API access\n\nFor endpoints not covered by dedicated\
    \ CLI commands, use `sentry api`:\n```bash\nsentry api /api/0/organizations/{your-org}/\
    \ --method GET\n```\n\nUse `sentry schema` to discover available API endpoints:\n\
    ```bash\nsentry schema issues\n```\n\n## Inputs and defaults\n\n- `org_slug`,\
    \ `project_slug`: auto-detected by the CLI from DSNs, env vars, and directory\
    \ names. Override with positional `{your-org}/{your-project}` if auto-detection\
    \ fails.\n- `time_range`: default `24h` (pass as `--period 24h`).\n- `environment`:\
    \ default `prod` (pass as part of `--query`, e.g., `environment:production`).\n\
    - `limit`: default 20 (pass as `--limit`).\n- `search_query`: optional `--query`\
    \ parameter, uses Sentry search syntax (e.g., `is:unresolved`, `assigned:me`).\n\
    - `issue_short_id`: use directly with `sentry issue view`.\n\n## Output formatting\
    \ rules\n\n- Issue list: show title, short_id, status, first_seen, last_seen,\
    \ count, environments, top_tags; order by most recent.\n- Event detail: include\
    \ culprit, timestamp, environment, release, url.\n- If no results, state explicitly.\n\
    - Redact PII in output (emails, IPs). Do not print raw stack traces.\n- Never\
    \ echo auth tokens.\n\n## Golden test inputs\n\n- Org: `{your-org}`\n- Project:\
    \ `{your-project}`\n- Issue short ID: `{ABC-123}`\n\nExample prompt: \"List the\
    \ top 10 open issues for prod in the last 24h.\"\nExpected: ordered list with\
    \ titles, short IDs, counts, last seen."
