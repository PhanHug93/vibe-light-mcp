  text: "# PDF Skill\n\n## When to use\n- Read or review PDF content where layout\
    \ and visuals matter.\n- Create PDFs programmatically with reliable formatting.\n\
    - Validate final rendering before delivery.\n\n## Workflow\n1. Prefer visual review:\
    \ render PDF pages to PNGs and inspect them.\n   - Use `pdftoppm` if available.\n\
    \   - If unavailable, install Poppler or ask the user to review the output locally.\n\
    2. Use `reportlab` to generate PDFs when creating new documents.\n3. Use `pdfplumber`\
    \ (or `pypdf`) for text extraction and quick checks; do not rely on it for layout\
    \ fidelity.\n4. After each meaningful update, re-render pages and verify alignment,\
    \ spacing, and legibility.\n\n## Temp and output conventions\n- Use `tmp/pdfs/`\
    \ for intermediate files; delete when done.\n- Write final artifacts under `output/pdf/`\
    \ when working in this repo.\n- Keep filenames stable and descriptive.\n\n## Dependencies\
    \ (install if missing)\nPrefer `uv` for dependency management.\n\nPython packages:\n\
    ```\nuv pip install reportlab pdfplumber pypdf\n```\nIf `uv` is unavailable:\n\
    ```\npython3 -m pip install reportlab pdfplumber pypdf\n```\nSystem tools (for\
    \ rendering):\n```\n# macOS (Homebrew)\nbrew install poppler\n\n# Ubuntu/Debian\n\
    sudo apt-get install -y poppler-utils\n```\n\nIf installation isn't possible in\
    \ this environment, tell the user which dependency is missing and how to install\
    \ it locally.\n\n## Environment\nNo required environment variables.\n\n## Rendering\
    \ command\n```\npdftoppm -png $INPUT_PDF $OUTPUT_PREFIX\n```\n\n## Quality expectations\n\
    - Maintain polished visual design: consistent typography, spacing, margins, and\
    \ section hierarchy.\n- Avoid rendering issues: clipped text, overlapping elements,\
    \ broken tables, black squares, or unreadable glyphs.\n- Charts, tables, and images\
    \ must be sharp, aligned, and clearly labeled.\n- Use ASCII hyphens only. Avoid\
    \ U+2011 (non-breaking hyphen) and other Unicode dashes.\n- Citations and references\
    \ must be human-readable; never leave tool tokens or placeholder strings.\n\n\
    ## Final checks\n- Do not deliver until the latest PNG inspection shows zero visual\
    \ or formatting defects.\n- Confirm headers/footers, page numbering, and section\
    \ transitions look polished.\n- Keep intermediate files organized or remove them\
    \ after final approval."
