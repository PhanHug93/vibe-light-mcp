  text: "# Draw.io Diagram Generator\n\nThis skill enables you to generate, edit,\
    \ and validate draw.io (`.drawio`) diagram files with\ncorrect mxGraph XML structure.\
    \ All generated files open immediately in the\n[Draw.io VS Code extension](https://marketplace.visualstudio.com/items?itemName=hediet.vscode-drawio)\n\
    (`hediet.vscode-drawio`) without any manual fixes required. You can also open\
    \ the files in the draw.io web app or desktop app if you prefer.\n\n---\n\n##\
    \ 1. When to Use This Skill\n\n**Trigger phrases (load this skill when you see\
    \ these)**\n\n- \"create a diagram\", \"draw a flowchart\", \"generate an architecture\
    \ diagram\"\n- \"design a sequence diagram\", \"make a UML class diagram\", \"\
    build an ER diagram\"\n- \"add a .drawio file\", \"update the diagram\", \"visualise\
    \ the flow\"\n- \"document the architecture\", \"show the data model\", \"diagram\
    \ the service interactions\"\n- Any request to produce or modify a `.drawio`,\
    \ `.drawio.svg`, or `.drawio.png` file\n\n**Supported diagram types**\n\n| Diagram\
    \ Type | Template Available | Description |\n|---|---|---|\n| Flowchart | `assets/templates/flowchart.drawio`\
    \ | Process flows with decisions and branches |\n| System Architecture | `assets/templates/architecture.drawio`\
    \ | Multi-tier / layered service architecture |\n| Sequence Diagram | `assets/templates/sequence.drawio`\
    \ | Actor lifelines and timed message flows |\n| ER Diagram | `assets/templates/er-diagram.drawio`\
    \ | Database tables with relationships |\n| UML Class Diagram | `assets/templates/uml-class.drawio`\
    \ | Classes, interfaces, enums, relationships |\n| Network Topology | (use shape\
    \ library) | Routers, servers, firewalls, subnets |\n| BPMN Workflow | (use shape\
    \ library) | Business process events, tasks, gateways |\n| Mind Map | (manual)\
    \ | Central topic with radiating branches |\n\n---\n\n## 2. Prerequisites\n\n\
    - If running with VS Code integration enabled, Install the drawio extension: **draw.io\
    \ VS Code extension** \u2014 `hediet.vscode-drawio` (extension id). Install with:\n\
    \  ```\n  ext install hediet.vscode-drawio\n  ```\n- **Supported file extensions**:\
    \ `.drawio`, `.drawio.svg`, `.drawio.png`\n- **Python 3.8+** (optional) \u2014\
    \ for the validation and shape-insertion scripts in `scripts/`\n\n---\n\n## 3.\
    \ Step-by-Step Agent Workflow\n\nFollow these steps in order for every diagram\
    \ generation task.\n\n### Step 1 \u2014 Understand the Request\n\nAsk or infer:\n\
    1. **Diagram type** \u2014 What kind of diagram? (flowchart, architecture, UML,\
    \ ER, sequence, network...)\n2. **Entities / actors** \u2014 What are the main\
    \ components, actors, classes, or tables?\n3. **Relationships** \u2014 How are\
    \ they connected? What direction? What cardinality?\n4. **Output path** \u2014\
    \ Where should the `.drawio` file be saved?\n5. **Existing file** \u2014 Are we\
    \ creating new or editing an existing file?\n\nIf the request is ambiguous, infer\
    \ the most sensible diagram type from context (e.g. \"show the tables\" \u2192\
    \ ER diagram, \"show how the API call flows\" \u2192 sequence diagram).\n\n###\
    \ Step 2 \u2014 Select a Template or Start Fresh\n\n- **Use a template** when\
    \ the diagram type matches one in `assets/templates/`. Copy the template structure\
    \ and replace placeholder values.\n- **Start fresh** for novel layouts. Begin\
    \ with the minimal valid skeleton:\n\n```xml\n<!-- Set modified=\"\" to the current\
    \ ISO 8601 timestamp when generating a new file -->\n<mxfile host=\"Electron\"\
    \ modified=\"\" version=\"26.0.0\">\n  <diagram id=\"page-1\" name=\"Page-1\"\
    >\n    <mxGraphModel dx=\"1422\" dy=\"762\" grid=\"1\" gridSize=\"10\" guides=\"\
    1\"\n                  tooltips=\"1\" connect=\"1\" arrows=\"1\" fold=\"1\"\n\
    \                  page=\"1\" pageScale=\"1\" pageWidth=\"1169\" pageHeight=\"\
    827\"\n                  math=\"0\" shadow=\"0\">\n      <root>\n        <mxCell\
    \ id=\"0\" />\n        <mxCell id=\"1\" parent=\"0\" />\n        <!-- Your cells\
    \ go here -->\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n```\n\
    \n> **Rule**: ids `0` and `1` are ALWAYS required and must be the first two cells.\
    \ Never reuse them.\n\n### Step 3 \u2014 Plan the Layout\n\nBefore generating\
    \ XML, sketch the logical placement:\n- Organise into **rows** or **tiers** (use\
    \ swimlanes for layers)\n- **Horizontal spacing**: 40\u201360px between same-row\
    \ shapes\n- **Vertical spacing**: 80\u2013120px between tier rows\n- Standard\
    \ shape size: `120x60` px for process boxes, `160x80` px for swimlanes\n- Default\
    \ canvas: A4 landscape = `1169 x 827` px\n\n### Step 4 \u2014 Generate the mxGraph\
    \ XML\n\n**Vertex cell** (every shape):\n```xml\n<mxCell id=\"unique-id\" value=\"\
    Label\"\n        style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"100\" y=\"100\" width=\"\
    120\" height=\"60\" as=\"geometry\" />\n</mxCell>\n```\n\n**Edge cell** (every\
    \ connector):\n```xml\n<mxCell id=\"edge-id\" value=\"Label (optional)\"\n   \
    \     style=\"edgeStyle=orthogonalEdgeStyle;html=1;\"\n        edge=\"1\" source=\"\
    source-id\" target=\"target-id\" parent=\"1\">\n  <mxGeometry relative=\"1\" as=\"\
    geometry\" />\n</mxCell>\n```\n\n**Critical rules**:\n- Every cell id must be\
    \ **globally unique** within the file\n- Every vertex must have an `mxGeometry`\
    \ child with `x`, `y`, `width`, `height`, `as=\"geometry\"`\n- Every edge must\
    \ have `source` and `target` matching existing vertex ids \u2014 **exception**:\
    \ floating edges (e.g. sequence diagram lifelines) use `sourcePoint`/`targetPoint`\
    \ inside `<mxGeometry>` instead; see \xA74 Sequence Diagram\n- Every cell's `parent`\
    \ must reference an existing cell id\n- Use `html=1` in style when the label contains\
    \ HTML (`<b>`, `<i>`, `<br>`)\n- Escape XML special characters in labels: `&`\
    \ => `&amp;`, `<` => `&lt;`, `>` => `&gt;`\n\n### Step 5 \u2014 Apply Correct\
    \ Styles\n\nUse the standard semantic color palette for consistency:\n\n| Purpose\
    \ | fillColor | strokeColor |\n|---|---|---|\n| Primary / Info | `#dae8fc` | `#6c8ebf`\
    \ |\n| Success / Start | `#d5e8d4` | `#82b366` |\n| Warning / Decision | `#fff2cc`\
    \ | `#d6b656` |\n| Error / End | `#f8cecc` | `#b85450` |\n| Neutral | `#f5f5f5`\
    \ | `#666666` |\n| External / Partner | `#e1d5e7` | `#9673a6` |\n\nCommon style\
    \ strings by diagram type:\n\n```\n# Rounded process box (flowchart)\nrounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\n\
    \n# Decision diamond\nrhombus;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;\n\
    \n# Start/End terminal\nellipse;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;\n\
    \n# Database cylinder\nshape=mxgraph.flowchart.database;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;\n\
    \n# Swimlane container (tier)\nswimlane;startSize=30;fillColor=#dae8fc;strokeColor=#6c8ebf;fontStyle=1;\n\
    \n# UML class box\nswimlane;fontStyle=1;align=center;startSize=40;fillColor=#dae8fc;strokeColor=#6c8ebf;\n\
    \n# Interface / stereotype box\nswimlane;fontStyle=3;align=center;startSize=40;fillColor=#f5f5f5;strokeColor=#666666;\n\
    \n# ER table container\nshape=table;startSize=30;container=1;collapsible=1;childLayout=tableLayout;\n\
    \n# Orthogonal connector\nedgeStyle=orthogonalEdgeStyle;html=1;\n\n# ER relationship\
    \ (crow's foot)\nedgeStyle=entityRelationEdgeStyle;html=1;endArrow=ERmany;startArrow=ERone;\n\
    ```\n\n> See `references/style-reference.md` for the complete style key catalog\
    \ and `references/shape-libraries.md` for all shape library names.\n\n### Step\
    \ 6 \u2014 Save and Validate\n\n1. **Write the file** to the requested path with\
    \ `.drawio` extension\n2. **Run the validator** (optional but recommended):\n\
    \   ```bash\n   python .github/skills/draw-io-diagram-generator/scripts/validate-drawio.py\
    \ <path-to-file.drawio>\n   ```\n3. **Tell the user** how to open the file:\n\
    \   > \"Open `<filename>` in VS Code \u2014 it will render automatically with\
    \ the draw.io extension. You can use draw.io's web app or desktop app as well\
    \ if you prefer.\"\n4. **Provide a brief description** of what is in the diagram\
    \ so the user knows what to expect.\n\n---\n\n## 4. Diagram-Type Recipes\n\n###\
    \ Flowchart\n\nKey elements: Start (ellipse) => Process (rounded rectangle) =>\
    \ Decision (diamond) => End (ellipse)\n\n```xml\n<!-- Start node -->\n<mxCell\
    \ id=\"start\" value=\"Start\"\n        style=\"ellipse;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"500\" y=\"80\" width=\"\
    120\" height=\"60\" as=\"geometry\" />\n</mxCell>\n\n<!-- Process -->\n<mxCell\
    \ id=\"p1\" value=\"Process Step\"\n        style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"500\" y=\"200\" width=\"\
    120\" height=\"60\" as=\"geometry\" />\n</mxCell>\n\n<!-- Decision -->\n<mxCell\
    \ id=\"d1\" value=\"Condition?\"\n        style=\"rhombus;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"460\" y=\"320\" width=\"\
    200\" height=\"100\" as=\"geometry\" />\n</mxCell>\n\n<!-- Arrow: start to p1\
    \ -->\n<mxCell id=\"e1\" value=\"\"\n        style=\"edgeStyle=orthogonalEdgeStyle;html=1;\"\
    \n        edge=\"1\" source=\"start\" target=\"p1\" parent=\"1\">\n  <mxGeometry\
    \ relative=\"1\" as=\"geometry\" />\n</mxCell>\n```\n\n### Architecture Diagram\
    \ (3-tier)\n\nUse **swimlane containers** for each tier. All service boxes are\
    \ children of their swimlane.\n\n```xml\n<!-- Tier swimlane -->\n<mxCell id=\"\
    tier1\" value=\"Client Layer\"\n        style=\"swimlane;startSize=30;fillColor=#dae8fc;strokeColor=#6c8ebf;fontStyle=1;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"60\" y=\"100\" width=\"\
    1050\" height=\"130\" as=\"geometry\" />\n</mxCell>\n\n<!-- Service inside tier\
    \ (parent=\"tier1\", coords are relative to tier) -->\n<mxCell id=\"webapp\" value=\"\
    Web App\"\n        style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\"\
    \n        vertex=\"1\" parent=\"tier1\">\n  <mxGeometry x=\"80\" y=\"40\" width=\"\
    120\" height=\"60\" as=\"geometry\" />\n</mxCell>\n```\n\n> Connectors between\
    \ tiers use absolute coordinates with `parent=\"1\"`.\n\n### Sequence Diagram\n\
    \nKey elements: Actors (top), Lifelines (dashed vertical lines), Activation boxes,\
    \ Message arrows.\n\n- Lifelines: `edge=\"1\"` with `endArrow=none` and `dashed=1`,\
    \ no source/target \u2014 use `sourcePoint`/`targetPoint` in geometry\n- Synchronous\
    \ message: `endArrow=block;endFill=1`\n- Return message: `endArrow=open;endFill=0;dashed=1`\n\
    - Self-call: loop the edge via two Array points to the right and back\n\n**Minimal\
    \ XML snippet:**\n\n```xml\n<!-- Actor (stick figure) -->\n<mxCell id=\"actorA\"\
    \ value=\"Client\"\n        style=\"shape=mxgraph.uml.actor;pointerEvents=1;dashed=0;whiteSpace=wrap;html=1;aspect=fixed;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"110\" y=\"80\" width=\"\
    60\" height=\"80\" as=\"geometry\" />\n</mxCell>\n\n<!-- Service box -->\n<mxCell\
    \ id=\"actorB\" value=\"API Server\"\n        style=\"rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;\"\
    \n        vertex=\"1\" parent=\"1\">\n  <mxGeometry x=\"480\" y=\"100\" width=\"\
    160\" height=\"60\" as=\"geometry\" />\n</mxCell>\n\n<!-- Lifeline \u2014 floating\
    \ edge: uses sourcePoint/targetPoint, NOT source/target attributes -->\n<mxCell\
    \ id=\"lifA\" value=\"\"\n        style=\"edgeStyle=none;dashed=1;endArrow=none;\"\
    \n        edge=\"1\" parent=\"1\">\n  <mxGeometry relative=\"1\" as=\"geometry\"\
    >\n    <mxPoint x=\"140\" y=\"160\" as=\"sourcePoint\" />\n    <mxPoint x=\"140\"\
    \ y=\"700\" as=\"targetPoint\" />\n  </mxGeometry>\n</mxCell>\n\n<!-- Activation\
    \ box (thin rectangle on lifeline) -->\n<mxCell id=\"actA1\" value=\"\"\n    \
    \    style=\"fillColor=#dae8fc;strokeColor=#6c8ebf;\"\n        vertex=\"1\" parent=\"\
    1\">\n  <mxGeometry x=\"130\" y=\"220\" width=\"20\" height=\"180\" as=\"geometry\"\
    \ />\n</mxCell>\n\n<!-- Synchronous message -->\n<mxCell id=\"msg1\" value=\"\
    POST /orders\"\n        style=\"edgeStyle=elbowEdgeStyle;elbow=vertical;html=1;endArrow=block;endFill=1;\"\
    \n        edge=\"1\" source=\"actA1\" target=\"actorB\" parent=\"1\">\n  <mxGeometry\
    \ relative=\"1\" as=\"geometry\" />\n</mxCell>\n\n<!-- Return message (dashed)\
    \ -->\n<mxCell id=\"msg2\" value=\"201 Created\"\n        style=\"edgeStyle=elbowEdgeStyle;elbow=vertical;dashed=1;html=1;endArrow=open;endFill=0;\"\
    \n        edge=\"1\" source=\"actorB\" target=\"actA1\" parent=\"1\">\n  <mxGeometry\
    \ relative=\"1\" as=\"geometry\" />\n</mxCell>\n```\n\n> **Note:** Lifelines are\
    \ floating edges that use `sourcePoint`/`targetPoint` in `<mxGeometry>` instead\
    \ of `source`/`target` attributes. This is the standard draw.io pattern for sequence\
    \ diagrams.\n\n### ER Diagram\n\nUse `shape=table` containers with `childLayout=tableLayout`.\
    \ Rows are `shape=tableRow` cells with `portConstraint=eastwest`. Columns inside\
    \ each row are `shape=partialRectangle`.\n\nRelationship arrows use `edgeStyle=entityRelationEdgeStyle`:\n\
    - One-to-One: `startArrow=ERone;endArrow=ERone`\n- One-to-Many: `startArrow=ERone;endArrow=ERmany`\n\
    - Many-to-Many: `startArrow=ERmany;endArrow=ERmany`\n- Mandatory: `ERmandOne`,\
    \ Optional: `ERzeroToOne`\n\n### UML Class Diagram\n\nClass boxes are swimlane\
    \ containers. Attributes and methods are plain text cells. Dividers are zero-height\
    \ swimlane children.\n\nArrow styles by relationship type:\n\n| Relationship |\
    \ Style String |\n|---|---|\n| Inheritance (extends) | `edgeStyle=orthogonalEdgeStyle;html=1;endArrow=block;endFill=0;`\
    \ |\n| Realization (implements) | `edgeStyle=orthogonalEdgeStyle;dashed=1;html=1;endArrow=block;endFill=0;`\
    \ |\n| Composition | `edgeStyle=orthogonalEdgeStyle;html=1;startArrow=diamond;startFill=1;endArrow=none;`\
    \ |\n| Aggregation | `edgeStyle=orthogonalEdgeStyle;html=1;startArrow=diamond;startFill=0;endArrow=none;`\
    \ |\n| Dependency | `edgeStyle=orthogonalEdgeStyle;dashed=1;html=1;endArrow=open;endFill=0;`\
    \ |\n| Association | `edgeStyle=orthogonalEdgeStyle;html=1;endArrow=open;endFill=0;`\
    \ |\n\n---\n\n## 5. Multi-Page Diagrams\n\nAdd multiple `<diagram>` elements for\
    \ complex systems:\n\n```xml\n<mxfile host=\"Electron\" version=\"26.0.0\">\n\
    \  <diagram id=\"overview\" name=\"Overview\">\n    <!-- overview mxGraphModel\
    \ -->\n  </diagram>\n  <diagram id=\"detail\" name=\"Detail View\">\n    <!--\
    \ detail mxGraphModel -->\n  </diagram>\n</mxfile>\n```\n\nEach page has its own\
    \ independent cell id namespace. The same id value can appear in different pages\
    \ without conflict.\n\n---\n\n## 6. Editing Existing Diagrams\n\nWhen modifying\
    \ an existing `.drawio` file:\n\n1. **Read** the file first to understand existing\
    \ cell ids, positions, and parent hierarchy\n2. **Identify the target diagram\
    \ page** \u2014 by index or `name` attribute\n3. **Assign new unique ids** that\
    \ do not collide with existing ids\n4. **Respect the container hierarchy** \u2014\
    \ children of a swimlane use coordinates relative to their parent\n5. **Verify\
    \ edges** \u2014 after repositioning nodes, confirm edge source/target ids remain\
    \ valid\n\nUse `scripts/add-shape.py` to safely add a single shape without editing\
    \ raw XML:\n```bash\npython .github/skills/draw-io-diagram-generator/scripts/add-shape.py\
    \ docs/arch.drawio \"New Service\" 700 380\n```\n\n---\n\n## 7. Best Practices\n\
    \n**Layout**\n- Align shapes to the 10px grid (all coordinates divisible by 10)\n\
    - Group related shapes inside swimlane containers\n- One diagram topic per page;\
    \ use multi-page files for complex systems\n- Aim for 40 or fewer cells per page\
    \ for readability\n\n**Labels**\n- Add a title text cell (`text;strokeColor=none;fillColor=none;fontSize=18;fontStyle=1`)\
    \ at top of every page\n- Always set `whiteSpace=wrap;html=1` on vertex shapes\n\
    - Keep labels concise \u2014 3 words or fewer per shape where possible\n\n**Style\
    \ consistency**\n- Use the semantic color palette from Section 3 Step 5 consistently\
    \ across a project\n- Prefer `edgeStyle=orthogonalEdgeStyle` for clean right-angle\
    \ connectors\n- Do not inline arbitrary HTML in labels unless necessary\n\n**File\
    \ naming**\n- Use kebab-case: `order-service-flow.drawio`, `database-schema.drawio`\n\
    - Place diagrams alongside the code they document: `docs/` or `architecture/`\n\
    \n---\n\n## 8. Troubleshooting\n\n| Problem | Likely Cause | Fix |\n|---|---|---|\n\
    | File opens blank in VS Code | Missing id=0 or id=1 cell | Add both root cells\
    \ before any other cells |\n| Shape at wrong position | Child inside container\
    \ \u2014 coords are relative | Check `parent`; adjust x/y relative to container\
    \ |\n| Edge not visible | source or target id does not match any vertex | Verify\
    \ both ids exist exactly as written |\n| Diagram shows \"Compressed\" | mxGraphModel\
    \ is base64-encoded | Open in draw.io web, File > Export > XML (uncompressed)\
    \ |\n| Shape style not rendering | Typo in shape= name | Check `references/shape-libraries.md`\
    \ for exact style string |\n| Label shows escaped HTML | html=0 on a cell with\
    \ HTML label | Add `html=1;` to the cell style |\n| Container children overlap\
    \ container edge | Container height too small | Increase container height in mxGeometry\
    \ |\n\n---\n\n## 9. Validation Checklist\n\nBefore delivering any generated `.drawio`\
    \ file, verify:\n\n- [ ] File starts with `<mxfile>` root element\n- [ ] Every\
    \ `<diagram>` has a non-empty `id` attribute\n- [ ] `<mxCell id=\"0\" />` is the\
    \ first cell in every diagram\n- [ ] `<mxCell id=\"1\" parent=\"0\" />` is the\
    \ second cell in every diagram\n- [ ] All cell `id` values are unique within each\
    \ diagram\n- [ ] Every vertex cell has `vertex=\"1\"` and a child `<mxGeometry\
    \ as=\"geometry\">`\n- [ ] Every edge cell has `edge=\"1\"` and either: (a) `source`/`target`\
    \ pointing to existing vertex ids, or (b) `<mxPoint as=\"sourcePoint\">` and `<mxPoint\
    \ as=\"targetPoint\">` in its `<mxGeometry>` (floating edge \u2014 used for sequence\
    \ diagram lifelines)\n- [ ] Every cell (except id=0) has a `parent` pointing to\
    \ an existing id\n- [ ] `html=1` is in the style for any label containing HTML\
    \ tags\n- [ ] XML is well-formed (no unclosed tags, no unescaped `&`, `<`, `>`\
    \ in attribute values)\n- [ ] A title label cell exists at the top of each page\n\
    \nRun the automated validator:\n```bash\npython .github/skills/draw-io-diagram-generator/scripts/validate-drawio.py\
    \ <file.drawio>\n```\n\n---\n\n## 10. Output Format\n\nWhen delivering a diagram,\
    \ always provide:\n\n1. **The `.drawio` file** written to the requested path\n\
    2. **A one-sentence summary** of what the diagram shows\n3. **How to open it**:\n\
    \   > \"Open `<filename>` in VS Code \u2014 the draw.io extension will render\
    \ it automatically. Or you can open it in the draw.io web app or desktop app if\
    \ you prefer.\"\n4. **How to edit it** (if the user is likely to customise):\n\
    \   > \"Click any shape to select it. Double-click to edit the label. Drag to\
    \ reposition.\"\n5. **Validation status** \u2014 whether the validator script\
    \ was run and passed\n\n---\n\n## 11. References\n\nAll companion files are in\
    \ `.github/skills/draw-io-diagram-generator/`:\n\n| File | Contents |\n|---|---|\n\
    | `references/drawio-xml-schema.md` | Complete mxfile / mxGraphModel / mxCell\
    \ attribute reference, coordinate system, reserved cells, validation rules |\n\
    | `references/style-reference.md` | All style keys with allowed values, vertex\
    \ and edge style keys, shape catalog, semantic color palette |\n| `references/shape-libraries.md`\
    \ | All shape library categories (General, Flowchart, UML, ER, Network, BPMN,\
    \ Mockup, K8s) with style strings |\n| `assets/templates/flowchart.drawio` | Ready-to-use\
    \ flowchart template |\n| `assets/templates/architecture.drawio` | 4-tier system\
    \ architecture template |\n| `assets/templates/sequence.drawio` | 3-actor sequence\
    \ diagram template |\n| `assets/templates/er-diagram.drawio` | 3-table ER diagram\
    \ with crow's foot relationships |\n| `assets/templates/uml-class.drawio` | Interface\
    \ + 2 classes + enum with relationship arrows |\n| `scripts/validate-drawio.py`\
    \ | Python script to validate XML structure of any .drawio file |\n| `scripts/add-shape.py`\
    \ | Python CLI to add a new shape to an existing diagram |\n| `scripts/README.md`\
    \ | How to use the scripts with examples |"
