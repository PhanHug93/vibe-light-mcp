  text: "# Issue Fields Migration\n\n[Issue fields](https://github.blog/changelog/2026-03-12-issue-fields-structured-issue-metadata-is-in-public-preview/)\
    \ are org-level typed metadata (single select, text, number, date) that replace\
    \ label-based workarounds with structured, searchable, cross-repo fields. Every\
    \ organization gets `Priority`, `Effort`, `Start date`, and `Target date` preconfigured,\
    \ with support for up to 25 custom fields.\n\nThis skill bulk-migrates existing\
    \ metadata into issue fields from two sources:\n\n- **Repo labels**: Convert labels\
    \ like `p0`, `p1`, `priority/high` into structured issue field values (e.g. the\
    \ Priority field). Supports migrating multiple labels at once and optionally removing\
    \ them after migration.\n- **Project V2 fields**: Copy field values (single select,\
    \ text, number, date, iteration) from a GitHub Project into the equivalent org-level\
    \ issue fields.\n\n## When to Use\n\n- User added org-level issue fields that\
    \ overlap with existing project fields\n- User wants to copy values from project\
    \ fields to issue fields before deleting the old project fields\n- User asks about\
    \ \"migrating\", \"transferring\", or \"copying\" project field data to issue\
    \ fields\n- User wants to convert repo labels (e.g., p0, p1, p2, p3) into issue\
    \ field values (e.g., Priority field)\n- User asks about replacing labels with\
    \ issue fields or cleaning up labels after adopting issue fields\n\n## Prerequisites\n\
    \n- The target org must have issue fields enabled\n- The issue fields must already\
    \ exist at the org level\n- For project field migration: issue fields must be\
    \ added to the project\n- For label migration: labels must exist on the target\
    \ repo(s)\n- The user must have write access to the repos (and project, if migrating\
    \ project fields)\n- `gh` CLI must be authenticated with appropriate scopes\n\n\
    ## Available Tools\n\n### MCP Tools (read operations)\n\n| Tool | Purpose |\n\
    |------|---------|\n| `mcp__github__projects_list` | List project fields (`list_project_fields`),\
    \ list project items with values (`list_project_items`) |\n| `mcp__github__projects_get`\
    \ | Get details of a specific project field or item |\n\n### CLI / REST API\n\n\
    | Operation | Command |\n|-----------|---------|\n| List org issue fields | `gh\
    \ api /orgs/{org}/issue-fields -H \"X-GitHub-Api-Version: 2026-03-10\"` |\n| Read\
    \ issue field values | `gh api /repos/{owner}/{repo}/issues/{number}/issue-field-values\
    \ -H \"X-GitHub-Api-Version: 2026-03-10\"` |\n| Write issue field values | `gh\
    \ api /repositories/{repo_id}/issues/{number}/issue-field-values -X POST -H \"\
    X-GitHub-Api-Version: 2026-03-10\" --input -` |\n| Get repository ID | `gh api\
    \ /repos/{owner}/{repo} --jq .id` |\n| List repo labels | `gh label list -R {owner}/{repo}\
    \ --limit 1000 --json name,color,description` |\n| List issues by label | `gh\
    \ issue list -R {owner}/{repo} --label \"{name}\" --state all --json number,title,labels\
    \ --limit 1000` |\n| Remove label from issue | `gh api /repos/{owner}/{repo}/issues/{number}/labels/{label_name}\
    \ -X DELETE` |\n\nSee [references/issue-fields-api.md](references/issue-fields-api.md),\
    \ [references/projects-api.md](references/projects-api.md), and [references/labels-api.md](references/labels-api.md)\
    \ for full API details.\n\n## Workflow\n\n### Step 0: Migration Source\n\nAsk\
    \ the user what they are migrating:\n\n1. **\"Are you migrating labels or project\
    \ fields?\"**\n   - **Labels**: proceed to the [Label Migration Flow](#label-migration-flow)\
    \ below.\n   - **Project fields**: proceed to the [Project Field Migration Flow](#project-field-migration-flow)\
    \ below.\n\n2. If the user says **labels**:\n   - Ask: \"Which org and repo(s)\
    \ contain the labels?\"\n   - Ask: \"Which labels do you want to migrate?\" (they\
    \ can name them or say \"show me the labels first\")\n\n3. If the user says **project\
    \ fields**:\n   - Ask: \"Can you share the link to your project or tell me the\
    \ org name and project number?\"\n   - Ask: \"Which field do you want to migrate?\"\
    \n\n---\n\n### Label Migration Flow\n\nUse this flow when the user wants to convert\
    \ repo labels into issue field values. Labels can only map to `single_select`\
    \ issue fields (each label name maps to one option value).\n\n#### Phase L1: Input\
    \ & Label Discovery\n\n1. Ask the user for: **org name** and **repo(s)** to migrate.\n\
    2. Fetch labels from each repo:\n\n```bash\ngh label list -R {owner}/{repo} --limit\
    \ 1000 --json name,color,description\n```\n\n3. Fetch org issue fields:\n\n```bash\n\
    gh api /orgs/{org}/issue-fields \\\n  -H \"X-GitHub-Api-Version: 2026-03-10\"\
    \ \\\n  --jq '.[] | {id, name, content_type, options: [.options[]?.name]}'\n```\n\
    \n4. **Filtering** (for repos with many labels): if the repo has 50+ labels, group\
    \ by common prefix (e.g., `priority-*`, `team-*`, `type-*`) or color. Let the\
    \ user filter with \"show labels matching priority\" or \"show blue labels\" before\
    \ mapping. Never dump 100+ labels at once.\n\n5. Ask the user which labels map\
    \ to which issue field and option. Support these patterns:\n   - **Single label\
    \ to single field**: e.g., label \"bug\" \u2192 Type field, \"Bug\" option\n \
    \  - **Multiple labels to one field** (bulk): e.g., labels p0, p1, p2, p3 \u2192\
    \ Priority field with matching options\n   - **Multiple labels to multiple fields**:\
    \ e.g., p1 \u2192 Priority + frontend \u2192 Team. Handle as separate mapping\
    \ groups.\n\n6. **Auto-suggest mappings**: for each label, attempt to match issue\
    \ field options using these patterns (in order):\n   - **Exact match** (case-insensitive):\
    \ label `Bug` \u2192 option `Bug`\n   - **Prefix-number** (`{prefix}-{n}` \u2192\
    \ `{P}{n}`): label `priority-1` \u2192 option `P1`\n   - **Strip separators**\
    \ (hyphens, underscores, spaces): label `good_first_issue` \u2192 option `Good\
    \ First Issue`\n   - **Substring containment**: label `type: bug` \u2192 option\
    \ `Bug`\n\n   Present all suggestions at once for the user to confirm, correct,\
    \ or skip.\n\n**Example output:**\n\n```\nLabels in github/my-repo (showing relevant\
    \ ones):\n  p0, p1, p2, p3, bug, enhancement, frontend, backend\n\nOrg issue fields\
    \ (single_select):\n  Priority: Critical, P0, P1, P2, P3\n  Type: Bug, Feature,\
    \ Task\n  Team: Frontend, Backend, Design\n\nSuggested mappings:\n  Label \"p0\"\
    \ \u2192 Priority \"P0\"\n  Label \"p1\" \u2192 Priority \"P1\"\n  Label \"p2\"\
    \ \u2192 Priority \"P2\"\n  Label \"p3\" \u2192 Priority \"P3\"\n  Label \"bug\"\
    \ \u2192 Type \"Bug\"\n  Label \"frontend\" \u2192 Team \"Frontend\"\n  Label\
    \ \"backend\" \u2192 Team \"Backend\"\n  Label \"enhancement\" \u2192 (no auto-match;\
    \ skip or map manually)\n\nConfirm, adjust, or add more mappings?\n```\n\n####\
    \ Phase L2: Conflict Detection\n\nAfter finalizing the label-to-option mappings,\
    \ check for conflicts. A conflict occurs when an issue has multiple labels that\
    \ map to the **same** issue field (since single_select fields can hold only one\
    \ value).\n\n1. Group label mappings by target issue field.\n2. For each field\
    \ with multiple label sources, note the potential for conflicts.\n3. Ask the user\
    \ for a conflict resolution strategy:\n   - **First match**: use the first matching\
    \ label found (by order of label mapping list)\n   - **Skip**: skip issues with\
    \ conflicting labels and report them\n   - **Manual**: present each conflict for\
    \ the user to decide\n\n**Example:**\n\n```\nPotential conflict: labels \"p0\"\
    \ and \"p1\" both map to the Priority field.\nIf an issue has both labels, which\
    \ value should win?\n\nOptions:\n  1. First match (use \"p0\" since it appears\
    \ first in the mapping)\n  2. Skip conflicting issues\n  3. I'll decide case by\
    \ case\n```\n\n#### Phase L3: Pre-flight Checks & Data Scan\n\n1. For each repo,\
    \ verify write access and cache the `repository_id`:\n\n```bash\ngh api /repos/{owner}/{repo}\
    \ --jq '{full_name, id, permissions: .permissions}'\n```\n\n2. For each label\
    \ in the mapping, fetch matching issues:\n\n```bash\ngh issue list -R {owner}/{repo}\
    \ --label \"{label_name}\" --state all \\\n  --json number,title,labels,type --limit\
    \ 1000\n```\n\n   **Warning**: `--limit 1000` silently truncates results. If you\
    \ expect a label may have more than 1000 issues, paginate manually or verify the\
    \ total count first (e.g., `gh issue list --label \"X\" --state all --json number\
    \ | jq length`).\n\n   **PR filtering**: `gh issue list` returns both issues and\
    \ PRs. Include `type` in the `--json` output and filter for `type == \"Issue\"\
    ` if the user only wants issues migrated.\n\n3. If **all selected labels return\
    \ 0 issues**, stop and tell the user. Suggest: try different labels, check spelling,\
    \ or try a different repository. Do not proceed with an empty migration.\n\n4.\
    \ For multi-repo migrations, repeat across all specified repos.\n\n5. For each\
    \ issue found:\n   - Check if the issue already has a value for the target issue\
    \ field (skip if set).\n   - Detect multi-label conflicts (issue has two labels\
    \ for the same field).\n   - Apply the conflict resolution strategy chosen in\
    \ Phase L2.\n   - Classify: **migrate**, **skip (already set)**, **skip (conflict)**,\
    \ or **skip (no matching label)**.\n\n#### Phase L4: Preview / Dry-Run\n\nPresent\
    \ a summary before any writes.\n\n**Example preview:**\n\n```\nLabel Migration\
    \ Preview\n\nSource: labels in github/my-repo\nTarget fields: Priority, Type,\
    \ Team\n\n| Category                | Count |\n|-------------------------|-------|\n\
    | Issues to migrate       |   156 |\n| Already set (skip)      |    12 |\n| Conflicting\
    \ labels (skip)|    3 |\n| Total issues with labels|   171 |\n\nLabel breakdown:\n\
    \  \"p1\" \u2192 Priority \"P1\": 42 issues\n  \"p2\" \u2192 Priority \"P2\":\
    \ 67 issues\n  \"p3\" \u2192 Priority \"P3\": 38 issues\n  \"bug\" \u2192 Type\
    \ \"Bug\": 9 issues\n\nSample changes (first 5):\n  github/my-repo#101: Priority\
    \ \u2192 \"P1\"\n  github/my-repo#203: Priority \u2192 \"P2\", Type \u2192 \"\
    Bug\"\n  github/my-repo#44:  Priority \u2192 \"P3\"\n  github/my-repo#310: Priority\
    \ \u2192 \"P1\"\n  github/my-repo#7:   Type \u2192 \"Bug\"\n\nAfter migration,\
    \ do you also want to remove the migrated labels from issues? (optional)\n\nEstimated\
    \ time: ~24s (156 API calls at 0.15s each)\n\nProceed?\n```\n\n#### Phase L5:\
    \ Execution\n\n1. For each issue to migrate, write the issue field value (same\
    \ endpoint as project field migration):\n\n```bash\necho '{\"issue_field_values\"\
    : [{\"field_id\": FIELD_ID, \"value\": \"OPTION_NAME\"}]}' | \\\n  gh api /repositories/{repo_id}/issues/{number}/issue-field-values\
    \ \\\n    -X POST \\\n    -H \"X-GitHub-Api-Version: 2026-03-10\" \\\n    --input\
    \ -\n```\n\n   Replace `FIELD_ID` with the integer field ID (e.g., `1`) and `OPTION_NAME`\
    \ with the option name string.\n\n2. If the user opted to remove labels, remove\
    \ each migrated label after successful field write:\n\n```bash\ngh api /repos/{owner}/{repo}/issues/{number}/labels/{label_name}\
    \ -X DELETE\n```\n\n   URL-encode label names that contain spaces or special characters.\n\
    \n3. **Pacing**: 100ms delay between calls. Exponential backoff on HTTP 429 (1s,\
    \ 2s, 4s, up to 30s).\n4. **Progress**: report every 25 items (e.g., \"Migrated\
    \ 75/156 issues...\").\n5. **Error handling**: log failures but continue. Include\
    \ label removal failures separately.\n6. **Final summary**:\n\n```\nLabel Migration\
    \ Complete\n\n| Result                | Count |\n|-----------------------|-------|\n\
    | Fields set            |   153 |\n| Labels removed        |   153 |\n| Skipped\
    \               |    15 |\n| Failed (field write)  |     2 |\n| Failed (label\
    \ remove) |     1 |\n\nFailed items:\n  github/my-repo#501: 403 Forbidden (insufficient\
    \ permissions)\n  github/my-repo#88:  422 Validation failed (field not available\
    \ on repo)\n  github/my-repo#120: label removal failed (404, label already removed)\n\
    ```\n\n---\n\n### Project Field Migration Flow\n\nUse this flow when the user\
    \ wants to copy values from a GitHub Project V2 field to the corresponding org-level\
    \ issue field.\n\nFollow these six phases in order. Always preview before executing.\n\
    \n#### Phase P1: Input & Discovery\n\n1. Ask the user for: **org name** and **project\
    \ number** (or project URL).\n2. Fetch project fields:\n\n```bash\n# Use MCP tool\n\
    mcp__github__projects_list(owner: \"{org}\", project_number: {n}, method: \"list_project_fields\"\
    )\n```\n\n3. Fetch org issue fields:\n\n```bash\ngh api /orgs/{org}/issue-fields\
    \ \\\n  -H \"X-GitHub-Api-Version: 2026-03-10\" \\\n  --jq '.[] | {id, name, content_type,\
    \ options: [.options[]?.name]}'\n```\n\n4. **Filter out proxy fields**: after\
    \ issue fields are enabled on a project, some project fields appear as \"proxy\"\
    \ entries with empty `options: []` for single-select types. These mirror the real\
    \ issue fields and should be ignored. Only match against project fields that have\
    \ actual option values.\n\n5. Auto-match fields by name (case-insensitive) with\
    \ compatible types:\n\n| Project Field Type | Issue Field Type | Compatible? |\n\
    |-------------------|-----------------|-------------|\n| TEXT | text | Yes, direct\
    \ copy |\n| SINGLE_SELECT | single_select | Yes, option mapping needed |\n| NUMBER\
    \ | number | Yes, direct copy |\n| DATE | date | Yes, direct copy |\n| ITERATION\
    \ | (none) | No equivalent; skip with warning |\n\n6. Present the proposed field\
    \ mappings as a table. Let the user confirm, adjust, or skip fields.\n\n**Example\
    \ output:**\n\n```\nFound 3 potential field mappings:\n\n| # | Project Field \
    \     | Type          | Issue Field        | Status     |\n|---|-------------------|---------------|--------------------|------------|\n\
    | 1 | Priority (renamed) | SINGLE_SELECT | Priority           | Auto-match |\n\
    | 2 | Due Date           | DATE          | Due Date           | Auto-match |\n\
    | 3 | Sprint             | ITERATION     | (no equivalent)    | Skipped    |\n\
    \nProceed with fields 1 and 2? You can also add manual mappings.\n```\n\n####\
    \ Phase P2: Option Mapping (single-select fields only)\n\nFor each matched single-select\
    \ pair:\n\n1. Compare option names between the project field and issue field (case-insensitive).\n\
    2. Auto-match options with identical names.\n3. For any unmapped project field\
    \ options, present **all** unmapped options in a single summary and ask the user\
    \ to provide mappings for all of them at once. Do not prompt one-by-one; batch\
    \ them into a single exchange.\n4. Show the final option mapping table for confirmation.\n\
    \n**Example output:**\n\n```\nOption mapping for \"Release - Target\":\n\nAuto-matched\
    \ (case-insensitive):\n  \"GA\" \u2192 \"GA\"\n  \"Private Preview\" \u2192 \"\
    Private Preview\"\n  \"Public Preview\" \u2192 \"Public Preview\"\n\nUnmapped\
    \ project options (need your input):\n  1. \"Internal Only\" \u2192 which issue\
    \ field option? (or skip)\n  2. \"Retired\" \u2192 which issue field option? (or\
    \ skip)\n  3. \"Beta\" \u2192 which issue field option? (or skip)\n  4. \"Deprecated\"\
    \ \u2192 which issue field option? (or skip)\n\nAvailable issue field options\
    \ not yet mapped: \"Internal\", \"Sunset\", \"Beta Testing\", \"End of Life\"\n\
    \nPlease provide mappings for all 4 options above (e.g., \"1\u2192Internal, 2\u2192\
    Sunset, 3\u2192Beta Testing, 4\u2192skip\").\n```\n\n#### Phase P3: Pre-flight\
    \ Checks\n\nBefore scanning items, verify write access to each repository that\
    \ may be touched:\n\n1. From the project items (first page), collect the unique\
    \ set of `{owner}/{repo}` values.\n2. For each unique repo, verify the authenticated\
    \ user has Issues write permission:\n\n```bash\ngh api /repos/{owner}/{repo} --jq\
    \ '{full_name, permissions: .permissions}'\n```\n\n3. If any repo shows `push:\
    \ false` or `triage: false`, warn the user before proceeding. Items in those repos\
    \ will fail at write time.\n4. Cache the `repository_id` (integer) for each repo\
    \ now; you will need it in Phase 6:\n\n```bash\ngh api /repos/{owner}/{repo} --jq\
    \ .id\n```\n\n#### Phase P4: Data Scan\n\n1. Fetch all project items using MCP.\
    \ **Important**: for projects with more than ~200 items, `gh api graphql --paginate`\
    \ is unreliable (it concatenates JSON responses without proper separators and\
    \ can time out). Use the MCP tool which handles pagination internally, or use\
    \ explicit cursor-based pagination:\n\n```bash\n# Preferred: use MCP tool (handles\
    \ pagination automatically)\nmcp__github__projects_list(owner: \"{org}\", project_number:\
    \ {n}, method: \"list_project_items\")\n\n# Fallback for large projects: manual\
    \ cursor-based pagination\n# Fetch 100 items per page, advancing the cursor each\
    \ time.\n# Process each page before fetching the next to avoid memory issues.\n\
    # Save progress (page number or last cursor) so you can resume if interrupted.\n\
    ```\n\n2. For each item:\n   - Skip if it is a draft item (not a real issue).\n\
    \   - Extract the source project field value.\n   - Skip if the source value is\
    \ empty.\n   - Check if the issue already has a value for the target issue field:\n\
    \n```bash\ngh api /repos/{owner}/{repo}/issues/{number}/issue-field-values \\\n\
    \  -H \"X-GitHub-Api-Version: 2026-03-10\"\n```\n\n   - If the issue field already\
    \ has a value, skip it (preserve existing data).\n\n3. Classify each item into\
    \ one of:\n   - **Migrate**: has source value, no existing target value\n   -\
    \ **Skip (already set)**: target issue field already has a value\n   - **Skip\
    \ (no source)**: project field is empty for this item\n   - **Skip (draft)**:\
    \ item is a draft, not a real issue\n   - **Skip (unmapped option)**: single-select\
    \ value was not mapped\n\n#### Phase P5: Preview / Dry-Run\n\nPresent a summary\
    \ before any writes.\n\n**If user requested dry-run**: show the full detailed\
    \ report (every issue, its current value, proposed new value, and skip reason)\
    \ and stop. Do not execute.\n\n**Otherwise (preview mode)**: show summary counts\
    \ and a sample of changes, then ask for confirmation.\n\n**Example preview:**\n\
    \n```\nMigration Preview for Project #42\n\nFields to migrate: Priority, Due Date\n\
    \n| Category               | Count |\n|------------------------|-------|\n| Items\
    \ to migrate       |   847 |\n| Already set (skip)     |    23 |\n| No source\
    \ value (skip) |   130 |\n| Draft items (skip)     |    12 |\n| Total project\
    \ items    | 1,012 |\n\nSample changes (first 5):\n  github/repo-a#101: Priority\
    \ \u2192 \"High\"\n  github/repo-a#203: Priority \u2192 \"Medium\", Due Date \u2192\
    \ \"2025-03-15\"\n  github/repo-b#44:  Priority \u2192 \"Low\"\n  github/repo-a#310:\
    \ Due Date \u2192 \"2025-04-01\"\n  github/repo-c#7:   Priority \u2192 \"Critical\"\
    \n\nEstimated time: ~127s (847 API calls at 0.15s each)\n\nProceed with migration?\
    \ This will update 847 issues across 3 repositories.\n```\n\n#### Phase P6: Execution\n\
    \n1. Use the `repository_id` values cached in Phase 3.\n\n2. For each item to\
    \ migrate, write the issue field value:\n\n```bash\necho '{\"issue_field_values\"\
    : [{\"field_id\": FIELD_ID, \"value\": \"VALUE\"}]}' | \\\n  gh api /repositories/{repo_id}/issues/{number}/issue-field-values\
    \ \\\n    -X POST \\\n    -H \"X-GitHub-Api-Version: 2026-03-10\" \\\n    --input\
    \ -\n```\n\n   Replace `FIELD_ID` with the integer field ID (e.g., `1`) and `VALUE`\
    \ with the value string.\n\n3. **Pacing**: add a 100ms delay between API calls.\
    \ On HTTP 429 responses, use exponential backoff (1s, 2s, 4s, up to 30s).\n4.\
    \ **Progress**: report status every 25 items (e.g., \"Migrated 75/847 items...\"\
    ).\n5. **Error handling**: log failures but continue processing remaining items.\n\
    6. **Final summary**:\n\n```\nMigration Complete\n\n| Result  | Count |\n|---------|-------|\n\
    | Success |   842 |\n| Skipped |   165 |\n| Failed  |     5 |\n\nFailed items:\n\
    \  github/repo-a#501: 403 Forbidden (insufficient permissions)\n  github/repo-b#88:\
    \  422 Validation failed (field not available on repo)\n  ...\n```\n\n## Important\
    \ Notes\n\n- **Write endpoint quirk**: the REST API for writing issue field values\
    \ uses `repository_id` (integer), not `owner/repo`. Always look up the repo ID\
    \ first with `gh api /repos/{owner}/{repo} --jq .id`.\n- **Single-select values**:\
    \ the REST API accepts option **names** as strings (not option IDs). This makes\
    \ mapping straightforward for both project fields and labels.\n- **Reading values\
    \ back**: when reading issue field values from the API response, use `.single_select_option.name`\
    \ for the human-readable value. The `.value` property returns the internal option\
    \ ID (an integer like `1201`), not the display name.\n- **API version header**:\
    \ all issue fields endpoints require `X-GitHub-Api-Version: 2026-03-10`.\n- **Cross-repo\
    \ items**: a project can contain issues from multiple repositories. Cache the\
    \ repo ID per-repository to avoid redundant lookups.\n- **Preserve existing values**:\
    \ never overwrite an issue field value that is already set. Skip those items.\n\
    - **Iteration fields**: have no issue field equivalent. Always warn the user and\
    \ skip.\n- **Draft items**: project items that are not linked to real issues cannot\
    \ have issue field values. Skip with a note.\n- **Labels are repo-scoped**: unlike\
    \ project fields, labels exist per-repo. The same label name may exist in multiple\
    \ repos; migration applies separately to each.\n- **Label conflicts**: an issue\
    \ can have multiple labels that map to the same single_select field. Always detect\
    \ and resolve these before execution.\n- **Label removal is optional**: after\
    \ migration, the user may want to keep labels as backup or remove them. Always\
    \ ask before removing.\n- **URL-encode label names**: labels with spaces or special\
    \ characters must be URL-encoded when used in REST API paths (e.g., `good%20first%20issue`).\n\
    - **Script generation for scale**: for migrations of 100+ issues, generate a standalone\
    \ shell script rather than executing API calls one at a time through the agent.\
    \ This is faster, resumable, and avoids agent timeout issues.\n- **Idempotent\
    \ migrations**: re-running a migration is safe. Issues that already have the target\
    \ field value set will be skipped. This means you can safely resume a partial\
    \ migration without duplicating work.\n- **`--limit 1000` truncation**: `gh issue\
    \ list --limit 1000` silently stops at 1000 results. For labels with more issues,\
    \ paginate with `--jq` and cursor-based pagination or run multiple filtered queries\
    \ (e.g., by date range).\n- **macOS bash version**: macOS ships with bash 3.x,\
    \ which does not support `declare -A` (associative arrays). Generated scripts\
    \ should use POSIX-compatible constructs or note the incompatibility and suggest\
    \ `brew install bash`.\n- **Issues vs PRs**: `gh issue list` returns both issues\
    \ and pull requests. If the migration should only target issues, include `type`\
    \ in `--json` output and filter for `type == \"Issue\"`.\n\n## Examples\n\n###\
    \ Example 1: Full Migration\n\n**User**: \"I need to migrate Priority values from\
    \ our project to the new org Priority issue field\"\n\n**Action**: Follow Phases\
    \ P1-P6. Discover fields, map options, check permissions, scan items, preview,\
    \ execute.\n\n### Example 2: Dry-Run Only\n\n**User**: \"Show me what would happen\
    \ if I migrated fields from project #42, but don't actually do it\"\n\n**Action**:\
    \ Follow Phases P1-P5 only. Present the full dry-run report with every item listed.\
    \ Do not execute.\n\n### Example 3: Multiple Fields\n\n**User**: \"Migrate Priority\
    \ and Due Date from project #15 to issue fields\"\n\n**Action**: Same workflow,\
    \ but process both fields in a single pass. During the data scan, collect values\
    \ for all mapped fields per item. Write all field values in a single API call\
    \ per issue.\n\n### Example 4: Single Label to Issue Field\n\n**User**: \"I want\
    \ to migrate the 'bug' label to the Type issue field\"\n\n**Action**: Route to\
    \ Label Migration Flow. Ask for org/repo, list labels, confirm mapping: label\
    \ \"bug\" \u2192 Type field \"Bug\" option. Scan issues with that label, preview,\
    \ execute. Ask whether to remove the label after migration.\n\n### Example 5:\
    \ Multiple Labels to One Field (Bulk)\n\n**User**: \"We have p0, p1, p2, p3 labels\
    \ and want to convert them to the Priority issue field\"\n\n**Action**: Route\
    \ to Label Migration Flow. Map all four labels to Priority field options (p0\u2192\
    P0, p1\u2192P1, p2\u2192P2, p3\u2192P3). Check for conflicts (issues with multiple\
    \ priority labels). Preview all changes in one summary. Execute in one pass. Optionally\
    \ remove all four labels from migrated issues.\n\n### Example 6: Cross-Repo Label\
    \ Migration with Label Removal\n\n**User**: \"Migrate the 'frontend' and 'backend'\
    \ labels to the Team issue field across github/issues, github/memex, and github/mobile,\
    \ then remove the old labels\"\n\n**Action**: Route to Label Migration Flow. Confirm\
    \ repos and label mappings: \"frontend\"\u2192Team \"Frontend\", \"backend\"\u2192\
    Team \"Backend\". Scan all three repos for issues with these labels. Detect conflicts\
    \ (issues with both labels). Preview across repos. Execute field writes, then\
    \ remove labels from migrated issues. Report per-repo stats."
