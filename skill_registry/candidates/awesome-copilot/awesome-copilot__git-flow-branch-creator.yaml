  text: "### Instructions\n\n```xml\n<instructions>\n\t<title>Git Flow Branch Creator</title>\n\
    \t<description>This prompt analyzes your current git changes using git status\
    \ and git diff (or git diff --cached), then intelligently determines the appropriate\
    \ branch type according to the Git Flow branching model and creates a semantic\
    \ branch name.</description>\n\t<note>\n\t\tJust run this prompt and Copilot will\
    \ analyze your changes and create the appropriate Git Flow branch for you.\n\t\
    </note>\n</instructions>\n```\n\n### Workflow\n\n**Follow these steps:**\n\n1.\
    \ Run `git status` to review the current repository state and changed files.\n\
    2. Run `git diff` (for unstaged changes) or `git diff --cached` (for staged changes)\
    \ to analyze the nature of changes.\n3. Analyze the changes using the Git Flow\
    \ Branch Analysis Framework below.\n4. Determine the appropriate branch type based\
    \ on the analysis.\n5. Generate a semantic branch name following Git Flow conventions.\n\
    6. Create the branch and switch to it automatically.\n7. Provide a summary of\
    \ the analysis and next steps.\n\n### Git Flow Branch Analysis Framework\n\n```xml\n\
    <analysis-framework>\n\t<branch-types>\n\t\t<feature>\n\t\t\t<purpose>New features,\
    \ enhancements, non-critical improvements</purpose>\n\t\t\t<branch-from>develop</branch-from>\n\
    \t\t\t<merge-to>develop</merge-to>\n\t\t\t<naming>feature/descriptive-name or\
    \ feature/ticket-number-description</naming>\n\t\t\t<indicators>\n\t\t\t\t<indicator>New\
    \ functionality being added</indicator>\n\t\t\t\t<indicator>UI/UX improvements</indicator>\n\
    \t\t\t\t<indicator>New API endpoints or methods</indicator>\n\t\t\t\t<indicator>Database\
    \ schema additions (non-breaking)</indicator>\n\t\t\t\t<indicator>New configuration\
    \ options</indicator>\n\t\t\t\t<indicator>Performance improvements (non-critical)</indicator>\n\
    \t\t\t</indicators>\n\t\t</feature>\n\n\t\t<release>\n\t\t\t<purpose>Release preparation,\
    \ version bumps, final testing</purpose>\n\t\t\t<branch-from>develop</branch-from>\n\
    \t\t\t<merge-to>develop AND master</merge-to>\n\t\t\t<naming>release-X.Y.Z</naming>\n\
    \t\t\t<indicators>\n\t\t\t\t<indicator>Version number changes</indicator>\n\t\t\
    \t\t<indicator>Build configuration updates</indicator>\n\t\t\t\t<indicator>Documentation\
    \ finalization</indicator>\n\t\t\t\t<indicator>Minor bug fixes before release</indicator>\n\
    \t\t\t\t<indicator>Release notes updates</indicator>\n\t\t\t\t<indicator>Dependency\
    \ version locks</indicator>\n\t\t\t</indicators>\n\t\t</release>\n\n\t\t<hotfix>\n\
    \t\t\t<purpose>Critical production bug fixes requiring immediate deployment</purpose>\n\
    \t\t\t<branch-from>master</branch-from>\n\t\t\t<merge-to>develop AND master</merge-to>\n\
    \t\t\t<naming>hotfix-X.Y.Z or hotfix/critical-issue-description</naming>\n\t\t\
    \t<indicators>\n\t\t\t\t<indicator>Security vulnerability fixes</indicator>\n\t\
    \t\t\t<indicator>Critical production bugs</indicator>\n\t\t\t\t<indicator>Data\
    \ corruption fixes</indicator>\n\t\t\t\t<indicator>Service outage resolution</indicator>\n\
    \t\t\t\t<indicator>Emergency configuration changes</indicator>\n\t\t\t</indicators>\n\
    \t\t</hotfix>\n\t</branch-types>\n</analysis-framework>\n```\n\n### Branch Naming\
    \ Conventions\n\n```xml\n<naming-conventions>\n\t<feature-branches>\n\t\t<format>feature/[ticket-number-]descriptive-name</format>\n\
    \t\t<examples>\n\t\t\t<example>feature/user-authentication</example>\n\t\t\t<example>feature/PROJ-123-shopping-cart</example>\n\
    \t\t\t<example>feature/api-rate-limiting</example>\n\t\t\t<example>feature/dashboard-redesign</example>\n\
    \t\t</examples>\n\t</feature-branches>\n\n\t<release-branches>\n\t\t<format>release-X.Y.Z</format>\n\
    \t\t<examples>\n\t\t\t<example>release-1.2.0</example>\n\t\t\t<example>release-2.1.0</example>\n\
    \t\t\t<example>release-1.0.0</example>\n\t\t</examples>\n\t</release-branches>\n\
    \n\t<hotfix-branches>\n\t\t<format>hotfix-X.Y.Z OR hotfix/critical-description</format>\n\
    \t\t<examples>\n\t\t\t<example>hotfix-1.2.1</example>\n\t\t\t<example>hotfix/security-patch</example>\n\
    \t\t\t<example>hotfix/payment-gateway-fix</example>\n\t\t\t<example>hotfix-2.1.1</example>\n\
    \t\t</examples>\n\t</hotfix-branches>\n</naming-conventions>\n```\n\n### Analysis\
    \ Process\n\n```xml\n<analysis-process>\n\t<step-1>\n\t\t<title>Change Nature\
    \ Analysis</title>\n\t\t<description>Examine the types of files modified and the\
    \ nature of changes</description>\n\t\t<criteria>\n\t\t\t<files-modified>Look\
    \ at file extensions, directory structure, and purpose</files-modified>\n\t\t\t\
    <change-scope>Determine if changes are additive, corrective, or preparatory</change-scope>\n\
    \t\t\t<urgency-level>Assess if changes address critical issues or are developmental</urgency-level>\n\
    \t\t</criteria>\n\t</step-1>\n\n\t<step-2>\n\t\t<title>Git Flow Classification</title>\n\
    \t\t<description>Map the changes to appropriate Git Flow branch type</description>\n\
    \t\t<decision-tree>\n\t\t\t<question>Are these critical fixes for production issues?</question>\n\
    \t\t\t<if-yes>Consider hotfix branch</if-yes>\n\t\t\t<if-no>\n\t\t\t\t<question>Are\
    \ these release preparation changes (version bumps, final tweaks)?</question>\n\
    \t\t\t\t<if-yes>Consider release branch</if-yes>\n\t\t\t\t<if-no>Default to feature\
    \ branch</if-no>\n\t\t\t</if-no>\n\t\t</decision-tree>\n\t</step-2>\n\n\t<step-3>\n\
    \t\t<title>Branch Name Generation</title>\n\t\t<description>Create semantic, descriptive\
    \ branch name</description>\n\t\t<guidelines>\n\t\t\t<use-kebab-case>Use lowercase\
    \ with hyphens</use-kebab-case>\n\t\t\t<be-descriptive>Name should clearly indicate\
    \ the purpose</be-descriptive>\n\t\t\t<include-context>Add ticket numbers or project\
    \ context when available</include-context>\n\t\t\t<keep-concise>Avoid overly long\
    \ names</keep-concise>\n\t\t</guidelines>\n\t</step-3>\n</analysis-process>\n\
    ```\n\n### Edge Cases and Validation\n\n```xml\n<edge-cases>\n\t<mixed-changes>\n\
    \t\t<scenario>Changes include both features and bug fixes</scenario>\n\t\t<resolution>Prioritize\
    \ the most significant change type or suggest splitting into multiple branches</resolution>\n\
    \t</mixed-changes>\n\n\t<no-changes>\n\t\t<scenario>No changes detected in git\
    \ status/diff</scenario>\n\t\t<resolution>Inform user and suggest checking git\
    \ status or making changes first</resolution>\n\t</no-changes>\n\n\t<existing-branch>\n\
    \t\t<scenario>Already on a feature/hotfix/release branch</scenario>\n\t\t<resolution>Analyze\
    \ if new branch is needed or if current branch is appropriate</resolution>\n\t\
    </existing-branch>\n\n\t<conflicting-names>\n\t\t<scenario>Suggested branch name\
    \ already exists</scenario>\n\t\t<resolution>Append incremental suffix or suggest\
    \ alternative name</resolution>\n\t</conflicting-names>\n</edge-cases>\n```\n\n\
    ### Examples\n\n```xml\n<examples>\n\t<example-1>\n\t\t<scenario>Added new user\
    \ registration API endpoint</scenario>\n\t\t<analysis>New functionality, additive\
    \ changes, not critical</analysis>\n\t\t<branch-type>feature</branch-type>\n\t\
    \t<branch-name>feature/user-registration-api</branch-name>\n\t\t<command>git checkout\
    \ -b feature/user-registration-api develop</command>\n\t</example-1>\n\n\t<example-2>\n\
    \t\t<scenario>Fixed critical security vulnerability in authentication</scenario>\n\
    \t\t<analysis>Security fix, critical for production, immediate deployment needed</analysis>\n\
    \t\t<branch-type>hotfix</branch-type>\n\t\t<branch-name>hotfix/auth-security-patch</branch-name>\n\
    \t\t<command>git checkout -b hotfix/auth-security-patch master</command>\n\t</example-2>\n\
    \n\t<example-3>\n\t\t<scenario>Updated version to 2.1.0 and finalized release\
    \ notes</scenario>\n\t\t<analysis>Release preparation, version bump, documentation</analysis>\n\
    \t\t<branch-type>release</branch-type>\n\t\t<branch-name>release-2.1.0</branch-name>\n\
    \t\t<command>git checkout -b release-2.1.0 develop</command>\n\t</example-3>\n\
    \n\t<example-4>\n\t\t<scenario>Improved database query performance and updated\
    \ caching</scenario>\n\t\t<analysis>Performance improvement, non-critical enhancement</analysis>\n\
    \t\t<branch-type>feature</branch-type>\n\t\t<branch-name>feature/database-performance-optimization</branch-name>\n\
    \t\t<command>git checkout -b feature/database-performance-optimization develop</command>\n\
    \t</example-4>\n</examples>\n```\n\n### Validation Checklist\n\n```xml\n<validation>\n\
    \t<pre-analysis>\n\t\t<check>Repository is in a clean state (no uncommitted changes\
    \ that would conflict)</check>\n\t\t<check>Current branch is appropriate starting\
    \ point (develop for features/releases, master for hotfixes)</check>\n\t\t<check>Remote\
    \ repository is up to date</check>\n\t</pre-analysis>\n\n\t<analysis-quality>\n\
    \t\t<check>Change analysis covers all modified files</check>\n\t\t<check>Branch\
    \ type selection follows Git Flow principles</check>\n\t\t<check>Branch name is\
    \ semantic and follows conventions</check>\n\t\t<check>Edge cases are considered\
    \ and handled</check>\n\t</analysis-quality>\n\n\t<execution-safety>\n\t\t<check>Target\
    \ branch (develop/master) exists and is accessible</check>\n\t\t<check>Proposed\
    \ branch name doesn't conflict with existing branches</check>\n\t\t<check>User\
    \ has appropriate permissions to create branches</check>\n\t</execution-safety>\n\
    </validation>\n```\n\n### Final Execution\n\n```xml\n<execution-protocol>\n\t\
    <analysis-summary>\n\t\t<git-status>Output of git status command</git-status>\n\
    \t\t<git-diff>Relevant portions of git diff output</git-diff>\n\t\t<change-analysis>Detailed\
    \ analysis of what changes represent</change-analysis>\n\t\t<branch-decision>Explanation\
    \ of why specific branch type was chosen</branch-decision>\n\t</analysis-summary>\n\
    \n\t<branch-creation>\n\t\t<command>git checkout -b [branch-name] [source-branch]</command>\n\
    \t\t<confirmation>Verify branch creation and current branch status</confirmation>\n\
    \t\t<next-steps>Provide guidance on next actions (commit changes, push branch,\
    \ etc.)</next-steps>\n\t</branch-creation>\n\n\t<fallback-options>\n\t\t<alternative-names>Suggest\
    \ 2-3 alternative branch names if primary suggestion isn't suitable</alternative-names>\n\
    \t\t<manual-override>Allow user to specify different branch type if analysis seems\
    \ incorrect</manual-override>\n\t</fallback-options>\n</execution-protocol>\n\
    ```\n\n### Git Flow Reference\n\n```xml\n<gitflow-reference>\n\t<main-branches>\n\
    \t\t<master>Production-ready code, every commit is a release</master>\n\t\t<develop>Integration\
    \ branch for features, latest development changes</develop>\n\t</main-branches>\n\
    \n\t<supporting-branches>\n\t\t<feature>Branch from develop, merge back to develop</feature>\n\
    \t\t<release>Branch from develop, merge to both develop and master</release>\n\
    \t\t<hotfix>Branch from master, merge to both develop and master</hotfix>\n\t\
    </supporting-branches>\n\n\t<merge-strategy>\n\t\t<flag>Always use --no-ff flag\
    \ to preserve branch history</flag>\n\t\t<tagging>Tag releases on master branch</tagging>\n\
    \t\t<cleanup>Delete branches after successful merge</cleanup>\n\t</merge-strategy>\n\
    </gitflow-reference>\n```"
