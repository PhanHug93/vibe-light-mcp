  text: "# Scaling for Query Volume\n\nProblem: When a query has a large limit (e.g.\
    \ 1000) and there are multiple shards (e.g. 10), naively each shard must return\
    \ the full 1000 results \u2014 totaling 10,000 scored points transferred and merged.\
    \ This is wasteful since data is randomly distributed across auto-shards.\n\n\
    ## Core idea\n\nInstead of asking every shard for the full limit, ask each shard\
    \ for a smaller limit computed via Poisson distribution statistics, then merge.\
    \ This is safe because auto-sharding guarantees random, independent data distribution.\n\
    \n## When it activates\n\n- More than 1 shard\n- Auto-sharding is in use (all\
    \ queried shards share the same shard key)\n- The request's limit + offset >=\
    \ SHARD_QUERY_SUBSAMPLING_LIMIT (128)\n- The query is not exact\n\n## Key tradeoff\n\
    \n The strategy trades a small probability of slightly incomplete results for\
    \ a large reduction in inter-shard data transfer, especially for high-limit queries\
    \ across many shards. The 1.2x safety factor and the 99.9% Poisson threshold keep\
    \ the error rate very low \u2014 comparable to inaccuracies already introduced\
    \ by approximate vector indices like HNSW."
