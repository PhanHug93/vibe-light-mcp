  text: "# Salesforce Component Quality Standards\n\nApply these checks to every LWC,\
    \ Aura component, and Visualforce page you write or review.\n\n## Section 1 \u2014\
    \ LWC Quality Standards\n\n### 1.1 Data Access Pattern Selection\n\nChoose the\
    \ right data access pattern before writing JavaScript controller code:\n\n| Use\
    \ case | Pattern | Why |\n|---|---|---|\n| Read a single record reactively (follows\
    \ navigation) | `@wire(getRecord, { recordId, fields })` | Lightning Data Service\
    \ \u2014 cached, reactive |\n| Standard CRUD form for a single object | `<lightning-record-form>`\
    \ or `<lightning-record-edit-form>` | Built-in FLS, CRUD, and accessibility |\n\
    | Complex server query or filtered list | `@wire(apexMethodName, { param })` on\
    \ a `cacheable=true` method | Allows caching; wire re-fires on param change |\n\
    | User-triggered action, DML, or non-cacheable server call | Imperative `apexMethodName(params).then(...).catch(...)`\
    \ | Required for DML \u2014 wired methods cannot be `@AuraEnabled` without `cacheable=true`\
    \ |\n| Cross-component communication (no shared parent) | Lightning Message Service\
    \ (LMS) | Decoupled, works across DOM boundaries |\n| Multi-object graph relationships\
    \ | GraphQL `@wire(gql, { query, variables })` | Single round-trip for complex\
    \ related data |\n\n### 1.2 Security Rules\n\n| Rule | Enforcement |\n|---|---|\n\
    | No raw user data in `innerHTML` | Use `{expression}` binding in the template\
    \ \u2014 the framework auto-escapes. Never use `this.template.querySelector('.el').innerHTML\
    \ = userValue` |\n| Apex `@AuraEnabled` methods enforce CRUD/FLS | Use `WITH USER_MODE`\
    \ in SOQL or explicit `Schema.sObjectType` checks |\n| No hardcoded org-specific\
    \ IDs in component JavaScript | Query or pass as a prop \u2014 never embed record\
    \ IDs in source |\n| `@api` properties from parent: validate before use | A parent\
    \ can pass anything \u2014 validate type and range before using as a query parameter\
    \ |\n\n### 1.3 SLDS 2 and Styling Standards\n\n- **Never** hardcode colours: `color:\
    \ #FF3366` \u2192 use `color: var(--slds-c-button-brand-color-background)` or\
    \ a semantic SLDS token.\n- **Never** override SLDS classes with `!important`\
    \ \u2014 compose with custom CSS properties.\n- Use `<lightning-*>` base components\
    \ wherever they exist: `lightning-button`, `lightning-input`, `lightning-datatable`,\
    \ `lightning-card`, etc.\n- Base components include built-in SLDS 2, dark mode,\
    \ and accessibility \u2014 avoid reimplementing their behaviour.\n- If using custom\
    \ CSS, test in both **light mode** and **dark mode** before declaring done.\n\n\
    ### 1.4 Accessibility Requirements (WCAG 2.1 AA)\n\nEvery LWC component must pass\
    \ all of these before it is considered done:\n\n- [ ] All form inputs have `<label>`\
    \ or `aria-label` \u2014 never use placeholder as the only label\n- [ ] All icon-only\
    \ buttons have `alternative-text` or `aria-label` describing the action\n- [ ]\
    \ All interactive elements are reachable and operable by keyboard (Tab, Enter,\
    \ Space, Escape)\n- [ ] Colour is not the only means of conveying status \u2014\
    \ pair with text, icon, or `aria-*` attributes\n- [ ] Error messages are associated\
    \ with their input via `aria-describedby`\n- [ ] Focus management is correct in\
    \ modals \u2014 focus moves into the modal on open and back on close\n\n### 1.5\
    \ Component Communication Rules\n\n| Direction | Mechanism |\n|---|---|\n| Parent\
    \ \u2192 Child | `@api` property or calling a `@api` method |\n| Child \u2192\
    \ Parent | `CustomEvent` \u2014 `this.dispatchEvent(new CustomEvent('eventname',\
    \ { detail: data }))` |\n| Sibling / unrelated components | Lightning Message\
    \ Service (LMS) |\n| Never use | `document.querySelector`, `window.*`, or Pub/Sub\
    \ libraries |\n\nFor Flow screen components:\n- Events that need to reach the\
    \ Flow runtime must set `bubbles: true` and `composed: true`.\n- Expose `@api\
    \ value` for two-way binding with the Flow variable.\n\n### 1.6 JavaScript Performance\
    \ Rules\n\n- **No side effects in `connectedCallback`**: it runs on every DOM\
    \ attach \u2014 avoid DML, heavy computation, or rendering state mutations here.\n\
    - **Guard `renderedCallback`**: always use a boolean guard to prevent infinite\
    \ render loops.\n- **Avoid reactive property traps**: setting a reactive property\
    \ inside `renderedCallback` causes a re-render \u2014 use it only when necessary\
    \ and guarded.\n- **Do not store large datasets in component state** \u2014 paginate\
    \ or stream large results instead.\n\n### 1.7 Jest Test Requirements\n\nEvery\
    \ component that handles user interaction or retrieves Apex data must have a Jest\
    \ test:\n\n```javascript\n// Minimum test coverage expectations\nit('renders the\
    \ component with correct title', async () => { ... });\nit('calls apex method\
    \ and displays results', async () => { ... });  // Wire mock\nit('dispatches event\
    \ when button is clicked', async () => { ... });\nit('shows error state when apex\
    \ call fails', async () => { ... }); // Error path\n```\n\nUse `@salesforce/sfdx-lwc-jest`\
    \ mocking utilities:\n- `wire` adapter mocking: `setImmediate` + `emit({ data,\
    \ error })`\n- Apex method mocking: `jest.mock('@salesforce/apex/MyClass.myMethod',\
    \ ...)`\n\n---\n\n## Section 2 \u2014 Aura Component Standards\n\n### 2.1 When\
    \ to Use Aura vs LWC\n\n- **New components: always LWC** unless the target context\
    \ is Aura-only (e.g. extending `force:appPage`, using Aura-specific events in\
    \ a legacy managed package).\n- **Migrating Aura to LWC**: prefer LWC, migrate\
    \ component-by-component; LWC can be embedded inside Aura components.\n\n### 2.2\
    \ Aura Security Rules\n\n- `@AuraEnabled` controller methods must declare `with\
    \ sharing` and enforce CRUD/FLS \u2014 Aura does **not** enforce them automatically.\n\
    - Never use `{!v.something}` with unescaped user data in `<div>` unbound helpers\
    \ \u2014 use `<ui:outputText value=\"{!v.text}\" />` or `<c:something>` to escape.\n\
    - Validate all inputs from component attributes before using them in SOQL / Apex\
    \ logic.\n\n### 2.3 Aura Event Design\n\n- **Component events** for parent-child\
    \ communication \u2014 lowest scope.\n- **Application events** only when component\
    \ events cannot reach the target \u2014 they broadcast to the entire app and can\
    \ be a performance and maintenance problem.\n- For hybrid LWC + Aura stacks: use\
    \ Lightning Message Service to decouple communication \u2014 do not rely on Aura\
    \ application events reaching LWC components.\n\n---\n\n## Section 3 \u2014 Visualforce\
    \ Security Standards\n\n### 3.1 XSS Prevention\n\n```xml\n<!-- \u274C NEVER \u2014\
    \ renders raw user input as HTML -->\n<apex:outputText value=\"{!userInput}\"\
    \ escape=\"false\" />\n\n<!-- \u2705 ALWAYS \u2014 auto-escaping on -->\n<apex:outputText\
    \ value=\"{!userInput}\" />\n<!-- Default escape=\"true\" \u2014 platform HTML-encodes\
    \ the output -->\n```\n\nRule: `escape=\"false\"` is never acceptable for user-controlled\
    \ data. If rich text must be rendered, sanitise server-side with a whitelist before\
    \ output.\n\n### 3.2 CSRF Protection\n\nUse `<apex:form>` for all postback actions\
    \ \u2014 the platform injects a CSRF token automatically into the form. Do **not**\
    \ use raw `<form method=\"POST\">` HTML elements, which bypass CSRF protection.\n\
    \n### 3.3 SOQL Injection Prevention in Controllers\n\n```apex\n// \u274C NEVER\n\
    String soql = 'SELECT Id FROM Account WHERE Name = \\'' + ApexPages.currentPage().getParameters().get('name')\
    \ + '\\'';\nList<Account> results = Database.query(soql);\n\n// \u2705 ALWAYS\
    \ \u2014 bind variable\nString nameParam = ApexPages.currentPage().getParameters().get('name');\n\
    List<Account> results = [SELECT Id FROM Account WHERE Name = :nameParam];\n```\n\
    \n### 3.4 View State Management Checklist\n\n- [ ] View state is under 135 KB\
    \ (check in browser developer tools or the Salesforce View State tab)\n- [ ] Fields\
    \ used only for server-side calculations are declared `transient`\n- [ ] Large\
    \ collections are not persisted across postbacks unnecessarily\n- [ ] `readonly=\"\
    true\"` is set on `<apex:page>` for read-only pages to skip view-state serialisation\n\
    \n### 3.5 FLS / CRUD in Visualforce Controllers\n\n```apex\n// Before reading\
    \ a field\nif (!Schema.sObjectType.Account.fields.Revenue__c.isAccessible()) {\n\
    \    ApexPages.addMessage(new ApexPages.Message(ApexPages.Severity.ERROR, 'You\
    \ do not have access to this field.'));\n    return null;\n}\n\n// Before performing\
    \ DML\nif (!Schema.sObjectType.Account.isDeletable()) {\n    throw new System.NoAccessException();\n\
    }\n```\n\nStandard controllers enforce FLS for bound fields automatically. **Custom\
    \ controllers do not** \u2014 FLS must be enforced manually.\n\n---\n\n## Quick\
    \ Reference \u2014 Component Anti-Patterns Summary\n\n| Anti-pattern | Technology\
    \ | Risk | Fix |\n|---|---|---|---|\n| `innerHTML` with user data | LWC | XSS\
    \ | Use template bindings `{expression}` |\n| Hardcoded hex colours | LWC/Aura\
    \ | Dark-mode / SLDS 2 break | Use SLDS CSS custom properties |\n| Missing `aria-label`\
    \ on icon buttons | LWC/Aura/VF | Accessibility failure | Add `alternative-text`\
    \ or `aria-label` |\n| No guard in `renderedCallback` | LWC | Infinite rerender\
    \ loop | Add `hasRendered` boolean guard |\n| Application event for parent-child\
    \ | Aura | Unnecessary broadcast scope | Use component event instead |\n| `escape=\"\
    false\"` on user data | Visualforce | XSS | Remove \u2014 use default escaping\
    \ |\n| Raw `<form>` postback | Visualforce | CSRF vulnerability | Use `<apex:form>`\
    \ |\n| No `with sharing` on custom controller | VF / Apex | Data exposure | Add\
    \ `with sharing` declaration |\n| FLS not checked in custom controller | VF /\
    \ Apex | Privilege escalation | Add `Schema.sObjectType` checks |\n| SOQL concatenated\
    \ with URL param | VF / Apex | SOQL injection | Use bind variables |"
