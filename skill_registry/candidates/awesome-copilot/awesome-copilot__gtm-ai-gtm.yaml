  text: "# AI Product GTM\n\nGo-to-market strategy for AI products. These aren't generic\
    \ AI principles \u2014 they're patterns from selling autonomous AI agents into\
    \ enterprises where \"autonomous\" scared buyers and \"teammate\" converted them.\n\
    \n## When to Use\n\n**Triggers:**\n- \"How do we position this AI product?\"\n\
    - \"Buyers say they're worried about AI breaking production\"\n- \"Should we call\
    \ it autonomous or copilot?\"\n- \"How do we price AI when usage varies 10x by\
    \ customer?\"\n- \"Enterprise security passed but ops rejected us \u2014 why?\"\
    \n\n**Context:**\n- AI agent platforms (coding, support, ops)\n- LLM-based applications\n\
    - Autonomous tools that *do* things (not just suggest)\n- AI infrastructure\n\
    - Anything where the AI makes decisions\n\n---\n\n## Core Frameworks\n\n### 1.\
    \ The Real Enterprise AI Objection (It's Not What You Think)\n\n**What I Learned\
    \ Selling Autonomous AI Agents:**\n\nThree months in, enterprise security reviews\
    \ were passing fast. Good sign, right? Then the pattern emerged: security approved,\
    \ but **operations rejected us**.\n\nThe objection wasn't \"will the AI break\
    \ production?\" \u2014 they *assumed* it would break production eventually. The\
    \ real question was:\n\n**\"Who's responsible when the agent does something wrong?\"\
    **\n\nNot \"do we trust the agent?\" \u2014 \"do we trust our *team* to handle\
    \ this?\"\n\n**Why This Matters:**\n\nAutonomous agents create a new operational\
    \ burden. You're not selling AI capability, you're selling organizational readiness.\
    \ When your agent halts production at 2am, who gets paged? Who fixes it? Who explains\
    \ it to the VP?\n\n**Framework: The Accountability Cascade**\n\nBefore deploying\
    \ AI agents, enterprises need clear answers:\n\n1. **L1 Response**: Who monitors\
    \ the agent? (24/7 ops team, or dev team on-call?)\n2. **L2 Escalation**: When\
    \ agent action fails, who debugs? (Agent team, or product team?)\n3. **L3 Ownership**:\
    \ When something breaks badly, who owns customer communication?\n\nIf you can't\
    \ answer all three, **they won't buy**. Doesn't matter how good your AI is.\n\n\
    **How This Changes Your Sales Process:**\n\n**Old approach:**\n- Demo the AI\n\
    - Show accuracy metrics\n- Talk about ROI\n\n**New approach:**\n- Demo the AI\n\
    - Show the *failure modes* explicitly\n- Ask: \"Who on your team would handle\
    \ this scenario?\"\n- Walk through their incident response process\n- Map AI failures\
    \ to their existing runbooks\n\n**The Qualification Question:**\n\n\"Walk me through\
    \ what happens when the agent takes an action that breaks a workflow. Who gets\
    \ alerted? Who investigates? Who decides whether to roll back or fix forward?\"\
    \n\nIf they can't answer, they're not ready. Pause the deal and help them build\
    \ the process first.\n\n**Common Mistake:**\n\nTreating this as a *product* objection\
    \ (\"we'll make the AI more accurate\"). It's an *organizational* objection. More\
    \ accuracy doesn't solve \"who owns this at 2am?\"\n\n**Pattern I've Seen Work:**\n\
    \nCompanies that succeed with AI agents already have:\n- On-call rotations for\
    \ production systems\n- Incident response playbooks\n- Blameless postmortem culture\n\
    - Clear escalation paths\n\nCompanies that struggle:\n- Manual deployment processes\n\
    - Hero culture (\"Steve fixes everything\")\n- No formal incident response\n-\
    \ Blame-focused culture\n\n**Decision Criteria:**\n\nBefore demoing autonomous\
    \ AI to enterprises, ask yourself: \"If this breaks their production, who on *their*\
    \ team owns the fix?\" If you can't answer, they can't buy.\n\n---\n\n### 2. Copilot\
    \ vs Agent vs Teammate (Three Different GTM Motions)\n\n**The Positioning Trap:**\n\
    \nEarly enterprise conversations, we positioned as \"autonomous AI agent.\" Buyers\
    \ flinched. One word change \u2014 \"autonomous\" \u2192 \"AI teammate\" \u2014\
    \ and deal progression improved measurably.\n\nWhy? **Word choice shapes buyer\
    \ psychology.**\n\n**The Three Framings:**\n\n**1. Copilot (Safest, Lowest Value)**\n\
    - **What it means**: AI suggests, human decides every time\n- **Buyer psychology**:\
    \ Feels safe, non-threatening\n- **GTM motion**: Developer adoption, bottoms-up\n\
    - **Use case**: Code completion, writing assistance, search\n- **Objection**:\
    \ \"Is this worth paying for?\" (low perceived value)\n\n**2. Agent (Scariest,\
    \ Highest Value)**\n- **What it means**: AI acts autonomously, human reviews periodically\n\
    - **Buyer psychology**: Scary, implies replacing humans\n- **GTM motion**: Enterprise\
    \ sales, top-down\n- **Use case**: Batch processing, automated workflows, ops\n\
    - **Objection**: \"What if it breaks production?\" (accountability fear)\n\n**3.\
    \ Teammate (Sweet Spot)**\n- **What it means**: AI and human collaborate, split\
    \ the work\n- **Buyer psychology**: Partnership, not replacement\n- **GTM motion**:\
    \ Hybrid (dev adoption + manager approval)\n- **Use case**: Most AI agent platforms\n\
    - **Objection**: \"How do we integrate this into our workflow?\" (process question)\n\
    \n**The Positioning Shift:**\n\n**Before:** \"Autonomous AI agent that handles\
    \ complex workflows end-to-end\"\n- Developers: \"Cool, but scary\"\n- Managers:\
    \ \"Will this replace our team?\"\n- Deal progression: Slow\n\n**After:** \"AI\
    \ teammate that pairs with your engineers on complex tasks\"\n- Developers: \"\
    This helps me\"\n- Managers: \"This makes my team more productive\"\n- Deal progression:\
    \ Three enterprise deals that had stalled 4+ months closed within 8 weeks of the\
    \ shift\n\n**Specific Language Choices That Mattered:**\n\n\u274C **Don't say:**\n\
    - \"Autonomous\" (scary)\n- \"Replaces\" (threatening)\n- \"Fully automated\"\
    \ (no control)\n- \"AI-first\" (what does that even mean?)\n\n\u2705 **Do say:**\n\
    - \"Teammate\" (collaborative)\n- \"Augments\" or \"Accelerates\" (helping, not\
    \ replacing)\n- \"You stay in control\" (reassuring)\n- \"Handles the repetitive\
    \ work\" (specific value)\n\n**How to Choose Your Framing:**\n\n```\nDoes your\
    \ AI make decisions without human approval?\n\u251C\u2500 Yes \u2192 Are you selling\
    \ to developers or enterprises?\n\u2502   \u251C\u2500 Developers \u2192 \"Agent\"\
    \ framing (they want autonomous)\n\u2502   \u2514\u2500 Enterprises \u2192 \"\
    Teammate\" framing (they want control)\n\u2514\u2500 No \u2192 \"Copilot\" framing\
    \ (augmentation, not automation)\n```\n\n**The Hard Truth:**\n\nYou can build\
    \ an agent but position it as a copilot. You can't build a copilot and position\
    \ it as an agent. **Product capabilities set a ceiling, positioning chooses where\
    \ you land below it.**\n\n**Common Mistake:**\n\nUsing \"autonomous\" because\
    \ it sounds impressive. Impressive \u2260 trusted. If buyers flinch at your positioning,\
    \ you've lost them.\n\n---\n\n### 3. The AI Pricing Problem (When Usage Varies\
    \ 10x)\n\n**The Pattern:**\n\nEvery AI company I've worked with faces this: Customer\
    \ A uses 1,000 API calls/month. Customer B uses 10,000. Do you charge Customer\
    \ B 10x more? If yes, they churn. If no, your margins collapse.\n\n**The Three\
    \ Models:**\n\n**1. Seat-Based ($X per user/month)**\n- **When it works**: AI\
    \ augments human work predictably\n- **Example**: Code completion, writing assistant\n\
    - **Problem**: Doesn't capture AI value scaling\n- **Real risk**: High-usage customers\
    \ are your best customers, but they subsidize low-usage ones\n\n**2. Usage-Based\
    \ ($X per API call / prediction / hour)**\n- **When it works**: AI does variable\
    \ work, customers understand the unit\n- **Example**: Image generation, transcription,\
    \ batch ML\n- **Problem**: Sticker shock for high-usage customers\n- **Real risk**:\
    \ Customers optimize to use *less* of your product\n\n**3. Outcome-Based ($X per\
    \ outcome achieved)**\n- **When it works**: You can measure outcomes reliably\n\
    - **Example**: \"Pay per bug fixed\" or \"Pay per support ticket resolved\"\n\
    - **Problem**: Hard to measure, easy to game\n- **Real risk**: You bear all the\
    \ risk if AI doesn't perform\n\n**What Actually Works (Hybrid):**\n\nBase fee\
    \ (covers fixed costs) + variable fee (scales with value).\n\n**Example structure:**\n\
    - Base: $X/month per team (access to platform)\n- Variable: $Y per successful\
    \ action/outcome\n- Why this works:\n  - Base covers infra/support costs\n  -\
    \ Variable aligns with customer value\n  - High-usage customers aren't punished\
    \ (they're getting more value)\n\n**The Pricing Conversation I Wish I'd Had Earlier:**\n\
    \nWhen pricing usage-based AI:\n\n**Ask the customer:**\n\"How much would it cost\
    \ you to do this manually?\"\n\nIf it's $0.10 per API call but saves them $2 in\
    \ labor, you're underpriced. If it costs $0.50 per call but saves them $0.40,\
    \ they won't use it enough to matter.\n\n**Pricing Rule:**\n\nYour variable cost\
    \ should be **20-30% of customer's alternative cost**. High enough to capture\
    \ value, low enough that they'll use it liberally.\n\n**Common Mistake:**\n\n\
    Copying OpenAI's pricing ($0.01 per 1K tokens) because \"that's what everyone\
    \ does.\" Your cost structure isn't OpenAI's cost structure. Your value isn't\
    \ OpenAI's value. Price for *your* business.\n\n---\n\n### 4. The AI Trust Ladder\
    \ (From Someone Who Climbed It)\n\n**The Pattern:**\n\nYou can't sell AI by saying\
    \ \"trust us, it works.\" You build trust in stages.\n\n**First: Transparency\
    \ (Before First Demo)**\n\nSend these three docs before they ask:\n- Model card\
    \ (what model, trained on what, accuracy on what benchmarks)\n- Security whitepaper\
    \ (where data goes, how it's processed)\n- Explainability doc (how to interpret\
    \ AI decisions)\n\n**Why this works:**\nBuyers expect to do diligence. If you\
    \ send docs *before they ask*, you look confident and credible.\n\n**Second: Control\
    \ (In the Demo)**\n\nShow them the safety mechanisms:\n- How users approve/reject\
    \ AI suggestions\n- Kill switches and rollback mechanisms\n- Confidence scores\
    \ and when AI says \"I'm not sure\"\n\n**Why this works:**\nFear of \"runaway\
    \ AI\" is real. Showing control mechanisms proves you thought about failure modes.\n\
    \n**Third: Performance (Week 4-8)**\n\nProve it works:\n- Benchmarks vs baseline\
    \ (human or previous tool)\n- Case study from similar company\n- Live demo on\
    \ their data (if possible)\n\n**Why this works:**\nProof beats promises. One customer\
    \ saying \"we saved X hours/week\" is worth 100 marketing claims.\n\n**Fourth:\
    \ Scale (When They're Serious)**\n\nShow enterprise readiness:\n- Enterprise deployment\
    \ examples\n- Performance at scale (latency, throughput, error rates)\n- Compliance\
    \ docs (SOC 2, GDPR, etc.)\n\n**Why this works:**\nEnterprises don't deploy MVPs.\
    \ They need proof you won't fall over at 1000 users.\n\n**The Mistake I Made:**\n\
    \nTrying to prove performance before explaining how the AI worked. Buyers didn't\
    \ trust the benchmarks because they didn't understand the system. **Order matters.**\n\
    \n**Decision Criteria:**\n\nIf buyers ask \"how does this work?\" before you've\
    \ demoed, you skipped transparency. Back up and send the docs.\n\n---\n\n### 5.\
    \ The Enterprise AI Demo (Show Failure, Not Just Success)\n\n**What Doesn't Work:**\n\
    \nCanned demo where AI magically solves everything. Buyers think \"this won't\
    \ work on our messy data.\"\n\n**What Works:**\n\nShow the AI making a mistake\
    \ and recovering. Seriously.\n\n**Demo Structure That Works:**\n\n**1. The Problem\
    \ (30 seconds)**\n\"Your engineers spend hours on [specific task]. Here's what\
    \ that looks like.\"\n- Show: Current manual workflow\n- Quantify: Time \xD7 Engineers\
    \ \xD7 Weeks = Total cost\n\n**2. The AI Attempt (60 seconds)**\n\"Here's the\
    \ AI handling the same task.\"\n- Show: AI analyzing, taking action\n- **Key move**:\
    \ Have AI encounter an error or uncertainty\n- Show: AI re-analyzing, recovering,\
    \ or asking for help\n- **Narrate**: \"Notice it didn't get it perfect first time.\
    \ It handles uncertainty like a human would.\"\n\n**3. The Human Review (30 seconds)**\n\
    \"Here's where the engineer reviews and approves.\"\n- Show: Engineer examining\
    \ AI's work\n- **Key move**: Show the engineer overriding or adjusting something\n\
    - **Narrate**: \"Human stays in control. AI handles repetitive work, human handles\
    \ judgment calls.\"\n\n**4. The Outcome (30 seconds)**\n\"[X hours] \u2192 [Y\
    \ minutes]. Engineer still owns the outcome, AI accelerates execution.\"\n- Quantify:\
    \ Time reduction, cost savings, capacity freed\n\n**Why This Works:**\n\n- Showing\
    \ failure \u2192 Builds trust (you're not hiding anything)\n- Showing recovery\
    \ \u2192 Proves AI is robust\n- Showing human override \u2192 Gives them control\n\
    - Quantifying savings \u2192 Makes ROI concrete\n\n**The Pattern I've Seen:**\n\
    \nDemos with perfect AI \u2192 Buyers skeptical\nDemos with imperfect AI that\
    \ recovers \u2192 Buyers engaged\n\n**Common Mistake:**\n\nCherry-picking examples\
    \ where AI is 100% accurate. Buyers know real-world data is messy. If you don't\
    \ show messiness, they assume you're hiding it.\n\n---\n\n### 6. The \"Who Owns\
    \ This?\" Objection Handler\n\n**The Objection:**\n\n\"This looks great, but what\
    \ happens when the AI does something wrong?\"\n\n**Bad Answer:**\n\"Our AI is\
    \ 95% accurate, and we're improving it every week.\"\n(Translation: \"It will\
    \ break production 5% of the time, good luck with that\")\n\n**Good Answer:**\n\
    \"Great question. Let's walk through a failure scenario together.\"\n\n**Then\
    \ Ask:**\n\n1. \"When the AI takes an action that causes an error, who on your\
    \ team investigates?\"\n2. \"Do you have an incident response process for tooling\
    \ failures?\"\n3. \"Who owns rollback decisions \u2014 the engineer who approved\
    \ it, or the ops team?\"\n\n**What This Does:**\n\n- Shifts from \"will it fail?\"\
    \ (yes, it will) to \"how do we handle failures?\"\n- Makes them think through\
    \ operational readiness\n- Reveals whether they're ready for AI agents\n\n**The\
    \ Follow-Up:**\n\n\"Here's what we recommend: Start with low-risk environments.\
    \ Let the AI handle non-critical workflows for 2-4 weeks. See how your team handles\
    \ its mistakes. Then expand scope when you're confident in the process.\"\n\n\
    **Why This Works:**\n\nYou're not selling perfection. You're selling a tool that\
    \ requires operational maturity. **Filtering for mature buyers is better than\
    \ convincing immature ones.**\n\n**The Pattern:**\n\nMature buyers say: \"We already\
    \ have runbooks for tool failures, we'll add AI to them.\"\nImmature buyers say:\
    \ \"Can you make it never fail?\"\n\n**Decision Criteria:**\n\nIf a buyer demands\
    \ 100% accuracy, walk away. They're not ready. Come back when they have incident\
    \ response processes.\n\n---\n\n### 7. The AI Positioning Trap (Fighting Asymmetric\
    \ Wars)\n\n**The Pattern:**\n\nYou're competing in the AI agent space. Every competitor's\
    \ homepage says the same thing: \"Automate [workflow] with AI.\" Your differentiation\
    \ requires explaining complex technical benchmarks that buyers don't understand.\n\
    \nThis is the positioning trap: **competing on features against better-funded\
    \ companies on their battlefield.**\n\n**How to Diagnose It:**\n\n1. Collect homepage\
    \ messaging from 5-7 direct competitors\n2. Identify shared claims (these are\
    \ commoditized \u2014 you can't win here)\n3. Map where you have structural advantage\
    \ (not just product features)\n4. Find the position competitors can't easily copy\n\
    \n**Structural advantages that work for AI positioning:**\n- Unique data or workflow\
    \ ownership (you control something competitors can't replicate)\n- Deployment\
    \ flexibility (on-prem, private cloud, customer-controlled infrastructure)\n-\
    \ Pricing model innovation (outcome-based, usage-based when competitors are seat-based)\n\
    - Community or ecosystem (network effects that compound over time)\n\nFeature\
    \ advantages that don't last:\n- \"Better accuracy\" (competitors catch up in\
    \ one sprint)\n- \"Faster inference\" (infrastructure commoditizes)\n- \"More\
    \ integrations\" (easy to copy)\n\n**The Test:**\n\nFor every positioning claim,\
    \ ask: Can a competitor copy this with a single product sprint? If yes, it's not\
    \ defensible. Don't build your GTM on it.\n\n**Common Mistake:**\n\nClaiming you're\
    \ \"better\" at what everyone does. In AI, benchmarks change monthly. Position\
    \ on what's structurally different about your approach, not what's temporarily\
    \ better about your model.\n\n---\n\n### 8. Ceiling Moment Qualification (Finding\
    \ High-Intent AI Buyers)\n\n**The Pattern:**\n\nThe highest-intent enterprise\
    \ buyers for AI agents are people who've already adopted a comparable tool and\
    \ hit its limits. They've invested in learning, they understand the problem space,\
    \ and they have a clear business case for the upgrade.\n\n**How to Identify Ceiling\
    \ Moments:**\n\nThe prospect has:\n- Used a copilot/assistant tool for 6+ months\n\
    - Hit its limitations (can't handle complex tasks, doesn't work with their stack,\
    \ not autonomous enough)\n- Low switching costs (the mental model transfers)\n\
    - Clear business case (\"we're spending X hours on this manually even with the\
    \ current tool\")\n\n**How to Target Them:**\n\n1. Identify the tool(s) your AI\
    \ product complements or displaces\n2. Build target lists of companies known to\
    \ use those tools\n3. Craft outreach around the limitation, not your features:\n\
    \   - \"Teams using [incumbent] often hit a ceiling when they need [capability\
    \ your product provides]\"\n   - Acknowledge the incumbent has value (don't trash-talk)\n\
    \   - Position as \"next level,\" not replacement\n\n**Why This Converts Better:**\n\
    \nCeiling-moment conversations convert 3-5x vs cold outreach because:\n- Prospect\
    \ already understands the problem\n- They've already invested in the category\n\
    - They have internal budget allocated\n- They can articulate what's missing\n\n\
    **The Qualification Question:**\n\n\"What's the most complex task you've tried\
    \ to automate with your current tool, and where did it break down?\"\n\nIf they\
    \ have a specific answer with specific pain, they're a ceiling-moment buyer. If\
    \ they say \"it works fine,\" they're not ready.\n\n**Common Mistake:**\n\nTrying\
    \ to convince tool-naive prospects to adopt AI agents. Bad conversion rates, long\
    \ education cycles, and they'll compare you to \"doing nothing\" instead of \"\
    doing it better.\" Target buyers who already believe in the category.\n\n---\n\
    \n## Decision Trees\n\n### Which Positioning Should I Use?\n\n```\nDoes your AI\
    \ act autonomously (no approval per action)?\n\u251C\u2500 Yes \u2192 Who are\
    \ you selling to?\n\u2502   \u251C\u2500 Developers \u2192 \"Agent\" framing\n\
    \u2502   \u2514\u2500 Enterprises \u2192 \"Teammate\" framing\n\u2514\u2500 No\
    \ \u2192 \"Copilot\" framing\n```\n\n### Which Pricing Model Should I Use?\n\n\
    ```\nCan you measure customer outcomes reliably?\n\u251C\u2500 Yes \u2192 Outcome-based\
    \ (or hybrid with outcome component)\n\u2514\u2500 No \u2192 Continue...\n   \
    \ \u2502\n    Does usage vary 5x+ by customer?\n    \u251C\u2500 Yes \u2192 Hybrid\
    \ (base + usage)\n    \u2514\u2500 No \u2192 Seat-based\n```\n\n### Is This Buyer\
    \ Ready for AI Agents?\n\n```\nDo they have incident response processes for tool\
    \ failures?\n\u251C\u2500 Yes \u2192 Continue...\n\u2502   \u2502\n\u2502   Do\
    \ they have on-call rotations for production systems?\n\u2502   \u251C\u2500 Yes\
    \ \u2192 Qualified buyer\n\u2502   \u2514\u2500 No \u2192 Help them build it first\n\
    \u2514\u2500 No \u2192 Not ready (come back in 6 months)\n```\n\n---\n\n## Common\
    \ Mistakes\n\n**1. Using \"autonomous\" because it sounds impressive**\n   - I've\
    \ watched this slow deals. \"Autonomous\" scares enterprises. \"Teammate\" progresses\
    \ faster.\n\n**2. Hiding AI failure modes**\n   - Buyers know real-world data\
    \ is messy. If you don't show failures, they assume you're hiding them.\n\n**3.\
    \ Treating \"will it break production?\" as the objection**\n   - Real objection:\
    \ \"who's responsible when it does?\" Organizational readiness, not accuracy.\n\
    \n**4. Pricing usage-based AI like OpenAI**\n   - Your cost structure isn't theirs.\
    \ Price for 20-30% of customer's alternative cost.\n\n**5. Skipping transparency\
    \ docs before demo**\n   - Order matters. Transparency \u2192 Control \u2192 Performance\
    \ \u2192 Scale. Don't skip steps.\n\n**6. Demoing perfect AI**\n   - Show mistakes\
    \ + recovery. Builds more trust than fake perfection.\n\n**7. Selling to buyers\
    \ who demand 100% accuracy**\n   - They're not ready. Filter for mature buyers\
    \ with incident response processes.\n\n---\n\n## Quick Reference\n\n**Enterprise\
    \ objection checklist:**\n- [ ] \"Who gets paged when AI breaks production?\"\
    \ \u2192 Map to their on-call rotation\n- [ ] \"Who debugs AI failures?\" \u2192\
    \ Map to their incident response\n- [ ] \"Who owns customer communication?\" \u2192\
    \ Map to their escalation path\n\n**Positioning word choices:**\n- \u2705 Teammate,\
    \ augments, accelerates, you stay in control\n- \u274C Autonomous, replaces, fully\
    \ automated, AI-first\n\n**Demo structure:**\n1. Problem with quantified cost\
    \ (30s)\n2. AI attempt including failure/uncertainty (60s)\n3. Human review and\
    \ override (30s)\n4. Outcome with ROI (30s)\n\n**Trust ladder:**\n1. Transparency\
    \ (model card, security, explainability)\n2. Control (approval workflows, kill\
    \ switches, confidence scores)\n3. Performance (benchmarks, case studies, live\
    \ demo)\n4. Scale (enterprise deployments, compliance, SLAs)\n\n**Pricing hybrid\
    \ formula:**\n- Base: $X/month (covers fixed costs)\n- Variable: $Y per unit (20-30%\
    \ of customer's alternative cost)\n\n---\n\n## Related Skills\n\n- **positioning-strategy**:\
    \ General positioning frameworks and testing\n- **technical-product-pricing**:\
    \ Pricing models including AI-specific patterns\n- **enterprise-account-planning**:\
    \ Enterprise AI deal management\n\n---\n\n*Based on enterprise AI agent GTM across\
    \ developer tools and infrastructure. Patterns drawn from working enterprise deal\
    \ cycles selling autonomous AI products \u2014 some carried directly, others supported\
    \ alongside sales leadership \u2014 including the positioning trap diagnosis that\
    \ shifted from feature competition to structural differentiation, the ceiling-moment\
    \ qualification that improved outbound conversion significantly, and frameworks\
    \ tested across security, operations, and engineering buyer personas. Not theory\
    \ \u2014 lessons from deals where \"autonomous\" killed conversations and \"teammate\"\
    \ converted.*"
