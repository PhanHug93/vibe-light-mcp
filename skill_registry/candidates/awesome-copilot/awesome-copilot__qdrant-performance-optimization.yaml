  text: "# Qdrant Performance Optimization\n\nThere are different aspects of Qdrant\
    \ performance, this document serves as a navigation hub for different aspects\
    \ of performance optimization in Qdrant.\n\n\n## Search Speed Optimization\n\n\
    There are two different criteria for search speed: latency and throughput. \n\
    Latency is the time it takes to get a response for a single query, while throughput\
    \ is the number of queries that can be processed in a given time frame.\nDepending\
    \ on your use case, you may want to optimize for one or both of these metrics.\n\
    \nMore on search speed optimization can be found in the [Search Speed Optimization](search-speed-optimization/SKILL.md)\
    \ skill.\n\n\n## Indexing Performance Optimization\n\nQdrant needs to build a\
    \ vector index to perform efficient similarity search. The time it takes to build\
    \ the index can vary depending on the size of your dataset, hardware, and configuration.\n\
    \nMore on indexing performance optimization can be found in the [Indexing Performance\
    \ Optimization](indexing-performance-optimization/SKILL.md) skill.\n\n\n## Memory\
    \ Usage Optimization\n\nVector search can be memory intensive, especially when\
    \ dealing with large datasets.\nQdrant has a flexible memory management system,\
    \ which allows you to precisely control which parts of storage are kept in memory\
    \ and which are stored on disk. This can help you optimize memory usage without\
    \ sacrificing performance.\n\nMore on memory usage optimization can be found in\
    \ the [Memory Usage Optimization](memory-usage-optimization/SKILL.md) skill."
