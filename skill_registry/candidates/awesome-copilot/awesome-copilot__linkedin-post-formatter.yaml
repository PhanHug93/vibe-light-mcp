  text: "# LinkedIn Post Formatter\n\nTransform raw content, ideas, or technical material\
    \ into polished, engagement-optimized LinkedIn posts using Unicode typography\
    \ and proven structural patterns.\n\n## Overview\n\nLinkedIn only supports plain\
    \ text \u2014 no Markdown rendering, no rich formatting. This skill uses Unicode\
    \ Mathematical Alphanumeric Symbols to simulate bold, italic, and bold-italic\
    \ text that renders natively in the LinkedIn editor without any external tools.\n\
    \n## Unicode Typography Reference\n\nWhen converting plain text into Unicode-styled\
    \ LinkedIn text, first load and use `references/unicode-charmap.md` as the authoritative\
    \ character mapping reference.\n\nApply these character mappings to create visual\
    \ emphasis in plain text:\n\n### Bold (Mathematical Sans-Serif Bold)\n\nUse bold\
    \ for key phrases, section headers, and emphasis words.\n\n| Plain | Unicode Bold\
    \ |\n|-------|-------------|\n| A-Z   | \U0001D5D4-\U0001D5ED         |\n| a-z\
    \   | \U0001D5EE-\U0001D607         |\n| 0-9   | \U0001D7EC-\U0001D7F5       \
    \  |\n\n### Italic (Mathematical Sans-Serif Italic)\n\nUse italic for subtle emphasis,\
    \ technical terms, or quotes.\n\n| Plain | Unicode Italic |\n|-------|---------------|\n\
    | A-Z   | \U0001D608-\U0001D621           |\n| a-z   | \U0001D622-\U0001D63B \
    \          |\n\n### Bold-Italic (Mathematical Sans-Serif Bold Italic)\n\nUse sparingly\
    \ for maximum emphasis.\n\n| Plain | Unicode Bold-Italic |\n|-------|-------------------|\n\
    | A-Z   | \U0001D63C-\U0001D655               |\n| a-z   | \U0001D656-\U0001D66F\
    \               |\n\n## Visual Separators\n\nUse these characters to create visual\
    \ structure:\n\n- **Section divider**: `\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501` (box-drawing heavy horizontal)\n- **Bullet points**: `\u25C8` (diamond\
    \ with dot) or `\u25CE` (bullseye)\n- **Arrow flow**: `\u2193` for vertical flow,\
    \ `\u2192` for horizontal continuation\n- **Sub-points**: `\u21B3` for indented\
    \ sub-items\n- **Numbered items**: Use bold Unicode digits `\U0001D7ED. \U0001D7EE\
    . \U0001D7EF.` etc.\n\n## Post Structure Patterns\n\n### Pattern 1: Hook \u2192\
    \ Content \u2192 CTA (General Purpose)\n\n```\n[Bold hook line \u2014 provocative\
    \ statement or question]\n\n[1-2 lines of context setting the stage]\n\n\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n[Main content with bold section\
    \ headers]\n[Bullet points using \u25C8 or numbered with bold digits]\n\n\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n[Bold takeaway or summary]\n\
    \n[Call to action \u2014 repost, comment, or grab resource]\n\n#Hashtags\n```\n\
    \n### Pattern 2: Listicle (Numbered Insights)\n\n```\n[Bold opening line with\
    \ a strong claim]\n\n[Setup line explaining what follows]\n\n\U0001D7ED. [Bold\
    \ item title]\n   [Supporting detail]\n\n\U0001D7EE. [Bold item title]\n   [Supporting\
    \ detail]\n\n...\n\n\U0001D5E7\U0001D5F5\U0001D5F2 \U0001D5F8\U0001D5F2\U0001D606\
    \ \U0001D601\U0001D5EE\U0001D5F8\U0001D5F2\U0001D5EE\U0001D604\U0001D5EE\U0001D606\
    : [Summary in italic]\n\n#Hashtags\n```\n\n### Pattern 3: Story \u2192 Lesson\
    \ (Thought Leadership)\n\n```\n[Italic opening with a personal or observed moment]\n\
    \n[2-3 short paragraphs telling the story]\n\n\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\n\n\U0001D5E7\U0001D5F5\U0001D5F2 \U0001D5F9\U0001D5F2\U0001D600\
    \U0001D600\U0001D5FC\U0001D5FB:\n\n[Bold lesson or principle extracted from the\
    \ story]\n\n[CTA]\n\n#Hashtags\n```\n\n### Pattern 4: Resource Share (Cheatsheet/Guide/Tool)\n\
    \n```\n[Hook: \"If you do X, you cannot miss this...\"]\n\n[Brief description\
    \ of what the resource covers]\n\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\n\n[Bold section count]. [Bold section titles as numbered list]\n\n\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
    \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n\U0001D5E7\U0001D5F5\U0001D5F2\
    \ \U0001D5FF\U0001D5F2\U0001D5EE\U0001D5F9 \U0001D601\U0001D5EE\U0001D5F8\U0001D5F2\
    \U0001D5EE\U0001D604\U0001D5EE\U0001D606:\n\n[Why this resource matters \u2014\
    \ bold key phrase]\n\n[Grab it / Share it CTA]\n\n\u267B\uFE0F \U0001D5E5\U0001D5F2\
    \U0001D5FD\U0001D5FC\U0001D600\U0001D601 if this is useful to your network.\n\n\
    #Hashtags\n```\n\n## Formatting Rules\n\n1. **Line breaks matter**: LinkedIn collapses\
    \ multiple blank lines. Use single blank lines between paragraphs.\n2. **Hook\
    \ above the fold**: The first 2-3 lines must compel the reader to click \"see\
    \ more.\" Front-load value.\n3. **Short paragraphs**: 1-3 sentences max per paragraph.\
    \ Wall of text kills engagement.\n4. **Bold sparingly**: Bold key phrases and\
    \ headers, not entire paragraphs.\n5. **Italic for nuance**: Use italic for technical\
    \ terms, internal thoughts, or subtle emphasis.\n6. **Hashtags at the end**: 5-8\
    \ relevant hashtags on the last line. No mid-post hashtags.\n7. **No emojis in\
    \ body** unless the user explicitly requests them. Exception: one strategic emoji\
    \ in CTA (\u267B\uFE0F for repost).\n8. **Character limit**: LinkedIn posts can\
    \ be up to 3000 characters. Aim for 1500-2500 for optimal engagement.\n9. **No\
    \ URLs in body**: LinkedIn suppresses reach for posts with links. Add links in\
    \ comments instead. Mention \"link in comments\" or \"grab it below\" as CTA.\n\
    \n## Engagement Optimization\n\n- **Opening hooks that work**: Questions, bold\
    \ claims, \"If you do X...\", contrarian takes, surprising stats.\n- **Closing\
    \ CTAs that work**: \"\u267B\uFE0F \U0001D5E5\U0001D5F2\U0001D5FD\U0001D5FC\U0001D600\
    \U0001D601 if...\", \"Save this for later\", \"Tag someone who needs this\", \"\
    What's your take? \U0001F447\"\n- **Whitespace is your friend**: Dense text gets\
    \ scrolled past. Airy, scannable layout wins.\n- **The \"see more\" hook**: LinkedIn\
    \ truncates posts after ~210 characters on desktop. Make sure the first 2 lines\
    \ create enough curiosity to click.\n\n## Process\n\n1. Analyze the source content\
    \ (text, HTML, image, or idea).\n2. Identify the best post structure pattern (Hook\u2192\
    Content\u2192CTA, Listicle, Story\u2192Lesson, Resource Share).\n3. Extract the\
    \ core message and 3-5 key points.\n4. Apply Unicode bold/italic formatting to\
    \ headers and emphasis words using `references/unicode-charmap.md`.\n5. Add visual\
    \ separators between sections.\n6. Write a compelling hook for the opening.\n\
    7. Add a CTA and hashtags at the end.\n8. Verify the post is copy-paste ready\
    \ for LinkedIn."
