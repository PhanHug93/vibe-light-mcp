  text: "# Autoresearch: Autonomous Iterative Experimentation\n\nAn autonomous experimentation\
    \ loop for any programming task. You define the goal and how to measure it; the\
    \ agent iterates autonomously -- modifying code, running experiments, measuring\
    \ results, and keeping or discarding changes -- until interrupted.\n\nThis skill\
    \ is inspired by [Karpathy's autoresearch](https://github.com/karpathy/autoresearch),\
    \ generalized from ML training to **any programming task with a measurable outcome**.\n\
    \n---\n\n## Agent Behavior Rules\n\n1. **DO** guide the user through the Setup\
    \ phase interactively before starting the loop.\n2. **DO** establish a baseline\
    \ measurement before making any changes.\n3. **DO** commit every experiment attempt\
    \ before running it (so it can be reverted cleanly).\n4. **DO** keep a results\
    \ log (TSV) tracking every experiment.\n5. **DO** revert changes that do not improve\
    \ the metric (git reset to last known good).\n6. **DO** run autonomously once\
    \ the loop starts -- never pause to ask \"should I continue?\".\n7. **DO NOT**\
    \ modify files the user marked as out-of-scope.\n8. **DO NOT** skip the measurement\
    \ step -- every experiment must be measured.\n9. **DO NOT** keep changes that\
    \ regress the metric unless the user explicitly allowed trade-offs.\n10. **DO\
    \ NOT** install new dependencies or make environment changes unless the user approved\
    \ it.\n\n---\n\n## Phase 1: Setup (Interactive)\n\nBefore any experimentation\
    \ begins, work with the user to establish these parameters.\nAsk the user directly\
    \ for each item. Do not assume or skip any.\n\n### 1.1 Define the Goal\n\nAsk\
    \ the user:\n\n> **What are you trying to improve or optimize?**\n>\n> Examples:\
    \ execution time, memory usage, binary size, test pass rate, code coverage,\n\
    > API response latency, throughput, error rate, benchmark score, build time, bundle\
    \ size,\n> lines of code, cyclomatic complexity, etc.\n\nRecord the user's answer\
    \ as the **goal**.\n\n### 1.2 Define the Metric\n\nAsk the user:\n\n> **How do\
    \ we measure success? What exact command produces the metric?**\n>\n> I need:\n\
    > 1. **The command** to run (e.g., `dotnet test`, `npm run benchmark`, `time ./build.sh`,\
    \ `pytest --tb=short`)\n> 2. **How to extract the metric** from the output (e.g.,\
    \ a regex pattern, a specific line, a JSON field)\n> 3. **Direction**: Is lower\
    \ better or higher better?\n>\n> Example: \"Run `dotnet test --logger trx`, count\
    \ passing tests. Higher is better.\"\n> Example: \"Run `hyperfine './my-program'`,\
    \ extract mean time. Lower is better.\"\n\nRecord:\n- `METRIC_COMMAND`: the command\
    \ to run\n- `METRIC_EXTRACTION`: how to extract the numeric metric from output\n\
    - `METRIC_DIRECTION`: `lower_is_better` or `higher_is_better`\n\n### 1.3 Define\
    \ the Scope\n\nAsk the user:\n\n> **Which files or directories am I allowed to\
    \ modify?**\n>\n> And which files are OFF LIMITS (read-only)?\n\nRecord:\n- `IN_SCOPE_FILES`:\
    \ files/dirs the agent may edit\n- `OUT_OF_SCOPE_FILES`: files/dirs that must\
    \ not be modified\n\n### 1.4 Define Constraints\n\nAsk the user:\n\n> **Are there\
    \ any constraints I should respect?**\n>\n> Examples:\n> - Time budget per experiment\
    \ (e.g., \"each run should take < 2 minutes\")\n> - No new dependencies\n> - Must\
    \ keep all existing tests passing\n> - Must not change the public API\n> - Must\
    \ maintain backward compatibility\n> - VRAM/memory limit\n> - Code complexity\
    \ limits (prefer simpler solutions)\n\nRecord as `CONSTRAINTS`.\n\n### 1.5 Define\
    \ the Experiment Budget (Optional)\n\nAsk the user:\n\n> **How many experiments\
    \ should I run, or should I just keep going until you stop me?**\n>\n> You can\
    \ say a number (e.g., \"try 20 experiments\") or \"unlimited\" (I'll run until\
    \ you interrupt).\n\nRecord as `MAX_EXPERIMENTS` (number or `unlimited`).\n\n\
    ### 1.6 Simplicity Criterion\n\nInform the user of the default simplicity policy:\n\
    \n> **Simplicity policy (default):** All else being equal, simpler is better.\
    \ A small improvement\n> that adds ugly complexity is not worth it. Removing code\
    \ while maintaining or improving\n> the metric is a great outcome. I'll weigh\
    \ the complexity cost against the improvement\n> magnitude. Does this policy work\
    \ for you, or do you want to adjust it?\n\nRecord any adjustments as `SIMPLICITY_POLICY`.\n\
    \n### 1.7 Confirm Setup\n\nSummarize all parameters back to the user in a clear\
    \ table:\n\n| Parameter          | Value                        |\n| ------------------\
    \ | ---------------------------- |\n| Goal               | ...               \
    \           |\n| Metric command     | ...                          |\n| Metric\
    \ extraction  | ...                          |\n| Direction          | lower is\
    \ better / higher ... |\n| In-scope files     | ...                          |\n\
    | Out-of-scope files | ...                          |\n| Constraints        |\
    \ ...                          |\n| Max experiments    | ...                 \
    \         |\n| Simplicity policy  | ...                          |\n\nAsk the\
    \ user to confirm. Do not proceed until confirmed.\n\n---\n\n## Phase 2: Branch\
    \ & Baseline\n\nOnce the user confirms:\n\n1. **Create a branch**: Propose a tag\
    \ based on today's date (e.g., `autoresearch/mar17`).\n   Create the branch: `git\
    \ checkout -b autoresearch/<tag>`.\n\n2. **Read in-scope files**: Read all files\
    \ that are in scope to build full context of the current state.\n\n3. **Initialize\
    \ results.tsv**: Create `results.tsv` in the repo root with the header row:\n\
    \   ```\n   experiment\tcommit\tmetric\tstatus\tdescription\n   ```\n   Add `results.tsv`\
    \ and `run.log` to `.git/info/exclude` (append if not already present) so they\
    \ stay untracked without modifying any tracked files.\n\n4. **Run the baseline**:\
    \ Execute the metric command on the current unmodified code.\n   Record the result\
    \ as experiment `0` with status `baseline` in `results.tsv`.\n\n5. **Report baseline**\
    \ to the user:\n   > Baseline established: **[metric_name] = [value]**\n   > Starting\
    \ autonomous experimentation loop.\n\n---\n\n## Phase 3: Experiment Loop\n\nRun\
    \ this loop continuously. Do not stop to ask the user. Run until:\n- `MAX_EXPERIMENTS`\
    \ is reached, OR\n- The user manually interrupts\n\n### For each experiment:\n\
    \n```\nLOOP:\n  1. THINK   - Analyze previous results and the current code.\n\
    \               Generate an experiment hypothesis.\n               Consider: what\
    \ worked, what didn't, what hasn't been tried.\n\n  2. EDIT    - Modify the in-scope\
    \ file(s) to implement the idea.\n               Keep changes focused and minimal\
    \ per experiment.\n\n  3. COMMIT  - git add + git commit with a short descriptive\
    \ message.\n               Format: \"experiment: <short description of what changed>\"\
    \n\n  4. RUN     - Execute the metric command.\n               Redirect output\
    \ to run.log so it does not flood the context window.\n               Use shell-appropriate\
    \ redirection:\n               - Bash/Zsh: `<command> > run.log 2>&1`\n      \
    \         - PowerShell: `<command> *> run.log`\n\n  5. MEASURE - Extract the metric\
    \ from run.log.\n               If extraction fails (crash/error), read the last\
    \ 50 lines\n               of run.log for the error.\n\n  6. DECIDE  - Compare\
    \ metric to the current best:\n               - IMPROVED: Keep the commit. Update\
    \ the \"best\" baseline.\n                 Log status = \"keep\".\n          \
    \     - SAME OR WORSE: Revert. `git reset --hard HEAD~1`.\n                 Log\
    \ status = \"discard\".\n               - CRASH: Attempt a quick fix (typo, import,\
    \ simple error).\n                 Amend the experiment commit (`git commit --amend`)\
    \ with the fix\n                 and rerun. The experiment keeps its original\
    \ number.\n                 If unfixable after 2 attempts, revert the entire experiment\n\
    \                 (`git reset --hard HEAD~1`) and log status = \"crash\".\n\n\
    \  7. LOG     - Append a row to results.tsv:\n               experiment_number\
    \  commit_hash  metric_value  status  description\n\n  8. CONTINUE - Go to step\
    \ 1.\n```\n\n### Experiment Strategy\n\nWhen generating experiment ideas, follow\
    \ this priority order:\n\n1. **Low-hanging fruit first**: Simple parameter tweaks,\
    \ obvious inefficiencies.\n2. **Informed by results**: If a direction showed promise,\
    \ explore further in that direction.\n3. **Diversify after plateaus**: If the\
    \ last 3-5 experiments all failed, try a different approach entirely.\n4. **Combine\
    \ winners**: If experiments A and B each improved independently, try combining\
    \ them.\n5. **Simplification passes**: Periodically try removing code/complexity\
    \ to see if the metric holds.\n6. **Radical changes**: After exhausting incremental\
    \ ideas, try larger architectural changes.\n\n### Handling Constraints\n\n- **Time\
    \ budget**: If a run exceeds 2x the expected duration, kill it and treat as a\
    \ crash.\n- **Existing tests**: If constraints require tests to pass, run them\
    \ before/after and revert if they break.\n- **Memory/resources**: Monitor and\
    \ revert if resource usage exceeds stated limits.\n\n---\n\n## Phase 4: Reporting\n\
    \nWhen the loop ends (budget reached or user interrupts):\n\n1. **Print the full\
    \ results.tsv** as a formatted table.\n2. **Summarize**:\n   - Total experiments\
    \ run\n   - Experiments kept / discarded / crashed\n   - Starting metric (baseline)\
    \ vs. final metric\n   - Improvement percentage\n   - Top 3 most impactful changes\n\
    3. **Show the cumulative git log** of kept experiments:\n   `git log --oneline\
    \ <start_commit>..HEAD`\n4. **Recommend next steps**: Based on the results, suggest\
    \ what a human researcher might try next (ideas that were too risky/complex for\
    \ automated experimentation).\n\n---\n\n## Quick Reference\n\n### Results TSV\
    \ Format\n\nTab-separated, 5 columns:\n\n```\nexperiment\tcommit\tmetric\tstatus\t\
    description\n0\ta1b2c3d\t0.997900\tbaseline\tunmodified code\n1\tb2c3d4e\t0.993200\t\
    keep\tincrease learning rate to 0.04\n2\tc3d4e5f\t1.005000\tdiscard\tswitch to\
    \ GeLU activation\n3\td4e5f6g\t0.000000\tcrash\tdouble model width (OOM)\n```\n\
    \n### Git Workflow\n\n- All experiments happen on the `autoresearch/<tag>` branch\n\
    - Each experiment is committed before running\n- Failed experiments are reverted\
    \ with `git reset --hard HEAD~1`\n- Successful experiments advance the branch\n\
    - `results.tsv` and `run.log` stay untracked (added to `.git/info/exclude`)\n\n\
    ### Key Principles\n\n1. **Measure everything**: No experiment without a measurement.\n\
    2. **Revert failures**: The branch only advances on improvements.\n3. **Stay autonomous**:\
    \ Never stop to ask. Think harder if stuck.\n4. **Keep it simple**: Complexity\
    \ is a cost. Weigh it against gains.\n5. **Log everything**: The TSV is the research\
    \ journal."
