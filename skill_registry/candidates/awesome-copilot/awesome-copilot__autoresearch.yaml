description: 'Autonomous iterative experimentation loop for any programming task.
  Guides the user through defining goals, measurable metrics, and scope constraints,
  then runs an autonomous loop of code changes, testing, measuring, and keeping/discarding
  results. Inspired by Karpathy''s autoresearch. USE FOR: autonomous improvement,
  iterative optimization, experiment loop, auto research, performance tuning, automated
  experimentation, hill climbing, try things automatically, optimize code, run experiments,
  autonomous coding loop. DO NOT USE FOR: one-shot tasks, simple bug fixes, code review,
  or tasks without a measurable metric.'
