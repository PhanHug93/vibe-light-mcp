  text: "# React Audit Grep Patterns\n\nComplete scan command library for React 18.3.1\
    \ and React 19 migration audits.\n\n## Usage\n\nRead the relevant section for\
    \ your target:\n- **`references/react18-scans.md`** - all scans for React 16/17\
    \ \u2192 18.3.1 audit\n- **`references/react19-scans.md`** - all scans for React\
    \ 18 \u2192 19 audit\n- **`references/test-scans.md`** - test file specific scans\
    \ (used by both auditors)\n- **`references/dep-scans.md`** - dependency and peer\
    \ conflict scans\n\n## Base Patterns Used Across All Scans\n\n```bash\n# Standard\
    \ flags used throughout:\n# -r = recursive\n# -n = show line numbers\n# -l = show\
    \ filenames only (for counting affected files)\n# --include=\"*.js\" --include=\"\
    *.jsx\" = JS/JSX files only\n# | grep -v \"\\.test\\.\\|\\.spec\\.\\|__tests__\"\
    \ = exclude test files\n# | grep -v \"node_modules\" = safety (usually handled\
    \ by not scanning node_modules)\n# 2>/dev/null = suppress \"no files found\" errors\n\
    \n# Source files only (exclude tests):\nSRC_FLAGS='--include=\"*.js\" --include=\"\
    *.jsx\"'\nEXCLUDE_TESTS='grep -v \"\\.test\\.\\|\\.spec\\.\\|__tests__\"'\n\n\
    # Test files only:\nTEST_FLAGS='--include=\"*.test.js\" --include=\"*.test.jsx\"\
    \ --include=\"*.spec.js\" --include=\"*.spec.jsx\"'\n```"
