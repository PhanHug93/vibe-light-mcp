  text: "# Minecraft Plugin Development\n\nUse this skill for Minecraft server plugin\
    \ work in the Paper, Spigot, and Bukkit ecosystem.\n\nThis skill is especially\
    \ useful for gameplay-heavy plugins such as combat systems, wave or boss encounters,\
    \ war or team modes, arenas, kit systems, cooldown-based abilities, scoreboards,\
    \ and config-driven game rules.\n\nFor grounded implementation patterns drawn\
    \ from real Paper plugins, load these references as needed:\n\n- [`references/project-patterns.md`](references/project-patterns.md)\
    \ for high-level architecture patterns seen in real gameplay plugins\n- [`references/bootstrap-registration.md`](references/bootstrap-registration.md)\
    \ for `onEnable`, command wiring, listener registration, and shutdown expectations\n\
    - [`references/state-sessions-and-phases.md`](references/state-sessions-and-phases.md)\
    \ for player session modeling, game phases, match state, and reconnect-safe logic\n\
    - [`references/config-data-and-async.md`](references/config-data-and-async.md)\
    \ for config managers, database-backed player data, async flushes, and UI refresh\
    \ tasks\n- [`references/maps-heroes-and-feature-modules.md`](references/maps-heroes-and-feature-modules.md)\
    \ for map rotation, hero or class systems, and modular feature growth\n- [`references/minigame-instance-flow.md`](references/minigame-instance-flow.md)\
    \ for arena instances, countdowns, loot refreshes, wave systems, visibility isolation,\
    \ and entity-to-game ownership\n- [`references/persistent-progression-and-events.md`](references/persistent-progression-and-events.md)\
    \ for long-running PvP servers with profiles, perks, buffs, quests, economy, custom\
    \ domain events, and extension registries\n- [`references/build-test-and-runtime-validation.md`](references/build-test-and-runtime-validation.md)\
    \ for Maven or Gradle packaging, shaded dependencies, generated resources, soft\
    \ dependencies, config validation commands, and first-round server test plans\n\
    \n## Scope\n\n- In scope: Paper, Spigot, Bukkit plugin development\n- In scope:\
    \ `plugin.yml`, commands, tab completion, listeners, schedulers, configs, permissions,\
    \ Adventure text, player state, minigame flow, arena instances, map copies, loot,\
    \ waves, persistent profiles, perks, buffs, quests, economy, and PvP/PvE game\
    \ loops\n- In scope: Java-based server plugin architecture, debugging, refactoring,\
    \ and feature implementation\n- Out of scope by default: Fabric mods, Forge mods,\
    \ client mods, Bedrock add-ons\n\nIf the user says \"Minecraft plugin\" but the\
    \ stack is unclear, first determine whether the project is Paper/Spigot/Bukkit\
    \ or a modding stack.\n\n## Default Working Style\n\nWhen this skill triggers:\n\
    \n1. Identify the server API and version target.\n2. Identify the build system\
    \ and Java version.\n3. Inspect `plugin.yml`, the main plugin class, and command\
    \ or listener registration.\n4. Map the gameplay flow before editing code:\n \
    \  - player lifecycle\n   - game phases\n   - timers and scheduled tasks\n   -\
    \ team, arena, or match state\n   - config and persistence\n5. Make the smallest\
    \ coherent change that keeps registration, config, and runtime behavior aligned.\n\
    \nIf the plugin is gameplay-heavy or stateful, read [`references/project-patterns.md`](references/project-patterns.md)\
    \ and [`references/state-sessions-and-phases.md`](references/state-sessions-and-phases.md)\
    \ before editing.\n\nIf the task touches arena isolation, map instances, chest\
    \ or resource refills, wave spawning, route voting, spectator visibility, or game-specific\
    \ chat, also read [`references/minigame-instance-flow.md`](references/minigame-instance-flow.md).\n\
    \nIf the task touches persistent player progression, profile saves, economy rewards,\
    \ perks, buffs, quests, custom combat events, or long-running shared PvP servers,\
    \ also read [`references/persistent-progression-and-events.md`](references/persistent-progression-and-events.md).\n\
    \nIf the task touches build files, `plugin.yml` metadata, shaded dependencies,\
    \ generated resource output, deployment to a test server, optional plugin integrations,\
    \ or release validation, also read [`references/build-test-and-runtime-validation.md`](references/build-test-and-runtime-validation.md).\n\
    \n## Project Discovery Checklist\n\nCheck these first when present:\n\n- `plugin.yml`\n\
    - `pom.xml`, `build.gradle`, or `build.gradle.kts`\n- the plugin main class extending\
    \ `JavaPlugin`\n- command executors and tab completers\n- listener classes\n-\
    \ config bootstrap code for `config.yml`, messages, kits, arenas, or custom YAML\
    \ files\n- generated resource output such as `target/classes`, `build/resources`,\
    \ or copied plugin jars\n- scheduler usage through Bukkit scheduler APIs\n- any\
    \ player data, team state, arena state, or match state containers\n\n## Core Rules\n\
    \n### Prefer the concrete server API in the repo\n\n- If the project already targets\
    \ Paper APIs, keep using Paper-first APIs instead of downgrading to generic Bukkit\
    \ unless compatibility is explicitly required.\n- Do not assume an API exists\
    \ across all versions. Check the existing dependency and surrounding code style\
    \ first.\n\n### Keep registration in sync\n\nWhen adding commands, permissions,\
    \ or listeners, update the relevant registration points in the same change:\n\n\
    - `plugin.yml`\n- plugin startup registration in `onEnable`\n- any permission\
    \ checks in code\n- any related config or message keys\n\n### Respect main-thread\
    \ boundaries\n\n- Do not touch world state, entities, inventories, scoreboards,\
    \ or most Bukkit API objects from async tasks unless the API explicitly permits\
    \ it.\n- Use async tasks for external I/O, heavy computation, or database work,\
    \ then switch back to the main thread before applying gameplay changes.\n\n###\
    \ Model gameplay as state, not scattered booleans\n\nFor gameplay plugins, prefer\
    \ explicit state objects over duplicated flags:\n\n- match or game phase\n- player\
    \ role or class\n- cooldown state\n- team membership\n- arena assignment\n- alive,\
    \ eliminated, spectating, or queued state\n\nWhen the feature affects match-heavy\
    \ minigames or persistent-brawl gameplay, look for hidden state transitions first\
    \ before patching symptoms.\n\nFor multi-arena plugins, isolate per-game visibility,\
    \ chat recipients, scoreboards, loot, and entity ownership. Do not let one arena\
    \ observe or mutate another arena by accident.\n\n### Favor config-driven values\n\
    \nWhen the feature includes damage, cooldowns, rewards, durations, messages, map\
    \ settings, or toggles:\n\n- prefer config-backed values over hardcoding\n- provide\
    \ sensible defaults\n- keep key names stable and readable\n- validate or sanitize\
    \ missing values\n\n### Be careful with reload behavior\n\n- Avoid promising safe\
    \ hot reload unless the code already supports it well.\n- On config reload, ensure\
    \ in-memory caches, scheduled tasks, and gameplay state are handled consistently.\n\
    \n## Implementation Patterns\n\n### Commands\n\nFor new commands:\n\n- add the\
    \ command to `plugin.yml`\n- implement executor and tab completion when needed\n\
    - validate sender type before casting to `Player`\n- separate parsing, permission\
    \ checks, and gameplay logic\n- send clear player-facing feedback for invalid\
    \ usage\n\nMinimal registration shape:\n\n```yaml\ncommands:\n  arena:\n    description:\
    \ Join or leave an arena\n    usage: /arena <join|leave>\n```\n\n```java\n@Override\n\
    public void onEnable() {\n    ArenaCommand command = new ArenaCommand(gameService);\n\
    \    PluginCommand arena = getCommand(\"arena\");\n    if (arena != null) {\n\
    \        arena.setExecutor(command);\n        arena.setTabCompleter(command);\n\
    \    }\n}\n```\n\n### Listeners\n\nFor event listeners:\n\n- guard early and return\
    \ early\n- check whether the current player, arena, or game phase should handle\
    \ the event\n- avoid doing expensive work in hot events such as move, damage,\
    \ or interact spam\n- centralize repeated checks where practical\n\n### Scheduled\
    \ Tasks\n\nFor timers, rounds, countdowns, cooldowns, or periodic checks:\n\n\
    - store task handles when cancellation matters\n- cancel tasks on plugin disable\
    \ and when a match or arena ends\n- avoid multiple overlapping tasks for the same\
    \ gameplay concern unless explicitly intended\n- prefer one authoritative game\
    \ loop over many loosely coordinated repeating tasks\n- ensure countdown or refill\
    \ tasks self-cancel when the game leaves the expected state\n\nMain-thread handoff\
    \ shape:\n\n```java\nBukkit.getScheduler().runTaskAsynchronously(plugin, () ->\
    \ {\n    PlayerData data = repository.load(playerId);\n    Bukkit.getScheduler().runTask(plugin,\
    \ () -> {\n        Player player = Bukkit.getPlayer(playerId);\n        if (player\
    \ != null && player.isOnline()) {\n            scoreboard.update(player, data);\n\
    \        }\n    });\n});\n```\n\n### Player and Match State\n\nFor per-player\
    \ or per-match state:\n\n- define ownership clearly\n- clean up on quit, kick,\
    \ death, match end, and plugin disable\n- avoid memory leaks from stale maps keyed\
    \ by `Player`\n- prefer `UUID` for persistent tracking unless a live player object\
    \ is strictly needed\n\n### Text and Messages\n\nWhen the project uses Adventure\
    \ or MiniMessage:\n\n- follow the existing formatting approach\n- avoid mixing\
    \ legacy color codes and Adventure styles without a reason\n- keep message templates\
    \ configurable when messages are gameplay-facing\n\n## High-Risk Areas\n\nPay\
    \ extra attention when editing:\n\n- damage handling and custom combat logic\n\
    - death, respawn, spectator, and elimination flow\n- arena join and leave flow\n\
    - scoreboard or boss bar updates\n- inventory mutation and kit distribution\n\
    - async database or file access\n- economy, quest, perk, and profile mutation\n\
    - custom event dispatch or extension registries\n- version-sensitive API calls\n\
    - shutdown and cleanup in `onDisable`\n- cross-arena visibility, chat, and broadcast\
    \ isolation\n- map copy, unload, and folder deletion logic\n- mob, NPC, projectile,\
    \ or temporary entity ownership\n- chest or resource refill systems\n\n## Output\
    \ Expectations\n\nWhen implementing or revising plugin code:\n\n- produce runnable\
    \ Java code, not pseudo-code, unless the user asks for design only\n- mention\
    \ any required updates to `plugin.yml`, config files, build files, or resources\n\
    - call out version assumptions explicitly\n- point out thread-safety or API-compatibility\
    \ risks when they exist\n- preserve the project's existing conventions and folder\
    \ structure\n\nWhen the requested change touches plugin startup, async data, match\
    \ flow, class systems, or rotating maps, consult the matching reference file before\
    \ editing.\n\n## Validation Checklist\n\nBefore finishing, verify as many of these\
    \ as the task allows:\n\n- the command, listener, or feature is registered correctly\n\
    - `plugin.yml` matches the implemented behavior\n- imports and API types match\
    \ the targeted server stack\n- scheduler usage is safe\n- config keys referenced\
    \ in code exist or have defaults\n- state cleanup paths exist for match end, player\
    \ quit, and plugin disable\n- per-arena chat, visibility, scoreboards, and broadcasts\
    \ are isolated\n- temporary worlds, mobs, tasks, and generated resources are cleaned\
    \ up\n- there are no obvious null, cast, or lifecycle hazards\n\n## Common Gotchas\n\
    \n- Casting `CommandSender` to `Player` without checking\n- Updating Bukkit state\
    \ from async tasks\n- Forgetting to register listeners or declare commands in\
    \ `plugin.yml`\n- Using `Player` objects as long-lived map keys when `UUID` is\
    \ safer\n- Leaving repeating tasks alive after a round, arena, or plugin shutdown\n\
    - Hardcoding gameplay constants that should live in config\n- Assuming Paper-only\
    \ APIs in a Spigot-targeted plugin\n- Treating reload as free even though stateful\
    \ plugins often break under reload\n- Broadcasting, showing players, or applying\
    \ scoreboard changes across unrelated game instances\n- Loading or mutating chest/container\
    \ blocks before their chunks are available\n- Forgetting to unregister spawned\
    \ mobs or temporary entities from the owning game\n- Editing generated files under\
    \ `target/classes` or `build/resources` instead of source files under `src/main/resources`\n\
    \n## Preferred Response Shape\n\nFor substantial requests, structure work like\
    \ this:\n\n1. Current plugin context and assumptions\n2. Gameplay or lifecycle\
    \ impact\n3. Code changes\n4. Required registration or config updates\n5. Validation\
    \ and remaining risks\n\nFor small requests, keep the answer concise but still\
    \ mention any needed `plugin.yml`, config, or lifecycle updates."
