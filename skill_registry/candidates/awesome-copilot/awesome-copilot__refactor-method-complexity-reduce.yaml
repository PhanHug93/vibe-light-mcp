  text: "# Refactor Method to Reduce Cognitive Complexity\n\n## Objective\nRefactor\
    \ the method `${input:methodName}`, to reduce its cognitive complexity to `${input:complexityThreshold}`\
    \ or below, by extracting logic into focused helper methods.\n\n## Instructions\n\
    \n1. **Analyze the current method** to identify sources of cognitive complexity:\n\
    \   - Nested conditional statements\n   - Multiple if-else or switch chains\n\
    \   - Repeated code blocks\n   - Multiple loops with conditions\n   - Complex\
    \ boolean expressions\n\n2. **Identify extraction opportunities**:\n   - Validation\
    \ logic that can be extracted into a separate method\n   - Type-specific or case-specific\
    \ processing that repeats\n   - Complex transformations or calculations\n   -\
    \ Common patterns that appear multiple times\n\n3. **Extract focused helper methods**:\n\
    \   - Each helper should have a single, clear responsibility\n   - Extract validation\
    \ into separate `Validate*` methods\n   - Extract type-specific logic into handler\
    \ methods\n   - Create utility methods for common operations\n   - Use appropriate\
    \ access levels (static, private, async)\n\n4. **Simplify the main method**:\n\
    \   - Reduce nesting depth\n   - Replace massive if-else chains with smaller orchestrated\
    \ calls\n   - Use switch statements where appropriate for cleaner dispatch\n \
    \  - Ensure the main method reads as a high-level flow\n\n5. **Preserve functionality**:\n\
    \   - Maintain the same input/output behavior\n   - Keep all validation and error\
    \ handling\n   - Preserve exception types and error messages\n   - Ensure all\
    \ parameters are properly passed to helpers\n\n6. **Best practices**:\n   - Make\
    \ helper methods static when they don't need instance state\n   - Use null checks\
    \ and guard clauses early\n   - Avoid creating unnecessary local variables\n \
    \  - Consider using tuples for multiple return values\n   - Group related helper\
    \ methods together\n\n## Implementation Approach\n\n- Extract helper methods before\
    \ refactoring the main flow\n- Test incrementally to ensure no regressions\n-\
    \ Use meaningful names that describe the extracted responsibility\n- Keep extracted\
    \ methods close to where they're used\n- Consider making repeated code patterns\
    \ into generic methods\n\n## Result\n\nThe refactored method should:\n- Have cognitive\
    \ complexity reduced to the target threshold of `${input:complexityThreshold}`\
    \ or below\n- Be more readable and maintainable\n- Have clear separation of concerns\n\
    - Be easier to test and debug\n- Retain all original functionality\n\n## Testing\
    \ and Validation\n\n**CRITICAL: After completing the refactoring, you MUST:**\n\
    \n1. **Run all existing tests** related to the refactored method and its surrounding\
    \ functionality\n2. **MANDATORY: Explicitly verify test results show \"failed=0\"\
    **\n   - **NEVER assume tests passed** - always examine the actual test output\n\
    \   - Search for the summary line containing pass/fail counts (e.g., \"passed=X\
    \ failed=Y\")\n   - **If the summary shows any number other than \"failed=0\"\
    , tests have FAILED**\n   - If test output is in a file, read the entire file\
    \ to locate and verify the failure count\n   - Running tests is NOT the same as\
    \ verifying tests passed\n   - **Do not proceed** until you have explicitly confirmed\
    \ zero failures\n3. **If any tests fail (failed > 0):**\n   - State clearly how\
    \ many tests failed\n   - Analyze each failure to understand what functionality\
    \ was broken\n   - Common causes: null handling, empty collection checks, condition\
    \ logic errors\n   - Identify the root cause in the refactored code\n   - Correct\
    \ the refactored code to restore the original behavior\n   - Re-run tests and\
    \ verify \"failed=0\" in the output\n   - Repeat until all tests pass (failed=0)\n\
    4. **Verify compilation** - Ensure there are no compilation errors\n5. **Check\
    \ cognitive complexity** - Confirm the metric is at or below the target threshold\
    \ of `${input:complexityThreshold}`\n\n## Confirmation Checklist\n- [ ] Code compiles\
    \ without errors\n- [ ] **Test results explicitly state \"failed=0\"** (verified\
    \ by reading the output)\n- [ ] All test failures analyzed and corrected (if any\
    \ occurred)\n- [ ] Cognitive complexity is at or below the target threshold of\
    \ `${input:complexityThreshold}`\n- [ ] All original functionality is preserved\n\
    - [ ] Code follows project conventions and standards"
