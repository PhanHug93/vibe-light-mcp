  text: "# AppInsights instrumentation\n\nThis skill enables sending telemetry data\
    \ of a webapp to Azure App Insights for better observability of the app's health.\n\
    \n## When to use this skill\n\nUse this skill when the user wants to enable telemetry\
    \ for their webapp.\n\n## Prerequisites\n\nThe app in the workspace must be one\
    \ of these kinds\n\n- An ASP.NET Core app hosted in Azure\n- A Node.js app hosted\
    \ in Azure\n\n## Guidelines\n\n### Collect context information\n\nFind out the\
    \ (programming language, application framework, hosting) tuple of the application\
    \ the user is trying to add telemetry support in. This determines how the application\
    \ can be instrumented. Read the source code to make an educated guess. Confirm\
    \ with the user on anything you don't know. You must always ask the user where\
    \ the application is hosted (e.g. on a personal computer, in an Azure App Service\
    \ as code, in an Azure App Service as container, in an Azure Container App, etc.).\
    \ \n\n### Prefer auto-instrument if possible\n\nIf the app is a C# ASP.NET Core\
    \ app hosted in Azure App Service, use [AUTO guide](references/AUTO.md) to help\
    \ user auto-instrument the app.\n\n### Manually instrument\n\nManually instrument\
    \ the app by creating the AppInsights resource and update the app's code. \n\n\
    #### Create AppInsights resource\n\nUse one of the following options that fits\
    \ the environment.\n\n- Add AppInsights to existing Bicep template. See [examples/appinsights.bicep](examples/appinsights.bicep)\
    \ for what to add. This is the best option if there are existing Bicep template\
    \ files in the workspace.\n- Use Azure CLI. See [scripts/appinsights.ps1](scripts/appinsights.ps1)\
    \ for what Azure CLI command to execute to create the App Insights resource.\n\
    \nNo matter which option you choose, recommend the user to create the App Insights\
    \ resource in a meaningful resource group that makes managing resources easier.\
    \ A good candidate will be the same resource group that contains the resources\
    \ for the hosted app in Azure.\n\n#### Modify application code\n\n- If the app\
    \ is an ASP.NET Core app, see [ASPNETCORE guide](references/ASPNETCORE.md) for\
    \ how to modify the C# code.\n- If the app is a Node.js app, see [NODEJS guide](references/NODEJS.md)\
    \ for how to modify the JavaScript/TypeScript code.\n- If the app is a Python\
    \ app, see [PYTHON guide](references/PYTHON.md) for how to modify the Python code."
