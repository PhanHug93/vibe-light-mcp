  text: "# Acquire Codebase Knowledge\n\nProduces seven populated documents in `docs/codebase/`\
    \ covering everything needed to work effectively on the project. Only document\
    \ what is verifiable from files or terminal output \u2014 never infer or assume.\n\
    \n## Output Contract (Required)\n\nBefore finishing, all of the following must\
    \ be true:\n\n1. Exactly these files exist in `docs/codebase/`: `STACK.md`, `STRUCTURE.md`,\
    \ `ARCHITECTURE.md`, `CONVENTIONS.md`, `INTEGRATIONS.md`, `TESTING.md`, `CONCERNS.md`.\n\
    2. Every claim is traceable to source files, config, or terminal output.\n3. Unknowns\
    \ are marked as `[TODO]`; intent-dependent decisions are marked `[ASK USER]`.\n\
    4. Every document includes a short \"evidence\" list with concrete file paths.\n\
    5. Final response includes numbered `[ASK USER]` questions and intent-vs-reality\
    \ divergences.\n\n## Workflow\n\nCopy and track this checklist:\n\n```\n- [ ]\
    \ Phase 1: Run scan, read intent documents\n- [ ] Phase 2: Investigate each documentation\
    \ area\n- [ ] Phase 3: Populate all seven docs in docs/codebase/\n- [ ] Phase\
    \ 4: Validate docs, present findings, resolve all [ASK USER] items\n```\n\n##\
    \ Focus Area Mode\n\nIf the user supplies a focus area (for example: \"architecture\
    \ only\" or \"testing and concerns\"):\n\n1. Always run Phase 1 in full.\n2. Fully\
    \ complete focus-area documents first.\n3. For non-focus documents not yet analyzed,\
    \ keep required sections present and mark unknowns as `[TODO]`.\n4. Still run\
    \ the Phase 4 validation loop on all seven documents before final output.\n\n\
    ### Phase 1: Scan and Read Intent\n\n1. Run the scan script from the target project\
    \ root:\n   ```bash\n   python3 \"$SKILL_ROOT/scripts/scan.py\" --output docs/codebase/.codebase-scan.txt\n\
    \   ```\n   Where `$SKILL_ROOT` is the absolute path to the skill folder. Works\
    \ on Windows, macOS, and Linux.\n\n   **Quick start:** If you have the path inline:\n\
    \   ```bash\n   python3 /absolute/path/to/skills/acquire-codebase-knowledge/scripts/scan.py\
    \ --output docs/codebase/.codebase-scan.txt\n   ```\n\n2. Search for `PRD`, `TRD`,\
    \ `README`, `ROADMAP`, `SPEC`, `DESIGN` files and read them.\n3. Summarise the\
    \ stated project intent before reading any source code.\n\n### Phase 2: Investigate\n\
    \nUse the scan output to answer questions for each of the seven templates. Load\
    \ [`references/inquiry-checkpoints.md`](references/inquiry-checkpoints.md) for\
    \ the full per-template question list.\n\nIf the stack is ambiguous (multiple\
    \ manifest files, unfamiliar file types, no `package.json`), load [`references/stack-detection.md`](references/stack-detection.md).\n\
    \n### Phase 3: Populate Templates\n\nCopy each template from `assets/templates/`\
    \ into `docs/codebase/`. Fill in this order:\n\n1. [STACK.md](assets/templates/STACK.md)\
    \ \u2014 language, runtime, frameworks, all dependencies\n2. [STRUCTURE.md](assets/templates/STRUCTURE.md)\
    \ \u2014 directory layout, entry points, key files\n3. [ARCHITECTURE.md](assets/templates/ARCHITECTURE.md)\
    \ \u2014 layers, patterns, data flow\n4. [CONVENTIONS.md](assets/templates/CONVENTIONS.md)\
    \ \u2014 naming, formatting, error handling, imports\n5. [INTEGRATIONS.md](assets/templates/INTEGRATIONS.md)\
    \ \u2014 external APIs, databases, auth, monitoring\n6. [TESTING.md](assets/templates/TESTING.md)\
    \ \u2014 frameworks, file organization, mocking strategy\n7. [CONCERNS.md](assets/templates/CONCERNS.md)\
    \ \u2014 tech debt, bugs, security risks, perf bottlenecks\n\nUse `[TODO]` for\
    \ anything that cannot be determined from code. Use `[ASK USER]` where the right\
    \ answer requires team intent.\n\n### Phase 4: Validate, Repair, Verify\n\nRun\
    \ this mandatory validation loop before finalizing:\n\n1. Validate each doc against\
    \ `references/inquiry-checkpoints.md`.\n2. For each non-trivial claim, confirm\
    \ at least one evidence reference exists.\n3. If any required section is missing\
    \ or unsupported:\n  - Fix the document.\n  - Re-run validation.\n4. Repeat until\
    \ all seven docs pass.\n\nThen present a summary of all seven documents, list\
    \ every `[ASK USER]` item as a numbered question, and highlight any Intent vs.\
    \ Reality divergences from Phase 1.\n\nValidation pass criteria:\n\n- No unsupported\
    \ claims.\n- No empty required sections.\n- Unknowns use `[TODO]` rather than\
    \ assumptions.\n- Team-intent gaps are explicitly marked `[ASK USER]`.\n\n---\n\
    \n## Gotchas\n\n**Monorepos:** Root `package.json` may have no source \u2014 check\
    \ for `workspaces`, `packages/`, or `apps/` directories. Each workspace may have\
    \ independent dependencies and conventions. Map each sub-package separately.\n\
    \n**Outdated README:** README often describes intended architecture, not the current\
    \ one. Cross-reference with actual file structure before treating any README claim\
    \ as fact.\n\n**TypeScript path aliases:** `tsconfig.json` `paths` config means\
    \ imports like `@/foo` don't map directly to the filesystem. Map aliases to real\
    \ paths before documenting structure.\n\n**Generated/compiled output:** Never\
    \ document patterns from `dist/`, `build/`, `generated/`, `.next/`, `out/`, or\
    \ `__pycache__/`. These are artefacts \u2014 document source conventions only.\n\
    \n**`.env.example` reveals required config:** Secrets are never committed. Read\
    \ `.env.example`, `.env.template`, or `.env.sample` to discover required environment\
    \ variables.\n\n**`devDependencies` \u2260 production stack:** Only `dependencies`\
    \ (or equivalent, e.g. `[tool.poetry.dependencies]`) runs in production. Document\
    \ linters, formatters, and test frameworks separately as dev tooling.\n\n**Test\
    \ TODOs \u2260 production debt:** TODOs inside `test/`, `tests/`, `__tests__/`,\
    \ or `spec/` are coverage gaps, not production technical debt. Separate them in\
    \ `CONCERNS.md`.\n\n**High-churn files = fragile areas:** Files appearing most\
    \ in recent git history have the highest modification rate and likely hidden complexity.\
    \ Always note them in `CONCERNS.md`.\n\n---\n\n## Anti-Patterns\n\n| \u274C Don't\
    \ | \u2705 Do instead |\n|---------|--------------|\n| \"Uses Clean Architecture\
    \ with Domain/Data layers.\" (when no such directories exist) | State only what\
    \ directory structure actually shows. |\n| \"This is a Next.js project.\" (without\
    \ checking `package.json`) | Check `dependencies` first. State what's actually\
    \ there. |\n| Guess the database from a variable name like `dbUrl` | Check manifest\
    \ for `pg`, `mysql2`, `mongoose`, `prisma`, etc. |\n| Document `dist/` or `build/`\
    \ naming patterns as conventions | Source files only. |\n\n---\n\n## Enhanced\
    \ Scan Output Sections\n\nThe `scan.py` script now produce the following sections\
    \ in addition to the original output:\n\n- **CODE METRICS** \u2014 Total files,\
    \ lines of code by language, largest files (complexity signals)\n- **CI/CD PIPELINES**\
    \ \u2014 Detected GitHub Actions, GitLab CI, Jenkins, CircleCI, etc.\n- **CONTAINERS\
    \ & ORCHESTRATION** \u2014 Docker, Docker Compose, Kubernetes, Vagrant configs\n\
    - **SECURITY & COMPLIANCE** \u2014 Snyk, Dependabot, SECURITY.md, SBOM, security\
    \ policies\n- **PERFORMANCE & TESTING** \u2014 Benchmark configs, profiling markers,\
    \ load testing tools\n\nUse these sections during Phase 2 to inform investigation\
    \ questions and identify tool-specific patterns.\n\n---\n\n## Bundled Assets\n\
    \n| Asset | When to load |\n|-------|-------------|\n| [`scripts/scan.py`](scripts/scan.py)\
    \ | Phase 1 \u2014 run first, before reading any code (Python 3.8+ required) |\n\
    \n| [`references/inquiry-checkpoints.md`](references/inquiry-checkpoints.md) |\
    \ Phase 2 \u2014 load for per-template investigation questions |\n| [`references/stack-detection.md`](references/stack-detection.md)\
    \ | Phase 2 \u2014 only if stack is ambiguous |\n| [`assets/templates/STACK.md`](assets/templates/STACK.md)\
    \ | Phase 3 step 1 |\n| [`assets/templates/STRUCTURE.md`](assets/templates/STRUCTURE.md)\
    \ | Phase 3 step 2 |\n| [`assets/templates/ARCHITECTURE.md`](assets/templates/ARCHITECTURE.md)\
    \ | Phase 3 step 3 |\n| [`assets/templates/CONVENTIONS.md`](assets/templates/CONVENTIONS.md)\
    \ | Phase 3 step 4 |\n| [`assets/templates/INTEGRATIONS.md`](assets/templates/INTEGRATIONS.md)\
    \ | Phase 3 step 5 |\n| [`assets/templates/TESTING.md`](assets/templates/TESTING.md)\
    \ | Phase 3 step 6 |\n| [`assets/templates/CONCERNS.md`](assets/templates/CONCERNS.md)\
    \ | Phase 3 step 7 |\n\nTemplate usage mode:\n\n- Default mode: complete only\
    \ the \"Core Sections (Required)\" in each template.\n- Extended mode: add optional\
    \ sections only when the repo complexity justifies them."
