  text: "# Generate Python MCP Server\n\nCreate a complete Model Context Protocol\
    \ (MCP) server in Python with the following specifications:\n\n## Requirements\n\
    \n1. **Project Structure**: Create a new Python project with proper structure\
    \ using uv\n2. **Dependencies**: Include mcp[cli] package with uv\n3. **Transport\
    \ Type**: Choose between stdio (for local) or streamable-http (for remote)\n4.\
    \ **Tools**: Create at least one useful tool with proper type hints\n5. **Error\
    \ Handling**: Include comprehensive error handling and validation\n\n## Implementation\
    \ Details\n\n### Project Setup\n- Initialize with `uv init project-name`\n- Add\
    \ MCP SDK: `uv add \"mcp[cli]\"`\n- Create main server file (e.g., `server.py`)\n\
    - Add `.gitignore` for Python projects\n- Configure for direct execution with\
    \ `if __name__ == \"__main__\"`\n\n### Server Configuration\n- Use `FastMCP` class\
    \ from `mcp.server.fastmcp`\n- Set server name and optional instructions\n- Choose\
    \ transport: stdio (default) or streamable-http\n- For HTTP: optionally configure\
    \ host, port, and stateless mode\n\n### Tool Implementation\n- Use `@mcp.tool()`\
    \ decorator on functions\n- Always include type hints - they generate schemas\
    \ automatically\n- Write clear docstrings - they become tool descriptions\n- Use\
    \ Pydantic models or TypedDicts for structured outputs\n- Support async operations\
    \ for I/O-bound tasks\n- Include proper error handling\n\n### Resource/Prompt\
    \ Setup (Optional)\n- Add resources with `@mcp.resource()` decorator\n- Use URI\
    \ templates for dynamic resources: `\"resource://{param}\"`\n- Add prompts with\
    \ `@mcp.prompt()` decorator\n- Return strings or Message lists from prompts\n\n\
    ### Code Quality\n- Use type hints for all function parameters and returns\n-\
    \ Write docstrings for tools, resources, and prompts\n- Follow PEP 8 style guidelines\n\
    - Use async/await for asynchronous operations\n- Implement context managers for\
    \ resource cleanup\n- Add inline comments for complex logic\n\n## Example Tool\
    \ Types to Consider\n- Data processing and transformation\n- File system operations\
    \ (read, analyze, search)\n- External API integrations\n- Database queries\n-\
    \ Text analysis or generation (with sampling)\n- System information retrieval\n\
    - Math or scientific calculations\n\n## Configuration Options\n- **For stdio Servers**:\n\
    \  - Simple direct execution\n  - Test with `uv run mcp dev server.py`\n  - Install\
    \ to Claude: `uv run mcp install server.py`\n  \n- **For HTTP Servers**:\n  -\
    \ Port configuration via environment variables\n  - Stateless mode for scalability:\
    \ `stateless_http=True`\n  - JSON response mode: `json_response=True`\n  - CORS\
    \ configuration for browser clients\n  - Mounting to existing ASGI servers (Starlette/FastAPI)\n\
    \n## Testing Guidance\n- Explain how to run the server:\n  - stdio: `python server.py`\
    \ or `uv run server.py`\n  - HTTP: `python server.py` then connect to `http://localhost:PORT/mcp`\n\
    - Test with MCP Inspector: `uv run mcp dev server.py`\n- Install to Claude Desktop:\
    \ `uv run mcp install server.py`\n- Include example tool invocations\n- Add troubleshooting\
    \ tips\n\n## Additional Features to Consider\n- Context usage for logging, progress,\
    \ and notifications\n- LLM sampling for AI-powered tools\n- User input elicitation\
    \ for interactive workflows\n- Lifespan management for shared resources (databases,\
    \ connections)\n- Structured output with Pydantic models\n- Icons for UI display\n\
    - Image handling with Image class\n- Completion support for better UX\n\n## Best\
    \ Practices\n- Use type hints everywhere - they're not optional\n- Return structured\
    \ data when possible\n- Log to stderr (or use Context logging) to avoid stdout\
    \ pollution\n- Clean up resources properly\n- Validate inputs early\n- Provide\
    \ clear error messages\n- Test tools independently before LLM integration\n\n\
    Generate a complete, production-ready MCP server with type safety, proper error\
    \ handling, and comprehensive documentation."
