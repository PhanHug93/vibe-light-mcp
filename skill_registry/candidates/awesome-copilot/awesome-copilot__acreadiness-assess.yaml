  text: "# /acreadiness-assess \u2014 AI-readiness assessment\n\nUse this skill whenever\
    \ the user asks for an **AI-readiness assessment**, a **readiness check**, an\
    \ **audit**, or wants to **see how AI-ready** their repository is.\n\nThis skill\
    \ is the *Measure* step in AgentRC's **Measure \u2192 Generate \u2192 Maintain**\
    \ loop. The result is a self-contained HTML dashboard the user can open with `file://`\
    \ or commit to the repo.\n\n## Steps\n\n1. **Confirm prerequisites.** Node 20+\
    \ must be on PATH. If unsure, run `node --version`.\n\n2. **Decide on a policy**\
    \ (optional but encouraged):\n   - If the user provided `--policy <source>`, capture\
    \ it.\n   - Otherwise check `agentrc.config.json` for a `policies` array.\n  \
    \ - If neither, run with no policy (built-in defaults).\n   - For a primer on\
    \ policies, suggest the `acreadiness-policy` skill.\n\n3. **Run the readiness\
    \ scan** in the repo root with structured output:\n   ```bash\n   npx -y github:microsoft/agentrc\
    \ readiness --json [--policy <source>] [--per-area]\n   ```\n   The `CommandResult<T>`\
    \ JSON envelope is your input for the next step.\n\n4. **Hand off to the `ai-readiness-reporter`\
    \ custom agent** to interpret the JSON and produce `reports/index.html`. The agent\
    \ renders via the bundled template `report-template.html` (shipped alongside this\
    \ skill) so every report has an identical look & feel. The agent:\n   - Reads\
    \ the bundled `report-template.html` and substitutes placeholders with real data.\n\
    \   - Inlines all CSS, ships a single static file (works under `file://`).\n \
    \  - Renders maturity level, overall score, grade, pass-rate vs threshold.\n \
    \  - Breaks down all 9 pillars across **Repo Health** (8) and **AI Setup** (1)\
    \ with *what it measures*, *why it matters for AI*, *current state*, and *a specific\
    \ recommendation*.\n   - Tags every pillar with an **AI relevance** badge (High\
    \ / Medium / Low).\n   - Surfaces **Extras** separately (they never affect the\
    \ score).\n   - Shows the **Active Policy** including any disabled/overridden\
    \ criteria and thresholds.\n   - Produces a **Prioritised Remediation Plan** (\U0001F534\
    \ Fix First / \U0001F7E1 Fix Next / \U0001F535 Plan).\n   - Embeds the raw AgentRC\
    \ JSON for reuse.\n\n5. **Tell the user where the report lives** (`reports/index.html`)\
    \ and how to open it. Summarise in chat: maturity level, overall score, top three\
    \ lowest pillars, and the single highest-leverage next action (almost always:\
    \ run the `acreadiness-generate-instructions` skill).\n\n## Notes\n\n- AgentRC\
    \ also has a built-in HTML renderer (`--visual` / `--output report.html`) but\
    \ its output is intentionally generic. This skill produces a tailored, opinionated\
    \ dashboard via the custom agent \u2014 closer to a code review than a metrics\
    \ dump.\n- For CI gating, recommend `agentrc readiness --fail-level <n>` (1\u2013\
    5).\n- The skill never modifies repository files other than creating `reports/index.html`."
