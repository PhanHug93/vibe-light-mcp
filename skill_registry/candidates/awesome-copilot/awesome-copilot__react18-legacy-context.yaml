  text: "# React 18 Legacy Context Migration\n\nLegacy context (`contextTypes`, `childContextTypes`,\
    \ `getChildContext`) was deprecated in React 16.3 and warns in React 18.3.1. It\
    \ is **removed in React 19**.\n\n## This Is Always a Cross-File Migration\n\n\
    Unlike most other migrations that touch one file at a time, context migration\
    \ requires coordinating:\n1. Create the context object (usually a new file)\n\
    2. Update the **provider** component\n3. Update **every consumer** component\n\
    \nMissing any consumer leaves the app broken - it will read from the wrong context\
    \ or get `undefined`.\n\n## Migration Steps (Always Follow This Order)\n\n```\n\
    Step 1: Find the provider (childContextTypes + getChildContext)\nStep 2: Find\
    \ ALL consumers (contextTypes)\nStep 3: Create the context file\nStep 4: Update\
    \ the provider\nStep 5: Update each consumer (class components \u2192 contextType,\
    \ function components \u2192 useContext)\nStep 6: Verify - run the app, check\
    \ no legacy context warnings remain\n```\n\n## Scan Commands\n\n```bash\n# Find\
    \ all providers\ngrep -rn \"childContextTypes\\|getChildContext\" src/ --include=\"\
    *.js\" --include=\"*.jsx\" | grep -v \"\\.test\\.\"\n\n# Find all consumers\n\
    grep -rn \"contextTypes\\s*=\" src/ --include=\"*.js\" --include=\"*.jsx\" | grep\
    \ -v \"\\.test\\.\"\n\n# Find this.context usage (may be legacy or modern - check\
    \ which)\ngrep -rn \"this\\.context\\.\" src/ --include=\"*.js\" --include=\"\
    *.jsx\" | grep -v \"\\.test\\.\"\n```\n\n## Reference Files\n\n- **`references/single-context.md`**\
    \ - complete migration for one context (theme, auth, etc.) with provider + class\
    \ consumer + function consumer\n- **`references/multi-context.md`** - apps with\
    \ multiple legacy contexts (nested providers, multiple consumers of different\
    \ contexts)\n- **`references/context-file-template.md`** - the standard file structure\
    \ for a new context module"
