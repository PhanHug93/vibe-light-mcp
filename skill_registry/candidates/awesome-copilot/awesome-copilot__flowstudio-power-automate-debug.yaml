  text: "# Power Automate Debugging with FlowStudio MCP\n\nA step-by-step diagnostic\
    \ process for investigating failing Power Automate\ncloud flows through the FlowStudio\
    \ MCP server.\n\n> **Real debugging examples**: [Expression error in child flow](https://github.com/ninihen1/power-automate-mcp-skills/blob/main/examples/fix-expression-error.md)\
    \ |\n> [Data entry, not a flow bug](https://github.com/ninihen1/power-automate-mcp-skills/blob/main/examples/data-not-flow.md)\
    \ |\n> [Null value crashes child flow](https://github.com/ninihen1/power-automate-mcp-skills/blob/main/examples/null-child-flow.md)\n\
    \n**Prerequisite**: A FlowStudio MCP server must be reachable with a valid JWT.\n\
    See the `flowstudio-power-automate-mcp` skill for connection setup.\nSubscribe\
    \ at https://mcp.flowstudio.app\n\n---\n\n## Source of Truth\n\n> **Always call\
    \ `list_skills` / `tool_search` first** to confirm available tool\n> names and\
    \ parameter schemas. Tool names and parameters may change between\n> server versions.\n\
    > This skill covers response shapes, behavioral notes, and diagnostic patterns\
    \ \u2014\n> things tool schemas cannot tell you. If this document disagrees with\n\
    > `tool_search` or a real API response, the API wins.\n\n---\n\n## Python Helper\n\
    \n```python\nimport json, urllib.request\n\nMCP_URL   = \"https://mcp.flowstudio.app/mcp\"\
    \nMCP_TOKEN = \"<YOUR_JWT_TOKEN>\"\n\ndef mcp(tool, **kwargs):\n    payload =\
    \ json.dumps({\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/call\",\n \
    \                         \"params\": {\"name\": tool, \"arguments\": kwargs}}).encode()\n\
    \    req = urllib.request.Request(MCP_URL, data=payload,\n        headers={\"\
    x-api-key\": MCP_TOKEN, \"Content-Type\": \"application/json\",\n            \
    \     \"User-Agent\": \"FlowStudio-MCP/1.0\"})\n    try:\n        resp = urllib.request.urlopen(req,\
    \ timeout=120)\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"\
    utf-8\", errors=\"replace\")\n        raise RuntimeError(f\"MCP HTTP {e.code}:\
    \ {body[:200]}\") from e\n    raw = json.loads(resp.read())\n    if \"error\"\
    \ in raw:\n        raise RuntimeError(f\"MCP error: {json.dumps(raw['error'])}\"\
    )\n    return json.loads(raw[\"result\"][\"content\"][0][\"text\"])\n\nENV = \"\
    <environment-id>\"   # e.g. Default-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\n```\n\
    \n---\n\n## Step 1 \u2014 Locate the Flow\n\n```python\nresult = mcp(\"list_live_flows\"\
    , environmentName=ENV)\n# Returns a wrapper object: {mode, flows, totalCount,\
    \ error}\ntarget = next(f for f in result[\"flows\"] if \"My Flow Name\" in f[\"\
    displayName\"])\nFLOW_ID = target[\"id\"]   # plain UUID \u2014 use directly as\
    \ flowName\nprint(FLOW_ID)\n```\n\n---\n\n## Step 2 \u2014 Find the Failing Run\n\
    \n```python\nruns = mcp(\"get_live_flow_runs\", environmentName=ENV, flowName=FLOW_ID,\
    \ top=5)\n# Returns direct array (newest first):\n# [{\"name\": \"08584296068667933411438594643CU15\"\
    ,\n#   \"status\": \"Failed\",\n#   \"startTime\": \"2026-02-25T06:13:38.6910688Z\"\
    ,\n#   \"endTime\": \"2026-02-25T06:15:24.1995008Z\",\n#   \"triggerName\": \"\
    manual\",\n#   \"error\": {\"code\": \"ActionFailed\", \"message\": \"An action\
    \ failed...\"}},\n#  {\"name\": \"...\", \"status\": \"Succeeded\", \"error\"\
    : null, ...}]\n\nfor r in runs:\n    print(r[\"name\"], r[\"status\"], r[\"startTime\"\
    ])\n\nRUN_ID = next(r[\"name\"] for r in runs if r[\"status\"] == \"Failed\")\n\
    ```\n\n---\n\n## Step 3 \u2014 Get the Top-Level Error\n\n> **CRITICAL**: `get_live_flow_run_error`\
    \ tells you **which** action failed.\n> `get_live_flow_run_action_outputs` tells\
    \ you **why**. You must call BOTH.\n> Never stop at the error alone \u2014 error\
    \ codes like `ActionFailed`,\n> `NotSpecified`, and `InternalServerError` are\
    \ generic wrappers. The actual\n> root cause (wrong field, null value, HTTP 500\
    \ body, stack trace) is only\n> visible in the action's inputs and outputs.\n\n\
    ```python\nerr = mcp(\"get_live_flow_run_error\",\n    environmentName=ENV, flowName=FLOW_ID,\
    \ runName=RUN_ID)\n# Returns:\n# {\n#   \"runName\": \"08584296068667933411438594643CU15\"\
    ,\n#   \"failedActions\": [\n#     {\"actionName\": \"Apply_to_each_prepare_workers\"\
    , \"status\": \"Failed\",\n#      \"error\": {\"code\": \"ActionFailed\", \"message\"\
    : \"An action failed...\"},\n#      \"startTime\": \"...\", \"endTime\": \"...\"\
    },\n#     {\"actionName\": \"HTTP_find_AD_User_by_Name\", \"status\": \"Failed\"\
    ,\n#      \"code\": \"NotSpecified\", \"startTime\": \"...\", \"endTime\": \"\
    ...\"}\n#   ],\n#   \"allActions\": [\n#     {\"actionName\": \"Apply_to_each\"\
    , \"status\": \"Skipped\"},\n#     {\"actionName\": \"Compose_WeekEnd\", \"status\"\
    : \"Succeeded\"},\n#     ...\n#   ]\n# }\n\n# failedActions is ordered outer-to-inner.\
    \ The ROOT cause is the LAST entry:\nroot = err[\"failedActions\"][-1]\nprint(f\"\
    Root action: {root['actionName']} \u2192 code: {root.get('code')}\")\n\n# allActions\
    \ shows every action's status \u2014 useful for spotting what was Skipped\n# See\
    \ common-errors.md to decode the error code.\n```\n\n---\n\n## Step 4 \u2014 Inspect\
    \ the Failing Action's Inputs and Outputs\n\n> **This is the most important step.**\
    \ `get_live_flow_run_error` only gives\n> you a generic error code. The actual\
    \ error detail \u2014 HTTP status codes,\n> response bodies, stack traces, null\
    \ values \u2014 lives in the action's runtime\n> inputs and outputs. **Always\
    \ inspect the failing action immediately after\n> identifying it.**\n\n```python\n\
    # Get the root failing action's full inputs and outputs\nroot_action = err[\"\
    failedActions\"][-1][\"actionName\"]\ndetail = mcp(\"get_live_flow_run_action_outputs\"\
    ,\n    environmentName=ENV,\n    flowName=FLOW_ID,\n    runName=RUN_ID,\n    actionName=root_action)\n\
    \nif len(detail) > 1:\n    print(f\"{root_action} returned {len(detail)} repetitions;\
    \ inspect iteration indexes\")\nout = detail[0] if detail else {}\nprint(f\"Action:\
    \ {out.get('actionName')}\")\nprint(f\"Status: {out.get('status')}\")\n\n# For\
    \ HTTP actions, the real error is in outputs.body\nif isinstance(out.get(\"outputs\"\
    ), dict):\n    status_code = out[\"outputs\"].get(\"statusCode\")\n    body =\
    \ out[\"outputs\"].get(\"body\", {})\n    print(f\"HTTP {status_code}\")\n   \
    \ print(json.dumps(body, indent=2)[:500])\n\n    # Error bodies are often nested\
    \ JSON strings \u2014 parse them\n    if isinstance(body, dict) and \"error\"\
    \ in body:\n        err_detail = body[\"error\"]\n        if isinstance(err_detail,\
    \ str):\n            err_detail = json.loads(err_detail)\n        print(f\"Error:\
    \ {err_detail.get('message', err_detail)}\")\n\n# For expression errors, the error\
    \ is in the error field\nif out.get(\"error\"):\n    print(f\"Error: {out['error']}\"\
    )\n\n# Also check inputs \u2014 they show what expression/URL/body was used\n\
    if out.get(\"inputs\"):\n    print(f\"Inputs: {json.dumps(out['inputs'], indent=2)[:500]}\"\
    )\n```\n\n### What the action outputs reveal (that error codes don't)\n\n| Error\
    \ code from `get_live_flow_run_error` | What `get_live_flow_run_action_outputs`\
    \ reveals |\n|---|---|\n| `ActionFailed` | Which nested action actually failed\
    \ and its HTTP response |\n| `NotSpecified` | The HTTP status code + response\
    \ body with the real error |\n| `InternalServerError` | The server's error message,\
    \ stack trace, or API error JSON |\n| `InvalidTemplate` | The exact expression\
    \ that failed and the null/wrong-type value |\n| `BadRequest` | The request body\
    \ that was sent and why the server rejected it |\n\n### Foreach iterations\n\n\
    When `actionName` refers to an action inside a foreach, the output tool can\n\
    return every repetition of that action. Each item may include\n`repetitionIndexes`\
    \ with the loop name and zero-based `itemIndex`. Use\n`iterationIndex` to inspect\
    \ one iteration after you find the suspicious item:\n\n```python\nall_reps = mcp(\"\
    get_live_flow_run_action_outputs\",\n    environmentName=ENV,\n    flowName=FLOW_ID,\n\
    \    runName=RUN_ID,\n    actionName=root_action)\n\nfor rep in all_reps[:10]:\n\
    \    print(rep.get(\"repetitionIndexes\"), rep.get(\"status\"), rep.get(\"error\"\
    ))\n\none_rep = mcp(\"get_live_flow_run_action_outputs\",\n    environmentName=ENV,\n\
    \    flowName=FLOW_ID,\n    runName=RUN_ID,\n    actionName=root_action,\n   \
    \ iterationIndex=3)\n```\n\n### Evidence Compose Bookends\n\nFor uncertain connector\
    \ work, add a `Compose_*_Request` before the risky action\nand a `Compose_*_Result`\
    \ after it, with the result action allowed on both\n`Succeeded` and `Failed`.\
    \ This gives future debugging a clean payload snapshot\nwithout requiring another\
    \ deploy. Do not include secrets or long binary payloads\nin these bookends.\n\
    \n### Example: HTTP action returning 500\n\n```\nError code: \"InternalServerError\"\
    \ \u2190 this tells you nothing\n\nAction outputs reveal:\n  HTTP 500\n  body:\
    \ {\"error\": \"Cannot read properties of undefined (reading 'toLowerCase')\n\
    \    at getClientParamsFromConnectionString (storage.js:20)\"}\n  \u2190 THIS\
    \ tells you the Azure Function crashed because a connection string is undefined\n\
    ```\n\n### Example: Expression error on null\n\n```\nError code: \"BadRequest\"\
    \ \u2190 generic\n\nAction outputs reveal:\n  inputs: \"body('HTTP_GetTokenFromStore')?['token']?['access_token']\"\
    \n  outputs: \"\"   \u2190 empty string, the path resolved to null\n  \u2190 THIS\
    \ tells you the response shape changed \u2014 token is at body.access_token, not\
    \ body.token.access_token\n```\n\n---\n\n## Step 5 \u2014 Read the Flow Definition\n\
    \n```python\ndefn = mcp(\"get_live_flow\", environmentName=ENV, flowName=FLOW_ID)\n\
    actions = defn[\"properties\"][\"definition\"][\"actions\"]\nprint(list(actions.keys()))\n\
    ```\n\nFind the failing action in the definition. Inspect its `inputs` expression\n\
    to understand what data it expects.\n\n---\n\n## Step 6 \u2014 Walk Back from\
    \ the Failure\n\nWhen the failing action's inputs reference upstream actions,\
    \ inspect those\ntoo. Walk backward through the chain until you find the source\
    \ of the\nbad data:\n\n```python\n# Inspect multiple actions leading up to the\
    \ failure\nfor action_name in [root_action, \"Compose_WeekEnd\", \"HTTP_Get_Data\"\
    ]:\n    result = mcp(\"get_live_flow_run_action_outputs\",\n        environmentName=ENV,\n\
    \        flowName=FLOW_ID,\n        runName=RUN_ID,\n        actionName=action_name)\n\
    \    out = result[0] if result else {}\n    print(f\"\\n--- {action_name} ({out.get('status')})\
    \ ---\")\n    print(f\"Inputs:  {json.dumps(out.get('inputs', ''), indent=2)[:300]}\"\
    )\n    print(f\"Outputs: {json.dumps(out.get('outputs', ''), indent=2)[:300]}\"\
    )\n```\n\n> \u26A0\uFE0F Output payloads from array-processing actions can be\
    \ very large.\n> Always slice (e.g. `[:500]`) before printing.\n\n> **Tip**: Omit\
    \ `actionName` to list top-level actions when you're not sure\n> which action\
    \ produced the bad data. Once you pick an action inside a foreach,\n> pass `iterationIndex`\
    \ to avoid pulling every repetition into context.\n\n---\n\n## Step 7 \u2014 Pinpoint\
    \ the Root Cause\n\n### Expression Errors (e.g. `split` on null)\nIf the error\
    \ mentions `InvalidTemplate` or a function name:\n1. Find the action in the definition\n\
    2. Check what upstream action/expression it reads\n3. **Inspect that upstream\
    \ action's output** for null / missing fields\n\n```python\n# Example: action\
    \ uses split(item()?['Name'], ' ')\n# \u2192 null Name in the source data\nresult\
    \ = mcp(\"get_live_flow_run_action_outputs\", ..., actionName=\"Compose_Names\"\
    )\nif not result:\n    print(\"No outputs returned for Compose_Names\")\n    names\
    \ = []\nelse:\n    names = result[0].get(\"outputs\", {}).get(\"body\") or []\n\
    nulls = [x for x in names if x.get(\"Name\") is None]\nprint(f\"{len(nulls)} records\
    \ with null Name\")\n```\n\n### Wrong Field Path\nExpression `triggerBody()?['fieldName']`\
    \ returns null \u2192 `fieldName` is wrong.\n**Inspect the trigger output** to\
    \ see the actual field names:\n```python\nresult = mcp(\"get_live_flow_run_action_outputs\"\
    , ..., actionName=\"<trigger-action-name>\")\nprint(json.dumps(result[0].get(\"\
    outputs\"), indent=2)[:500])\n```\n\n### HTTP Actions Returning Errors\nThe error\
    \ code says `InternalServerError` or `NotSpecified` \u2014 **always inspect\n\
    the action outputs** to get the actual HTTP status and response body:\n```python\n\
    result = mcp(\"get_live_flow_run_action_outputs\", ..., actionName=\"HTTP_Get_Data\"\
    )\nout = result[0]\nprint(f\"HTTP {out['outputs']['statusCode']}\")\nprint(json.dumps(out['outputs']['body'],\
    \ indent=2)[:500])\n```\n\n### Connection / Auth Failures\nLook for `ConnectionAuthorizationFailed`\
    \ \u2014 the connection owner must match the\nservice account running the flow.\
    \ Cannot fix via API; fix in PA designer.\n\n### Outlook user-picker failures\
    \ (`DynamicListValuesUndefinedOrInvalid`)\nOutlook actions like `GetEmailsV3`\
    \ use parameters (`mailboxAddress`, `to`, `cc`,\n`from`) whose dropdown is backed\
    \ by `builtInOperation:AadGraph.GetUsers` \u2014 which\nis broken at the PA listEnum\
    \ layer and always returns\n`DynamicListValuesUndefinedOrInvalid`. This shows\
    \ up when an agent rebuilds or\nmodifies an Outlook action via `update_live_flow`\
    \ and tries to resolve a user\nthrough dynamic options. **Don't fix it by retrying\
    \ AadGraph** \u2014 switch to\n`shared_office365users.SearchUserV2` instead (returns\
    \ the same AAD user shape).\nUse `describe_live_connector` to confirm whether\
    \ the affected parameter exposes\na structured `fallback`, then call `get_live_dynamic_options`\
    \ against\n`shared_office365users.SearchUserV2` instead of the broken AadGraph\
    \ operation.\nFor dynamic field schemas rather than dropdown options, use\n`get_live_dynamic_properties`\
    \ with the metadata returned by\n`describe_live_connector`.\n\n---\n\n## Step\
    \ 8 \u2014 Apply the Fix\n\n**For expression/data issues**:\n```python\ndefn =\
    \ mcp(\"get_live_flow\", environmentName=ENV, flowName=FLOW_ID)\nacts = defn[\"\
    properties\"][\"definition\"][\"actions\"]\n\n# Example: fix split on potentially-null\
    \ Name\nacts[\"Compose_Names\"][\"inputs\"] = \\\n    \"@coalesce(item()?['Name'],\
    \ 'Unknown')\"\n\nconn_refs = defn[\"properties\"][\"connectionReferences\"]\n\
    result = mcp(\"update_live_flow\",\n    environmentName=ENV,\n    flowName=FLOW_ID,\n\
    \    definition=defn[\"properties\"][\"definition\"],\n    connectionReferences=conn_refs)\n\
    \nprint(result.get(\"error\"))  # None = success\n```\n\n> \u26A0\uFE0F `update_live_flow`\
    \ always returns an `error` key.\n> A value of `null` (Python `None`) means success.\n\
    \n---\n\n## Step 9 \u2014 Verify the Fix\n\n> **Use `resubmit_live_flow_run` to\
    \ test ANY flow \u2014 not just HTTP triggers.**\n> `resubmit_live_flow_run` replays\
    \ a previous run using its original trigger\n> payload. This works for **every\
    \ trigger type**: Recurrence, SharePoint\n> \"When an item is created\", connector\
    \ webhooks, Button triggers, and HTTP\n> triggers. You do NOT need to ask the\
    \ user to manually trigger the flow or\n> wait for the next scheduled run.\n>\n\
    > The only case where `resubmit` is not available is a **brand-new flow that\n\
    > has never run** \u2014 it has no prior run to replay.\n\n```python\n# Resubmit\
    \ the failed run \u2014 works for ANY trigger type\nresubmit = mcp(\"resubmit_live_flow_run\"\
    ,\n    environmentName=ENV, flowName=FLOW_ID, runName=RUN_ID)\nprint(resubmit)\
    \   # {\"resubmitted\": true, \"triggerName\": \"...\"}\n\n# Wait ~30 s then check\n\
    import time; time.sleep(30)\nnew_runs = mcp(\"get_live_flow_runs\", environmentName=ENV,\
    \ flowName=FLOW_ID, top=3)\nprint(new_runs[0][\"status\"])   # Succeeded = done\n\
    ```\n\n### When to use resubmit vs trigger\n\n| Scenario | Use | Why |\n|---|---|---|\n\
    | **Testing a fix** on any flow | `resubmit_live_flow_run` | Replays the exact\
    \ trigger payload that caused the failure \u2014 best way to verify |\n| Recurrence\
    \ / scheduled flow | `resubmit_live_flow_run` | Cannot be triggered on demand\
    \ any other way |\n| SharePoint / connector trigger | `resubmit_live_flow_run`\
    \ | Cannot be triggered without creating a real SP item |\n| HTTP trigger with\
    \ **custom** test payload | `trigger_live_flow` | When you need to send different\
    \ data than the original run |\n| Brand-new flow, never run | `trigger_live_flow`\
    \ (HTTP only) | No prior run exists to resubmit |\n\n### Testing HTTP-Triggered\
    \ Flows with custom payloads\n\nFor flows with a `Request` (HTTP) trigger, use\
    \ `trigger_live_flow` when you\nneed to send a **different** payload than the\
    \ original run:\n\n```python\n# First inspect what the trigger expects \u2014\
    \ read directly from the flow definition\ndefn = mcp(\"get_live_flow\", environmentName=ENV,\
    \ flowName=FLOW_ID)\ntriggers = defn[\"properties\"][\"definition\"][\"triggers\"\
    ]\nmanual = next(iter(triggers.values()))   # usually the only trigger on HTTP\
    \ flows\nrequest_schema = manual.get(\"inputs\", {}).get(\"schema\")\nprint(\"\
    Expected body schema:\", request_schema)\n\n# Response schemas live on Response\
    \ action(s) in the actions block\nfor name, act in defn[\"properties\"][\"definition\"\
    ][\"actions\"].items():\n    if act.get(\"type\") == \"Response\":\n        print(f\"\
    Response {name}:\", act.get(\"inputs\", {}).get(\"schema\"))\n\n# Trigger with\
    \ a test payload\nresult = mcp(\"trigger_live_flow\",\n    environmentName=ENV,\n\
    \    flowName=FLOW_ID,\n    body={\"name\": \"Test User\", \"value\": 42})\nprint(f\"\
    Status: {result['responseStatus']}, Body: {result.get('responseBody')}\")\n```\n\
    \n> `trigger_live_flow` handles AAD-authenticated triggers automatically.\n> Only\
    \ works for flows with a `Request` (HTTP) trigger type.\n\n---\n\n## Quick-Reference\
    \ Diagnostic Decision Tree\n\n| Symptom | First Tool | Then ALWAYS Call | What\
    \ to Look For |\n|---|---|---|---|\n| Flow shows as Failed | `get_live_flow_run_error`\
    \ | `get_live_flow_run_action_outputs` on the failing action | HTTP status + response\
    \ body in `outputs` |\n| Error code is generic (`ActionFailed`, `NotSpecified`)\
    \ | \u2014 | `get_live_flow_run_action_outputs` | The `outputs.body` contains\
    \ the real error message, stack trace, or API error |\n| HTTP action returns 500\
    \ | \u2014 | `get_live_flow_run_action_outputs` | `outputs.statusCode` + `outputs.body`\
    \ with server error detail |\n| Expression crash | \u2014 | `get_live_flow_run_action_outputs`\
    \ on prior action | null / wrong-type fields in output body |\n| Flow never starts\
    \ | `get_live_flow` | \u2014 | check `properties.state` = \"Started\" |\n| Action\
    \ returns wrong data | `get_live_flow_run_action_outputs` | \u2014 | actual output\
    \ body vs expected |\n| Fix applied but still fails | `get_live_flow_runs` after\
    \ resubmit | \u2014 | new run `status` field |\n\n> **Rule: never diagnose from\
    \ error codes alone.** `get_live_flow_run_error`\n> identifies the failing action.\
    \ `get_live_flow_run_action_outputs` reveals\n> the actual cause. Always call\
    \ both.\n\n---\n\n## Reference Files\n\n- [common-errors.md](references/common-errors.md)\
    \ \u2014 Error codes, likely causes, and fixes\n- [debug-workflow.md](references/debug-workflow.md)\
    \ \u2014 Full decision tree for complex failures\n\n## Related Skills\n\n- `flowstudio-power-automate-mcp`\
    \ \u2014 Foundation skill: connection setup, MCP helper, tool discovery\n- `flowstudio-power-automate-build`\
    \ \u2014 Build and deploy new flows"
