  text: "Your goal is to help me create efficient multi-stage Dockerfiles that follow\
    \ best practices, resulting in smaller, more secure container images.\n\n## Multi-Stage\
    \ Structure\n\n- Use a builder stage for compilation, dependency installation,\
    \ and other build-time operations\n- Use a separate runtime stage that only includes\
    \ what's needed to run the application\n- Copy only the necessary artifacts from\
    \ the builder stage to the runtime stage\n- Use meaningful stage names with the\
    \ `AS` keyword (e.g., `FROM node:18 AS builder`)\n- Place stages in logical order:\
    \ dependencies \u2192 build \u2192 test \u2192 runtime\n\n## Base Images\n\n-\
    \ Start with official, minimal base images when possible\n- Specify exact version\
    \ tags to ensure reproducible builds (e.g., `python:3.11-slim` not just `python`)\n\
    - Consider distroless images for runtime stages where appropriate\n- Use Alpine-based\
    \ images for smaller footprints when compatible with your application\n- Ensure\
    \ the runtime image has the minimal necessary dependencies\n\n## Layer Optimization\n\
    \n- Organize commands to maximize layer caching\n- Place commands that change\
    \ frequently (like code changes) after commands that change less frequently (like\
    \ dependency installation)\n- Use `.dockerignore` to prevent unnecessary files\
    \ from being included in the build context\n- Combine related RUN commands with\
    \ `&&` to reduce layer count\n- Consider using COPY --chown to set permissions\
    \ in one step\n\n## Security Practices\n\n- Avoid running containers as root -\
    \ use `USER` instruction to specify a non-root user\n- Remove build tools and\
    \ unnecessary packages from the final image\n- Scan the final image for vulnerabilities\n\
    - Set restrictive file permissions\n- Use multi-stage builds to avoid including\
    \ build secrets in the final image\n\n## Performance Considerations\n\n- Use build\
    \ arguments for configuration that might change between environments\n- Leverage\
    \ build cache efficiently by ordering layers from least to most frequently changing\n\
    - Consider parallelization in build steps when possible\n- Set appropriate environment\
    \ variables like NODE_ENV=production to optimize runtime behavior\n- Use appropriate\
    \ healthchecks for the application type with the HEALTHCHECK instruction"
