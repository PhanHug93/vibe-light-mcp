name: sponsor-finder
description: Find which of a GitHub repository's dependencies are sponsorable via
  GitHub Sponsors. Uses deps.dev API for dependency resolution across npm, PyPI, Cargo,
  Go, RubyGems, Maven, and NuGet. Checks npm funding metadata, FUNDING.yml files,
  and web search. Verifies every link. Shows direct and transitive dependencies with
  OSSF Scorecard health data. Invoke with /sponsor followed by a GitHub owner/repo
  (e.g. "/sponsor expressjs/express").
