  text: "# Suggest Awesome GitHub Copilot Instructions\n\nAnalyze current repository\
    \ context and suggest relevant copilot-instruction files from the [GitHub awesome-copilot\
    \ repository](https://github.com/github/awesome-copilot/blob/main/docs/README.instructions.md)\
    \ that are not already available in this repository.\n\n## Process\n\n1. **Fetch\
    \ Available Instructions**: Extract instruction list and descriptions from [awesome-copilot\
    \ README.instructions.md](https://github.com/github/awesome-copilot/blob/main/docs/README.instructions.md).\
    \ Must use `#fetch` tool.\n2. **Scan Local Instructions**: Discover existing instruction\
    \ files in `.github/instructions/` folder\n3. **Extract Descriptions**: Read front\
    \ matter from local instruction files to get descriptions and `applyTo` patterns\n\
    4. **Fetch Remote Versions**: For each local instruction, fetch the corresponding\
    \ version from awesome-copilot repository using raw GitHub URLs (e.g., `https://raw.githubusercontent.com/github/awesome-copilot/main/instructions/<filename>`)\n\
    5. **Compare Versions**: Compare local instruction content with remote versions\
    \ to identify:\n   - Instructions that are up-to-date (exact match)\n   - Instructions\
    \ that are outdated (content differs)\n   - Key differences in outdated instructions\
    \ (description, applyTo patterns, content)\n6. **Analyze Context**: Review chat\
    \ history, repository files, and current project needs\n7. **Compare Existing**:\
    \ Check against instructions already available in this repository\n8. **Match\
    \ Relevance**: Compare available instructions against identified patterns and\
    \ requirements\n9. **Present Options**: Display relevant instructions with descriptions,\
    \ rationale, and availability status including outdated instructions\n10. **Validate**:\
    \ Ensure suggested instructions would add value not already covered by existing\
    \ instructions\n11. **Output**: Provide structured table with suggestions, descriptions,\
    \ and links to both awesome-copilot instructions and similar local instructions\n\
    \   **AWAIT** user request to proceed with installation or updates of specific\
    \ instructions. DO NOT INSTALL OR UPDATE UNLESS DIRECTED TO DO SO.\n12. **Download/Update\
    \ Assets**: For requested instructions, automatically:\n    - Download new instructions\
    \ to `.github/instructions/` folder\n    - Update outdated instructions by replacing\
    \ with latest version from awesome-copilot\n    - Do NOT adjust content of the\
    \ files\n    - Use `#fetch` tool to download assets, but may use `curl` using\
    \ `#runInTerminal` tool to ensure all content is retrieved\n    - Use `#todos`\
    \ tool to track progress\n\n## Context Analysis Criteria\n\n\U0001F50D **Repository\
    \ Patterns**:\n- Programming languages used (.cs, .js, .py, .ts, etc.)\n- Framework\
    \ indicators (ASP.NET, React, Azure, Next.js, etc.)\n- Project types (web apps,\
    \ APIs, libraries, tools)\n- Development workflow requirements (testing, CI/CD,\
    \ deployment)\n\n\U0001F5E8\uFE0F **Chat History Context**:\n- Recent discussions\
    \ and pain points\n- Technology-specific questions\n- Coding standards discussions\n\
    - Development workflow requirements\n\n## Output Format\n\nDisplay analysis results\
    \ in structured table comparing awesome-copilot instructions with existing repository\
    \ instructions:\n\n| Awesome-Copilot Instruction | Description | Already Installed\
    \ | Similar Local Instruction | Suggestion Rationale |\n|------------------------------|-------------|-------------------|---------------------------|---------------------|\n\
    | [blazor.instructions.md](https://github.com/github/awesome-copilot/blob/main/instructions/blazor.instructions.md)\
    \ | Blazor development guidelines | \u2705 Yes | blazor.instructions.md | Already\
    \ covered by existing Blazor instructions |\n| [reactjs.instructions.md](https://github.com/github/awesome-copilot/blob/main/instructions/reactjs.instructions.md)\
    \ | ReactJS development standards | \u274C No | None | Would enhance React development\
    \ with established patterns |\n| [java.instructions.md](https://github.com/github/awesome-copilot/blob/main/instructions/java.instructions.md)\
    \ | Java development best practices | \u26A0\uFE0F Outdated | java.instructions.md\
    \ | applyTo pattern differs: remote uses `'**/*.java'` vs local `'*.java'` - Update\
    \ recommended |\n\n## Local Instructions Discovery Process\n\n1. List all `*.instructions.md`\
    \ files in the `instructions/` directory\n2. For each discovered file, read front\
    \ matter to extract `description` and `applyTo` patterns\n3. Build comprehensive\
    \ inventory of existing instructions with their applicable file patterns\n4. Use\
    \ this inventory to avoid suggesting duplicates\n\n## Version Comparison Process\n\
    \n1. For each local instruction file, construct the raw GitHub URL to fetch the\
    \ remote version:\n   - Pattern: `https://raw.githubusercontent.com/github/awesome-copilot/main/instructions/<filename>`\n\
    2. Fetch the remote version using the `#fetch` tool\n3. Compare entire file content\
    \ (including front matter and body)\n4. Identify specific differences:\n   - **Front\
    \ matter changes** (description, applyTo patterns)\n   - **Content updates** (guidelines,\
    \ examples, best practices)\n5. Document key differences for outdated instructions\n\
    6. Calculate similarity to determine if update is needed\n\n## File Structure\
    \ Requirements\n\nBased on GitHub documentation, copilot-instructions files should\
    \ be:\n- **Repository-wide instructions**: `.github/copilot-instructions.md` (applies\
    \ to entire repository)\n- **Path-specific instructions**: `.github/instructions/NAME.instructions.md`\
    \ (applies to specific file patterns via `applyTo` frontmatter)\n- **Community\
    \ instructions**: `instructions/NAME.instructions.md` (for sharing and distribution)\n\
    \n## Front Matter Structure\n\nInstructions files in awesome-copilot use this\
    \ front matter format:\n```markdown\n---\ndescription: 'Brief description of what\
    \ this instruction provides'\napplyTo: '**/*.js,**/*.ts' # Optional: glob patterns\
    \ for file matching\n---\n```\n\n## Requirements\n\n- Use `githubRepo` tool to\
    \ get content from awesome-copilot repository instructions folder\n- Scan local\
    \ file system for existing instructions in `.github/instructions/` directory\n\
    - Read YAML front matter from local instruction files to extract descriptions\
    \ and `applyTo` patterns\n- Compare local instructions with remote versions to\
    \ detect outdated instructions\n- Compare against existing instructions in this\
    \ repository to avoid duplicates\n- Focus on gaps in current instruction library\
    \ coverage\n- Validate that suggested instructions align with repository's purpose\
    \ and standards\n- Provide clear rationale for each suggestion\n- Include links\
    \ to both awesome-copilot instructions and similar local instructions\n- Clearly\
    \ identify outdated instructions with specific differences noted\n- Consider technology\
    \ stack compatibility and project-specific needs\n- Don't provide any additional\
    \ information or context beyond the table and the analysis\n\n## Icons Reference\n\
    \n- \u2705 Already installed and up-to-date\n- \u26A0\uFE0F Installed but outdated\
    \ (update available)\n- \u274C Not installed in repo\n\n## Update Handling\n\n\
    When outdated instructions are identified:\n1. Include them in the output table\
    \ with \u26A0\uFE0F status\n2. Document specific differences in the \"Suggestion\
    \ Rationale\" column\n3. Provide recommendation to update with key changes noted\n\
    4. When user requests update, replace entire local file with remote version\n\
    5. Preserve file location in `.github/instructions/` directory"
