  text: "# Eval-Driven Development for Python LLM Applications\n\nYou're building\
    \ an **automated evaluation pipeline** that tests a Python-based AI application\
    \ end-to-end \u2014 running it the same way a real user would, with real inputs\
    \ \u2014 then scoring the outputs using evaluators and producing pass/fail results\
    \ via `pixie test`.\n\n**What you're testing is the app itself** \u2014 its request\
    \ handling, context assembly (how it gathers data, builds prompts, manages conversation\
    \ state), routing, and response formatting. The app uses an LLM, which makes outputs\
    \ non-deterministic \u2014 that's why you use evaluators (LLM-as-judge, similarity\
    \ scores) instead of `assertEqual` \u2014 but the thing under test is the app's\
    \ code, not the LLM.\n\nDuring evaluation, the app's own code runs for real \u2014\
    \ routing, prompt assembly, LLM calls, response formatting \u2014 nothing is mocked\
    \ or stubbed. But the data the app reads from external sources (databases, caches,\
    \ third-party APIs, voice streams) is replaced with test-specified values via\
    \ instrumentations. This means each test case controls exactly what data the app\
    \ sees, while still exercising the full application code path.\n\n**Rule: The\
    \ app's LLM calls must go to a real LLM.** Do not replace, mock, stub, or intercept\
    \ the LLM with a fake implementation. The LLM is the core value-generating component\
    \ \u2014 replacing it makes the eval tautological (you control both inputs and\
    \ outputs, so scores are meaningless). If the project's test suite contains LLM\
    \ mocking patterns, those are for the project's own unit tests \u2014 do NOT adopt\
    \ them for the eval Runnable.\n\n**The deliverable is a working `pixie test` run\
    \ with real scores** \u2014 not a plan, not just instrumentation, not just a dataset.\n\
    \nThis skill is about doing the work, not describing it. Read code, edit files,\
    \ run commands, produce a working pipeline.\n\n---\n\n## Before you start\n\n\
    **First, activate the virtual environment**. Identify the correct virtual environment\
    \ for the project and activate it. After the virtual environment is active, run\
    \ the setup.sh included in the skill's resources.\nThe script updates the `eval-driven-dev`\
    \ skill and `pixie-qa` python package to latest version, initialize the pixie\
    \ working directory if it's not already initialized, and start a web server in\
    \ the background to show user updates.\n\n**Setup error handling \u2014 what you\
    \ can skip vs. what must succeed:**\n\n- **Skill update fails** \u2192 OK to continue.\
    \ The existing skill version is sufficient.\n- **pixie-qa upgrade fails but was\
    \ already installed** \u2192 OK to continue with the existing version.\n- **pixie-qa\
    \ is NOT installed and installation fails** \u2192 **STOP.** Ask the user for\
    \ help. The workflow cannot proceed without the `pixie` package.\n- **`pixie init`\
    \ fails** \u2192 **STOP.** Ask the user for help.\n- **`pixie start` (web server)\
    \ fails** \u2192 **STOP.** Ask the user for help. Check `server.log` in the pixie\
    \ root directory for diagnostics. Common causes: port conflict, missing dependency,\
    \ slow environment. Do NOT proceed without the web server \u2014 the user needs\
    \ it to see eval results.\n\n---\n\n## The workflow\n\nFollow Steps 1\u20136 straight\
    \ through without stopping. Do not ask the user for confirmation at intermediate\
    \ steps \u2014 verify each step yourself and continue.\n\n**How to work \u2014\
    \ read this before doing anything else:**\n\n- **One step at a time.** Read only\
    \ the current step's instructions. Do NOT read Steps 2\u20136 while working on\
    \ Step 1.\n- **Read references only when a step tells you to.** Each step names\
    \ a specific reference file. Read it when you reach that step \u2014 not before.\n\
    - **Create artifacts immediately.** After reading code for a sub-step, write the\
    \ output file for that sub-step before moving on. Don't accumulate understanding\
    \ across multiple sub-steps before writing anything.\n- **Verify, then move on.**\
    \ Each step has a checkpoint. Verify it, then proceed to the next step. Don't\
    \ plan future steps while verifying the current one.\n\n**When to stop and ask\
    \ for help:**\n\nSome blockers cannot and should not be worked around. When you\
    \ encounter any of the following, **stop immediately and ask the user for help**\
    \ \u2014 do not attempt workarounds:\n\n- **Application won't run due to missing\
    \ environment variables or configuration**: The app requires environment variables\
    \ or configuration that are not set and cannot be inferred. Do NOT work around\
    \ this by mocking, faking, or replacing application components \u2014 the eval\
    \ must exercise real production code. Ask the user to fix the environment setup.\n\
    - **App import failures that indicate a broken project**: If the app's core modules\
    \ cannot be imported due to missing system dependencies or incompatible Python\
    \ versions (not just missing pip packages you can install), ask the user to fix\
    \ the project setup.\n- **Ambiguous entry point**: If the app has multiple equally\
    \ plausible entry points and the project analysis doesn't clarify which one matters\
    \ most, ask the user which to target.\n\nBlockers you SHOULD resolve yourself\
    \ (do not ask): missing Python packages (install them), missing `pixie` package\
    \ (install it), port conflicts (pick a different port), file permission issues\
    \ (fix them).\n\n**Run Steps 1\u20136 in sequence.** If the user's prompt makes\
    \ it clear that earlier steps are already done (e.g., \"run the existing tests\"\
    , \"re-run evals\"), skip to the appropriate step. When in doubt, start from Step\
    \ 1.\n\n---\n\n### Step 1: Understand the app and define eval criteria\n\n**First,\
    \ check the user's prompt for specific requirements.** Before reading app code,\
    \ examine what the user asked for:\n\n- **Referenced documents or specs**: Does\
    \ the prompt mention a file to follow (e.g., \"follow the spec in EVAL_SPEC.md\"\
    , \"use the methodology in REQUIREMENTS.md\")? If so, **read that file first**\
    \ \u2014 it may specify datasets, evaluation dimensions, pass criteria, or methodology\
    \ that override your defaults.\n- **Specified datasets or data sources**: Does\
    \ the prompt reference specific data files (e.g., \"use questions from eval_inputs/research_questions.json\"\
    , \"use the scenarios in call_scenarios.json\")? If so, **read those files** \u2014\
    \ you must use them as the basis for your eval dataset, not fabricate generic\
    \ alternatives.\n- **Specified evaluation dimensions**: Does the prompt name specific\
    \ quality aspects to evaluate (e.g., \"evaluate on factuality, completeness, and\
    \ bias\", \"test identity verification and tool call correctness\")? If so, **every\
    \ named dimension must have a corresponding evaluator** in your test file.\n\n\
    If the prompt specifies any of the above, they take priority. Read and incorporate\
    \ them before proceeding.\n\nStep 1 has three sub-steps. Each reads its own reference\
    \ file and produces its own output file. **Complete each sub-step fully before\
    \ starting the next.**\n\n#### Sub-step 1a: Project analysis\n\n> **Reference**:\
    \ Read `references/1-a-project-analysis.md` now.\n\nBefore looking at code structure\
    \ or entry points, understand what this software does in the real world \u2014\
    \ its purpose, its users, the complexity of real inputs, and where it fails. This\
    \ understanding drives every downstream decision: which entry points matter most,\
    \ what eval criteria to define, what trace inputs to use, and what dataset entries\
    \ to create. Write the detailed context file before moving on. **Note**: the project\
    \ may contain `tests/`, `fixtures/`, `examples/`, mock servers, and documentation\
    \ \u2014 these are the project's own development infrastructure, NOT data sources\
    \ for your eval pipeline. Ignore them when sourcing trace inputs and dataset content.\n\
    \n> **Checkpoint**: `pixie_qa/00-project-analysis.md` written \u2014 covering\
    \ what the software does, target users, capability inventory (at least 3 capabilities\
    \ if the project has them), realistic input characteristics, and hard problems\
    \ / failure modes (at least 2).\n\n#### Sub-step 1b: Entry point & execution flow\n\
    \n> **Reference**: Read `references/1-b-entry-point.md` now.\n\nRead the source\
    \ code to understand how the app starts and how a real user invokes it. Use the\
    \ **capability inventory** from `pixie_qa/00-project-analysis.md` to prioritize\
    \ entry points \u2014 focus on the entry point(s) that exercise the most valuable\
    \ capabilities, not just the first one found. Write the detailed context file\
    \ before moving on.\n\n> **Checkpoint**: `pixie_qa/01-entry-point.md` written\
    \ \u2014 covering entry point, execution flow, user-facing interface, and env\
    \ requirements.\n\n#### Sub-step 1c: Eval criteria\n\n> **Reference**: Read `references/1-c-eval-criteria.md`\
    \ now.\n\nDefine the app's use cases and eval criteria. Derive use cases from\
    \ the **capability inventory** in `pixie_qa/00-project-analysis.md`. Derive eval\
    \ criteria from the **hard problems / failure modes** \u2014 not generic quality\
    \ dimensions. Use cases drive dataset creation (Step 4); eval criteria drive evaluator\
    \ selection (Step 3). Write the detailed context file before moving on.\n\n> **Checkpoint**:\
    \ `pixie_qa/02-eval-criteria.md` written \u2014 covering use cases, eval criteria,\
    \ and their applicability scope. Do NOT read Step 2 instructions yet.\n\n---\n\
    \n### Step 2: Instrument, run application, and capture a reference trace\n\nStep\
    \ 2 has three sub-steps. Each reads its own reference file. **Complete each sub-step\
    \ before starting the next.**\n\n#### Sub-step 2a: Instrument with `wrap`\n\n\
    > **Reference**: Read `references/2a-instrumentation.md` now.\n\nAdd `wrap()`\
    \ calls at the app's data boundaries so the eval harness can inject controlled\
    \ inputs and capture outputs. This makes the app testable without changing its\
    \ logic.\n\n> **Checkpoint**: `wrap()` calls added at all data boundaries. Every\
    \ eval criterion from `pixie_qa/02-eval-criteria.md` has a corresponding data\
    \ point.\n\n#### Sub-step 2b: Implement the Runnable\n\n> **Reference**: Read\
    \ `references/2b-implement-runnable.md` now.\n\nWrite a Runnable class that lets\
    \ the eval harness invoke the app exactly as a real user would. The Runnable should\
    \ be simple \u2014 it just wires up the app's real entry point to the harness\
    \ interface. If it's getting complicated, something is wrong.\n\n> **Checkpoint**:\
    \ `pixie_qa/run_app.py` written. The Runnable calls the app's real entry point\
    \ with real LLM configuration \u2014 no mocking, no faking, no component replacement.\n\
    \n#### Sub-step 2c: Capture and verify a reference trace\n\n> **Reference**: Read\
    \ `references/2c-capture-and-verify-trace.md` now.\n\nRun the app through the\
    \ Runnable and capture a trace. The trace proves instrumentation and the Runnable\
    \ are working correctly, and provides the data shapes needed for dataset creation\
    \ in Step 4.\n\n> **Checkpoint**: `pixie_qa/reference-trace.jsonl` exists. All\
    \ expected `wrap` entries and `llm_span` entries appear. `pixie format` shows\
    \ all data points needed for evaluation. Do NOT read Step 3 instructions yet.\n\
    \n---\n\n### Step 3: Define evaluators\n\n> **Reference**: Read `references/3-define-evaluators.md`\
    \ now for the detailed sub-steps.\n\n**Goal**: Turn the qualitative eval criteria\
    \ from Step 1c into concrete, runnable scoring functions. Each criterion maps\
    \ to either a built-in evaluator, an **agent evaluator** (the default for any\
    \ semantic or qualitative criterion), or a manual custom function (only for mechanical/deterministic\
    \ checks like regex or field existence). The evaluator mapping artifact bridges\
    \ between criteria and the dataset, ensuring every quality dimension has a scorer.\
    \ Select evaluators that measure the **hard problems** identified in `pixie_qa/00-project-analysis.md`\
    \ \u2014 not just generic quality dimensions.\n\n> **Checkpoint**: All evaluators\
    \ implemented. `pixie_qa/03-evaluator-mapping.md` written with criterion-to-evaluator\
    \ mapping and decision rationale. Do NOT read Step 4 instructions yet.\n\n---\n\
    \n### Step 4: Build the dataset\n\n> **Reference**: Read `references/4-build-dataset.md`\
    \ now for the detailed sub-steps.\n\n**Goal**: Create the test scenarios that\
    \ tie everything together \u2014 the runnable (Step 2), the evaluators (Step 3),\
    \ and the use cases (Step 1c). Each dataset entry defines what to send to the\
    \ app, what data the app should see from external services, and how to score the\
    \ result. Use the reference trace from Step 2 as the source of truth for data\
    \ shapes and field names. Cover entries from the **capability inventory** in `pixie_qa/00-project-analysis.md`\
    \ and include entries targeting the **failure modes** identified there. **Do NOT\
    \ use the project's own test fixtures, mock servers, or example data as dataset\
    \ `eval_input` content** \u2014 source real-world data instead. **Every `wrap(purpose=\"\
    input\")` in the app must have pre-captured content in each entry's `eval_input`**\
    \ \u2014 do NOT leave `eval_input` empty when the app has input wraps.\n\n> **Checkpoint**:\
    \ Dataset JSON created at `pixie_qa/datasets/<name>.json` with diverse entries\
    \ covering all use cases. **Dataset realism audit passed** \u2014 entries use\
    \ real-world data at representative scale, no project test fixtures contamination,\
    \ at least one entry targets a failure mode with uncertain outcome, and every\
    \ `eval_input` has captured content for all input wraps. Do NOT read Step 5 instructions\
    \ yet.\n\n---\n\n### Step 5: Run `pixie test` and fix mechanical issues\n\n> **Reference**:\
    \ Read `references/5-run-tests.md` now for the detailed sub-steps.\n\n**Goal**:\
    \ Execute the full pipeline end-to-end and get it running without mechanical errors.\
    \ This step is strictly about fixing setup and data issues in the pixie QA components\
    \ (dataset, runnable, custom evaluators) \u2014 NOT about fixing the application\
    \ itself or evaluating result quality. Once `pixie test` completes without errors\
    \ and produces real evaluator scores for every entry, this step is done.\n\n>\
    \ **Checkpoint**: `pixie test` runs to completion. Every dataset entry has evaluator\
    \ scores (real `EvaluationResult` or `PendingEvaluation`). No setup errors, no\
    \ import failures, no data validation errors.\n>\n> If the test errors out, that's\
    \ a mechanical bug in your QA components \u2014 fix and re-run. But once tests\
    \ produce scores, move on. Do NOT assess result quality here \u2014 that's Step\
    \ 6.\n\n**Always proceed to Step 6 after tests produce scores.** Analysis is the\
    \ essential final step \u2014 without it, pending evaluations are never completed\
    \ and the user gets uninterpreted raw scores with no actionable insights. Do NOT\
    \ stop here and ask the user whether to continue.\n\n**Cycle rule for iterative\
    \ runs**: Every successful `pixie test` invocation creates a concrete `pixie_qa/results/<test_id>`\
    \ directory and starts a new analysis cycle. Before you edit application code,\
    \ prompts, datasets, evaluators, or rerun `pixie test`, complete Step 6 for that\
    \ exact results directory. Do not skip earlier cycles and analyze only the last\
    \ run.\n\n---\n\n### Step 6: Analyze outcomes\n\n> **Reference**: Read `references/6-analyze-outcomes.md`\
    \ now \u2014 it has the complete three-phase analysis process, writing guidelines,\
    \ and output format requirements.\n\n**Goal**: Analyze `pixie test` results in\
    \ a structured, data-driven process to produce actionable insights on test case\
    \ quality, evaluator quality, and application quality. This step completes pending\
    \ evaluations, writes per-entry and per-dataset analysis, and produces a prioritized\
    \ action plan. Every statement must be backed by concrete data from the evaluation\
    \ run \u2014 no speculation, no hand-waving.\n\n**Persisted analysis artifacts**:\
    \ In this trimmed workflow, persist analysis only at the dataset level and test-run\
    \ level. Those artifacts still use a **detailed version** (for agent consumption:\
    \ data points, evidence trails, reasoning chains) plus a **summary version** (for\
    \ human review: concise TLDR readable in under 2 minutes). Do not create per-entry\
    \ analysis files.\n\n**Hard completion gate**: Step 6 is **not complete** until\
    \ all of the following are true:\n\n- Every `\"status\": \"pending\"` entry in\
    \ every `pixie_qa/results/<test_id>/dataset-*/entry-*/evaluations.jsonl` has been\
    \ replaced with a scored result containing `score` and `reasoning`.\n- Every dataset\
    \ directory has `analysis.md` and `analysis-summary.md`.\n- The test run root\
    \ has `action-plan.md` and `action-plan-summary.md`.\n- You have run the Step\
    \ 6 verifier script from this skill's `resources/` directory against `pixie_qa/results/<test_id>`,\
    \ and it reports success.\n\n**Explicitly not sufficient**:\n\n- Writing a single\
    \ top-level file such as `pixie_qa/06-analysis.md`\n- Saying pending evaluations\
    \ are for the user to review in the web UI\n- Saying an entry \"likely passes\"\
    \ without updating `evaluations.jsonl`\n\n---\n\n## Web Server Management\n\n\
    pixie-qa runs a web server in the background for displaying context, traces, and\
    \ eval results to the user. It's automatically started by the setup script (via\
    \ `pixie start`, which launches a detached background process and returns immediately).\n\
    \nWhen the user is done with the eval-driven-dev workflow, inform them the web\
    \ server is still running and you can clean it up with:\n\n```bash\npixie stop\n\
    ```\n\nIMPORTANT: after the web server is stopped, the web UI becomes inaccessible.\
    \ So only stop the server if the user confirms they're done with all web UI features.\
    \ If they want to keep using the web UI, do NOT stop the server.\n\nAnd whenever\
    \ you restart the workflow, always run the setup.sh script in resources again\
    \ to ensure the web server is running:"
