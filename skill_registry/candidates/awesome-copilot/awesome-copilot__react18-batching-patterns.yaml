name: react18-batching-patterns
description: Provides exact patterns for diagnosing and fixing automatic batching
  regressions in React 18 class components. Use this skill whenever a class component
  has multiple setState calls in an async method, inside setTimeout, inside a Promise
  .then() or .catch(), or in a native event handler. Use it before writing any flushSync
  call - the decision tree here prevents unnecessary flushSync overuse. Also use this
  skill when fixing test failures caused by intermediate state assertions that break
  after React 18 upgrade.
