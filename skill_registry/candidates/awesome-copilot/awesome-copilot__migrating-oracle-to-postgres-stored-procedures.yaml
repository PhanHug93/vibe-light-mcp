  text: "# Migrating Stored Procedures from Oracle to PostgreSQL\n\nTranslate Oracle\
    \ PL/SQL stored procedures and functions to PostgreSQL PL/pgSQL equivalents.\n\
    \n## Workflow\n\n```\nProgress:\n- [ ] Step 1: Read the Oracle source procedure\n\
    - [ ] Step 2: Translate to PostgreSQL PL/pgSQL\n- [ ] Step 3: Write the migrated\
    \ procedure to Postgres output directory\n```\n\n**Step 1: Read the Oracle source\
    \ procedure**\n\nRead the Oracle stored procedure from `.github/oracle-to-postgres-migration/DDL/Oracle/Procedures\
    \ and Functions/`. Consult the Oracle table/view definitions at `.github/oracle-to-postgres-migration/DDL/Oracle/Tables\
    \ and Views/` for type resolution.\n\n**Step 2: Translate to PostgreSQL PL/pgSQL**\n\
    \nApply these translation rules:\n\n- Translate all Oracle-specific syntax to\
    \ PostgreSQL equivalents.\n- Preserve original functionality and control flow\
    \ logic.\n- Keep type-anchored input parameters (e.g., `PARAM_NAME IN table_name.column_name%TYPE`).\n\
    - Use explicit types (`NUMERIC`, `VARCHAR`, `INTEGER`) for output parameters passed\
    \ to other procedures \u2014 do not type-anchor these.\n- Do not alter method\
    \ signatures.\n- Do not prefix object names with schema names unless already present\
    \ in the Oracle source.\n- Leave exception handling and rollback logic unchanged.\n\
    - Do not generate `COMMENT` or `GRANT` statements.\n- Use `COLLATE \"C\"` when\
    \ ordering by text fields for Oracle-compatible sorting.\n- Leverage the `orafce`\
    \ extension when it improves clarity or fidelity.\n\nConsult the PostgreSQL table/view\
    \ definitions at `.github/oracle-to-postgres-migration/DDL/Postgres/Tables and\
    \ Views/` for target schema details.\n\n**Step 3: Write the migrated procedure\
    \ to Postgres output directory**\n\nPlace each migrated procedure in its own file\
    \ under `.github/oracle-to-postgres-migration/DDL/Postgres/Procedures and Functions/{PACKAGE_NAME_IF_APPLICABLE}/`.\
    \ One procedure per file."
