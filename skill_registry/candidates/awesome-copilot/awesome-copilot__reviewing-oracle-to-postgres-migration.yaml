  text: "# Oracle-to-PostgreSQL Database Migration\n\nSurfaces migration risks and\
    \ validates migration work against known Oracle/PostgreSQL behavioral differences\
    \ documented in the `references/` folder.\n\n## When to use\n\n1. **Planning**\
    \ \u2014 Before starting migration work on a procedure, trigger, query, or refcursor\
    \ client. Identify which reference insights apply so risks are addressed up front.\n\
    2. **Validating** \u2014 After migration work is done, confirm every applicable\
    \ insight was addressed and integration tests cover the new PostgreSQL semantics.\n\
    \n## Workflow\n\nDetermine the task type:\n\n**Planning a migration?** Follow\
    \ the risk assessment workflow.\n**Validating completed work?** Follow the validation\
    \ workflow.\n\n### Risk assessment workflow (planning)\n\n```\nRisk Assessment:\n\
    - [ ] Step 1: Identify the migration scope\n- [ ] Step 2: Screen each insight\
    \ for applicability\n- [ ] Step 3: Document risks and recommended actions\n```\n\
    \n**Step 1: Identify the migration scope**\n\nList the affected database objects\
    \ (procedures, triggers, queries, views) and the application code that calls them.\n\
    \n**Step 2: Screen each insight for applicability**\n\nReview the reference index\
    \ in [references/REFERENCE.md](references/REFERENCE.md). For each entry, determine\
    \ whether the migration scope contains patterns affected by that insight. Read\
    \ the full reference file only when the insight is potentially relevant.\n\n**Step\
    \ 3: Document risks and recommended actions**\n\nFor each applicable insight,\
    \ note the specific risk and the recommended fix pattern from the reference file.\
    \ Flag any insight that requires a design decision (e.g., whether to preserve\
    \ Oracle empty-string-as-NULL semantics or adopt PostgreSQL behavior).\n\n###\
    \ Validation workflow (post-migration)\n\n```\nValidation:\n- [ ] Step 1: Map\
    \ the migration artifact\n- [ ] Step 2: Cross-check applicable insights\n- [ ]\
    \ Step 3: Verify integration test coverage\n- [ ] Step 4: Gate the result\n```\n\
    \n**Step 1: Map the migration artifact**\n\nIdentify the migrated object and summarize\
    \ the change set.\n\n**Step 2: Cross-check applicable insights**\n\nFor each reference\
    \ in [references/REFERENCE.md](references/REFERENCE.md), confirm the behavior\
    \ or test requirement is acknowledged and addressed in the migration work.\n\n\
    **Step 3: Verify integration test coverage**\n\nConfirm tests exercise both the\
    \ happy path and the failure scenarios highlighted in applicable insights (exceptions,\
    \ sorting, refcursor consumption, concurrent transactions, timestamps, etc.).\n\
    \n**Step 4: Gate the result**\n\nReturn a checklist asserting each applicable\
    \ insight was addressed, migration scripts run, and integration tests pass."
