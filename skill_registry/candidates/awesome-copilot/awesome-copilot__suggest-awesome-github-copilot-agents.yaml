  text: "# Suggest Awesome GitHub Copilot Custom Agents\n\nAnalyze current repository\
    \ context and suggest relevant Custom Agents files from the [GitHub awesome-copilot\
    \ repository](https://github.com/github/awesome-copilot/blob/main/docs/README.agents.md)\
    \ that are not already available in this repository. Custom Agent files are located\
    \ in the [agents](https://github.com/github/awesome-copilot/tree/main/agents)\
    \ folder of the awesome-copilot repository.\n\n## Process\n\n1. **Fetch Available\
    \ Custom Agents**: Extract Custom Agents list and descriptions from [awesome-copilot\
    \ README.agents.md](https://github.com/github/awesome-copilot/blob/main/docs/README.agents.md).\
    \ Must use `fetch` tool.\n2. **Scan Local Custom Agents**: Discover existing custom\
    \ agent files in `.github/agents/` folder\n3. **Extract Descriptions**: Read front\
    \ matter from local custom agent files to get descriptions\n4. **Fetch Remote\
    \ Versions**: For each local agent, fetch the corresponding version from awesome-copilot\
    \ repository using raw GitHub URLs (e.g., `https://raw.githubusercontent.com/github/awesome-copilot/main/agents/<filename>`)\n\
    5. **Compare Versions**: Compare local agent content with remote versions to identify:\n\
    \   - Agents that are up-to-date (exact match)\n   - Agents that are outdated\
    \ (content differs)\n   - Key differences in outdated agents (tools, description,\
    \ content)\n6. **Analyze Context**: Review chat history, repository files, and\
    \ current project needs\n7. **Match Relevance**: Compare available custom agents\
    \ against identified patterns and requirements\n8. **Present Options**: Display\
    \ relevant custom agents with descriptions, rationale, and availability status\
    \ including outdated agents\n9. **Validate**: Ensure suggested agents would add\
    \ value not already covered by existing agents\n10. **Output**: Provide structured\
    \ table with suggestions, descriptions, and links to both awesome-copilot custom\
    \ agents and similar local custom agents\n    **AWAIT** user request to proceed\
    \ with installation or updates of specific custom agents. DO NOT INSTALL OR UPDATE\
    \ UNLESS DIRECTED TO DO SO.\n11. **Download/Update Assets**: For requested agents,\
    \ automatically:\n    - Download new agents to `.github/agents/` folder\n    -\
    \ Update outdated agents by replacing with latest version from awesome-copilot\n\
    \    - Do NOT adjust content of the files\n    - Use `#fetch` tool to download\
    \ assets, but may use `curl` using `#runInTerminal` tool to ensure all content\
    \ is retrieved\n    - Use `#todos` tool to track progress\n\n## Context Analysis\
    \ Criteria\n\n\U0001F50D **Repository Patterns**:\n\n- Programming languages used\
    \ (.cs, .js, .py, etc.)\n- Framework indicators (ASP.NET, React, Azure, etc.)\n\
    - Project types (web apps, APIs, libraries, tools)\n- Documentation needs (README,\
    \ specs, ADRs)\n\n\U0001F5E8\uFE0F **Chat History Context**:\n\n- Recent discussions\
    \ and pain points\n- Feature requests or implementation needs\n- Code review patterns\n\
    - Development workflow requirements\n\n## Output Format\n\nDisplay analysis results\
    \ in structured table comparing awesome-copilot custom agents with existing repository\
    \ custom agents:\n\n| Awesome-Copilot Custom Agent                           \
    \                                                                            \
    \                     | Description                                          \
    \                                                                            \
    \                                          | Already Installed | Similar Local\
    \ Custom Agent         | Suggestion Rationale                                \
    \          |\n| -------------------------------------------------------------------------------------------------------------------------------------------------------\
    \ | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------\
    \ | ----------------- | ---------------------------------- | -------------------------------------------------------------\
    \ |\n| [amplitude-experiment-implementation.agent.md](https://github.com/github/awesome-copilot/blob/main/agents/amplitude-experiment-implementation.agent.md)\
    \ | This custom agent uses Amplitude's\_MCP tools to deploy new experiments inside\
    \ of Amplitude, enabling seamless variant testing capabilities and rollout of\
    \ product features | \u274C No             | None                            \
    \   | Would enhance experimentation capabilities within the product |\n| [launchdarkly-flag-cleanup.agent.md](https://github.com/github/awesome-copilot/blob/main/agents/launchdarkly-flag-cleanup.agent.md)\
    \                     | Feature flag cleanup agent for LaunchDarkly          \
    \                                                                            \
    \                                          | \u2705 Yes            | launchdarkly-flag-cleanup.agent.md\
    \ | Already covered by existing LaunchDarkly custom agents        |\n| [principal-software-engineer.agent.md](https://github.com/github/awesome-copilot/blob/main/agents/principal-software-engineer.agent.md)\
    \                 | Provide principal-level software engineering guidance with\
    \ focus on engineering excellence, technical leadership, and pragmatic implementation.\
    \                            | \u26A0\uFE0F Outdated       | principal-software-engineer.agent.md\
    \ | Tools configuration differs: remote uses `'web/fetch'` vs local `'fetch'`\
    \ - Update recommended |\n\n## Local Agent Discovery Process\n\n1. List all `*.agent.md`\
    \ files in `.github/agents/` directory\n2. For each discovered file, read front\
    \ matter to extract `description`\n3. Build comprehensive inventory of existing\
    \ agents\n4. Use this inventory to avoid suggesting duplicates\n\n## Version Comparison\
    \ Process\n\n1. For each local agent file, construct the raw GitHub URL to fetch\
    \ the remote version:\n   - Pattern: `https://raw.githubusercontent.com/github/awesome-copilot/main/agents/<filename>`\n\
    2. Fetch the remote version using the `fetch` tool\n3. Compare entire file content\
    \ (including front matter, tools array, and body)\n4. Identify specific differences:\n\
    \   - **Front matter changes** (description, tools)\n   - **Tools array modifications**\
    \ (added, removed, or renamed tools)\n   - **Content updates** (instructions,\
    \ examples, guidelines)\n5. Document key differences for outdated agents\n6. Calculate\
    \ similarity to determine if update is needed\n\n## Requirements\n\n- Use `githubRepo`\
    \ tool to get content from awesome-copilot repository agents folder\n- Scan local\
    \ file system for existing agents in `.github/agents/` directory\n- Read YAML\
    \ front matter from local agent files to extract descriptions\n- Compare local\
    \ agents with remote versions to detect outdated agents\n- Compare against existing\
    \ agents in this repository to avoid duplicates\n- Focus on gaps in current agent\
    \ library coverage\n- Validate that suggested agents align with repository's purpose\
    \ and standards\n- Provide clear rationale for each suggestion\n- Include links\
    \ to both awesome-copilot agents and similar local agents\n- Clearly identify\
    \ outdated agents with specific differences noted\n- Don't provide any additional\
    \ information or context beyond the table and the analysis\n\n## Icons Reference\n\
    \n- \u2705 Already installed and up-to-date\n- \u26A0\uFE0F Installed but outdated\
    \ (update available)\n- \u274C Not installed in repo\n\n## Update Handling\n\n\
    When outdated agents are identified:\n1. Include them in the output table with\
    \ \u26A0\uFE0F status\n2. Document specific differences in the \"Suggestion Rationale\"\
    \ column\n3. Provide recommendation to update with key changes noted\n4. When\
    \ user requests update, replace entire local file with remote version\n5. Preserve\
    \ file location in `.github/agents/` directory"
