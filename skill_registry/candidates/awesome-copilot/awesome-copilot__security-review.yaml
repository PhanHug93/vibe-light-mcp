  text: "# Security Review\n\nAn AI-powered security scanner that reasons about your\
    \ codebase the way a human security\nresearcher would \u2014 tracing data flows,\
    \ understanding component interactions, and catching\nvulnerabilities that pattern-matching\
    \ tools miss.\n\n## When to Use This Skill\n\nUse this skill when the request\
    \ involves:\n\n- Scanning a codebase or file for security vulnerabilities\n- Running\
    \ a security review or vulnerability check\n- Checking for SQL injection, XSS,\
    \ command injection, or other injection flaws\n- Finding exposed API keys, hardcoded\
    \ secrets, or credentials in code\n- Auditing dependencies for known CVEs\n- Reviewing\
    \ authentication, authorization, or access control logic\n- Detecting insecure\
    \ cryptography or weak randomness\n- Performing a data flow analysis to trace\
    \ user input to dangerous sinks\n- Any request phrasing like \"is my code secure?\"\
    , \"scan this file\", or \"check my repo for vulnerabilities\"\n- Running `/security-review`\
    \ or `/security-review <path>`\n\n## How This Skill Works\n\nUnlike traditional\
    \ static analysis tools that match patterns, this skill:\n1. **Reads code like\
    \ a security researcher** \u2014 understanding context, intent, and data flow\n\
    2. **Traces across files** \u2014 following how user input moves through your\
    \ application\n3. **Self-verifies findings** \u2014 re-examines each result to\
    \ filter false positives\n4. **Assigns severity ratings** \u2014 CRITICAL / HIGH\
    \ / MEDIUM / LOW / INFO\n5. **Proposes targeted patches** \u2014 every finding\
    \ includes a concrete fix\n6. **Requires human approval** \u2014 nothing is auto-applied;\
    \ you always review first\n\n## Execution Workflow\n\nFollow these steps **in\
    \ order** every time:\n\n### Step 1 \u2014 Scope Resolution\nDetermine what to\
    \ scan:\n- If a path was provided (`/security-review src/auth/`), scan only that\
    \ scope\n- If no path given, scan the **entire project** starting from the root\n\
    - Identify the language(s) and framework(s) in use (check package.json, requirements.txt,\n\
    \  go.mod, Cargo.toml, pom.xml, Gemfile, composer.json, etc.)\n- Read `references/language-patterns.md`\
    \ to load language-specific vulnerability patterns\n\n### Step 2 \u2014 Dependency\
    \ Audit\nBefore scanning source code, audit dependencies first (fast wins):\n\
    - **Node.js**: Check `package.json` + `package-lock.json` for known vulnerable\
    \ packages\n- **Python**: Check `requirements.txt` / `pyproject.toml` / `Pipfile`\n\
    - **Java**: Check `pom.xml` / `build.gradle`\n- **Ruby**: Check `Gemfile.lock`\n\
    - **Rust**: Check `Cargo.toml`\n- **Go**: Check `go.sum`\n- Flag packages with\
    \ known CVEs, deprecated crypto libs, or suspiciously old pinned versions\n- Read\
    \ `references/vulnerable-packages.md` for a curated watchlist\n\n### Step 3 \u2014\
    \ Secrets & Exposure Scan\nScan ALL files (including config, env, CI/CD, Dockerfiles,\
    \ IaC) for:\n- Hardcoded API keys, tokens, passwords, private keys\n- `.env` files\
    \ accidentally committed\n- Secrets in comments or debug logs\n- Cloud credentials\
    \ (AWS, GCP, Azure, Stripe, Twilio, etc.)\n- Database connection strings with\
    \ credentials embedded\n- Read `references/secret-patterns.md` for regex patterns\
    \ and entropy heuristics to apply\n\n### Step 4 \u2014 Vulnerability Deep Scan\n\
    This is the core scan. Reason about the code \u2014 don't just pattern-match.\n\
    Read `references/vuln-categories.md` for full details on each category.\n\n**Injection\
    \ Flaws**\n- SQL Injection: raw queries with string interpolation, ORM misuse,\
    \ second-order SQLi\n- XSS: unescaped output, dangerouslySetInnerHTML, innerHTML,\
    \ template injection\n- Command Injection: exec/spawn/system with user input\n\
    - LDAP, XPath, Header, Log injection\n\n**Authentication & Access Control**\n\
    - Missing authentication on sensitive endpoints\n- Broken object-level authorization\
    \ (BOLA/IDOR)\n- JWT weaknesses (alg:none, weak secrets, no expiry validation)\n\
    - Session fixation, missing CSRF protection\n- Privilege escalation paths\n- Mass\
    \ assignment / parameter pollution\n\n**Data Handling**\n- Sensitive data in logs,\
    \ error messages, or API responses\n- Missing encryption at rest or in transit\n\
    - Insecure deserialization\n- Path traversal / directory traversal\n- XXE (XML\
    \ External Entity) processing\n- SSRF (Server-Side Request Forgery)\n\n**Cryptography**\n\
    - Use of MD5, SHA1, DES for security purposes\n- Hardcoded IVs or salts\n- Weak\
    \ random number generation (Math.random() for tokens)\n- Missing TLS certificate\
    \ validation\n\n**Business Logic**\n- Race conditions (TOCTOU)\n- Integer overflow\
    \ in financial calculations\n- Missing rate limiting on sensitive endpoints\n\
    - Predictable resource identifiers\n\n### Step 5 \u2014 Cross-File Data Flow Analysis\n\
    After the per-file scan, perform a **holistic review**:\n- Trace user-controlled\
    \ input from entry points (HTTP params, headers, body, file uploads)\n  all the\
    \ way to sinks (DB queries, exec calls, HTML output, file writes)\n- Identify\
    \ vulnerabilities that only appear when looking at multiple files together\n-\
    \ Check for insecure trust boundaries between services or modules\n\n### Step\
    \ 6 \u2014 Self-Verification Pass\nFor EACH finding:\n1. Re-read the relevant\
    \ code with fresh eyes\n2. Ask: \"Is this actually exploitable, or is there sanitization\
    \ I missed?\"\n3. Check if a framework or middleware already handles this upstream\n\
    4. Downgrade or discard findings that aren't genuine vulnerabilities\n5. Assign\
    \ final severity: CRITICAL / HIGH / MEDIUM / LOW / INFO\n\n### Step 7 \u2014 Generate\
    \ Security Report\nOutput the full report in the format defined in `references/report-format.md`.\n\
    \n### Step 8 \u2014 Propose Patches\nFor every CRITICAL and HIGH finding, generate\
    \ a concrete patch:\n- Show the vulnerable code (before)\n- Show the fixed code\
    \ (after)\n- Explain what changed and why\n- Preserve the original code style,\
    \ variable names, and structure\n- Add a comment explaining the fix inline\n\n\
    Explicitly state: **\"Review each patch before applying. Nothing has been changed\
    \ yet.\"**\n\n## Severity Guide\n\n| Severity | Meaning | Example |\n|----------|---------|---------|\n\
    | \U0001F534 CRITICAL | Immediate exploitation risk, data breach likely | SQLi,\
    \ RCE, auth bypass |\n| \U0001F7E0 HIGH | Serious vulnerability, exploit path\
    \ exists | XSS, IDOR, hardcoded secrets |\n| \U0001F7E1 MEDIUM | Exploitable with\
    \ conditions or chaining | CSRF, open redirect, weak crypto |\n| \U0001F535 LOW\
    \ | Best practice violation, low direct risk | Verbose errors, missing headers\
    \ |\n| \u26AA INFO | Observation worth noting, not a vulnerability | Outdated\
    \ dependency (no CVE) |\n\n## Output Rules\n\n- **Always** produce a findings\
    \ summary table first (counts by severity)\n- **Never** auto-apply any patch \u2014\
    \ present patches for human review only\n- **Always** include a confidence rating\
    \ per finding (High / Medium / Low)\n- **Group findings** by category, not by\
    \ file\n- **Be specific** \u2014 include file path, line number, and the exact\
    \ vulnerable code snippet\n- **Explain the risk** in plain English \u2014 what\
    \ could an attacker do with this?\n- If the codebase is clean, say so clearly:\
    \ \"No vulnerabilities found\" with what was scanned\n\n## Reference Files\n\n\
    For detailed detection guidance, load the following reference files as needed:\n\
    \n- `references/vuln-categories.md` \u2014 Deep reference for every vulnerability\
    \ category with detection signals, safe patterns, and escalation checkers\n  -\
    \ Search patterns: `SQL injection`, `XSS`, `command injection`, `SSRF`, `BOLA`,\
    \ `IDOR`, `JWT`, `CSRF`, `secrets`, `cryptography`, `race condition`, `path traversal`\n\
    - `references/secret-patterns.md` \u2014 Regex patterns, entropy-based detection,\
    \ and CI/CD secret risks\n  - Search patterns: `API key`, `token`, `private key`,\
    \ `connection string`, `entropy`, `.env`, `GitHub Actions`, `Docker`, `Terraform`\n\
    - `references/language-patterns.md` \u2014 Framework-specific vulnerability patterns\
    \ for JavaScript, Python, Java, PHP, Go, Ruby, and Rust\n  - Search patterns:\
    \ `Express`, `React`, `Next.js`, `Django`, `Flask`, `FastAPI`, `Spring Boot`,\
    \ `PHP`, `Go`, `Rails`, `Rust`\n- `references/vulnerable-packages.md` \u2014 Curated\
    \ CVE watchlist for npm, pip, Maven, Rubygems, Cargo, and Go modules\n  - Search\
    \ patterns: `lodash`, `axios`, `jsonwebtoken`, `Pillow`, `log4j`, `nokogiri`,\
    \ `CVE`\n- `references/report-format.md` \u2014 Structured output template for\
    \ security reports with finding cards, dependency audit, secrets scan, and patch\
    \ proposal formatting\n  - Search patterns: `report`, `format`, `template`, `finding`,\
    \ `patch`, `summary`, `confidence`"
