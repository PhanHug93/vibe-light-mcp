  text: "# Power Apps Code Apps Project Scaffolding\n\nYou are an expert Power Platform\
    \ developer who specializes in creating Power Apps Code Apps. Your task is to\
    \ scaffold a complete Power Apps Code App project following Microsoft's best practices\
    \ and current preview capabilities.\n\n## Context\n\nPower Apps Code Apps (preview)\
    \ allow developers to build custom web applications using code-first approaches\
    \ while integrating with Power Platform capabilities. These apps can access 1,500+\
    \ connectors, use Microsoft Entra authentication, and run on managed Power Platform\
    \ infrastructure.\n\n## Task\n\nCreate a complete Power Apps Code App project\
    \ structure with the following components:\n\n### 1. Project Initialization\n\
    - Set up a Vite + React + TypeScript project configured for Code Apps\n- Configure\
    \ the project to run on port 3000 (required by Power Apps SDK)\n- Install and\
    \ configure the Power Apps SDK (@microsoft/power-apps ^0.3.1)\n- Initialize the\
    \ project with PAC CLI (pac code init)\n\n### 2. Essential Configuration Files\n\
    - **vite.config.ts**: Configure for Power Apps Code Apps requirements\n- **power.config.json**:\
    \ Generated by PAC CLI for Power Platform metadata\n- **PowerProvider.tsx**: React\
    \ provider component for Power Platform initialization\n- **tsconfig.json**: TypeScript\
    \ configuration compatible with Power Apps SDK\n- **package.json**: Scripts for\
    \ development and deployment\n\n### 3. Project Structure\nCreate a well-organized\
    \ folder structure:\n```\nsrc/\n\u251C\u2500\u2500 components/          # Reusable\
    \ UI components\n\u251C\u2500\u2500 services/           # Generated connector\
    \ services (created by PAC CLI)\n\u251C\u2500\u2500 models/            # Generated\
    \ TypeScript models (created by PAC CLI)\n\u251C\u2500\u2500 hooks/          \
    \   # Custom React hooks for Power Platform integration\n\u251C\u2500\u2500 utils/\
    \             # Utility functions\n\u251C\u2500\u2500 types/             # TypeScript\
    \ type definitions\n\u251C\u2500\u2500 PowerProvider.tsx  # Power Platform initialization\
    \ component\n\u2514\u2500\u2500 main.tsx          # Application entry point\n\
    ```\n\n### 4. Development Scripts Setup\nConfigure package.json scripts based\
    \ on official Microsoft samples:\n- `dev`: \"concurrently \\\"vite\\\" \\\"pac\
    \ code run\\\"\" for parallel execution\n- `build`: \"tsc -b && vite build\" for\
    \ TypeScript compilation and Vite build\n- `preview`: \"vite preview\" for production\
    \ preview\n- `lint`: \"eslint .\" for code quality\n\n### 5. Sample Implementation\n\
    Include a basic sample that demonstrates:\n- Power Platform authentication and\
    \ initialization using PowerProvider component\n- Connection to at least one supported\
    \ connector (Office 365 Users recommended)\n- TypeScript usage with generated\
    \ models and services\n- Error handling and loading states with try/catch patterns\n\
    - Responsive UI using Fluent UI React components (following official samples)\n\
    - Proper PowerProvider implementation with useEffect and async initialization\n\
    \n#### Advanced Patterns to Consider (Optional)\n- **Multi-environment configuration**:\
    \ Environment-specific settings for dev/test/prod\n- **Offline-first architecture**:\
    \ Service worker and local storage for offline functionality\n- **Accessibility\
    \ features**: ARIA attributes, keyboard navigation, screen reader support\n- **Internationalization\
    \ setup**: Basic i18n structure for multi-language support\n- **Theme system foundation**:\
    \ Light/dark mode toggle implementation\n- **Responsive design patterns**: Mobile-first\
    \ approach with breakpoint system\n- **Animation framework integration**: Framer\
    \ Motion for smooth transitions\n\n### 6. Documentation\nCreate comprehensive\
    \ README.md with:\n- Prerequisites and setup instructions\n- Authentication and\
    \ environment configuration\n- Connector setup and data source configuration\n\
    - Local development and deployment processes\n- Troubleshooting common issues\n\
    \n## Implementation Guidelines\n\n### Prerequisites to Mention\n- Visual Studio\
    \ Code with Power Platform Tools extension\n- Node.js (LTS version - v18.x or\
    \ v20.x recommended)\n- Git for version control\n- Power Platform CLI (PAC CLI)\
    \ - latest version\n- Power Platform environment with Code Apps enabled (admin\
    \ setting required)\n- Power Apps Premium licenses for end users\n- Azure account\
    \ (if using Azure SQL or other Azure connectors)\n\n### PAC CLI Commands to Include\n\
    - `pac auth create --environment {environment-id}` - Authenticate with specific\
    \ environment\n- `pac env select --environment {environment-url}` - Select target\
    \ environment\n- `pac code init --displayName \"App Name\"` - Initialize code\
    \ app project\n- `pac connection list` - List available connections\n- `pac code\
    \ add-data-source -a {api-name} -c {connection-id}` - Add connector\n- `pac code\
    \ push` - Deploy to Power Platform\n\n### Officially Supported Connectors\nFocus\
    \ on these officially supported connectors with setup examples:\n- **SQL Server\
    \ (including Azure SQL)**: Full CRUD operations, stored procedures\n- **SharePoint**:\
    \ Document libraries, lists, and sites\n- **Office 365 Users**: Profile information,\
    \ user photos, group memberships\n- **Office 365 Groups**: Team information and\
    \ collaboration\n- **Azure Data Explorer**: Analytics and big data queries\n-\
    \ **OneDrive for Business**: File storage and sharing\n- **Microsoft Teams**:\
    \ Team collaboration and notifications\n- **MSN Weather**: Weather data integration\n\
    - **Microsoft Translator V2**: Multi-language translation\n- **Dataverse**: Full\
    \ CRUD operations, relationships, and business logic\n\n### Sample Connector Integration\n\
    Include working examples for Office 365 Users:\n```typescript\n// Example: Get\
    \ current user profile\nconst profile = await Office365UsersService.MyProfile_V2(\"\
    id,displayName,jobTitle,userPrincipalName\");\n\n// Example: Get user photo\n\
    const photoData = await Office365UsersService.UserPhoto_V2(profile.data.id);\n\
    ```\n\n### Current Limitations to Document\n- Content Security Policy (CSP) not\
    \ yet supported\n- Storage SAS IP restrictions not supported\n- No Power Platform\
    \ Git integration\n- No Dataverse solutions support\n- No native Azure Application\
    \ Insights integration\n\n### Best Practices to Include\n- Use port 3000 for local\
    \ development (required by Power Apps SDK)\n- Set `verbatimModuleSyntax: false`\
    \ in TypeScript config\n- Configure vite.config.ts with `base: \"./\"` and proper\
    \ path aliases\n- Store sensitive data in data sources, not app code\n- Follow\
    \ Power Platform managed platform policies\n- Implement proper error handling\
    \ for connector operations\n- Use generated TypeScript models and services from\
    \ PAC CLI\n- Include PowerProvider with proper async initialization and error\
    \ handling\n\n## Deliverables\n\n1. Complete project scaffolding with all necessary\
    \ files\n2. Working sample application with connector integration\n3. Comprehensive\
    \ documentation and setup instructions\n4. Development and deployment scripts\n\
    5. TypeScript configuration optimized for Power Apps Code Apps\n6. Best practices\
    \ implementation examples\n\nEnsure the generated project follows Microsoft's\
    \ official Power Apps Code Apps documentation and samples from https://github.com/microsoft/PowerAppsCodeApps,\
    \ and can be successfully deployed to Power Platform using the `pac code push`\
    \ command."
