  text: "# Scaling Data Volume\n\nThis document covers data volume scaling scenarios,\n\
    where the total size of the dataset exceeds the capacity of a single node.\n\n\
    ## Tenant Scaling\n\nIf the use case is multi-tenant, meaning that each user only\
    \ has access to a subset of the data,\nand we never need to query across all the\
    \ data, then we can use multi-tenancy patterns to scale.\n\nThe recommended way\
    \ is to use multi-tenant workloads with payload partitioning, per-tenant indexes,\
    \ and tiered multitenancy.\n\nLearn more [Tenant Scaling](tenant-scaling/SKILL.md)\n\
    \n## Sliding Time Window\n\nSome use-cases are based on a sliding time window,\
    \ where only the most recent data is relevant.\nFor example an index for social\
    \ media posts, where only the last 6 months of data require fast search.\n\nLearn\
    \ more [Sliding Time Window](sliding-time-window/SKILL.md)\n\n## Global Search\n\
    \nMost general use-cases require global search across all data.\nIn these situations,\
    \ we might need to fall back to vertical scaling,\nand then horizontal scaling\
    \ when we reach the limits of vertical scaling.\n\n\n### Vertical Scaling\n\n\
    When data doesn't fit in a single node, the first approach is to scale the node\
    \ itself \u2014 more RAM, better disk, quantization, mmap.\nExhaust vertical options\
    \ before going horizontal, as horizontal scaling adds permanent operational complexity.\n\
    \nLearn more [Vertical Scaling](vertical-scaling/SKILL.md)\n\n### Horizontal Scaling\n\
    \nWhen a single node can't hold the data even with quantization and mmap, distribute\
    \ data across multiple nodes via sharding.\n\nLearn more [Horizontal Scaling](horizontal-scaling/SKILL.md)"
