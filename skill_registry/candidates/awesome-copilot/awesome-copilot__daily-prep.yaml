  text: "# Daily Prep\n\nGenerate a structured prep file for the next working day\
    \ with meeting details, prep bullets, linked tasks, and productivity recommendations.\n\
    \n## When to Use\n\n- End of day: \"prepare me for tomorrow\"\n- Any time: \"\
    prep me for Friday\" or \"what does March 25 look like?\"\n- Weekly planning:\
    \ run for multiple days\n\n## Procedure\n\n### 1. Determine Target Date\n\nIf\
    \ the user specifies a date, use it. Otherwise, default to tomorrow (current date\
    \ + 1 day).\nIf tomorrow is Saturday, default to Monday. If Sunday, default to\
    \ Monday.\nCompute the output path: `outputs/YYYY/MM/YYYY-MM-DD-prep.html`\n\n\
    ### 2. Pull Calendar via WorkIQ\n\nUse the WorkIQ MCP tool to fetch the calendar.\
    \ Ask WorkIQ:\n\n> \"What meetings do I have on {target date}? For each meeting,\
    \ include: subject, start time, end time, organizer, all attendees with their\
    \ email addresses, location, whether it's online, and whether I've accepted or\
    \ declined.\"\n\nIf the response is insufficient, make a follow-up query:\n\n\
    > \"For the meetings on {target date}, which ones are marked as optional or tentative?\
    \ Which ones are recurring?\"\n\n### 3. Classify Each Meeting\n\nApply these labels\
    \ based on attendee domains and subject:\n\n| Label | Criteria |\n|-------|----------|\n\
    | `[Customer \xB7 HIGH]` | External attendees from customer/partner domains, or\
    \ subject matches a known customer name |\n| `[Internal]` | Only internal company\
    \ domain attendees |\n| `[Community]` | CoP, community, guild, learning sessions\
    \ |\n| `[Upskilling]` | Training, workshop, certification, learning |\n| `[Optional\
    \ \xB7 skip]` | Tentative, low importance, or known recurring optional (e.g.,\
    \ \"Office Hours\", \"Open Q&A\") |\n| `[Personal]` | Private events, non-work\
    \ |\n\n#### Zone Markers\n\nFor every meeting, check the organizer field and apply\
    \ these additional markers:\n\n| Condition | Marker | Action |\n|-----------|--------|--------|\n\
    | Starts \u2265 15:30 and < 16:00 (any organizer) | `\u26A0\uFE0F After-hours`\
    \ | Recommend decline |\n| Starts \u2265 16:00 and **not** self-organized | `\u26A0\
    \uFE0F After-hours` | Recommend decline |\n| Starts \u2265 16:00 and self-organized\
    \ | _(no flag)_ | OK \u2014 you chose to schedule it |\n| Before 09:00 and **not**\
    \ self-organized | `\u26A0\uFE0F Early` | Recommend decline \u2014 intrudes on\
    \ learning window |\n| Before 09:00 and self-organized | _(no flag)_ | OK \u2014\
    \ you chose to schedule it |\n| Overlaps 12:00\u201313:00 | `\U0001F37D\uFE0F\
    \ Lunch conflict` | Note in Calendar Notes |\n\n\"Self-organized\" means **you**\
    \ are the meeting organizer (check the organizer field from WorkIQ).\n\n### 4.\
    \ Ideal Day Structure\n\nUse this as the decision framework for all analysis steps.\
    \ Every meeting must be evaluated against these zones. Users should adapt these\
    \ times and targets to their personal routine.\n\n| Zone | Time | Purpose | Rules\
    \ |\n|------|------|---------|-------|\n| Morning Focus | Before 09:00 | Admin,\
    \ learning, personal work | Protect from others' meetings. Flag external events.\
    \ |\n| Customer Zone | 09:00\u201312:00 | Customer / external meetings | Max 2\
    \ customer meetings. Prefer mornings for external calls. |\n| Lunch | 12:00\u2013\
    13:00 | Break | Protected. Flag any overlap. |\n| Deep Work | 13:00\u201315:30\
    \ | Deliverables, focused coding/writing | Minimize meetings. Flag non-essential\
    \ meetings as deep work disruption. |\n| Protected (strict) | 15:30\u201316:00\
    \ | End of day wind-down | Flag all meetings regardless of organizer. |\n| Protected\
    \ (flex) | 16:00+ | End of day | Flag others' meetings only. Self-organized OK.\
    \ |\n\n**Targets per day:**\n- Learning hours: **1.5h** (from morning focus +\
    \ gap time)\n- Deep work hours: **2.5h** (13:00\u201315:30 zone)\n- Customer meetings:\
    \ **max 2** (preferably in 09:00\u201312:00)\n\n### 5. Detect Conflicts & Day\
    \ Fit Issues\n\nCompare event time windows. Flag overlaps in a Conflicts table\
    \ with a recommendation for each \u2014 prioritize customer meetings over internal/optional.\n\
    \nAlso detect these **day fit issues** (report in a separate \"Day Fit Issues\"\
    \ table):\n\n| Check | Condition | Flag |\n|-------|-----------|------|\n| **Customer\
    \ overload** | >2 `[Customer \xB7 HIGH]` meetings | Flag 3rd+ as \"Consider rescheduling\
    \ to another day\" |\n| **Deep work disruption** | Non-essential meetings in 13:00\u2013\
    15:30 zone | \"Disrupts deep work \u2014 consider moving to morning\" |\n| **Non-ideal\
    \ placement** | Customer meetings outside 09:00\u201312:00 | \"Customer meeting\
    \ outside preferred morning zone\" |\n| **Early intrusion** | Others' meetings\
    \ before 09:00 | \"Intrudes on learning window \u2014 recommend decline\" |\n\
    | **Lunch conflict** | Meeting overlaps 12:00\u201313:00 | \"Conflicts with lunch\
    \ break\" |\n\n### 6. Gather Context from Workspace\n\n1. Read open task files\
    \ for tasks related to customer names or attendees in tomorrow's meetings\n2.\
    \ Search workspace folders for recent files related to those customers or topics\n\
    3. Check recent meeting summaries or plans for relevant prep context\n4. Use this\
    \ to generate actionable prep bullets per meeting\n\n### 7. Generate Prep per\
    \ Meeting\n\nFor each meeting (chronological), include:\n- Time, subject, organizer\n\
    - Attendee list (first name, company if external)\n- 3\u20135 actionable prep\
    \ bullets based on open tasks, recent summaries, and meeting subject\n- If no\
    \ context available, note what to ask/clarify in the meeting\n\n### 8. Find Learning\
    \ & Focus Slots\n\nAfter generating prep per meeting, analyze the day's schedule\
    \ to find open slots:\n\n1. **Morning Focus confirmation** \u2014 Verify the morning\
    \ focus window is clear. If any non-self-organized event exists there, flag it.\n\
    \n2. **Learning Slots** \u2014 Find gaps \u2265 30 min in the morning window and\
    \ any other free slots suitable for upskilling. Target: **1.5h/day**. For each\
    \ slot: time range, duration, suggested activity.\n\n3. **Deep Work Blocks** \u2014\
    \ Find continuous free gaps in the 13:00\u201315:30 zone for deliverables. For\
    \ each block: time range, duration, suggested task from open tasks.\n\n4. **Report\
    \ totals:**\n   - Learning hours found vs. 1.5h target (e.g., \"1.0h / 1.5h target\
    \ \u2014 0.5h short\")\n   - Deep work hours available in 13:00\u201315:30 (e.g.,\
    \ \"2.0h / 2.5h available\")\n\n### 9. Productivity Recommendations\n\nAnalyze\
    \ the full day and provide:\n\n| Section | What to Include |\n|---------|------------------|\n\
    | **Day Fit Score** | Rate 0\u2013100% how well the day matches the Ideal Day\
    \ Structure. Criteria: (1) morning focus clear (+20%), (2) \u22642 customer meetings\
    \ in 09:00\u201312:00 (+20%), (3) lunch 12:00\u201313:00 protected (+15%), (4)\
    \ deep work 13:00\u201315:30 intact (+20%), (5) nothing after 15:30 or only self-organized\
    \ after 16:00 (+15%), (6) \u22651h learning slots found (+10%). Show as: \U0001F7E2\
    \ \u226580%, \U0001F7E1 50\u201379%, \U0001F534 <50%. |\n| **Day Shape** | Total\
    \ meeting hours, focus time available, learning hours, deep work hours, heavy/moderate/light\
    \ assessment |\n| **Decline Candidates** | Auto-include: (1) all meetings 15:30\u2013\
    16:00, (2) others' meetings \u226516:00, (3) others' meetings <09:00, (4) 3rd+\
    \ customer meeting, (5) optional meetings during deep work zone. Show \"Reclaim\"\
    \ column with minutes recovered. Self-organized meetings before 09:00 or after\
    \ 16:00 are **excluded** from auto-decline. |\n| **Conflict Resolution** | Specific\
    \ recommendation for each overlap |\n| **Learning Slots** | Gaps for upskilling\
    \ \u2014 from Step 8. Table: Window, Duration, Suggested Activity. Show total\
    \ vs. 1.5h target. |\n| **Deep Work Blocks** | Free gaps in 13:00\u201315:30 for\
    \ deliverables \u2014 from Step 8. Table: Window, Duration, Suggested Task. |\n\
    | **Energy Management** | Flag if >3h back-to-back customer meetings without a\
    \ break |\n| **Top 3 Priorities** | The 3 most impactful things to accomplish\
    \ (meetings + tasks combined) |\n\n### 10. Write the File\n\nCreate the output\
    \ file at `outputs/YYYY/MM/YYYY-MM-DD-prep.html` as a self-contained HTML file\
    \ with embedded CSS (dark theme, color-coded timeline, responsive layout).\n\n\
    If a file already exists for that date, read it first and update rather than overwrite\
    \ \u2014 the user may have added manual notes.\n\n## Example Prompts\n\n- \"Prepare\
    \ me for tomorrow\"\n- \"What does Friday look like?\"\n- \"Daily prep for March\
    \ 28\"\n- \"Prep me for next Monday \u2014 focus on customer meetings\"\n\n##\
    \ Requirements\n\n- **WorkIQ MCP tool** must be available for calendar access\
    \ (Microsoft 365 / Outlook)\n- A workspace with task files and customer/project\
    \ folders for context enrichment\n- Output is self-contained HTML \u2014 no external\
    \ dependencies"
