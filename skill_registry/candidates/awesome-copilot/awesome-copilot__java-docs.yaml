  text: "# Java Documentation (Javadoc) Best Practices\n\n- Public and protected members\
    \ should be documented with Javadoc comments.\n- It is encouraged to document\
    \ package-private and private members as well, especially if they are complex\
    \ or not self-explanatory.\n- The first sentence of the Javadoc comment is the\
    \ summary description. It should be a concise overview of what the method does\
    \ and end with a period.\n- Use `@param` for method parameters. The description\
    \ starts with a lowercase letter and does not end with a period.\n- Use `@return`\
    \ for method return values.\n- Use `@throws` or `@exception` to document exceptions\
    \ thrown by methods.\n- Use `@see` for references to other types or members.\n\
    - Use `{@inheritDoc}` to inherit documentation from base classes or interfaces.\n\
    \  - Unless there is major behavior change, in which case you should document\
    \ the differences.\n- Use `@param <T>` for type parameters in generic types or\
    \ methods.\n- Use `{@code}` for inline code snippets.\n- Use `<pre>{@code ...\
    \ }</pre>` for code blocks.\n- Use `@since` to indicate when the feature was introduced\
    \ (e.g., version number).\n- Use `@version` to specify the version of the member.\n\
    - Use `@author` to specify the author of the code.\n- Use `@deprecated` to mark\
    \ a member as deprecated and provide an alternative."
