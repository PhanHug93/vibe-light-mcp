  text: "This is a guide to add a new language to a Next.js project using next-intl\
    \ for internationalization,\n\n- For i18n, the application uses next-intl.\n-\
    \ All translations are in the directory `./messages`.\n- The UI component is `src/components/language-toggle.tsx`.\n\
    - Routing and middleware configuration are handled in:\n  - `src/i18n/routing.ts`\n\
    \  - `src/middleware.ts`\n\nWhen adding a new language:\n\n- Translate all the\
    \ content of `en.json` to the new language. The goal is to have all the JSON entries\
    \ in the new language for a complete translation.\n- Add the path in `routing.ts`\
    \ and `middleware.ts`.\n- Add the language to `language-toggle.tsx`."
