  text: "# MCP Security Audit\n\nAudit MCP server configurations for security issues\
    \ \u2014 secrets exposure, shell injection, unpinned dependencies, and unapproved\
    \ servers.\n\n## Overview\n\nMCP servers give agents direct tool access to external\
    \ systems. A misconfigured `.mcp.json` can expose credentials, allow shell injection,\
    \ or connect to untrusted servers. This skill catches those issues before they\
    \ reach production.\n\n```\n.mcp.json \u2192 Parse Servers \u2192 Check Each Server:\n\
    \  1. Secrets in args/env?\n  2. Shell injection patterns?\n  3. Unpinned versions\
    \ (@latest)?\n  4. Dangerous commands (eval, bash -c)?\n  5. Server on approved\
    \ list?\n\u2192 Generate Report\n```\n\n## When to Use\n\n- Reviewing any `.mcp.json`\
    \ file in a project\n- Onboarding a new MCP server to a project\n- Auditing all\
    \ MCP servers in a monorepo or plugin marketplace\n- Pre-commit checks for MCP\
    \ configuration changes\n- Security review of agent tool configurations\n\n---\n\
    \n## Audit Check 1: Hardcoded Secrets\n\nScan MCP server args and env values for\
    \ hardcoded credentials.\n\n```python\nimport json\nimport re\nfrom pathlib import\
    \ Path\n\nSECRET_PATTERNS = [\n    (r'(?i)(api[_-]?key|token|secret|password|credential)\\\
    s*[:=]\\s*[\"\\'][^\"\\']{8,}', \"Hardcoded secret\"),\n    (r'(?i)Bearer\\s+[A-Za-z0-9\\\
    -._~+/]+=*', \"Hardcoded bearer token\"),\n    (r'(?i)(ghp_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9]{30,}',\
    \ \"GitHub token\"),\n    (r'sk-[A-Za-z0-9]{20,}', \"OpenAI API key\"),\n    (r'AKIA[0-9A-Z]{16}',\
    \ \"AWS access key\"),\n    (r'-----BEGIN\\s+(RSA\\s+)?PRIVATE\\s+KEY-----', \"\
    Private key\"),\n]\n\ndef check_secrets(mcp_config: dict) -> list[dict]:\n   \
    \ \"\"\"Check for hardcoded secrets in MCP server configurations.\"\"\"\n    findings\
    \ = []\n    raw = json.dumps(mcp_config)\n    for pattern, description in SECRET_PATTERNS:\n\
    \        matches = re.findall(pattern, raw)\n        if matches:\n           \
    \ findings.append({\n                \"severity\": \"CRITICAL\",\n           \
    \     \"check\": \"hardcoded-secret\",\n                \"message\": f\"{description}\
    \ found in MCP configuration\",\n                \"evidence\": f\"Pattern matched:\
    \ {pattern}\",\n                \"fix\": \"Use environment variable references:\
    \ ${ENV_VAR_NAME}\"\n            })\n    return findings\n```\n\n**Good practice\
    \ \u2014 use env var references:**\n```json\n{\n  \"mcpServers\": {\n    \"my-server\"\
    : {\n      \"command\": \"node\",\n      \"args\": [\"server.js\"],\n      \"\
    env\": {\n        \"API_KEY\": \"${MY_API_KEY}\",\n        \"DB_URL\": \"${DATABASE_URL}\"\
    \n      }\n    }\n  }\n}\n```\n\n**Bad \u2014 hardcoded credentials:**\n```json\n\
    {\n  \"mcpServers\": {\n    \"my-server\": {\n      \"command\": \"node\",\n \
    \     \"args\": [\"server.js\", \"--api-key\", \"sk-abc123realkey456\"],\n   \
    \   \"env\": {\n        \"DB_URL\": \"postgresql://admin:password123@prod-db:5432/main\"\
    \n      }\n    }\n  }\n}\n```\n\n---\n\n## Audit Check 2: Shell Injection Patterns\n\
    \nDetect dangerous command patterns in MCP server args.\n\n```python\nimport json\n\
    import re\n\nDANGEROUS_PATTERNS = [\n    (r'\\$\\(', \"Command substitution $(...)\"\
    ),\n    (r'`[^`]+`', \"Backtick command substitution\"),\n    (r';\\s*\\w', \"\
    Command chaining with semicolon\"),\n    (r'\\|\\s*\\w', \"Pipe to another command\"\
    ),\n    (r'&&\\s*\\w', \"Command chaining with &&\"),\n    (r'\\|\\|\\s*\\w',\
    \ \"Command chaining with ||\"),\n    (r'(?i)eval\\s', \"eval usage\"),\n    (r'(?i)bash\\\
    s+-c\\s', \"bash -c execution\"),\n    (r'(?i)sh\\s+-c\\s', \"sh -c execution\"\
    ),\n    (r'>\\s*/dev/tcp/', \"TCP redirect (reverse shell pattern)\"),\n    (r'curl\\\
    s+.*\\|\\s*(ba)?sh', \"curl pipe to shell\"),\n]\n\ndef check_shell_injection(server_config:\
    \ dict) -> list[dict]:\n    \"\"\"Check MCP server args for shell injection risks.\"\
    \"\"\n    findings = []\n    args_text = json.dumps(server_config.get(\"args\"\
    , []))\n    for pattern, description in DANGEROUS_PATTERNS:\n        if re.search(pattern,\
    \ args_text):\n            findings.append({\n                \"severity\": \"\
    HIGH\",\n                \"check\": \"shell-injection\",\n                \"message\"\
    : f\"Dangerous pattern in MCP server args: {description}\",\n                \"\
    fix\": \"Use direct command execution, not shell interpolation\"\n           \
    \ })\n    return findings\n```\n\n---\n\n## Audit Check 3: Unpinned Dependencies\n\
    \nFlag MCP servers using `@latest` in their package references.\n\n```python\n\
    def check_pinned_versions(server_config: dict) -> list[dict]:\n    \"\"\"Check\
    \ that MCP server dependencies use pinned versions, not @latest.\"\"\"\n    findings\
    \ = []\n    args = server_config.get(\"args\", [])\n    for arg in args:\n   \
    \     if isinstance(arg, str):\n            if \"@latest\" in arg:\n         \
    \       findings.append({\n                    \"severity\": \"MEDIUM\",\n   \
    \                 \"check\": \"unpinned-dependency\",\n                    \"\
    message\": f\"Unpinned dependency: {arg}\",\n                    \"fix\": f\"\
    Pin to specific version: {arg.replace('@latest', '@1.2.3')}\"\n              \
    \  })\n            # npx with unversioned package\n            if arg.startswith(\"\
    -y\") or (not \"@\" in arg and not arg.startswith(\"-\")):\n                pass\
    \  # npx flag or plain arg, ok\n    # Check if using npx without -y (interactive\
    \ prompt in CI)\n    command = server_config.get(\"command\", \"\")\n    if command\
    \ == \"npx\" and \"-y\" not in args:\n        findings.append({\n            \"\
    severity\": \"LOW\",\n            \"check\": \"npx-interactive\",\n          \
    \  \"message\": \"npx without -y flag may prompt interactively in CI\",\n    \
    \        \"fix\": \"Add -y flag: npx -y package-name\"\n        })\n    return\
    \ findings\n```\n\n**Good \u2014 pinned version:**\n```json\n{ \"args\": [\"-y\"\
    , \"my-mcp-server@2.1.0\"] }\n```\n\n**Bad \u2014 unpinned:**\n```json\n{ \"args\"\
    : [\"-y\", \"my-mcp-server@latest\"] }\n```\n\n---\n\n## Audit Check 4: Full Audit\
    \ Runner\n\nCombine all checks into a single audit.\n\n```python\ndef audit_mcp_config(mcp_path:\
    \ str) -> dict:\n    \"\"\"Run full security audit on an .mcp.json file.\"\"\"\
    \n    path = Path(mcp_path)\n    if not path.exists():\n        return {\"error\"\
    : f\"{mcp_path} not found\"}\n\n    config = json.loads(path.read_text(encoding=\"\
    utf-8\"))\n    servers = config.get(\"mcpServers\", {})\n    results = {\"file\"\
    : str(path), \"servers\": {}, \"summary\": {}}\n    total_findings = []\n\n  \
    \  # Run secrets check once on the whole config (not per-server)\n    config_level_findings\
    \ = check_secrets(config)\n    total_findings.extend(config_level_findings)\n\n\
    \    for name, server_config in servers.items():\n        if not isinstance(server_config,\
    \ dict):\n            continue\n        findings = []\n        findings.extend(check_shell_injection(server_config))\n\
    \        findings.extend(check_pinned_versions(server_config))\n        results[\"\
    servers\"][name] = {\n            \"command\": server_config.get(\"command\",\
    \ \"\"),\n            \"findings\": findings,\n        }\n        total_findings.extend(findings)\n\
    \n    # Summary\n    by_severity = {}\n    for f in total_findings:\n        sev\
    \ = f[\"severity\"]\n        by_severity[sev] = by_severity.get(sev, 0) + 1\n\n\
    \    results[\"summary\"] = {\n        \"total_servers\": len(servers),\n    \
    \    \"total_findings\": len(total_findings),\n        \"by_severity\": by_severity,\n\
    \        \"passed\": len(total_findings) == 0,\n    }\n    return results\n```\n\
    \n**Usage:**\n```python\nresults = audit_mcp_config(\".mcp.json\")\nif not results[\"\
    summary\"][\"passed\"]:\n    for server, data in results[\"servers\"].items():\n\
    \        for finding in data[\"findings\"]:\n            print(f\"[{finding['severity']}]\
    \ {server}: {finding['message']}\")\n            print(f\"  Fix: {finding['fix']}\"\
    )\n```\n\n---\n\n## Output Format\n\n```\nMCP Security Audit \u2014 .mcp.json\n\
    \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
    \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
    \u2550\u2550\u2550\u2550\u2550\nServers scanned: 5\nFindings: 3 (1 CRITICAL, 1\
    \ HIGH, 1 MEDIUM)\n\n[CRITICAL] my-api-server: Hardcoded secret found in MCP configuration\n\
    \  Fix: Use environment variable references: ${ENV_VAR_NAME}\n\n[HIGH] data-processor:\
    \ Dangerous pattern in MCP server args: bash -c execution\n  Fix: Use direct command\
    \ execution, not shell interpolation\n\n[MEDIUM] analytics: Unpinned dependency:\
    \ analytics-mcp@latest\n  Fix: Pin to specific version: analytics-mcp@2.1.0\n\
    ```\n\n---\n\n## Related Resources\n\n- [MCP Specification](https://modelcontextprotocol.io/)\n\
    - [Agent Governance Toolkit](https://github.com/microsoft/agent-governance-toolkit)\
    \ \u2014 Full governance framework with MCP trust proxy\n- [OWASP ASI-02: Insecure\
    \ Tool Use](https://owasp.org/www-project-agentic-ai-threats/)"
