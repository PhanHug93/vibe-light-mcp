  text: "# unit-test-vue-pinia\n\nUse this skill to create or review unit tests for\
    \ Vue components, composables, and Pinia stores. Keep tests small, deterministic,\
    \ and behavior-first.\n\n## Workflow\n\n1. Identify the behavior boundary first:\
    \ component UI behavior, composable behavior, or store behavior.\n2. Choose the\
    \ narrowest test style that can prove that behavior.\n3. Set up Pinia with the\
    \ least powerful option that still covers the scenario.\n4. Drive the test through\
    \ public inputs such as props, form updates, button clicks, emitted child events,\
    \ and store APIs.\n5. Assert observable outputs and side effects before considering\
    \ any instance-level assertion.\n6. Return or review tests with clear behavior-oriented\
    \ names and note any remaining coverage gaps.\n\n## Core Rules\n\n- Test one behavior\
    \ per test.\n- Assert observable input/output behavior first (rendered text, emitted\
    \ events, callback calls, store state changes).\n- Avoid implementation-coupled\
    \ assertions.\n- Access `wrapper.vm` only in exceptional cases when there is no\
    \ reasonable DOM, prop, emit, or store-level assertion.\n- Prefer explicit setup\
    \ in `beforeEach()` and reset mocks every test.\n- Use checked-in reference material\
    \ in `references/pinia-patterns.md` as the local source of truth for standard\
    \ Pinia test setups.\n\n## Pinia Testing Approach\n\nUse `references/pinia-patterns.md`\
    \ first, then fall back to Pinia's testing cookbook when the checked-in examples\
    \ do not cover the case.\n\n### Default pattern for component tests\n\nUse `createTestingPinia`\
    \ as a global plugin while mounting.\nPrefer `createSpy: vi.fn` as the default\
    \ for consistency and easier action-spy assertions.\n\n```ts\nconst wrapper =\
    \ mount(ComponentUnderTest, {\n\tglobal: {\n\t\tplugins: [\n\t\t\tcreateTestingPinia({\n\
    \t\t\t\tcreateSpy: vi.fn,\n\t\t\t}),\n\t\t],\n\t},\n});\n```\n\nBy default, actions\
    \ are stubbed and spied.\nUse `stubActions: true` (default) when the test only\
    \ needs to verify whether an action was called (or not called).\n\n### Accepted\
    \ minimal Pinia setups\n\nThe following are also valid and should not be flagged\
    \ as incorrect:\n\n- `createTestingPinia({})` when the test does not assert Pinia\
    \ action spy behavior.\n- `createTestingPinia({ initialState: ... })` or `createTestingPinia({\
    \ stubActions: ... })` without `createSpy`, when the test only needs state seeding\
    \ or action stubbing behavior and does not inspect generated spies.\n- `setActivePinia(createTestingPinia(...))`\
    \ in store/composable-focused tests (without mounting a component) when mocking/seeding\
    \ dependent stores is needed.\n\nUse `createSpy: vi.fn` when action spy assertions\
    \ are part of the test intent.\n\n### Execute real actions only when needed\n\n\
    Use `stubActions: false` only when the test must validate the action's real behavior\
    \ and side effects. Do not switch it on by default for simple \"was called\" assertions.\n\
    \n```ts\nconst wrapper = mount(ComponentUnderTest, {\n\tglobal: {\n\t\tplugins:\
    \ [\n\t\t\tcreateTestingPinia({\n\t\t\t\tcreateSpy: vi.fn,\n\t\t\t\tstubActions:\
    \ false,\n\t\t\t}),\n\t\t],\n\t},\n});\n```\n\n### Seed store state with `initialState`\n\
    \n```ts\nconst wrapper = mount(ComponentUnderTest, {\n\tglobal: {\n\t\tplugins:\
    \ [\n\t\t\tcreateTestingPinia({\n\t\t\t\tcreateSpy: vi.fn,\n\t\t\t\tinitialState:\
    \ {\n\t\t\t\t\tcounter: { n: 20 },\n\t\t\t\t\tuser: { name: \"Leia Organa\" },\n\
    \t\t\t\t},\n\t\t\t}),\n\t\t],\n\t},\n});\n```\n\n### Add Pinia plugins through\
    \ `createTestingPinia`\n\n```ts\nconst wrapper = mount(ComponentUnderTest, {\n\
    \tglobal: {\n\t\tplugins: [\n\t\t\tcreateTestingPinia({\n\t\t\t\tcreateSpy: vi.fn,\n\
    \t\t\t\tplugins: [myPiniaPlugin],\n\t\t\t}),\n\t\t],\n\t},\n});\n```\n\n### Getter\
    \ override pattern for edge cases\n\n```ts\nconst pinia = createTestingPinia({\
    \ createSpy: vi.fn });\nconst store = useCounterStore(pinia);\n\nstore.double\
    \ = 999;\n// @ts-expect-error test-only reset of overridden getter\nstore.double\
    \ = undefined;\n```\n\n### Pure store unit tests\n\nPrefer pure store tests with\
    \ `createPinia()` when the goal is to validate store state transitions and action\
    \ behavior without component rendering. Use `createTestingPinia()` only when you\
    \ need stubbed dependent stores, seeded test doubles, or action spies.\n\n```ts\n\
    beforeEach(() => {\n\tsetActivePinia(createPinia());\n});\n\nit(\"increments\"\
    , () => {\n\tconst counter = useCounterStore();\n\tcounter.increment();\n\texpect(counter.n).toBe(1);\n\
    });\n```\n\n## Vue Test Utils Approach\n\nFollow Vue Test Utils guidance: <https://test-utils.vuejs.org/guide/>\n\
    \n- Mount shallow by default for focused unit tests.\n- Mount full component trees\
    \ only when integration behavior is the subject.\n- Drive behavior through props,\
    \ user-like interactions, and emitted events.\n- Prefer `findComponent(...).vm.$emit(...)`\
    \ for child stub events instead of touching parent internals.\n- Use `nextTick`\
    \ only when updates are async.\n- Assert emitted events and payloads with `wrapper.emitted(...)`.\n\
    - Access `wrapper.vm` only when no DOM assertion, emitted event assertion, prop\
    \ assertion, or store-level assertion can express the behavior. Treat it as an\
    \ exception and keep the assertion narrowly scoped.\n\n## Key Testing Snippets\n\
    \nEmit and assert payload:\n\n```ts\nawait wrapper.find(\"button\").trigger(\"\
    click\");\nexpect(wrapper.emitted(\"submit\")?.[0]?.[0]).toBe(\"Mango Mission\"\
    );\n```\n\nUpdate input and assert output:\n\n```ts\nawait wrapper.find(\"input\"\
    ).setValue(\"Agent Violet\");\nawait wrapper.find(\"form\").trigger(\"submit\"\
    );\nexpect(wrapper.emitted(\"save\")?.[0]?.[0]).toBe(\"Agent Violet\");\n```\n\
    \n## Test Writing Workflow\n\n1. Identify the behavior boundary to test.\n2. Build\
    \ minimal fixture data (only fields needed by that behavior).\n3. Configure Pinia\
    \ and required test doubles.\n4. Trigger behavior through public inputs.\n5. Assert\
    \ public outputs and side effects.\n6. Refactor test names to describe behavior,\
    \ not implementation.\n\n## Constraints and Safety\n\n- Do not test private/internal\
    \ implementation details.\n- Do not overuse snapshots for dynamic UI behavior.\n\
    - Do not assert every field in large objects if only one behavior matters.\n-\
    \ Keep fake data deterministic; avoid random values.\n- Do not claim a Pinia setup\
    \ is wrong when it is one of the accepted minimal setups above.\n- Do not rewrite\
    \ working tests toward deeper mounting or real actions unless the behavior under\
    \ test requires that extra surface area.\n- Flag missing test coverage, brittle\
    \ selectors, and implementation-coupled assertions explicitly during review.\n\
    \n## Output Contract\n\n- For `create` or `update`, return the finished test code\
    \ plus a short note describing the selected Pinia strategy.\n- For `review`, return\
    \ concrete findings first, then missing coverage or brittleness risks.\n- When\
    \ the safest choice is ambiguous, state the assumption that drove the chosen test\
    \ setup.\n\n## References\n\n- `references/pinia-patterns.md`\n- Pinia testing\
    \ cookbook: <https://pinia.vuejs.org/cookbook/testing.html>\n- Vue Test Utils\
    \ guide: <https://test-utils.vuejs.org/guide/>"
