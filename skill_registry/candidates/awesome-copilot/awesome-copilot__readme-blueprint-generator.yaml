  text: "# README Generator Prompt\n\nGenerate a comprehensive README.md for this\
    \ repository by analyzing the documentation files in the .github/copilot directory\
    \ and the copilot-instructions.md file. Follow these steps:\n\n1. Scan all the\
    \ files in the .github/copilot folder, like:\n   - Architecture\n   - Code_Exemplars\n\
    \   - Coding_Standards\n   - Project_Folder_Structure\n   - Technology_Stack\n\
    \   - Unit_Tests\n   - Workflow_Analysis\n\n2. Also review the copilot-instructions.md\
    \ file in the .github folder\n\n3. Create a README.md with the following sections:\n\
    \n## Project Name and Description\n- Extract the project name and primary purpose\
    \ from the documentation\n- Include a concise description of what the project\
    \ does\n\n## Technology Stack\n- List the primary technologies, languages, and\
    \ frameworks used\n- Include version information when available\n- Source this\
    \ information primarily from the Technology_Stack file\n\n## Project Architecture\n\
    - Provide a high-level overview of the architecture\n- Consider including a simple\
    \ diagram if described in the documentation\n- Source from the Architecture file\n\
    \n## Getting Started\n- Include installation instructions based on the technology\
    \ stack\n- Add setup and configuration steps\n- Include any prerequisites\n\n\
    ## Project Structure\n- Brief overview of the folder organization\n- Source from\
    \ Project_Folder_Structure file\n\n## Key Features\n- List main functionality\
    \ and features of the project\n- Extract from various documentation files\n\n\
    ## Development Workflow\n- Summarize the development process\n- Include information\
    \ about branching strategy if available\n- Source from Workflow_Analysis file\n\
    \n## Coding Standards\n- Summarize key coding standards and conventions\n- Source\
    \ from the Coding_Standards file\n\n## Testing\n- Explain testing approach and\
    \ tools\n- Source from Unit_Tests file\n\n## Contributing\n- Guidelines for contributing\
    \ to the project\n- Reference any code exemplars for guidance\n- Source from Code_Exemplars\
    \ and copilot-instructions\n\n## License\n- Include license information if available\n\
    \nFormat the README with proper Markdown, including:\n- Clear headings and subheadings\n\
    - Code blocks where appropriate\n- Lists for better readability\n- Links to other\
    \ documentation files\n- Badges for build status, version, etc. if information\
    \ is available\n\nKeep the README concise yet informative, focusing on what new\
    \ developers or users would need to know about the project."
