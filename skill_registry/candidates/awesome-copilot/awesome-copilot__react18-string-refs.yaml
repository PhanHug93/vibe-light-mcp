  text: "# React 18 String Refs Migration\n\nString refs (`ref=\"myInput\"` + `this.refs.myInput`)\
    \ were deprecated in React 16.3, warn in React 18.3.1, and are **removed in React\
    \ 19**.\n\n## Quick Pattern Map\n\n| Pattern | Reference |\n|---|---|\n| Single\
    \ ref on a DOM element | [\u2192 patterns.md#single-ref](references/patterns.md#single-ref)\
    \ |\n| Multiple refs in one component | [\u2192 patterns.md#multiple-refs](references/patterns.md#multiple-refs)\
    \ |\n| Refs in a list / dynamic refs | [\u2192 patterns.md#list-refs](references/patterns.md#list-refs)\
    \ |\n| Callback refs (alternative approach) | [\u2192 patterns.md#callback-refs](references/patterns.md#callback-refs)\
    \ |\n| Ref passed to a child component | [\u2192 patterns.md#forwarded-refs](references/patterns.md#forwarded-refs)\
    \ |\n\n## Scan Command\n\n```bash\n# Find all string ref assignments in JSX\n\
    grep -rn 'ref=\"' src/ --include=\"*.js\" --include=\"*.jsx\" | grep -v \"\\.test\\\
    .\"\n\n# Find all this.refs accessors\ngrep -rn \"this\\.refs\\.\" src/ --include=\"\
    *.js\" --include=\"*.jsx\" | grep -v \"\\.test\\.\"\n```\n\nBoth should be migrated\
    \ together - find the `ref=\"name\"` and the `this.refs.name` accesses for each\
    \ component as a pair.\n\n## The Migration Rule\n\nEvery string ref migrates to\
    \ `React.createRef()`:\n\n1. Add `refName = React.createRef();` as a class field\
    \ (or in constructor)\n2. Replace `ref=\"refName\"` \u2192 `ref={this.refName}`\
    \ in JSX\n3. Replace `this.refs.refName` \u2192 `this.refName.current` everywhere\n\
    \nRead `references/patterns.md` for the full before/after for each case."
