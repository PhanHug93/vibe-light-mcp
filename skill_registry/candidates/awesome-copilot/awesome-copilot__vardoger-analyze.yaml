  text: "# Analyze Copilot CLI history and generate personalized instructions\n\n\
    Drive the local `vardoger` CLI to read the user's GitHub Copilot CLI conversation\
    \ history, extract behavioral patterns, and write a personalization block into\
    \ `~/.copilot/copilot-instructions.md`.\n\n## How it works\n\n`vardoger` prepares\
    \ the history in batches. You (the assistant) summarize each batch for behavioral\
    \ signals, then synthesize all summaries into a final personalization. `vardoger`\
    \ writes the result, fenced by `<!-- vardoger:start -->` / `<!-- vardoger:end\
    \ -->` markers so any hand-authored rules in the same file are preserved.\n\n\
    ## Sandbox note (read before running any command)\n\n`vardoger` reads and writes\
    \ files **outside** the current workspace:\n\n- Reads Copilot CLI history from\
    \ `~/.copilot/session-state/`.\n- Writes a checkpoint state file to `~/.vardoger/state.json`\
    \ (created on first run).\n- Writes the final personalization to `~/.copilot/copilot-instructions.md`.\n\
    \nWhen the host asks to approve a `vardoger` command, grant it write access beyond\
    \ the workspace. Otherwise the first `vardoger prepare` call will fail with `PermissionError:\
    \ ... ~/.vardoger/state.tmp` because the sandbox blocks writes outside the current\
    \ working directory.\n\n## Workflow\n\n1. Verify the `vardoger` CLI is installed\
    \ and fail fast with install guidance if not.\n2. Check staleness with `vardoger\
    \ status --platform copilot --json` and stop early if the personalization is still\
    \ fresh.\n3. Get batch metadata with `vardoger prepare --platform copilot` to\
    \ learn the number of batches.\n4. For each batch, run `vardoger prepare --platform\
    \ copilot --batch <N>` and write a concise bullet summary of the behavioral signals.\n\
    5. Get the synthesis prompt with `vardoger prepare --platform copilot --synthesize`.\n\
    6. Synthesize all batch summaries into a single personalization following the\
    \ synthesis prompt.\n7. Write the result by piping the personalization into `vardoger\
    \ write --platform copilot --scope global` (or `--scope project --project <path>`).\n\
    8. Report back to the user what was written, where, and that the write is idempotent.\n\
    \n## Steps\n\n### 1. Verify vardoger is installed\n\n```bash\nif ! command -v\
    \ vardoger >/dev/null 2>&1; then\n  cat <<'INSTALL_EOF'\nvardoger CLI is not installed.\n\
    \nThis skill calls the `vardoger` CLI to read your Copilot CLI history and\nwrite\
    \ a personalization file, so the CLI must be on PATH.\n\nInstall options:\n\n\
    \  # Recommended:\n  pipx install vardoger\n\n  # Or run without installing:\n\
    \  uvx vardoger --help\n\nIf you do not have pipx, see https://pipx.pypa.io/stable/installation/.\n\
    \nProject page: https://github.com/dstrupl/vardoger\n\nAfter installing, re-run\
    \ the personalization request.\nINSTALL_EOF\n  exit 1\nfi\n```\n\n### 2. Check\
    \ if a refresh is needed\n\n```bash\nvardoger status --platform copilot --json\n\
    ```\n\nIf the output shows `\"is_stale\": false`, tell the user their personalization\
    \ is up to date and ask if they want to re-run anyway. If stale or never generated,\
    \ continue with the analysis.\n\n### 3. Get batch metadata\n\n```bash\nvardoger\
    \ prepare --platform copilot\n```\n\nThis prints JSON like `{\"batches\": 3, \"\
    total_conversations\": 29}`. Note the number of batches. Tell the user: \"Found\
    \ N conversations in M batches. Analyzing...\"\n\n### 4. Summarize each batch\n\
    \nFor each batch number from 1 to N, run:\n\n```bash\nvardoger prepare --platform\
    \ copilot --batch 1\n```\n\nThe output contains a summarization prompt followed\
    \ by conversation data. Read the output carefully and produce a concise bullet-point\
    \ summary of the behavioral signals you observe in that batch. Keep your summary\
    \ for later.\n\nTell the user which batch you are processing: \"Analyzing batch\
    \ 1 of N...\"\n\nRepeat for all batches (`--batch 2`, `--batch 3`, etc.).\n\n\
    ### 5. Get the synthesis prompt\n\n```bash\nvardoger prepare --platform copilot\
    \ --synthesize\n```\n\n### 6. Synthesize the personalization\n\nFollowing the\
    \ synthesis prompt, combine all your batch summaries into a single personalization.\
    \ The output should be clean markdown with actionable instructions for an AI assistant.\n\
    \n### 7. Write the result\n\nPipe your personalization to `vardoger`:\n\n```bash\n\
    echo \"YOUR_PERSONALIZATION_HERE\" | vardoger write --platform copilot --scope\
    \ global\n```\n\nReplace `YOUR_PERSONALIZATION_HERE` with the actual personalization\
    \ markdown you generated. `--scope global` writes to `~/.copilot/copilot-instructions.md`;\
    \ use `--scope project --project <path>` to scope the write to a specific repository\
    \ instead.\n\n### 8. Report to the user\n\nTell the user what was written and\
    \ where. Mention they can ask you to re-run vardoger any time to update the personalization,\
    \ and that writes are idempotent (the fenced block is replaced; anything outside\
    \ it is preserved).\n\n## When to use\n\n- When the user asks to personalize their\
    \ Copilot CLI assistant.\n- When the user asks to analyze their Copilot CLI conversation\
    \ history.\n- When the user mentions \"vardoger\"."
