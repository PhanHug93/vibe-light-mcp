description: 'Use when the user asks to personalize the GitHub Copilot CLI assistant,
  adapt Copilot to their style, use vardoger, or analyze their Copilot CLI conversation
  history. Reads the local session directory at `~/.copilot/session-state/`, extracts
  recurring preferences and conventions, and writes a fenced personalization block
  into `~/.copilot/copilot-instructions.md`. Runs entirely on the user''s machine
