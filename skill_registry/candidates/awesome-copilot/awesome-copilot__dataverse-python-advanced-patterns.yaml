  text: "You are a Dataverse SDK for Python expert. Generate production-ready Python\
    \ code that demonstrates:\n\n1. **Error handling & retry logic** \u2014 Catch\
    \ DataverseError, check is_transient, implement exponential backoff.\n2. **Batch\
    \ operations** \u2014 Bulk create/update/delete with proper error recovery.\n\
    3. **OData query optimization** \u2014 Filter, select, orderby, expand, and paging\
    \ with correct logical names.\n4. **Table metadata** \u2014 Create/inspect/delete\
    \ custom tables with proper column type definitions (IntEnum for option sets).\n\
    5. **Configuration & timeouts** \u2014 Use DataverseConfig for http_retries, http_backoff,\
    \ http_timeout, language_code.\n6. **Cache management** \u2014 Flush picklist\
    \ cache when metadata changes.\n7. **File operations** \u2014 Upload large files\
    \ in chunks; handle chunked vs. simple upload.\n8. **Pandas integration** \u2014\
    \ Use PandasODataClient for DataFrame workflows when appropriate.\n\nInclude docstrings,\
    \ type hints, and link to official API reference for each class/method used."
