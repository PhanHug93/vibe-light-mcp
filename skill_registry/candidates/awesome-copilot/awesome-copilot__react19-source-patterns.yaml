  text: "# React 19 Source Migration Patterns\n\nReference for every source-file migration\
    \ required for React 19.\n\n## Quick Reference Table\n\n| Pattern | Action | Reference\
    \ |\n|---|---|---|\n| `ReactDOM.render(...)` | \u2192 `createRoot().render()`\
    \ | See references/api-migrations.md |\n| `ReactDOM.hydrate(...)` | \u2192 `hydrateRoot(...)`\
    \ | See references/api-migrations.md |\n| `unmountComponentAtNode` | \u2192 `root.unmount()`\
    \ | Inline fix |\n| `ReactDOM.findDOMNode` | \u2192 direct ref | Inline fix |\n\
    | `forwardRef(...)` wrapper | \u2192 ref as direct prop | See references/api-migrations.md\
    \ |\n| `Component.defaultProps = {}` | \u2192 ES6 default params | See references/api-migrations.md\
    \ |\n| `useRef()` no arg | \u2192 `useRef(null)` | Inline fix  add `null` |\n\
    | Legacy Context | \u2192 `createContext` | [\u2192 api-migrations.md#legacy-context](references/api-migrations.md#legacy-context)\
    \ |\n| String refs `this.refs.x` | \u2192 `createRef()` | [\u2192 api-migrations.md#string-refs](references/api-migrations.md#string-refs)\
    \ |\n| `import React from 'react'` (unused) | Remove | Only if no `React.` usage\
    \ in file |\n\n## PropTypes Rule\n\nDo **not** remove `.propTypes` assignments.\
    \ The `prop-types` package still works as a standalone validator. React 19 only\
    \ removes the built-in runtime checking from the React package  the package itself\
    \ remains valid.\n\nAdd this comment above any `.propTypes` block:\n```jsx\n//\
    \ NOTE: React 19 no longer runs propTypes validation at runtime.\n// PropTypes\
    \ kept for documentation and IDE tooling only.\n```\n\n## Read the Reference\n\
    \nFor full before/after code for each migration, read **`references/api-migrations.md`**.\
    \ It contains the complete patterns including edge cases for `forwardRef` with\
    \ `useImperativeHandle`, `defaultProps` null vs undefined behavior, and legacy\
    \ context provider/consumer cross-file migrations."
