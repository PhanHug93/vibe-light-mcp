  text: "# Microsoft Skill Creator\n\nCreate hybrid skills for Microsoft technologies\
    \ that store essential knowledge locally while enabling dynamic Learn MCP lookups\
    \ for deeper details.\n\n## About Skills\n\nSkills are modular packages that extend\
    \ agent capabilities with specialized knowledge and workflows. A skill transforms\
    \ a general-purpose agent into a specialized one for a specific domain.\n\n###\
    \ Skill Structure\n\n```\nskill-name/\n\u251C\u2500\u2500 SKILL.md (required)\
    \     # Frontmatter (name, description) + instructions\n\u251C\u2500\u2500 references/\
    \             # Documentation loaded into context as needed\n\u251C\u2500\u2500\
    \ sample_codes/           # Working code examples\n\u2514\u2500\u2500 assets/\
    \                 # Files used in output (templates, etc.)\n```\n\n### Key Principles\n\
    \n- **Frontmatter is critical**: `name` and `description` determine when the skill\
    \ triggers\u2014be clear and comprehensive\n- **Concise is key**: Only include\
    \ what agents don't already know; context window is shared\n- **No duplication**:\
    \ Information lives in SKILL.md OR reference files, not both\n\n## Learn MCP Tools\n\
    \n| Tool | Purpose | When to Use |\n|------|---------|-------------|\n| `microsoft_docs_search`\
    \ | Search official docs | First pass discovery, finding topics |\n| `microsoft_docs_fetch`\
    \ | Get full page content | Deep dive into important pages |\n| `microsoft_code_sample_search`\
    \ | Find code examples | Get implementation patterns |\n\n### CLI Alternative\n\
    \nIf the Learn MCP server is not available, use the `mslearn` CLI from a terminal\
    \ or shell (for example, Bash, PowerShell, or cmd) instead:\n\n```bash\n# Run\
    \ directly (no install needed)\nnpx @microsoft/learn-cli search \"semantic kernel\
    \ overview\"\n\n# Or install globally, then run\nnpm install -g @microsoft/learn-cli\n\
    mslearn search \"semantic kernel overview\"\n```\n\n| MCP Tool | CLI Command |\n\
    |----------|-------------|\n| `microsoft_docs_search(query: \"...\")` | `mslearn\
    \ search \"...\"` |\n| `microsoft_code_sample_search(query: \"...\", language:\
    \ \"...\")` | `mslearn code-search \"...\" --language ...` |\n| `microsoft_docs_fetch(url:\
    \ \"...\")` | `mslearn fetch \"...\"` |\n\nGenerated skills should include this\
    \ same CLI fallback table so agents can use either path.\n\n## Creation Process\n\
    \n### Step 1: Investigate the Topic\n\nBuild deep understanding using Learn MCP\
    \ tools in three phases:\n\n**Phase 1 - Scope Discovery:**\n```\nmicrosoft_docs_search(query=\"\
    {technology} overview what is\")\nmicrosoft_docs_search(query=\"{technology} concepts\
    \ architecture\")\nmicrosoft_docs_search(query=\"{technology} getting started\
    \ tutorial\")\n```\n\n**Phase 2 - Core Content:**\n```\nmicrosoft_docs_fetch(url=\"\
    ...\")  # Fetch pages from Phase 1\nmicrosoft_code_sample_search(query=\"{technology}\"\
    , language=\"{lang}\")\n```\n\n**Phase 3 - Depth:**\n```\nmicrosoft_docs_search(query=\"\
    {technology} best practices\")\nmicrosoft_docs_search(query=\"{technology} troubleshooting\
    \ errors\")\n```\n\n#### Investigation Checklist\n\nAfter investigating, verify:\n\
    - [ ] Can explain what the technology does in one paragraph\n- [ ] Identified\
    \ 3-5 key concepts\n- [ ] Have working code for basic usage\n- [ ] Know the most\
    \ common API patterns\n- [ ] Have search queries for deeper topics\n\n### Step\
    \ 2: Clarify with User\n\nPresent findings and ask:\n1. \"I found these key areas:\
    \ [list]. Which are most important?\"\n2. \"What tasks will agents primarily perform\
    \ with this skill?\"\n3. \"Which programming language should code samples prioritize?\"\
    \n\n### Step 3: Generate the Skill\n\nUse the appropriate template from [skill-templates.md](references/skill-templates.md):\n\
    \n| Technology Type | Template |\n|-----------------|----------|\n| Client library,\
    \ NuGet/npm package | SDK/Library |\n| Azure resource | Azure Service |\n| App\
    \ development framework | Framework/Platform |\n| REST API, protocol | API/Protocol\
    \ |\n\n#### Generated Skill Structure\n\n```\n{skill-name}/\n\u251C\u2500\u2500\
    \ SKILL.md                    # Core knowledge + Learn MCP guidance\n\u251C\u2500\
    \u2500 references/                 # Detailed local documentation (if needed)\n\
    \u2514\u2500\u2500 sample_codes/               # Working code examples\n    \u251C\
    \u2500\u2500 getting-started/\n    \u2514\u2500\u2500 common-patterns/\n```\n\n\
    ### Step 4: Balance Local vs Dynamic Content\n\n**Store locally when:**\n- Foundational\
    \ (needed for any task)\n- Frequently accessed\n- Stable (won't change)\n- Hard\
    \ to find via search\n\n**Keep dynamic when:**\n- Exhaustive reference (too large)\n\
    - Version-specific\n- Situational (specific tasks only)\n- Well-indexed (easy\
    \ to search)\n\n#### Content Guidelines\n\n| Content Type | Local | Dynamic |\n\
    |--------------|-------|---------|\n| Core concepts (3-5) | \u2705 Full | |\n\
    | Hello world code | \u2705 Full | |\n| Common patterns (3-5) | \u2705 Full |\
    \ |\n| Top API methods | Signature + example | Full docs via fetch |\n| Best practices\
    \ | Top 5 bullets | Search for more |\n| Troubleshooting | | Search queries |\n\
    | Full API reference | | Doc links |\n\n### Step 5: Validate\n\n1. Review: Is\
    \ local content sufficient for common tasks?\n2. Test: Do suggested search queries\
    \ return useful results?\n3. Verify: Do code samples run without errors?\n\n##\
    \ Common Investigation Patterns\n\n### For SDKs/Libraries\n```\n\"{name} overview\"\
    \ \u2192 purpose, architecture\n\"{name} getting started quickstart\" \u2192 setup\
    \ steps\n\"{name} API reference\" \u2192 core classes/methods\n\"{name} samples\
    \ examples\" \u2192 code patterns\n\"{name} best practices performance\" \u2192\
    \ optimization\n```\n\n### For Azure Services\n```\n\"{service} overview features\"\
    \ \u2192 capabilities\n\"{service} quickstart {language}\" \u2192 setup code\n\
    \"{service} REST API reference\" \u2192 endpoints\n\"{service} SDK {language}\"\
    \ \u2192 client library\n\"{service} pricing limits quotas\" \u2192 constraints\n\
    ```\n\n### For Frameworks/Platforms\n```\n\"{framework} architecture concepts\"\
    \ \u2192 mental model\n\"{framework} project structure\" \u2192 conventions\n\"\
    {framework} tutorial walkthrough\" \u2192 end-to-end flow\n\"{framework} configuration\
    \ options\" \u2192 customization\n```\n\n## Example: Creating a \"Semantic Kernel\"\
    \ Skill\n\n### Investigation\n\n```\nmicrosoft_docs_search(query=\"semantic kernel\
    \ overview\")\nmicrosoft_docs_search(query=\"semantic kernel plugins functions\"\
    )\nmicrosoft_code_sample_search(query=\"semantic kernel\", language=\"csharp\"\
    )\nmicrosoft_docs_fetch(url=\"https://learn.microsoft.com/semantic-kernel/overview/\"\
    )\n```\n\n### Generated Skill\n\n```\nsemantic-kernel/\n\u251C\u2500\u2500 SKILL.md\n\
    \u2514\u2500\u2500 sample_codes/\n    \u251C\u2500\u2500 getting-started/\n  \
    \  \u2502   \u2514\u2500\u2500 hello-kernel.cs\n    \u2514\u2500\u2500 common-patterns/\n\
    \        \u251C\u2500\u2500 chat-completion.cs\n        \u2514\u2500\u2500 function-calling.cs\n\
    ```\n\n### Generated SKILL.md\n\n```markdown\n---\nname: semantic-kernel\ndescription:\
    \ Build AI agents with Microsoft Semantic Kernel. Use for LLM-powered apps with\
    \ plugins, planners, and memory in .NET or Python.\n---\n\n# Semantic Kernel\n\
    \nOrchestration SDK for integrating LLMs into applications with plugins, planners,\
    \ and memory.\n\n## Key Concepts\n\n- **Kernel**: Central orchestrator managing\
    \ AI services and plugins\n- **Plugins**: Collections of functions the AI can\
    \ call\n- **Planner**: Sequences plugin functions to achieve goals\n- **Memory**:\
    \ Vector store integration for RAG patterns\n\n## Quick Start\n\nSee [getting-started/hello-kernel.cs](sample_codes/getting-started/hello-kernel.cs)\n\
    \n## Learn More\n\n| Topic | How to Find |\n|-------|-------------|\n| Plugin\
    \ development | `microsoft_docs_search(query=\"semantic kernel plugins custom\
    \ functions\")` |\n| Planners | `microsoft_docs_search(query=\"semantic kernel\
    \ planner\")` |\n| Memory | `microsoft_docs_fetch(url=\"https://learn.microsoft.com/en-us/semantic-kernel/frameworks/agent/agent-memory\"\
    )` |\n\n## CLI Alternative\n\nIf the Learn MCP server is not available, use the\
    \ `mslearn` CLI instead:\n\n| MCP Tool | CLI Command |\n|----------|-------------|\n\
    | `microsoft_docs_search(query: \"...\")` | `mslearn search \"...\"` |\n| `microsoft_code_sample_search(query:\
    \ \"...\", language: \"...\")` | `mslearn code-search \"...\" --language ...`\
    \ |\n| `microsoft_docs_fetch(url: \"...\")` | `mslearn fetch \"...\"` |\n\nRun\
    \ directly with `npx @microsoft/learn-cli <command>` or install globally with\
    \ `npm install -g @microsoft/learn-cli`.\n```"
