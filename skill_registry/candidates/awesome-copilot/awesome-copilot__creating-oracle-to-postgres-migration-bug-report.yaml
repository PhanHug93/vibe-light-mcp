  text: "# Creating Bug Reports for Oracle-to-PostgreSQL Migration\n\n## When to Use\n\
    \n- Documenting a defect caused by behavioral differences between Oracle and PostgreSQL\n\
    - Writing or reviewing a bug report for an Oracle-to-PostgreSQL migration project\n\
    \n## Bug Report Format\n\nUse the template in [references/BUG-REPORT-TEMPLATE.md](references/BUG-REPORT-TEMPLATE.md).\
    \ Each report must include:\n\n- **Status**: \u2705 RESOLVED, \u26D4 UNRESOLVED,\
    \ or \u23F3 IN PROGRESS\n- **Component**: Affected endpoint, repository, or stored\
    \ procedure\n- **Test**: Related automated test names\n- **Severity**: Low / Medium\
    \ / High / Critical \u2014 based on impact scope\n- **Problem**: Expected Oracle\
    \ behavior vs. observed PostgreSQL behavior\n- **Scenario**: Ordered reproduction\
    \ steps with seed data, operation, expected result, and actual result\n- **Root\
    \ Cause**: The specific Oracle/PostgreSQL behavioral difference causing the defect\n\
    - **Solution**: Changes made or required, with explicit file paths\n- **Validation**:\
    \ Steps to confirm the fix on both databases\n\n## Oracle-to-PostgreSQL Guidance\n\
    \n- **Oracle is the source of truth** \u2014 frame expected behavior from the\
    \ Oracle baseline\n- Call out data layer nuances explicitly: empty string vs.\
    \ NULL, type coercion strictness, collation, sequence values, time zones, padding,\
    \ constraints\n- Client code changes should be avoided unless required for correct\
    \ behavior; when proposed, document and justify them clearly\n\n## Writing Style\n\
    \n- Plain language, short sentences, clear next actions\n- Present or past tense\
    \ consistently\n- Bullets and numbered lists for steps and validations\n- Minimal\
    \ SQL excerpts and logs as evidence; omit sensitive data and keep snippets reproducible\n\
    - Stick to existing runtime/language versions; avoid speculative fixes\n\n## Filename\
    \ Convention\n\nSave bug reports as `BUG_REPORT_<DescriptiveSlug>.md` where `<DescriptiveSlug>`\
    \ is a short PascalCase identifier (e.g., `EmptyStringNullHandling`, `RefCursorUnwrapFailure`)."
