description: Apply GDPR-compliant engineering practices across your codebase. Use
  this skill whenever you are designing APIs, writing data models, building authentication
  flows, implementing logging, handling user data, writing retention/deletion jobs,
  designing cloud infrastructure, or reviewing pull requests for privacy compliance.
  Trigger this skill for any task involving personal data, user accounts, cookies,
  analytics, emails, audit logs, encryption, pseudonymization, anonymization, data
  exports, breach response, CI/CD pipelines that process real data, or any question
  framed as "is this GDPR-compliant?". Inspired by CNIL developer guidance and GDPR
  Articles 5, 25, 32, 33, 35.
