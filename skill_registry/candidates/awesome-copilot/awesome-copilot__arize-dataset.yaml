  text: "# Arize Dataset Skill\n\n> **`SPACE`** \u2014 All `--space` flags and the\
    \ `ARIZE_SPACE` env var accept a space **name** (e.g., `my-workspace`) or a base64\
    \ space **ID** (e.g., `U3BhY2U6...`). Find yours with `ax spaces list`.\n\n##\
    \ Concepts\n\n- **Dataset** = a versioned collection of examples used for evaluation\
    \ and experimentation\n- **Dataset Version** = a snapshot of a dataset at a point\
    \ in time; updates can be in-place or create a new version\n- **Example** = a\
    \ single record in a dataset with arbitrary user-defined fields (e.g., `question`,\
    \ `answer`, `context`)\n- **Space** = an organizational container; datasets belong\
    \ to a space\n\nSystem-managed fields on examples (`id`, `created_at`, `updated_at`)\
    \ are auto-generated by the server -- never include them in create or append payloads.\n\
    \n## Prerequisites\n\nProceed directly with the task \u2014 run the `ax` command\
    \ you need. Do NOT check versions, env vars, or profiles upfront.\n\nIf an `ax`\
    \ command fails, troubleshoot based on the error:\n- `command not found` or version\
    \ error \u2192 see references/ax-setup.md\n- `401 Unauthorized` / missing API\
    \ key \u2192 run `ax profiles show` to inspect the current profile. If the profile\
    \ is missing or the API key is wrong, follow references/ax-profiles.md to create/update\
    \ it. If the user doesn't have their key, direct them to https://app.arize.com/admin\
    \ > API Keys\n- Space unknown \u2192 run `ax spaces list` to pick by name, or\
    \ ask the user\n- Project unclear \u2192 ask the user, or run `ax projects list\
    \ -o json --limit 100` and present as selectable options\n- **Security:** Never\
    \ read `.env` files or search the filesystem for credentials. Use `ax profiles`\
    \ for Arize credentials and `ax ai-integrations` for LLM provider keys. If credentials\
    \ are not available through these channels, ask the user.\n\n## List Datasets:\
    \ `ax datasets list`\n\nBrowse datasets in a space. Output goes to stdout.\n\n\
    ```bash\nax datasets list\nax datasets list --space SPACE --limit 20\nax datasets\
    \ list --cursor CURSOR_TOKEN\nax datasets list -o json\n```\n\n### Flags\n\n|\
    \ Flag | Type | Default | Description |\n|------|------|---------|-------------|\n\
    | `--space` | string | from profile | Filter by space |\n| `--limit, -l` | int\
    \ | 15 | Max results (1-100) |\n| `--cursor` | string | none | Pagination cursor\
    \ from previous response |\n| `-o, --output` | string | table | Output format:\
    \ table, json, csv, parquet, or file path |\n| `-p, --profile` | string | default\
    \ | Configuration profile |\n\n## Get Dataset: `ax datasets get`\n\nQuick metadata\
    \ lookup -- returns dataset name, space, timestamps, and version list.\n\n```bash\n\
    ax datasets get NAME_OR_ID\nax datasets get NAME_OR_ID -o json\nax datasets get\
    \ NAME_OR_ID --space SPACE   # required when using dataset name instead of ID\n\
    ```\n\n### Flags\n\n| Flag | Type | Default | Description |\n|------|------|---------|-------------|\n\
    | `NAME_OR_ID` | string | required | Dataset name or ID (positional) |\n| `--space`\
    \ | string | none | Space name or ID (required if using dataset name instead of\
    \ ID) |\n| `-o, --output` | string | table | Output format |\n| `-p, --profile`\
    \ | string | default | Configuration profile |\n\n### Response fields\n\n| Field\
    \ | Type | Description |\n|-------|------|-------------|\n| `id` | string | Dataset\
    \ ID |\n| `name` | string | Dataset name |\n| `space_id` | string | Space this\
    \ dataset belongs to |\n| `created_at` | datetime | When the dataset was created\
    \ |\n| `updated_at` | datetime | Last modification time |\n| `versions` | array\
    \ | List of dataset versions (id, name, dataset_id, created_at, updated_at) |\n\
    \n## Export Dataset: `ax datasets export`\n\nDownload all examples to a file.\
    \ Use `--all` for datasets larger than 500 examples (unlimited bulk export).\n\
    \n```bash\nax datasets export NAME_OR_ID\n# -> dataset_abc123_20260305_141500/examples.json\n\
    \nax datasets export NAME_OR_ID --all\nax datasets export NAME_OR_ID --version-id\
    \ VERSION_ID\nax datasets export NAME_OR_ID --output-dir ./data\nax datasets export\
    \ NAME_OR_ID --stdout\nax datasets export NAME_OR_ID --stdout | jq '.[0]'\nax\
    \ datasets export NAME_OR_ID --space SPACE   # required when using dataset name\
    \ instead of ID\n```\n\n### Flags\n\n| Flag | Type | Default | Description |\n\
    |------|------|---------|-------------|\n| `NAME_OR_ID` | string | required |\
    \ Dataset name or ID (positional) |\n| `--space` | string | none | Space name\
    \ or ID (required if using dataset name instead of ID) |\n| `--version-id` | string\
    \ | latest | Export a specific dataset version |\n| `--all` | bool | false | Unlimited\
    \ bulk export (use for datasets > 500 examples) |\n| `--output-dir` | string |\
    \ `.` | Output directory |\n| `--stdout` | bool | false | Print JSON to stdout\
    \ instead of file |\n| `-p, --profile` | string | default | Configuration profile\
    \ |\n\n**Agent auto-escalation rule:** If an export returns exactly 500 examples,\
    \ the result is likely truncated \u2014 re-run with `--all` to get the full dataset.\n\
    \n**Export completeness verification:** After exporting, confirm the row count\
    \ matches what the server reports:\n```bash\n# Get the server-reported count from\
    \ dataset metadata\nax datasets get DATASET_NAME --space SPACE -o json | jq '.versions[-1]\
    \ | {version: .id, examples: .example_count}'\n\n# Compare to what was exported\n\
    jq 'length' dataset_*/examples.json\n\n# If counts differ, re-export with --all\n\
    ```\n\nOutput is a JSON array of example objects. Each example has system fields\
    \ (`id`, `created_at`, `updated_at`) plus all user-defined fields:\n\n```json\n\
    [\n  {\n    \"id\": \"ex_001\",\n    \"created_at\": \"2026-01-15T10:00:00Z\"\
    ,\n    \"updated_at\": \"2026-01-15T10:00:00Z\",\n    \"question\": \"What is\
    \ 2+2?\",\n    \"answer\": \"4\",\n    \"topic\": \"math\"\n  }\n]\n```\n\n##\
    \ Create Dataset: `ax datasets create`\n\nCreate a new dataset from a data file.\n\
    \n```bash\nax datasets create --name \"My Dataset\" --space SPACE --file data.csv\n\
    ax datasets create --name \"My Dataset\" --space SPACE --file data.json\nax datasets\
    \ create --name \"My Dataset\" --space SPACE --file data.jsonl\nax datasets create\
    \ --name \"My Dataset\" --space SPACE --file data.parquet\n```\n\n### Flags\n\n\
    | Flag | Type | Required | Description |\n|------|------|----------|-------------|\n\
    | `--name, -n` | string | yes | Dataset name |\n| `--space` | string | yes | Space\
    \ to create the dataset in |\n| `--file, -f` | path | yes | Data file: CSV, JSON,\
    \ JSONL, or Parquet |\n| `-o, --output` | string | no | Output format for the\
    \ returned dataset metadata |\n| `-p, --profile` | string | no | Configuration\
    \ profile |\n\n### Passing data via stdin\n\nUse `--file -` to pipe data directly\
    \ \u2014 no temp file needed:\n\n```bash\necho '[{\"question\": \"What is 2+2?\"\
    , \"answer\": \"4\"}]' | ax datasets create --name \"my-dataset\" --space SPACE\
    \ --file -\n\n# Or with a heredoc\nax datasets create --name \"my-dataset\" --space\
    \ SPACE --file - << 'EOF'\n[{\"question\": \"What is 2+2?\", \"answer\": \"4\"\
    }]\nEOF\n```\n\nTo add rows to an existing dataset, use `ax datasets append --json\
    \ '[...]'` instead \u2014 no file needed.\n\n### Supported file formats\n\n| Format\
    \ | Extension | Notes |\n|--------|-----------|-------|\n| CSV | `.csv` | Column\
    \ headers become field names |\n| JSON | `.json` | Array of objects |\n| JSON\
    \ Lines | `.jsonl` | One object per line (NOT a JSON array) |\n| Parquet | `.parquet`\
    \ | Column names become field names; preserves types |\n\n**Format gotchas:**\n\
    - **CSV**: Loses type information \u2014 dates become strings, `null` becomes\
    \ empty string. Use JSON/Parquet to preserve types.\n- **JSONL**: Each line is\
    \ a separate JSON object. A JSON array (`[{...}, {...}]`) in a `.jsonl` file will\
    \ fail \u2014 use `.json` extension instead.\n- **Parquet**: Preserves column\
    \ types. Requires `pandas`/`pyarrow` to read locally: `pd.read_parquet(\"examples.parquet\"\
    )`.\n\n## Append Examples: `ax datasets append`\n\nAdd examples to an existing\
    \ dataset. Two input modes -- use whichever fits.\n\n### Inline JSON (agent-friendly)\n\
    \nGenerate the payload directly -- no temp files needed:\n\n```bash\nax datasets\
    \ append DATASET_NAME --space SPACE --json '[{\"question\": \"What is 2+2?\",\
    \ \"answer\": \"4\"}]'\n\nax datasets append DATASET_NAME --space SPACE --json\
    \ '[\n  {\"question\": \"What is gravity?\", \"answer\": \"A fundamental force...\"\
    },\n  {\"question\": \"What is light?\", \"answer\": \"Electromagnetic radiation...\"\
    }\n]'\n```\n\n### From a file\n\n```bash\nax datasets append DATASET_NAME --space\
    \ SPACE --file new_examples.csv\nax datasets append DATASET_NAME --space SPACE\
    \ --file additions.json\n```\n\n### To a specific version\n\n```bash\nax datasets\
    \ append DATASET_NAME --space SPACE --json '[{\"q\": \"...\"}]' --version-id VERSION_ID\n\
    ```\n\n### Flags\n\n| Flag | Type | Required | Description |\n|------|------|----------|-------------|\n\
    | `NAME_OR_ID` | string | yes | Dataset name or ID (positional); add `--space`\
    \ when using name |\n| `--space` | string | no | Space name or ID (required if\
    \ using dataset name instead of ID) |\n| `--json` | string | mutex | JSON array\
    \ of example objects |\n| `--file, -f` | path | mutex | Data file (CSV, JSON,\
    \ JSONL, Parquet) |\n| `--version-id` | string | no | Append to a specific version\
    \ (default: latest) |\n| `-o, --output` | string | no | Output format for the\
    \ returned dataset metadata |\n| `-p, --profile` | string | no | Configuration\
    \ profile |\n\nExactly one of `--json` or `--file` is required.\n\n### Validation\n\
    \n- Each example must be a JSON object with at least one user-defined field\n\
    - Maximum 100,000 examples per request\n\n**Schema validation before append:**\
    \ If the dataset already has examples, inspect its schema before appending to\
    \ avoid silent field mismatches:\n\n```bash\n# Check existing field names in the\
    \ dataset\nax datasets export DATASET_NAME --space SPACE --stdout | jq '.[0] |\
    \ keys'\n\n# Verify your new data has matching field names\necho '[{\"question\"\
    : \"...\"}]' | jq '.[0] | keys'\n\n# Both outputs should show the same user-defined\
    \ fields\n```\n\nFields are free-form: extra fields in new examples are added,\
    \ and missing fields become null. However, typos in field names (e.g., `queston`\
    \ vs `question`) create new columns silently -- verify spelling before appending.\n\
    \n## Delete Dataset: `ax datasets delete`\n\n```bash\nax datasets delete NAME_OR_ID\n\
    ax datasets delete NAME_OR_ID --space SPACE   # required when using dataset name\
    \ instead of ID\nax datasets delete NAME_OR_ID --force   # skip confirmation prompt\n\
    ```\n\n### Flags\n\n| Flag | Type | Default | Description |\n|------|------|---------|-------------|\n\
    | `NAME_OR_ID` | string | required | Dataset name or ID (positional) |\n| `--space`\
    \ | string | none | Space name or ID (required if using dataset name instead of\
    \ ID) |\n| `--force, -f` | bool | false | Skip confirmation prompt |\n| `-p, --profile`\
    \ | string | default | Configuration profile |\n\n## Workflows\n\n### Find a dataset\
    \ by name\n\nAll dataset commands accept a name or ID directly. You can pass a\
    \ dataset name as the positional argument (add `--space SPACE` when not using\
    \ an ID):\n\n```bash\n# Use name directly\nax datasets get \"eval-set-v1\" --space\
    \ SPACE\nax datasets export \"eval-set-v1\" --space SPACE\n\n# Or resolve name\
    \ to ID via list if you need the base64 ID\nax datasets list -o json | jq '.[]\
    \ | select(.name == \"eval-set-v1\") | .id'\n```\n\n### Create a dataset from\
    \ file for evaluation\n\n1. Prepare a CSV/JSON/Parquet file with your evaluation\
    \ columns (e.g., `input`, `expected_output`)\n   - If generating data inline,\
    \ pipe it via stdin using `--file -` (see the Create Dataset section)\n2. `ax\
    \ datasets create --name \"eval-set-v1\" --space SPACE --file eval_data.csv`\n\
    3. Verify: `ax datasets get DATASET_NAME --space SPACE`\n4. Use the dataset name\
    \ to run experiments\n\n### Add examples to an existing dataset\n\n```bash\n#\
    \ Find the dataset\nax datasets list --space SPACE\n\n# Append inline or from\
    \ a file using the dataset name (see Append Examples section for full syntax)\n\
    ax datasets append DATASET_NAME --space SPACE --json '[{\"question\": \"...\"\
    , \"answer\": \"...\"}]'\nax datasets append DATASET_NAME --space SPACE --file\
    \ additional_examples.csv\n```\n\n### Download dataset for offline analysis\n\n\
    1. `ax datasets list --space SPACE` -- find the dataset name\n2. `ax datasets\
    \ export DATASET_NAME --space SPACE` -- download to file\n3. Parse the JSON: `jq\
    \ '.[] | .question' dataset_*/examples.json`\n\n### Export a specific version\n\
    \n```bash\n# List versions\nax datasets get DATASET_NAME --space SPACE -o json\
    \ | jq '.versions'\n\n# Export that version\nax datasets export DATASET_NAME --space\
    \ SPACE --version-id VERSION_ID\n```\n\n### Iterate on a dataset\n\n1. Export\
    \ current version: `ax datasets export DATASET_NAME --space SPACE`\n2. Modify\
    \ the examples locally\n3. Append new rows: `ax datasets append DATASET_NAME --space\
    \ SPACE --file new_rows.csv`\n4. Or create a fresh version: `ax datasets create\
    \ --name \"eval-set-v2\" --space SPACE --file updated_data.json`\n\n### Pipe export\
    \ to other tools\n\n```bash\n# Count examples\nax datasets export DATASET_NAME\
    \ --space SPACE --stdout | jq 'length'\n\n# Extract a single field\nax datasets\
    \ export DATASET_NAME --space SPACE --stdout | jq '.[].question'\n\n# Convert\
    \ to CSV with jq\nax datasets export DATASET_NAME --space SPACE --stdout | jq\
    \ -r '.[] | [.question, .answer] | @csv'\n```\n\n## Dataset Example Schema\n\n\
    Examples are free-form JSON objects. There is no fixed schema -- columns are whatever\
    \ fields you provide. System-managed fields are added by the server:\n\n| Field\
    \ | Type | Managed by | Notes |\n|-------|------|-----------|-------|\n| `id`\
    \ | string | server | Auto-generated UUID. Required on update, forbidden on create/append\
    \ |\n| `created_at` | datetime | server | Immutable creation timestamp |\n| `updated_at`\
    \ | datetime | server | Auto-updated on modification |\n| *(any user field)* |\
    \ any JSON type | user | String, number, boolean, null, nested object, array |\n\
    \n\n## Related Skills\n\n- **arize-trace**: Export production spans to understand\
    \ what data to put in datasets \u2192 use `arize-trace`\n- **arize-experiment**:\
    \ Run evaluations against this dataset \u2192 next step is `arize-experiment`\n\
    - **arize-prompt-optimization**: Use dataset + experiment results to improve prompts\
    \ \u2192 use `arize-prompt-optimization`\n\n## Troubleshooting\n\n| Problem |\
    \ Solution |\n|---------|----------|\n| `ax: command not found` | See references/ax-setup.md\
    \ |\n| `401 Unauthorized` | API key is wrong, expired, or doesn't have access\
    \ to this space. Fix the profile using references/ax-profiles.md. |\n| `No profile\
    \ found` | No profile is configured. See references/ax-profiles.md to create one.\
    \ |\n| `Dataset not found` | Verify dataset ID with `ax datasets list` |\n| `File\
    \ format error` | Supported: CSV, JSON, JSONL, Parquet. Use `--file -` to read\
    \ from stdin. |\n| `platform-managed column` | Remove `id`, `created_at`, `updated_at`\
    \ from create/append payloads |\n| `reserved column` | Remove `time`, `count`,\
    \ or any `source_record_*` field |\n| `Provide either --json or --file` | Append\
    \ requires exactly one input source |\n| `Examples array is empty` | Ensure your\
    \ JSON array or file contains at least one example |\n| `not a JSON object` |\
    \ Each element in the `--json` array must be a `{...}` object, not a string or\
    \ number |\n\n## Save Credentials for Future Use\n\nSee references/ax-profiles.md\
    \ \xA7 Save Credentials for Future Use."
