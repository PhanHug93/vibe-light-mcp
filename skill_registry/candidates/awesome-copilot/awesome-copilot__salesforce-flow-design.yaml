description: Salesforce Flow architecture decisions, flow type selection, bulk safety
  validation, and fault handling standards. Use this skill when designing or reviewing
  Record-Triggered, Screen, Autolaunched, Scheduled, or Platform Event flows to ensure
  correct type selection, no DML/Get Records in loops, proper fault connectors on
  all data-changing elements, and appropriate automation density checks before deployment.
