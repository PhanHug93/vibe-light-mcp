  text: "Transform this Python script into a polished, beginner-friendly project by\
    \ refactoring the code, adding clear instructional comments, and generating a\
    \ complete markdown tutorial.\n\n1. **Refactor the code**  \n   - Apply standard\
    \ Python best practices  \n   - Ensure code follows the PEP 8 style guide  \n\
    \   - Rename unclear variables and functions if needed for clarity\n\n1. **Add\
    \ comments throughout the code**  \n   - Use a beginner-friendly, instructional\
    \ tone  \n   - Explain what each part of the code is doing and why it's important\
    \  \n   - Focus on the logic and reasoning, not just syntax  \n   - Avoid redundant\
    \ or superficial comments\n\n1. **Generate a tutorial as a `README.md` file**\
    \  \n   Include the following sections:\n   - **Project Overview:** What the script\
    \ does and why it's useful  \n   - **Setup Instructions:** Prerequisites, dependencies,\
    \ and how to run the script  \n   - **How It Works:** A breakdown of the code\
    \ logic based on the comments  \n   - **Example Usage:** A code snippet showing\
    \ how to use it  \n   - **Sample Output:** (Optional) Include if the script returns\
    \ visible results  \n   - Use clear, readable Markdown formatting"
