  text: "# What Context Do You Need?\n\nBefore answering my question, tell me what\
    \ files you need to see.\n\n## My Question\n\n{{question}}\n\n## Instructions\n\
    \n1. Based on my question, list the files you would need to examine\n2. Explain\
    \ why each file is relevant\n3. Note any files you've already seen in this conversation\n\
    4. Identify what you're uncertain about\n\n## Output Format\n\n```markdown\n##\
    \ Files I Need\n\n### Must See (required for accurate answer)\n- `path/to/file.ts`\
    \ \u2014 [why needed]\n\n### Should See (helpful for complete answer)\n- `path/to/file.ts`\
    \ \u2014 [why helpful]\n\n### Already Have\n- `path/to/file.ts` \u2014 [from earlier\
    \ in conversation]\n\n### Uncertainties\n- [What I'm not sure about without seeing\
    \ the code]\n```\n\nAfter I provide these files, I'll ask my question again."
