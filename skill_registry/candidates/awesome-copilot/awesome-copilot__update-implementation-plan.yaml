  text: "# Update Implementation Plan\n\n## Primary Directive\n\nYou are an AI agent\
    \ tasked with updating the implementation plan file `${file}` based on new or\
    \ updated requirements. Your output must be machine-readable, deterministic, and\
    \ structured for autonomous execution by other AI systems or humans.\n\n## Execution\
    \ Context\n\nThis prompt is designed for AI-to-AI communication and automated\
    \ processing. All instructions must be interpreted literally and executed systematically\
    \ without human interpretation or clarification.\n\n## Core Requirements\n\n-\
    \ Generate implementation plans that are fully executable by AI agents or humans\n\
    - Use deterministic language with zero ambiguity\n- Structure all content for\
    \ automated parsing and execution\n- Ensure complete self-containment with no\
    \ external dependencies for understanding\n\n## Plan Structure Requirements\n\n\
    Plans must consist of discrete, atomic phases containing executable tasks. Each\
    \ phase must be independently processable by AI agents or humans without cross-phase\
    \ dependencies unless explicitly declared.\n\n## Phase Architecture\n\n- Each\
    \ phase must have measurable completion criteria\n- Tasks within phases must be\
    \ executable in parallel unless dependencies are specified\n- All task descriptions\
    \ must include specific file paths, function names, and exact implementation details\n\
    - No task should require human interpretation or decision-making\n\n## AI-Optimized\
    \ Implementation Standards\n\n- Use explicit, unambiguous language with zero interpretation\
    \ required\n- Structure all content as machine-parseable formats (tables, lists,\
    \ structured data)\n- Include specific file paths, line numbers, and exact code\
    \ references where applicable\n- Define all variables, constants, and configuration\
    \ values explicitly\n- Provide complete context within each task description\n\
    - Use standardized prefixes for all identifiers (REQ-, TASK-, etc.)\n- Include\
    \ validation criteria that can be automatically verified\n\n## Output File Specifications\n\
    \n- Save implementation plan files in `/plan/` directory\n- Use naming convention:\
    \ `[purpose]-[component]-[version].md`\n- Purpose prefixes: `upgrade|refactor|feature|data|infrastructure|process|architecture|design`\n\
    - Example: `upgrade-system-command-4.md`, `feature-auth-module-1.md`\n- File must\
    \ be valid Markdown with proper front matter structure\n\n## Mandatory Template\
    \ Structure\n\nAll implementation plans must strictly adhere to the following\
    \ template. Each section is required and must be populated with specific, actionable\
    \ content. AI agents must validate template compliance before execution.\n\n##\
    \ Template Validation Rules\n\n- All front matter fields must be present and properly\
    \ formatted\n- All section headers must match exactly (case-sensitive)\n- All\
    \ identifier prefixes must follow the specified format\n- Tables must include\
    \ all required columns\n- No placeholder text may remain in the final output\n\
    \n## Status\n\nThe status of the implementation plan must be clearly defined in\
    \ the front matter and must reflect the current state of the plan. The status\
    \ can be one of the following (status_color in brackets): `Completed` (bright\
    \ green badge), `In progress` (yellow badge), `Planned` (blue badge), `Deprecated`\
    \ (red badge), or `On Hold` (orange badge). It should also be displayed as a badge\
    \ in the introduction section.\n\n```md\n---\ngoal: [Concise Title Describing\
    \ the Package Implementation Plan's Goal]\nversion: [Optional: e.g., 1.0, Date]\n\
    date_created: [YYYY-MM-DD]\nlast_updated: [Optional: YYYY-MM-DD]\nowner: [Optional:\
    \ Team/Individual responsible for this spec]\nstatus: 'Completed'|'In progress'|'Planned'|'Deprecated'|'On\
    \ Hold'\ntags: [Optional: List of relevant tags or categories, e.g., `feature`,\
    \ `upgrade`, `chore`, `architecture`, `migration`, `bug` etc]\n---\n\n# Introduction\n\
    \n![Status: <status>](https://img.shields.io/badge/status-<status>-<status_color>)\n\
    \n[A short concise introduction to the plan and the goal it is intended to achieve.]\n\
    \n## 1. Requirements & Constraints\n\n[Explicitly list all requirements & constraints\
    \ that affect the plan and constrain how it is implemented. Use bullet points\
    \ or tables for clarity.]\n\n- **REQ-001**: Requirement 1\n- **SEC-001**: Security\
    \ Requirement 1\n- **[3 LETTERS]-001**: Other Requirement 1\n- **CON-001**: Constraint\
    \ 1\n- **GUD-001**: Guideline 1\n- **PAT-001**: Pattern to follow 1\n\n## 2. Implementation\
    \ Steps\n\n### Implementation Phase 1\n\n- GOAL-001: [Describe the goal of this\
    \ phase, e.g., \"Implement feature X\", \"Refactor module Y\", etc.]\n\n| Task\
    \ | Description | Completed | Date |\n|------|-------------|-----------|------|\n\
    | TASK-001 | Description of task 1 | \u2705 | 2025-04-25 |\n| TASK-002 | Description\
    \ of task 2 | |  |\n| TASK-003 | Description of task 3 | |  |\n\n### Implementation\
    \ Phase 2\n\n- GOAL-002: [Describe the goal of this phase, e.g., \"Implement feature\
    \ X\", \"Refactor module Y\", etc.]\n\n| Task | Description | Completed | Date\
    \ |\n|------|-------------|-----------|------|\n| TASK-004 | Description of task\
    \ 4 | |  |\n| TASK-005 | Description of task 5 | |  |\n| TASK-006 | Description\
    \ of task 6 | |  |\n\n## 3. Alternatives\n\n[A bullet point list of any alternative\
    \ approaches that were considered and why they were not chosen. This helps to\
    \ provide context and rationale for the chosen approach.]\n\n- **ALT-001**: Alternative\
    \ approach 1\n- **ALT-002**: Alternative approach 2\n\n## 4. Dependencies\n\n\
    [List any dependencies that need to be addressed, such as libraries, frameworks,\
    \ or other components that the plan relies on.]\n\n- **DEP-001**: Dependency 1\n\
    - **DEP-002**: Dependency 2\n\n## 5. Files\n\n[List the files that will be affected\
    \ by the feature or refactoring task.]\n\n- **FILE-001**: Description of file\
    \ 1\n- **FILE-002**: Description of file 2\n\n## 6. Testing\n\n[List the tests\
    \ that need to be implemented to verify the feature or refactoring task.]\n\n\
    - **TEST-001**: Description of test 1\n- **TEST-002**: Description of test 2\n\
    \n## 7. Risks & Assumptions\n\n[List any risks or assumptions related to the implementation\
    \ of the plan.]\n\n- **RISK-001**: Risk 1\n- **ASSUMPTION-001**: Assumption 1\n\
    \n## 8. Related Specifications / Further Reading\n\n[Link to related spec 1]\n\
    [Link to relevant external documentation]\n```"
