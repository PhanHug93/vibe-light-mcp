  text: "# React 18 Lifecycle Patterns\n\nReference for migrating the three unsafe\
    \ class component lifecycle methods to React 18.3.1 compliant patterns.\n\n##\
    \ Quick Decision Guide\n\nBefore migrating any lifecycle method, identify the\
    \ **semantic category** of what the method does. Wrong category = wrong migration.\
    \ The table below routes you to the correct reference file.\n\n### componentWillMount\
    \ - what does it do?\n\n| What it does | Correct migration | Reference |\n|---|---|---|\n\
    | Sets initial state (`this.setState(...)`) | Move to `constructor` | [\u2192\
    \ componentWillMount.md](references/componentWillMount.md#case-a) |\n| Runs a\
    \ side effect (fetch, subscription, DOM) | Move to `componentDidMount` | [\u2192\
    \ componentWillMount.md](references/componentWillMount.md#case-b) |\n| Derives\
    \ initial state from props | Move to `constructor` with props | [\u2192 componentWillMount.md](references/componentWillMount.md#case-c)\
    \ |\n\n### componentWillReceiveProps - what does it do?\n\n| What it does | Correct\
    \ migration | Reference |\n|---|---|---|\n| Async side effect triggered by prop\
    \ change (fetch, cancel) | `componentDidUpdate` | [\u2192 componentWillReceiveProps.md](references/componentWillReceiveProps.md#case-a)\
    \ |\n| Pure state derivation from new props (no side effects) | `getDerivedStateFromProps`\
    \ | [\u2192 componentWillReceiveProps.md](references/componentWillReceiveProps.md#case-b)\
    \ |\n\n### componentWillUpdate - what does it do?\n\n| What it does | Correct\
    \ migration | Reference |\n|---|---|---|\n| Reads the DOM before update (scroll,\
    \ size, position) | `getSnapshotBeforeUpdate` | [\u2192 componentWillUpdate.md](references/componentWillUpdate.md#case-a)\
    \ |\n| Cancels requests / runs effects before update | `componentDidUpdate` with\
    \ prev comparison | [\u2192 componentWillUpdate.md](references/componentWillUpdate.md#case-b)\
    \ |\n\n---\n\n## The UNSAFE_ Prefix Rule\n\n**Never use `UNSAFE_componentWillMount`,\
    \ `UNSAFE_componentWillReceiveProps`, or `UNSAFE_componentWillUpdate` as a permanent\
    \ fix.**\n\nPrefixing suppresses the React 18.3.1 warning but does NOT:\n- Fix\
    \ concurrent mode safety issues\n- Prepare the codebase for React 19 (where these\
    \ are removed, with or without the prefix)\n- Fix the underlying semantic problem\
    \ the migration is meant to address\n\nThe UNSAFE_ prefix is only appropriate\
    \ as a temporary hold while scheduling the real migration sprint. Mark any UNSAFE_\
    \ prefix additions with:\n```jsx\n// TODO: React 19 will remove this. Migrate\
    \ before React 19 upgrade.\n// UNSAFE_ prefix added temporarily - replace with\
    \ componentDidMount / getDerivedStateFromProps / etc.\n```\n\n---\n\n## Reference\
    \ Files\n\nRead the full reference file for the lifecycle method you are migrating:\n\
    \n- **`references/componentWillMount.md`** - 3 cases with full before/after code\n\
    - **`references/componentWillReceiveProps.md`** - getDerivedStateFromProps trap\
    \ warnings, full examples\n- **`references/componentWillUpdate.md`** - getSnapshotBeforeUpdate\
    \ + componentDidUpdate pairing\n\nRead the relevant file before writing any migration\
    \ code."
