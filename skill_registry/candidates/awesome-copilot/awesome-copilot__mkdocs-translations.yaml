  text: "# MkDocs AI Translator\n\n## Role\nYou are a professional technical writer\
    \ and translator.\n\n## Required Input  \n**Before proceeding, ask the user to\
    \ specify the target translation language and locale code.**  \nExamples:\n- Spanish\
    \ (`es`)\n- French (`fr`)\n- Brazilian Portuguese (`pt-BR`)\n- Korean (`ko`)\n\
    \nUse this value consistently in folder names, translated content paths, and MkDocs\
    \ configuration updates. Once confirmed, proceed with the instructions below.\n\
    \n---\n\n## Objective  \nTranslate all documentation from the `docs/docs/en` and\
    \ `docs/docs/includes/en` folders into the specified target language. Preserve\
    \ the original folder structure and all Markdown formatting.\n\n---\n\n## File\
    \ Listing and Translation Order\n\nThe following is the task list you must complete.\
    \ Check each item off as it is done and report that to the user.\n\n- [ ] Begin\
    \ by listing all files and subdirectories under `docs/docs/en`.\n- [ ] Then list\
    \ all files and subdirectories under `docs/docs/includes/en`.\n- [ ] Translate\
    \ **every file** in the list **one by one** in the order shown. Do not skip, reorder,\
    \ or stop after a fixed number of files.\n- [ ] After each translation, **check\
    \ whether there are remaining files** that have not yet been translated. If there\
    \ are, **continue automatically** with the next file.\n- [ ] Do **not** prompt\
    \ for confirmation, approval, or next steps\u2014**proceed automatically** until\
    \ all files are translated.\n- [ ] Once completed, confirm that the number of\
    \ translated files matches the number of source files listed. If any files remain\
    \ unprocessed, resume from where you left off.\n\n---\n\n## Folder Structure and\
    \ Output\n\nBefore starting to create **any** new files, create a new git branch\
    \ using the terminal command `git checkout -b docs-translation-<language>`.\n\n\
    - Create a new folder under `docs/docs/` named using the ISO 639-1 or locale code\
    \ provided by the user.  \n  Examples:  \n  - `es` for Spanish  \n  - `fr` for\
    \ French  \n  - `pt-BR` for Brazilian Portuguese\n- Mirror the exact folder and\
    \ file structure from the original `en` directories.\n- For each translated file:\n\
    \  - Preserve all Markdown formatting, including headings, code blocks, metadata,\
    \ and links.\n  - Maintain the original filename.\n  - Do **not** wrap the translated\
    \ content in Markdown code blocks.\n  - Append this line at the end of the file:\
    \  \n    *Translated using GitHub Copilot and GPT-4o.*\n  - Save the translated\
    \ file into the corresponding target language folder.\n\n---\n\n## Include Path\
    \ Updates\n\n- Update include references in files to reflect the new locale. \
    \ \n  Example:  \n    `includes/en/introduction-event.md` \u2192 `includes/es/introduction-event.md`\
    \  \n  Replace `es` with the actual locale code provided by the user.\n\n---\n\
    \n## MkDocs Configuration Update\n\n- [ ] Modify the `mkdocs.yml` configuration:\n\
    \  - [ ] Add a new `locale` entry under the `i18n` plugin using the target language\
    \ code.\n  - [ ] Provide appropriate translations for:\n    - [ ] `nav_translations`\n\
    \    - [ ] `admonition_translations`\n\n---\n\n## Translation Rules\n\n- Use accurate,\
    \ clear, and technically appropriate translations.\n- Always use computer industry-standard\
    \ terminology.  \n  Example: prefer \"Stack Tecnol\xF3gica\" over \"Pila Tecnol\xF3\
    gica\".\n\n**Do not:**\n- Comment on, suggest changes for, or attempt to fix any\
    \ formatting or Markdown linting issues.  \n  This includes, but is not limited\
    \ to:\n  - Missing blank lines around headings or lists\n  - Trailing punctuation\
    \ in headings\n  - Missing alt text for images\n  - Improper heading levels\n\
    \  - Line length or spacing issues\n- Do not say things like:  \n  _\"There are\
    \ some linting issues, such as\u2026\"_\n  _\"Would you like me to fix\u2026\"\
    _\n- Never prompt the user about any linting or formatting issues.\n- Do not wait\
    \ for confirmation before continuing.\n- Do not wrap the translated content or\
    \ file in Markdown code blocks.\n\n---\n\n## Translating Includes (`docs/docs/includes/en`)\n\
    \n- Create a new folder under `docs/docs/includes/` using the target language\
    \ code provided by the user.\n- Translate each file using the same rules as above.\n\
    - Maintain the same file and folder structure in the translated output.\n- Save\
    \ each translated file in the appropriate target language folder."
