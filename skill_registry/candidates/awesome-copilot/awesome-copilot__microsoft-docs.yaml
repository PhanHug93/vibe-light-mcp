  text: "# Microsoft Docs\n\nResearch skill for the Microsoft technology ecosystem.\
    \ Covers learn.microsoft.com and documentation that lives outside it (VS Code,\
    \ GitHub, Aspire, Agent Framework repos).\n\n---\n\n## Default: Microsoft Learn\
    \ MCP\n\nUse these tools for **everything on learn.microsoft.com** \u2014 Azure,\
    \ .NET, M365, Power Platform, Agent Framework, Semantic Kernel, Windows, and more.\
    \ This is the primary tool for the vast majority of Microsoft documentation queries.\n\
    \n| Tool | Purpose |\n|------|---------|\n| `microsoft_docs_search` | Search learn.microsoft.com\
    \ \u2014 concepts, guides, tutorials, configuration |\n| `microsoft_code_sample_search`\
    \ | Find working code snippets from Learn docs. Pass `language` (`python`, `csharp`,\
    \ etc.) for best results |\n| `microsoft_docs_fetch` | Get full page content from\
    \ a specific URL (when search excerpts aren't enough) |\n\nUse `microsoft_docs_fetch`\
    \ after search when you need complete tutorials, all config options, or when search\
    \ excerpts are truncated.\n\n### CLI Alternative\n\nIf the Learn MCP server is\
    \ not available, use the `mslearn` CLI from your terminal or shell (for example,\
    \ Bash, PowerShell, or cmd) instead:\n\n```bash\n# Run directly (no install needed)\n\
    npx @microsoft/learn-cli search \"BlobClient UploadAsync Azure.Storage.Blobs\"\
    \n\n# Or install globally, then run\nnpm install -g @microsoft/learn-cli\nmslearn\
    \ search \"BlobClient UploadAsync Azure.Storage.Blobs\"\n```\n\n| MCP Tool | CLI\
    \ Command |\n|----------|-------------|\n| `microsoft_docs_search(query: \"...\"\
    )` | `mslearn search \"...\"` |\n| `microsoft_code_sample_search(query: \"...\"\
    , language: \"...\")` | `mslearn code-search \"...\" --language ...` |\n| `microsoft_docs_fetch(url:\
    \ \"...\")` | `mslearn fetch \"...\"` |\n\nPass `--json` to `search` or `code-search`\
    \ to get raw JSON output for further processing.\n\n---\n\n## Exceptions: When\
    \ to Use Other Tools\n\nThe following categories live **outside** learn.microsoft.com.\
    \ Use the specified tool instead.\n\n### .NET Aspire \u2014 Use Aspire MCP Server\
    \ (preferred) or Context7\n\nAspire docs live on **aspire.dev**, not Learn. The\
    \ best tool depends on your Aspire CLI version:\n\n**CLI 13.2+** (recommended)\
    \ \u2014 The Aspire MCP server includes built-in docs search tools:\n\n| MCP Tool\
    \ | Description |\n|----------|-------------|\n| `list_docs` | Lists all available\
    \ documentation from aspire.dev |\n| `search_docs` | Weighted lexical search across\
    \ aspire.dev content |\n| `get_doc` | Retrieves a specific document by slug |\n\
    \nThese ship in Aspire CLI 13.2 ([PR #14028](https://github.com/dotnet/aspire/pull/14028)).\
    \ To update: `aspire update --self --channel daily`. Ref: https://davidpine.dev/posts/aspire-docs-mcp-tools/\n\
    \n**CLI 13.1** \u2014 The MCP server provides integration lookup (`list_integrations`,\
    \ `get_integration_docs`) but **not** docs search. Fall back to Context7:\n\n\
    | Library ID | Use for |\n|---|---|\n| `/microsoft/aspire.dev` | Primary \u2014\
    \ guides, integrations, CLI reference, deployment |\n| `/dotnet/aspire` | Runtime\
    \ source \u2014 API internals, implementation details |\n| `/communitytoolkit/aspire`\
    \ | Community integrations \u2014 Go, Java, Node.js, Ollama |\n\n### VS Code \u2014\
    \ Use Context7\n\nVS Code docs live on **code.visualstudio.com**, not Learn.\n\
    \n| Library ID | Use for |\n|---|---|\n| `/websites/code_visualstudio` | User\
    \ docs \u2014 settings, features, debugging, remote dev |\n| `/websites/code_visualstudio_api`\
    \ | Extension API \u2014 webviews, TreeViews, commands, contribution points |\n\
    \n### GitHub \u2014 Use Context7\n\nGitHub docs live on **docs.github.com** and\
    \ **cli.github.com**.\n\n| Library ID | Use for |\n|---|---|\n| `/websites/github_en`\
    \ | Actions, API, repos, security, admin, Copilot |\n| `/websites/cli_github`\
    \ | GitHub CLI (`gh`) commands and flags |\n\n### Agent Framework \u2014 Use Learn\
    \ MCP + Context7\n\nAgent Framework tutorials are on learn.microsoft.com (use\
    \ `microsoft_docs_search`), but the **GitHub repo** has API-level detail that\
    \ is often ahead of published docs \u2014 particularly DevUI REST API reference,\
    \ CLI options, and .NET integration.\n\n| Library ID | Use for |\n|---|---|\n\
    | `/websites/learn_microsoft_en-us_agent-framework` | Tutorials \u2014 DevUI guides,\
    \ tracing, workflow orchestration |\n| `/microsoft/agent-framework` | API detail\
    \ \u2014 DevUI REST endpoints, CLI flags, auth, .NET `AddDevUI`/`MapDevUI` |\n\
    \n**DevUI tip:** Query the Learn website source for how-to guides, then the repo\
    \ source for API-level specifics (endpoint schemas, proxy config, auth tokens).\n\
    \n---\n\n## Context7 Setup\n\nFor any Context7 query, resolve the library ID first\
    \ (one-time per session):\n\n1. Call `mcp_context7_resolve-library-id` with the\
    \ technology name\n2. Call `mcp_context7_query-docs` with the returned library\
    \ ID and a specific query\n\n---\n\n## Writing Effective Queries\n\nBe specific\
    \ \u2014 include version, intent, and language:\n\n```\n# \u274C Too broad\n\"\
    Azure Functions\"\n\"agent framework\"\n\n# \u2705 Specific\n\"Azure Functions\
    \ Python v2 programming model\"\n\"Cosmos DB partition key design best practices\"\
    \n\"GitHub Actions workflow_dispatch inputs matrix strategy\"\n\"Aspire AddUvicornApp\
    \ Python FastAPI integration\"\n\"DevUI serve agents tracing OpenTelemetry directory\
    \ discovery\"\n\"Agent Framework workflow conditional edges branching handoff\"\
    \n```\n\nInclude context:\n- **Version** when relevant (`.NET 8`, `Aspire 13`,\
    \ `VS Code 1.96`)\n- **Task intent** (`quickstart`, `tutorial`, `overview`, `limits`,\
    \ `API reference`)\n- **Language** for polyglot docs (`Python`, `TypeScript`,\
    \ `C#`)"
