  text: "# Content Management Systems\n\nUse this skill when the user is working on\
    \ a content management system or on software that behaves like one.\n\nThis skill\
    \ focuses on the seams that matter in CMS work:\n\n- themes and templates\n- plugins,\
    \ apps, modules, and extensions\n- admin and editor interfaces\n- media and upload\
    \ handling\n- content models, taxonomy, and metadata\n- render pipelines and static\
    \ export flows\n\n## When to Use This Skill\n\n- The user mentions a CMS platform\
    \ such as WordPress, Shopify, Drupal, Joomla, Webflow, Squarespace, Wix, WooCommerce,\
    \ HubSpot CMS Hub, or Adobe Experience Manager.\n- The task is about theme development,\
    \ template changes, or design system work inside a CMS.\n- The task is about plugins,\
    \ modules, apps, or extension points.\n- The task touches editor UX, previews,\
    \ taxonomy, slugs, SEO fields, or publishing behavior.\n- The task involves uploads,\
    \ media libraries, authored assets, markdown rendering, or static export.\n\n\
    ## First Pass\n\n1. Identify the platform category: self-hosted CMS, SaaS site\
    \ builder, commerce platform, or hybrid/headless system.\n2. Find the owning implementation\
    \ seam before editing:\n   - theme or template layer\n   - plugin, app, module,\
    \ or extension layer\n   - admin or editor surface\n   - content model or storage\
    \ layer\n   - media pipeline\n   - export, deploy, or rendering pipeline\n3. Check\
    \ platform constraints before choosing an approach:\n   - what is editable locally\n\
    \   - what is authored content versus code\n   - where media belongs\n   - whether\
    \ the final site is server-rendered, static-exported, or hosted remotely\n\n##\
    \ CMS Rules\n\n- Follow the platform's naming and folder conventions for themes,\
    \ modules, template parts, or sections.\n- Keep theme assets separate from user-uploaded\
    \ media unless the platform explicitly combines them.\n- Prefer structured content\
    \ fields over storing important metadata inside presentation markup.\n- Treat\
    \ previews, slugs, taxonomy, excerpts, meta fields, and publish states as first-class\
    \ CMS concerns.\n- Prefer safe defaults and graceful fallback behavior when config,\
    \ theme selection, or content input is invalid.\n- When changing editor or admin\
    \ behavior, trace the stored field, validation rules, preview path, and final\
    \ render path together.\n\n## Common Workflows\n\n### Themes and Templates\n\n\
    - Start at the template loader or theme runtime, not at a downstream include.\n\
    - Preserve the platform's template hierarchy and partial naming conventions.\n\
    - Keep presentation changes close to templates and shared theme helpers.\n\n###\
    \ Plugins, Apps, and Modules\n\n- Add behavior at the platform's extension seam\
    \ instead of scattering logic into templates.\n- Keep migrations, seed data, and\
    \ configuration updates explicit and versioned.\n- Document the extension's setup\
    \ assumptions when the platform requires activation or registration.\n\n### Admin\
    \ and Editor UX\n\n- Keep forms aligned with the stored content model.\n- Prefer\
    \ author-facing previews when content transformations are non-trivial.\n- Keep\
    \ validation, CSRF or equivalent safeguards, and permissions consistent with the\
    \ surrounding admin code.\n\n### Media and Uploads\n\n- Use a dedicated upload\
    \ path for authored media.\n- Keep decorative or theme-owned imagery in the active\
    \ theme folder.\n- Default to conventional locations like `uploads/` for authored\
    \ media and `img/` for theme assets unless the platform dictates a stronger convention.\n\
    - When a CMS supports configurable media directories, expose the setting with\
    \ a safe fallback.\n\n### Content Models and Migrations\n\n- Distinguish content\
    \ entities clearly: pages, posts, products, entries, collections, taxonomies,\
    \ and settings.\n- Prefer migration files or exportable schema definitions over\
    \ ad hoc runtime mutations.\n- Keep slugs, publish dates, excerpts, canonical\
    \ metadata, and taxonomy relations structured.\n\n### Markdown, HTML, and Static\
    \ Export\n\n- Decide whether markdown is authored input, intermediate content,\
    \ or build output before changing the renderer.\n- Pair renderer changes with\
    \ preview or validation when feasible.\n- For static-exported CMS systems, validate\
    \ rewritten permalinks and asset paths after build changes.\n\n## Identifying\
    \ the Owning Seam\n\nRegardless of platform, locate the owning seam before editing\
    \ by mapping the codebase to these CMS roles:\n\n- Runtime bootstrap and request\
    \ routing\n- Admin or editor controllers and their view templates\n- Theme loading,\
    \ template hierarchy, and shared template helpers\n- Repositories, models, or\
    \ schema/migration files for content, taxonomy, and settings\n- Markdown or content\
    \ transformation utilities\n- Static export, deploy, or render pipeline entry\
    \ points\n\nStep to the owning seam first, then make the smallest change that\
    \ preserves the CMS structure.\n\n## Platform Notes\n\nSee `references/cms-platform-workflows.md`\
    \ for a compact mapping of common CMS platforms, extension surfaces, and media\
    \ conventions."
