  text: "# Java MCP Server Generator\n\nGenerate a complete, production-ready MCP\
    \ server in Java using the official Java SDK with Maven or Gradle.\n\n## Project\
    \ Generation\n\nWhen asked to create a Java MCP server, generate a complete project\
    \ with this structure:\n\n```\nmy-mcp-server/\n\u251C\u2500\u2500 pom.xml (or\
    \ build.gradle.kts)\n\u251C\u2500\u2500 src/\n\u2502   \u251C\u2500\u2500 main/\n\
    \u2502   \u2502   \u251C\u2500\u2500 java/\n\u2502   \u2502   \u2502   \u2514\u2500\
    \u2500 com/example/mcp/\n\u2502   \u2502   \u2502       \u251C\u2500\u2500 McpServerApplication.java\n\
    \u2502   \u2502   \u2502       \u251C\u2500\u2500 config/\n\u2502   \u2502   \u2502\
    \       \u2502   \u2514\u2500\u2500 ServerConfiguration.java\n\u2502   \u2502\
    \   \u2502       \u251C\u2500\u2500 tools/\n\u2502   \u2502   \u2502       \u2502\
    \   \u251C\u2500\u2500 ToolDefinitions.java\n\u2502   \u2502   \u2502       \u2502\
    \   \u2514\u2500\u2500 ToolHandlers.java\n\u2502   \u2502   \u2502       \u251C\
    \u2500\u2500 resources/\n\u2502   \u2502   \u2502       \u2502   \u251C\u2500\u2500\
    \ ResourceDefinitions.java\n\u2502   \u2502   \u2502       \u2502   \u2514\u2500\
    \u2500 ResourceHandlers.java\n\u2502   \u2502   \u2502       \u2514\u2500\u2500\
    \ prompts/\n\u2502   \u2502   \u2502           \u251C\u2500\u2500 PromptDefinitions.java\n\
    \u2502   \u2502   \u2502           \u2514\u2500\u2500 PromptHandlers.java\n\u2502\
    \   \u2502   \u2514\u2500\u2500 resources/\n\u2502   \u2502       \u2514\u2500\
    \u2500 application.properties (if using Spring)\n\u2502   \u2514\u2500\u2500 test/\n\
    \u2502       \u2514\u2500\u2500 java/\n\u2502           \u2514\u2500\u2500 com/example/mcp/\n\
    \u2502               \u2514\u2500\u2500 McpServerTest.java\n\u2514\u2500\u2500\
    \ README.md\n```\n\n## Maven pom.xml Template\n\n```xml\n<?xml version=\"1.0\"\
