    \ Template\n\n```markdown\n# My MCP Server\n\nA Model Context Protocol server\
    \ built with Java and the official MCP Java SDK.\n\n## Features\n\n- \u2705 Tools:\
    \ greet, calculate\n- \u2705 Resources: example data, configuration\n- \u2705\
    \ Prompts: code-review\n- \u2705 Reactive Streams with Project Reactor\n- \u2705\
    \ Structured logging with SLF4J\n- \u2705 Full test coverage\n\n## Requirements\n\
    \n- Java 17 or later\n- Maven 3.6+ or Gradle 7+\n\n## Build\n\n### Maven\n```bash\n\
