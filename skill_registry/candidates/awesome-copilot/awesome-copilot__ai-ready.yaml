  text: "# AI Ready\n\nThis skill helps the user install the latest [ai-ready](https://github.com/johnpapa/ai-ready)\
    \ skill by [John Papa](https://github.com/johnpapa).\n\n*Why?*: The full ai-ready\
    \ skill is ~600 lines of detailed instructions that evolve frequently. This wrapper\
    \ keeps it discoverable here while the source of truth stays in [johnpapa/ai-ready](https://github.com/johnpapa/ai-ready)\
    \ \u2014 always up to date.\n\n## Steps\n\n1. Tell the user to add the skill by\
    \ running this command inside Copilot CLI:\n\n   ```\n   /skills add johnpapa/ai-ready\n\
    \   ```\n\n   This downloads the latest version of the skill to their personal\
    \ skills directory. Re-running the command updates to the latest version.\n\n\
    2. Remind the user to review the skill before loading it. They can inspect it\
    \ with:\n   ```bash\n   head -20 ~/.copilot/skills/ai-ready/SKILL.md\n   ```\n\
    3. After the user confirms they've reviewed and installed it, tell them to reload\
    \ skills with `/skills reload` and then say `make this repo ai-ready`.\n4. Do\
    \ **not** run the command on the user's behalf. The user must run it themselves."
