  text: "# Copilot Spaces\n\nUse Copilot Spaces to bring curated, project-specific\
    \ context into conversations. A Space is a shared collection of repositories,\
    \ files, documentation, and instructions that grounds Copilot responses in your\
    \ team's actual code and knowledge.\n\n## Available Tools\n\n### MCP Tools (Read-only)\n\
    \n| Tool | Purpose |\n|------|---------|\n| `mcp__github__list_copilot_spaces`\
    \ | List all spaces accessible to the current user |\n| `mcp__github__get_copilot_space`\
    \ | Load a space's full context by owner and name |\n\n### REST API via `gh api`\
    \ (Full CRUD)\n\nThe Spaces REST API supports creating, updating, deleting spaces,\
    \ and managing collaborators. The MCP server only exposes read operations, so\
    \ use `gh api` for writes.\n\n**User Spaces:**\n\n| Method | Endpoint | Purpose\
    \ |\n|--------|----------|---------|\n| `POST` | `/users/{username}/copilot-spaces`\
    \ | Create a space |\n| `GET` | `/users/{username}/copilot-spaces` | List spaces\
    \ |\n| `GET` | `/users/{username}/copilot-spaces/{number}` | Get a space |\n|\
    \ `PUT` | `/users/{username}/copilot-spaces/{number}` | Update a space |\n| `DELETE`\
    \ | `/users/{username}/copilot-spaces/{number}` | Delete a space |\n\n**Organization\
    \ Spaces:** Same pattern under `/orgs/{org}/copilot-spaces/...`\n\n**Collaborators:**\
    \ Add, list, update, and remove collaborators at `.../collaborators`\n\n**Scope\
    \ requirements:** PAT needs `read:user` for reads, `user` for writes. Add with\
    \ `gh auth refresh -h github.com -s user`.\n\n**Note:** This API is functional\
    \ but not yet in the public REST API docs. It may require the `copilot_spaces_api`\
    \ feature flag.\n\n## When to Use Spaces\n\n- User mentions \"Copilot space\"\
    \ or asks to \"load a space\"\n- User wants answers grounded in specific project\
    \ docs, code, or standards\n- User asks \"what spaces are available?\" or \"find\
    \ a space for X\"\n- User needs onboarding context, architecture docs, or team-specific\
    \ guidance\n- User wants to follow a structured workflow defined in a Space (templates,\
    \ checklists, multi-step processes)\n\n## Workflow\n\n### 1. Discover Spaces\n\
    \nWhen a user asks what spaces are available or you need to find the right space:\n\
    \n```\nCall mcp__github__list_copilot_spaces\n```\n\nThis returns all spaces the\
    \ user can access, each with a `name` and `owner_login`. Present relevant matches\
    \ to the user.\n\nTo filter for a specific user's spaces, match `owner_login`\
    \ against the username (e.g., \"show me my spaces\").\n\n### 2. Load a Space\n\
    \nWhen a user names a specific space or you've identified the right one:\n\n```\n\
    Call mcp__github__get_copilot_space with:\n  owner: \"org-or-user\"    (the owner_login\
    \ from the list)\n  name: \"Space Name\"      (exact space name, case-sensitive)\n\
    ```\n\nThis returns the space's full content: attached documentation, code context,\
    \ custom instructions, and any other curated materials. Use this context to inform\
    \ your responses.\n\n### 3. Follow the Breadcrumbs\n\nSpace content often references\
    \ external resources: GitHub issues, dashboards, repos, discussions, or other\
    \ tools. Proactively fetch these using other MCP tools to gather complete context.\
    \ For example:\n- A space references an initiative tracking issue. Use `issue_read`\
    \ to get the latest comments.\n- A space links to a project board. Use project\
    \ tools to check current status.\n- A space mentions a repo's masterplan. Use\
    \ `get_file_contents` to read it.\n\n### 4. Answer or Execute\n\nOnce loaded,\
    \ use the space content based on what it contains:\n\n**If the space contains\
    \ reference material** (docs, code, standards):\n- Answer questions about the\
    \ project's architecture, patterns, or standards\n- Generate code that follows\
    \ the team's conventions\n- Debug issues using project-specific knowledge\n\n\
    **If the space contains workflow instructions** (templates, step-by-step processes):\n\
    - Follow the workflow as defined, step by step\n- Gather data from the sources\
    \ the workflow specifies\n- Produce output in the format the workflow defines\n\
    - Show progress after each step so the user can steer\n\n### 5. Manage Spaces\
    \ (via `gh api`)\n\nWhen a user wants to create, update, or delete a space, use\
    \ `gh api`. First, find the space number from the list endpoint.\n\n**Update a\
    \ space's instructions:**\n```bash\ngh api users/{username}/copilot-spaces/{number}\
    \ \\\n  -X PUT \\\n  -f general_instructions=\"New instructions here\"\n```\n\n\
    **Update name, description, or instructions together:**\n```bash\ngh api users/{username}/copilot-spaces/{number}\
    \ \\\n  -X PUT \\\n  -f name=\"Updated Name\" \\\n  -f description=\"Updated description\"\
    \ \\\n  -f general_instructions=\"Updated instructions\"\n```\n\n**Create a new\
    \ space:**\n```bash\ngh api users/{username}/copilot-spaces \\\n  -X POST \\\n\
    \  -f name=\"My New Space\" \\\n  -f general_instructions=\"Help me with...\"\
    \ \\\n  -f visibility=\"private\"\n```\n\n**Attach resources (replaces entire\
    \ resource list):**\n```json\n{\n  \"resources_attributes\": [\n    { \"resource_type\"\
    : \"free_text\", \"metadata\": { \"name\": \"Notes\", \"text\": \"Content here\"\
    \ } },\n    { \"resource_type\": \"github_issue\", \"metadata\": { \"repository_id\"\
    : 12345, \"number\": 42 } },\n    { \"resource_type\": \"github_file\", \"metadata\"\
    : { \"repository_id\": 12345, \"file_path\": \"docs/guide.md\" } }\n  ]\n}\n```\n\
    \n**Delete a space:**\n```bash\ngh api users/{username}/copilot-spaces/{number}\
    \ -X DELETE\n```\n\n**Updatable fields:** `name`, `description`, `general_instructions`,\
    \ `icon_type`, `icon_color`, `visibility` (\"private\"/\"public\"), `base_role`\
    \ (\"no_access\"/\"reader\"), `resources_attributes`\n\n## Examples\n\n### Example\
    \ 1: User Asks for a Space\n\n**User**: \"Load the Accessibility copilot space\"\
    \n\n**Action**:\n1. Call `mcp__github__get_copilot_space` with owner `\"github\"\
    `, name `\"Accessibility\"`\n2. Use the returned context to answer questions about\
    \ accessibility standards, MAS grades, compliance processes, etc.\n\n### Example\
    \ 2: User Wants to Find Spaces\n\n**User**: \"What copilot spaces are available\
    \ for our team?\"\n\n**Action**:\n1. Call `mcp__github__list_copilot_spaces`\n\
    2. Filter/present spaces relevant to the user's org or interests\n3. Offer to\
    \ load any space they're interested in\n\n### Example 3: Context-Grounded Question\n\
    \n**User**: \"Using the security space, what's our policy on secret scanning?\"\
    \n\n**Action**:\n1. Call `mcp__github__get_copilot_space` with the appropriate\
    \ owner and name\n2. Find the relevant policy in the space content\n3. Answer\
    \ based on the actual internal documentation\n\n### Example 4: Space as a Workflow\
    \ Engine\n\n**User**: \"Write my weekly update using the PM Weekly Updates space\"\
    \n\n**Action**:\n1. Call `mcp__github__get_copilot_space` to load the space. It\
    \ contains a template format and step-by-step instructions.\n2. Follow the space's\
    \ workflow: pull data from attached initiative issues, gather metrics, draft each\
    \ section.\n3. Fetch external resources referenced by the space (tracking issues,\
    \ dashboards) using other MCP tools.\n4. Show the draft after each section so\
    \ the user can review and fill in gaps.\n5. Produce the final output in the format\
    \ the space defines.\n\n### Example 5: Update Space Instructions Programmatically\n\
    \n**User**: \"Update my PM Weekly Updates space to include a new writing guideline\"\
    \n\n**Action**:\n1. Call `mcp__github__list_copilot_spaces` and find the space\
    \ number (e.g., 19).\n2. Call `mcp__github__get_copilot_space` to read current\
    \ instructions.\n3. Modify the instructions text as requested.\n4. Push the update:\n\
    ```bash\ngh api users/labudis/copilot-spaces/19 -X PUT -f general_instructions=\"\
    updated instructions...\"\n```\n\n## Tips\n\n- Space names are **case-sensitive**.\
    \ Use the exact name from `list_copilot_spaces`.\n- Spaces can be owned by users\
    \ or organizations. Always provide both `owner` and `name`.\n- Space content can\
    \ be large (20KB+). If returned as a temp file, use grep or view_range to find\
    \ relevant sections rather than reading everything at once.\n- If a space isn't\
    \ found, suggest listing available spaces to find the right name.\n- Spaces auto-update\
    \ as underlying repos change, so the context is always current.\n- Some spaces\
    \ contain custom instructions that should guide your behavior (coding standards,\
    \ preferred patterns, workflows). Treat these as directives, not suggestions.\n\
    - **Write operations** (`gh api` for create/update/delete) require the `user`\
    \ PAT scope. If you get a 404 on write operations, run `gh auth refresh -h github.com\
    \ -s user`.\n- Resource updates **replace the entire array**. To add a resource,\
    \ include all existing resources plus the new one. To remove one, include `{ \"\
    id\": 123, \"_destroy\": true }` in the array."
