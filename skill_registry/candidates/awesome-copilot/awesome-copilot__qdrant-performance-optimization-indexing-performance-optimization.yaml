  text: "# What to Do When Qdrant Indexing Is Too Slow\n\nQdrant does NOT build HNSW\
    \ indexes immediately. Small segments use brute-force until they exceed `indexing_threshold_kb`\
    \ (default: 20 MB). Search during this window is slower by design, not a bug.\n\
    \n- Understand the indexing optimizer [Indexing optimizer](https://search.qdrant.tech/md/documentation/operations/optimizer/?s=indexing-optimizer)\n\
    \n\n## Uploads/Ingestion Too Slow\n\nUse when: upload or upsert API calls are\
    \ slow.\nIdentify bottleneck: client-side (network, batching) vs server-side (CPU,\
    \ disk I/O)\n\nFor client-side, optimize batching and parallelism:\n\n- Use batch\
    \ upserts (64-256 points per request) [Points API](https://search.qdrant.tech/md/documentation/manage-data/points/?s=upload-points)\n\
    - Use 2-4 parallel upload streams\n\nFor server-side, optimize Qdrant configuration\
    \ and indexing strategy:\n\n- Create more shards (3-12), each shard has an independent\
    \ update worker [Sharding](https://search.qdrant.tech/md/documentation/operations/distributed_deployment/?s=sharding)\n\
    - Create payload indexes before HNSW builds (needed for filterable vector index)\
    \ [Payload index](https://search.qdrant.tech/md/documentation/manage-data/indexing/?s=payload-index)\n\
    \nSuitable for initial bulk load of large datasets:\n\n- Disable HNSW during bulk\
    \ load (set `indexing_threshold_kb` very high, restore after) [Collection params](https://search.qdrant.tech/md/documentation/manage-data/collections/?s=update-collection-parameters)\n\
    - Setting `m=0` to disable HNSW is legacy, use high `indexing_threshold_kb` instead\n\
    \nCareful, fast unindexed upload might temporarily use more RAM and degrade search\
    \ performance until optimizer catches up.\n\nSee https://search.qdrant.tech/md/documentation/tutorials-develop/bulk-upload/\n\
    \n\n## Optimizer Stuck or Taking Too Long\n\nUse when: optimizer running for hours,\
    \ not finishing.\n\n- Check actual progress via optimizations endpoint (v1.17+)\
    \ [Optimization monitoring](https://search.qdrant.tech/md/documentation/operations/optimizer/?s=optimization-monitoring)\n\
    - Large merges and HNSW rebuilds legitimately take hours on big datasets\n- Check\
    \ CPU and disk I/O (HNSW is CPU-bound, merging is I/O-bound, HDD is not viable)\n\
    - If `optimizer_status` shows an error, check logs for disk full or corrupted\
    \ segments\n\n\n## HNSW Build Time Too High\n\nUse when: HNSW index build dominates\
    \ total indexing time.\n\n- Reduce `m` (default 16, good for most cases, 32+ rarely\
    \ needed) [HNSW params](https://search.qdrant.tech/md/documentation/manage-data/indexing/?s=vector-index)\n\
    - Reduce `ef_construct` (100-200 sufficient) [HNSW config](https://search.qdrant.tech/md/documentation/manage-data/collections/?s=indexing-vectors-in-hnsw)\n\
    - Keep `max_indexing_threads` proportional to CPU cores [Configuration](https://search.qdrant.tech/md/documentation/operations/configuration/)\n\
    - Use GPU for indexing [GPU indexing](https://search.qdrant.tech/md/documentation/operations/running-with-gpu/)\n\
    \n## HNSW index for multi-tenant collections\n\nIf you have a multi-tenant use\
    \ case where all data is split by some payload field (e.g. `tenant_id`), you can\
    \ avoid building a global HNSW index and instead rely on `payload_m` to build\
    \ HNSW index only for subsets of data.\nSkipping global HNSW index can significantly\
    \ reduce indexing time.\n\nSee [Multi-tenant collections](https://search.qdrant.tech/md/documentation/manage-data/multitenancy/)\
    \ for details.\n\n## Additional Payload Indexes Are Too Slow\n\nQdrant builds\
    \ extra HNSW links for all payload indexes to ensure that quality of filtered\
    \ vector search does not degrade.\nSome payload indexes (e.g. `text` fields with\
    \ long texts) can have a very high number of unique values per point, which can\
    \ lead to long HNSW build time.\n\nYou can disable building extra HNSW links for\
    \ specific payload index and instead rely on slightly slower query-time strategies\
    \ like ACORN.\n\nRead more about disabling extra HNSW links in [documentation](https://search.qdrant.tech/md/documentation/manage-data/indexing/?s=disable-the-creation-of-extra-edges-for-payload-fields)\n\
    \nRead more about ACORN in [documentation](https://search.qdrant.tech/md/documentation/search/search/?s=acorn-search-algorithm)\n\
    \n\n## What NOT to Do\n\n- Do not create payload indexes AFTER HNSW is built (breaks\
    \ filterable vector index)\n- Do not use `m=0` for bulk uploads into an existing\
    \ collection, it might drop the existing HNSW and cause long reindexing \n- Do\
    \ not upload one point at a time (per-request overhead dominates)"
