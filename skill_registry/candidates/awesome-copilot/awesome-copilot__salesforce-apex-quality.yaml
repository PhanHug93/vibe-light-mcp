  text: "# Salesforce Apex Quality Guardrails\n\nApply these checks to every Apex\
    \ class, trigger, and test file you write or review.\n\n## Step 1 \u2014 Governor\
    \ Limit Safety Check\n\nScan for these patterns before declaring any Apex file\
    \ acceptable:\n\n### SOQL and DML in Loops \u2014 Automatic Fail\n\n```apex\n\
    // \u274C NEVER \u2014 causes LimitException at scale\nfor (Account a : accounts)\
    \ {\n    List<Contact> contacts = [SELECT Id FROM Contact WHERE AccountId = :a.Id];\
    \ // SOQL in loop\n    update a; // DML in loop\n}\n\n// \u2705 ALWAYS \u2014\
    \ collect, then query/update once\nSet<Id> accountIds = new Map<Id, Account>(accounts).keySet();\n\
    Map<Id, List<Contact>> contactsByAccount = new Map<Id, List<Contact>>();\nfor\
    \ (Contact c : [SELECT Id, AccountId FROM Contact WHERE AccountId IN :accountIds])\
    \ {\n    if (!contactsByAccount.containsKey(c.AccountId)) {\n        contactsByAccount.put(c.AccountId,\
    \ new List<Contact>());\n    }\n    contactsByAccount.get(c.AccountId).add(c);\n\
    }\nupdate accounts; // DML once, outside the loop\n```\n\nRule: if you see `[SELECT`\
    \ or `Database.query`, `insert`, `update`, `delete`, `upsert`, `merge` inside\
    \ a `for` loop body \u2014 stop and refactor before proceeding.\n\n## Step 2 \u2014\
    \ Sharing Model Verification\n\nEvery class must declare its sharing intent explicitly.\
    \ Undeclared sharing inherits from the caller \u2014 unpredictable behaviour.\n\
    \n| Declaration | When to use |\n|---|---|\n| `public with sharing class Foo`\
    \ | Default for all service, handler, selector, and controller classes |\n| `public\
    \ without sharing class Foo` | Only when the class must run elevated (e.g. system-level\
    \ logging, trigger bypass). Requires a code comment explaining why. |\n| `public\
    \ inherited sharing class Foo` | Framework entry points that should respect the\
    \ caller's sharing context |\n\nIf a class does not have one of these three declarations,\
    \ **add it before writing anything else**.\n\n## Step 3 \u2014 CRUD / FLS Enforcement\n\
    \nApex code that reads or writes records on behalf of a user must verify object\
    \ and field access. The platform does **not** enforce FLS or CRUD automatically\
    \ in Apex.\n\n```apex\n// Check before querying a field\nif (!Schema.sObjectType.Contact.fields.Email.isAccessible())\
    \ {\n    throw new System.NoAccessException();\n}\n\n// Or use WITH USER_MODE\
    \ in SOQL (API 56.0+)\nList<Contact> contacts = [SELECT Id, Email FROM Contact\
    \ WHERE AccountId = :accId WITH USER_MODE];\n\n// Or use Database.query with AccessLevel\n\
    List<Contact> contacts = Database.query('SELECT Id, Email FROM Contact', AccessLevel.USER_MODE);\n\
    ```\n\nRule: any Apex method callable from a UI component, REST endpoint, or `@InvocableMethod`\
    \ **must** enforce CRUD/FLS. Internal service methods called only from trusted\
    \ contexts may use `with sharing` instead.\n\n## Step 4 \u2014 SOQL Injection\
    \ Prevention\n\n```apex\n// \u274C NEVER \u2014 concatenates user input into SOQL\
    \ string\nString soql = 'SELECT Id FROM Account WHERE Name = \\'' + userInput\
    \ + '\\'';\n\n// \u2705 ALWAYS \u2014 bind variable\nString soql = [SELECT Id\
    \ FROM Account WHERE Name = :userInput];\n\n// \u2705 For dynamic SOQL with user-controlled\
    \ field names \u2014 validate against a whitelist\nSet<String> allowedFields =\
    \ new Set<String>{'Name', 'Industry', 'AnnualRevenue'};\nif (!allowedFields.contains(userInput))\
    \ {\n    throw new IllegalArgumentException('Field not permitted: ' + userInput);\n\
    }\n```\n\n## Step 5 \u2014 Modern Apex Idioms\n\nPrefer current language features\
    \ (API 62.0 / Winter '25+):\n\n| Old pattern | Modern replacement |\n|---|---|\n\
    | `if (obj != null) { x = obj.Field__c; }` | `x = obj?.Field__c;` |\n| `x = (y\
    \ != null) ? y : defaultVal;` | `x = y ?? defaultVal;` |\n| `System.assertEquals(expected,\
    \ actual)` | `Assert.areEqual(expected, actual)` |\n| `System.assert(condition)`\
    \ | `Assert.isTrue(condition)` |\n| `[SELECT ... WHERE ...]` with no sharing context\
    \ | `[SELECT ... WHERE ... WITH USER_MODE]` |\n\n## Step 6 \u2014 PNB Test Coverage\
    \ Checklist\n\nEvery feature must be tested across all three paths. Missing any\
    \ one of these is a quality failure:\n\n### Positive Path\n- Expected input \u2192\
    \ expected output.\n- Assert the exact field values, record counts, or return\
    \ values \u2014 not just that no exception was thrown.\n\n### Negative Path\n\
    - Invalid input, null values, empty collections, and error conditions.\n- Assert\
    \ that exceptions are thrown with the correct type and message.\n- Assert that\
    \ no records were mutated when the operation should have failed cleanly.\n\n###\
    \ Bulk Path\n- Insert/update/delete **200\u2013251 records** in a single test\
    \ transaction.\n- Assert that all records processed correctly \u2014 no partial\
    \ failures from governor limits.\n- Use `Test.startTest()` / `Test.stopTest()`\
    \ to isolate governor limit counters for async work.\n\n### Test Class Rules\n\
    ```apex\n@isTest(SeeAllData=false)   // Required \u2014 no exceptions without\
    \ a documented reason\nprivate class AccountServiceTest {\n\n    @TestSetup\n\
    \    static void makeData() {\n        // Create all test data here \u2014 use\
    \ a factory if one exists in the project\n    }\n\n    @isTest\n    static void\
    \ givenValidInput_whenProcessAccounts_thenFieldsUpdated() {\n        // Positive\
    \ path\n        List<Account> accounts = [SELECT Id FROM Account LIMIT 10];\n\
    \        Test.startTest();\n        AccountService.processAccounts(accounts);\n\
    \        Test.stopTest();\n        // Assert meaningful outcomes \u2014 not just\
    \ no exception\n        List<Account> updated = [SELECT Status__c FROM Account\
    \ WHERE Id IN :accounts];\n        Assert.areEqual('Processed', updated[0].Status__c,\
    \ 'Status should be Processed');\n    }\n}\n```\n\n## Step 7 \u2014 Trigger Architecture\
    \ Checklist\n\n- [ ] One trigger per object. If a second trigger exists, consolidate\
    \ into the handler.\n- [ ] Trigger body contains only: context checks, handler\
    \ invocation, and routing logic.\n- [ ] No business logic, SOQL, or DML directly\
    \ in the trigger body.\n- [ ] If a trigger framework (Trigger Actions Framework,\
    \ ff-apex-common, custom base class) is already in use \u2014 extend it. Do not\
    \ create a parallel pattern.\n- [ ] Handler class is `with sharing` unless the\
    \ trigger requires elevated access.\n\n## Quick Reference \u2014 Hardcoded Anti-Patterns\
    \ Summary\n\n| Pattern | Action |\n|---|---|\n| SOQL inside `for` loop | Refactor:\
    \ query before the loop, operate on collections |\n| DML inside `for` loop | Refactor:\
    \ collect mutations, DML once after the loop |\n| Class missing sharing declaration\
    \ | Add `with sharing` (or document why `without sharing`) |\n| `escape=\"false\"\
    ` on user data (VF) | Remove \u2014 auto-escaping enforces XSS prevention |\n\
    | Empty `catch` block | Add logging and appropriate re-throw or error handling\
    \ |\n| String-concatenated SOQL with user input | Replace with bind variable or\
    \ whitelist validation |\n| Test with no assertion | Add a meaningful `Assert.*`\
    \ call |\n| `System.assert` / `System.assertEquals` style | Upgrade to `Assert.isTrue`\
    \ / `Assert.areEqual` |\n| Hardcoded record ID (`'001...'`) | Replace with queried\
    \ or inserted test record ID |"
