  text: "# Data Cleaning and Variable Screening\n\n## Quick Start\n\n```bash\n# Run\
    \ the complete data cleaning pipeline\npython \".github/skills/datanalysis-credit-risk/scripts/example.py\"\
    \n```\n\n## Complete Process Description\n\nThe data cleaning pipeline consists\
    \ of the following 11 steps, each executed independently without deleting the\
    \ original data:\n\n1. **Get Data** - Load and format raw data\n2. **Organization\
    \ Sample Analysis** - Statistics of sample count and bad sample rate for each\
    \ organization\n3. **Separate OOS Data** - Separate out-of-sample (OOS) samples\
    \ from modeling samples\n4. **Filter Abnormal Months** - Remove months with insufficient\
    \ bad sample count or total sample count\n5. **Calculate Missing Rate** - Calculate\
    \ overall and organization-level missing rates for each feature\n6. **Drop High\
    \ Missing Rate Features** - Remove features with overall missing rate exceeding\
    \ threshold\n7. **Drop Low IV Features** - Remove features with overall IV too\
    \ low or IV too low in too many organizations\n8. **Drop High PSI Features** -\
    \ Remove features with unstable PSI\n9. **Null Importance Denoising** - Remove\
    \ noise features using label permutation method\n10. **Drop High Correlation Features**\
    \ - Remove high correlation features based on original gain\n11. **Export Report**\
    \ - Generate Excel report containing details and statistics of all steps\n\n##\
    \ Core Functions\n\n| Function | Purpose | Module |\n|------|------|----------|\n\
    | `get_dataset()` | Load and format data | references.func |\n| `org_analysis()`\
    \ | Organization sample analysis | references.func |\n| `missing_check()` | Calculate\
    \ missing rate | references.func |\n| `drop_abnormal_ym()` | Filter abnormal months\
    \ | references.analysis |\n| `drop_highmiss_features()` | Drop high missing rate\
    \ features | references.analysis |\n| `drop_lowiv_features()` | Drop low IV features\
    \ | references.analysis |\n| `drop_highpsi_features()` | Drop high PSI features\
    \ | references.analysis |\n| `drop_highnoise_features()` | Null Importance denoising\
    \ | references.analysis |\n| `drop_highcorr_features()` | Drop high correlation\
    \ features | references.analysis |\n| `iv_distribution_by_org()` | IV distribution\
    \ statistics | references.analysis |\n| `psi_distribution_by_org()` | PSI distribution\
    \ statistics | references.analysis |\n| `value_ratio_distribution_by_org()` |\
    \ Value ratio distribution statistics | references.analysis |\n| `export_cleaning_report()`\
    \ | Export cleaning report | references.analysis |\n\n## Parameter Description\n\
    \n### Data Loading Parameters\n- `DATA_PATH`: Data file path (best are parquet\
    \ format)\n- `DATE_COL`: Date column name\n- `Y_COL`: Label column name\n- `ORG_COL`:\
    \ Organization column name\n- `KEY_COLS`: Primary key column name list\n\n###\
    \ OOS Organization Configuration\n- `OOS_ORGS`: Out-of-sample organization list\n\
    \n### Abnormal Month Filtering Parameters\n- `min_ym_bad_sample`: Minimum bad\
    \ sample count per month (default 10)\n- `min_ym_sample`: Minimum total sample\
    \ count per month (default 500)\n\n### Missing Rate Parameters\n- `missing_ratio`:\
    \ Overall missing rate threshold (default 0.6)\n\n### IV Parameters\n- `overall_iv_threshold`:\
    \ Overall IV threshold (default 0.1)\n- `org_iv_threshold`: Single organization\
    \ IV threshold (default 0.1)\n- `max_org_threshold`: Maximum tolerated low IV\
    \ organization count (default 2)\n\n### PSI Parameters\n- `psi_threshold`: PSI\
    \ threshold (default 0.1)\n- `max_months_ratio`: Maximum unstable month ratio\
    \ (default 1/3)\n- `max_orgs`: Maximum unstable organization count (default 6)\n\
    \n### Null Importance Parameters\n- `n_estimators`: Number of trees (default 100)\n\
    - `max_depth`: Maximum tree depth (default 5)\n- `gain_threshold`: Gain difference\
    \ threshold (default 50)\n\n### High Correlation Parameters\n- `max_corr`: Correlation\
    \ threshold (default 0.9)\n- `top_n_keep`: Keep top N features by original gain\
    \ ranking (default 20)\n\n## Output Report\n\nThe generated Excel report contains\
    \ the following sheets:\n\n1. **\u6C47\u603B** - Summary information of all steps,\
    \ including operation results and conditions\n2. **\u673A\u6784\u6837\u672C\u7EDF\
    \u8BA1** - Sample count and bad sample rate for each organization\n3. **\u5206\
    \u79BBOOS\u6570\u636E** - OOS sample and modeling sample counts\n4. **Step4-\u5F02\
    \u5E38\u6708\u4EFD\u5904\u7406** - Abnormal months that were removed\n5. **\u7F3A\
    \u5931\u7387\u660E\u7EC6** - Overall and organization-level missing rates for\
    \ each feature\n6. **Step5-\u6709\u503C\u7387\u5206\u5E03\u7EDF\u8BA1** - Distribution\
    \ of features in different value ratio ranges\n7. **Step6-\u9AD8\u7F3A\u5931\u7387\
    \u5904\u7406** - High missing rate features that were removed\n8. **Step7-IV\u660E\
    \u7EC6** - IV values of each feature in each organization and overall\n9. **Step7-IV\u5904\
    \u7406** - Features that do not meet IV conditions and low IV organizations\n\
    10. **Step7-IV\u5206\u5E03\u7EDF\u8BA1** - Distribution of features in different\
    \ IV ranges\n11. **Step8-PSI\u660E\u7EC6** - PSI values of each feature in each\
    \ organization each month\n12. **Step8-PSI\u5904\u7406** - Features that do not\
    \ meet PSI conditions and unstable organizations\n13. **Step8-PSI\u5206\u5E03\u7EDF\
    \u8BA1** - Distribution of features in different PSI ranges\n14. **Step9-null\
    \ importance\u5904\u7406** - Noise features that were removed\n15. **Step10-\u9AD8\
    \u76F8\u5173\u6027\u5254\u9664** - High correlation features that were removed\n\
    \n## Features\n\n- **Interactive Input**: Parameters can be input before each\
    \ step execution, with default values supported\n- **Independent Execution**:\
    \ Each step is executed independently without deleting original data, facilitating\
    \ comparative analysis\n- **Complete Report**: Generate complete Excel report\
    \ containing details, statistics, and distributions\n- **Multi-process Support**:\
    \ IV and PSI calculations support multi-process acceleration\n- **Organization-level\
    \ Analysis**: Support organization-level statistics and modeling/OOS distinction"
