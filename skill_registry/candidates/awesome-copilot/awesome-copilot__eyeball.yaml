  text: "# Eyeball\n\nAnalyze documents with visual proof. When activated, Eyeball\
    \ produces a Word document on the user's Desktop where every factual assertion\
    \ includes an inline screenshot from the source material with the cited text highlighted\
    \ in yellow.\n\n## Activation\n\nWhen the user invokes this skill (e.g., \"use\
    \ eyeball\", \"run eyeball on this\", \"eyeball this document\"), respond with:\n\
    \n> **Eyeball is active.** I'll analyze the document and produce a Word doc with\
    \ inline source screenshots so you can verify every claim with your own eyes.\n\
    \nThen follow the workflow below.\n\n## Supported Sources\n\n- **Local files:**\
    \ Word documents (.docx, .doc), PDFs (.pdf), RTF files\n- **Web URLs:** Any publicly\
    \ accessible web page\n\n## Tool Location\n\nThe Eyeball Python utility is located\
    \ at:\n```\n<plugin_dir>/skills/eyeball/tools/eyeball.py\n```\n\nTo find the actual\
    \ path, run:\n```bash\nfind ~/.copilot/installed-plugins -name \"eyeball.py\"\
    \ -path \"*/eyeball/*\" 2>/dev/null\n```\n\nIf not found there, check the project\
    \ directory or the user's home directory for the eyeball repo.\n\n## First-Run\
    \ Setup\n\nBefore first use, check that dependencies are installed:\n\n```bash\n\
    python3 <path-to>/eyeball.py setup-check\n```\n\nIf anything is missing, install\
    \ the required dependencies:\n```bash\npip3 install pymupdf pillow python-docx\
    \ playwright\npython3 -m playwright install chromium\n```\n\nOn Windows, also\
    \ install pywin32 for Word automation:\n```bash\npip install pywin32\n```\n\n\
    ## Workflow\n\nFollow these steps exactly. The order matters.\n\n### Step 1: Read\
    \ the source text\n\nBefore writing any analysis, extract and read the full text\
    \ of the source document:\n\n```bash\npython3 <path-to>/eyeball.py extract-text\
    \ --source \"<path-or-url>\"\n```\n\nRead the output carefully. Identify actual\
    \ section numbers, headings, page numbers, and key language.\n\n**CRITICAL:**\
    \ Do not skip this step. Do not write analysis based on assumptions about how\
    \ the document is structured. Read the actual text.\n\n### Step 2: Write analysis\
    \ with exact citations\n\nFor each point in your analysis, you must:\n\n1. **Reference\
    \ the correct section number as it appears in the document** (e.g., \"Section\
    \ 9\" not \"Section 8\" because you assumed the numbering).\n2. **Reference the\
    \ correct page number** where the section appears in the extracted text.\n3. **Select\
    \ anchors that are verbatim phrases from the source** that directly support your\
    \ claim.\n\n### Step 3: Select anchors correctly\n\nThis is the most important\
    \ step. Anchors determine what gets highlighted in the screenshots.\n\n**DO:**\n\
    - Use verbatim phrases from the source text that directly support your assertion\n\
    - Use multiple anchors to span the full range of text the reader should see\n\
    - Use specific, uncommon phrases that appear only where you intend\n\n**DO NOT:**\n\
    - Use generic topic labels (e.g., \"Confidentiality\") that appear throughout\
    \ the document\n- Use section titles alone when they appear as cross-references\
    \ elsewhere\n- Use single common words that match in many places\n\n**Examples:**\n\
    \nWRONG -- uses a generic topic label that matches everywhere:\n```json\n{\"anchors\"\
    : [\"User-Generated Content\"], \"target_page\": 8}\n```\n\nRIGHT -- uses the\
    \ specific language that supports the claim:\n```json\n{\"anchors\": [\"retain\
    \ ownership\", \"Ownership of Content, Right to Post\"], \"target_page\": 8}\n\
    ```\n\nWRONG -- section title appears as a cross-reference on earlier pages:\n\
    ```json\n{\"anchors\": [\"LIMITATION OF LIABILITY\"]}\n```\n\nRIGHT -- includes\
    \ the section number for precision, targets the correct page:\n```json\n{\"anchors\"\
    : [\"12. LIMITATION OF LIABILITY\", \"INDIRECT\", \"CONSEQUENTIAL\"], \"target_page\"\
    : 13}\n```\n\n### Step 4: Build the analysis document\n\nConstruct a JSON array\
    \ of sections and call the build command:\n\n```bash\npython3 <path-to>/eyeball.py\
    \ build \\\n  --source \"<path-or-url>\" \\\n  --output ~/Desktop/<title>.docx\
    \ \\\n  --title \"Analysis Title\" \\\n  --subtitle \"Source description\" \\\n\
    \  --sections '[\n    {\n      \"heading\": \"1. Section Title\",\n      \"analysis\"\
    : \"Your analysis text here. Reference Section X on page Y...\",\n      \"anchors\"\
    : [\"verbatim phrase 1\", \"verbatim phrase 2\"],\n      \"target_page\": 5,\n\
    \      \"context_padding\": 40\n    },\n    {\n      \"heading\": \"2. Another\
    \ Section\",\n      \"analysis\": \"More analysis...\",\n      \"anchors\": [\"\
    exact quote from source\"],\n      \"target_pages\": [10, 11],\n      \"context_padding\"\
    : 50\n    }\n  ]'\n```\n\nSection object fields:\n- `heading` (required): Section\
    \ heading in the output document\n- `analysis` (required): Your analysis text\n\
    - `anchors` (required): List of verbatim phrases from the source to search for\
    \ and highlight\n- `target_page` (optional): Single page number (1-indexed) to\
    \ search on\n- `target_pages` (optional): List of page numbers to search across\
    \ (screenshots stitched vertically)\n- `context_padding` (optional): Padding in\
    \ PDF points above/below the anchor region (default: 40). Increase for more context.\n\
    \n### Step 5: Deliver the output\n\nSave the output to the user's Desktop. Tell\
    \ the user the filename and that they can open it to verify each claim against\
    \ the highlighted source screenshots.\n\n## Self-Check Before Delivery\n\nBefore\
    \ saving the final document, mentally verify:\n\n1. Does each section's analysis\
    \ text reference the correct section number from the source?\n2. Are the anchors\
    \ verbatim phrases that appear on the target page?\n3. Does each anchor directly\
    \ support the claim in the analysis, not just relate to the same topic?\n4. If\
    \ the screenshot doesn't match the analysis, is the analysis wrong or is the anchor\
    \ wrong? Fix whichever is incorrect.\n\n## Notes\n\n- The output document includes\
    \ highlighted screenshots that are dynamically sized. If you provide multiple\
    \ anchors, the screenshot expands to cover all of them.\n- When a search term\
    \ is not found, the output document will note this. If this happens, the anchor\
    \ was likely not verbatim enough. Adjust and rebuild.\n- For web pages, Playwright\
    \ renders the page to PDF first. The resulting page numbers may differ from what\
    \ you see in a browser. Use the extracted text output (step 1) to determine correct\
    \ page numbers.\n- If the user has already provided the source text or you have\
    \ already read it in the current conversation, you can skip step 1. But always\
    \ verify section numbers and page references against the actual text before writing\
    \ analysis."
